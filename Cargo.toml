[package]
name = "thinkly-fast"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
gpui-component = { version = "=0.5.1", default-features = false }
ropey = { version = "=2.0.0-beta.1", default-features = false, features = ["metric_lines_lf", "metric_utf16"] }
html5ever = "0.27"
tree-sitter-css = "0.23.2"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-md = { version = "0.5.1", default-features = false }
tree-sitter-python = "0.23.6"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
tiny-skia = "0.11"
cosmic-text = "0.14"
im = "15.1"
pulldown-cmark = { version = "0.13", default-features = false }
global-hotkey = "0.9.0"
dirs = "7.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
