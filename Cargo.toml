[package]
name = "thinkly-fast"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
tiny-skia = "0.11"
cosmic-text = "0.14"
im = "15.1"
pulldown-cmark = { version = "0.13", default-features = false }
