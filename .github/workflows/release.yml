# 不要往 GitHub Release 添加允许名单以外的附件。唯一名单是 scripts/release/allowed-assets.mjs 里的 5 个安装包。
# Do not add GitHub Release assets beyond the allowlist. The only list is the 5 installers in scripts/release/allowed-assets.mjs.

name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）检查；仅当自上一版 Release 后有面向用户的新提交且当日未发版时构建发布。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release after building installers
        type: boolean
        default: true
      force:
        description: Build even when no new user-facing commits exist
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Separate from older runs so a cancelled build cannot block or publish this one.
  group: block-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  prepare:
    name: Select version and release notes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      auto_bump: ${{ steps.check.outputs.auto_bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check commits and generate release plan
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          FORCE: ${{ inputs.force == true }}
          MAGPIE_BASE_URL: ${{ github.ref == 'refs/heads/main' && vars.MAGPIE_BASE_URL || '' }}
          MAGPIE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.MAGPIE_API_KEY || '' }}
          MAGPIE_CA_CERT: scripts/release/pubgw-cert.pem
          CHANGELOG_MODEL: antigravity/gemini-3.8-flash
        run: node scripts/release/select-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.should_build == 'yes'
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 5

  release-macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Build release .app and DMG
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          BLOCK_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bun scripts/release/package-release.mjs
      - name: Resolve allowlisted macOS installer
        id: installer
        shell: bash
        run: echo "name=$(node scripts/release/allowed-assets.mjs macos ${{ matrix.arch }} dmg)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: block-installer-macos-${{ matrix.arch }}
          path: dist/release/${{ steps.installer.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  release-windows:
    name: Windows x64 NSIS
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Install NSIS 3.13
        shell: pwsh
        run: |
          choco install nsis --version=3.13.0 -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"
      - name: Build NSIS installer
        env:
          BLOCK_ARCH: x64
        run: node scripts/release/package-windows.mjs
      - name: Resolve allowlisted Windows installer
        id: installer
        shell: bash
        run: echo "name=$(node scripts/release/allowed-assets.mjs windows x64 exe)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: block-installer-windows-x64
          path: dist/release/${{ steps.installer.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  release-linux:
    name: Linux x64 deb and AppImage
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config patchelf ca-certificates curl \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev libwayland-dev libvulkan-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxext-dev libxfixes-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev \
            libssl-dev libfontconfig1-dev libasound2-dev
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_ARCH=x86_64" >> "$GITHUB_ENV"
      - name: Build AppImage and deb
        env:
          BLOCK_ARCH: x64
        run: |
          node scripts/release/package-linux.mjs
          node scripts/release/package-native.mjs
      - name: Resolve allowlisted Linux installers
        id: installer
        shell: bash
        run: |
          {
            echo "app=$(node scripts/release/allowed-assets.mjs linux x64 AppImage)"
            echo "deb=$(node scripts/release/allowed-assets.mjs linux x64 deb)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: block-installer-linux-x64
          path: |
            dist/release/${{ steps.installer.outputs.app }}
            dist/release/${{ steps.installer.outputs.deb }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [prepare, release-macos, release-windows, release-linux]
    if: >-
      needs.prepare.outputs.should_build == 'yes' &&
      github.ref == 'refs/heads/main' &&
      needs.release-macos.result == 'success' &&
      needs.release-windows.result == 'success' &&
      needs.release-linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: block-installer-*
          merge-multiple: true
          path: dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: block-release-${{ env.SOURCE_SHA }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/publish-release.mjs
      - name: Prune and verify release assets
        if: needs.prepare.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: node scripts/release/prune-release-assets.mjs
      # Pushes packaging/aur to the AUR repo only. It does not upload a GitHub Release asset.
      - name: Update AUR block-bin
        if: needs.prepare.outputs.publish == 'yes'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash scripts/release/publish-aur.sh
