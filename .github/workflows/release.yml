name: Daily macOS Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）检查；仅当自上一版 Release 后有面向用户的新提交且当日未发版时构建发布。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release after building macOS installers
        type: boolean
        default: true
      force:
        description: Build and publish even when no new user-facing commits exist
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: thinkly-fast-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  prepare:
    name: Select version and release notes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      auto_bump: ${{ steps.check.outputs.auto_bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check commits and generate release plan
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish != false }}
          FORCE: ${{ inputs.force == true }}
          MAGPIE_BASE_URL: ${{ github.ref == 'refs/heads/main' && vars.MAGPIE_BASE_URL || '' }}
          MAGPIE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.MAGPIE_API_KEY || '' }}
          MAGPIE_CA_CERT: scripts/release/pubgw-cert.pem
        run: node scripts/release/select-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.should_build == 'true'
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 5

  release:
    name: Build and publish macOS arm64
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Build release .app, ad-hoc sign, and package DMG/ZIP
        run: bun scripts/release/package-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thinkly-fast-macos-${{ env.SOURCE_SHA }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/publish-release.mjs
