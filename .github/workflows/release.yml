# 不要往 GitHub Release 添加允许名单以外的附件。唯一名单是 scripts/release/allowed-assets.mjs 里的 5 个安装包。
# Do not add GitHub Release assets beyond the allowlist. The only list is the 5 installers in scripts/release/allowed-assets.mjs.

name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）检查；仅当自上一版 Release 后有面向用户的新提交且当日未发版时构建发布。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release after building installers
        type: boolean
        default: true
      force:
        description: Build even when no new user-facing commits exist
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Separate from older runs so a cancelled build cannot block or publish this one.
  group: block-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  CGO_ENABLED: '0'

jobs:
  prepare:
    name: Select version and release notes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: release-notes
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      auto_bump: ${{ steps.check.outputs.auto_bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 只在 main 的定时或手动发布里短时加入 tailnet。身份只存在 Environment release-notes。
      # 目标只有 100.115.90.80:3425。不要 API key，不要公网地址，不要 3430。
      - name: Detect tailnet identity
        id: tailnet
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_AUDIENCE" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=release-notes::未配置 Environment release-notes 的 TS_OAUTH_CLIENT_ID 或 TS_AUDIENCE，未加入 tailnet，不会调用 grok-4.7。"
          fi
      - name: Join tailnet
        id: tailscale
        if: steps.tailnet.outputs.ready == 'yes'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-release-notes
          version: "1.104.4"
          ping: "100.115.90.80"
          timeout: 1m
          retry: "2"
          args: --shields-up
      - name: Check Magpie TCP 3425
        id: magpie
        if: steps.tailscale.outcome == 'success'
        run: |
          if timeout 10 bash -c 'echo >/dev/tcp/100.115.90.80/3425'; then
            echo "reachable=yes" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=release-notes::100.115.90.80:3425 不可达，不会调用 grok-4.7。"
          fi
      - name: Check commits and generate release plan
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          FORCE: ${{ inputs.force == true }}
          MAGPIE_BASE_URL: http://100.115.90.80:3425/v1
          MAGPIE_REACHABLE: ${{ steps.magpie.outputs.reachable == 'yes' && 'yes' || 'no' }}
          CHANGELOG_MODEL: grok-4.7
        run: node scripts/release/select-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.should_build == 'yes'
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 5

  release-macos:
    name: macOS arm64 & x64 DMG
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GOMODCACHE: ${{ runner.temp }}/go-mod
      GOCACHE: ${{ runner.temp }}/go-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ hashFiles('go.sum') }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ github.sha }}
          restore-keys: |
            go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Build release .app and DMG
        env:
          BLOCK_ARCHES: arm64,x64
        run: node scripts/release/package-release.mjs
      - name: Resolve allowlisted macOS installers
        id: installer
        shell: bash
        run: |
          {
            echo "arm64=$(node scripts/release/allowed-assets.mjs macos arm64 dmg)"
            echo "x64=$(node scripts/release/allowed-assets.mjs macos x64 dmg)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: block-installer-macos
          path: |
            dist/release/${{ steps.installer.outputs.arm64 }}
            dist/release/${{ steps.installer.outputs.x64 }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release-windows:
    name: Windows x64 NSIS
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOMODCACHE: ${{ runner.temp }}\go-mod
      GOCACHE: ${{ runner.temp }}\go-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\go-mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ hashFiles('go.sum') }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\go-build
          key: go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ github.sha }}
          restore-keys: |
            go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Cache NSIS 3.13
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-3.13.0-windows-x64
      - name: Install NSIS 3.13
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version=3.13.0 -y --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"
      - name: Build NSIS installer
        env:
          BLOCK_ARCH: x64
        run: node scripts/release/package-windows.mjs
      - name: Resolve allowlisted Windows installer
        id: installer
        shell: bash
        run: echo "name=$(node scripts/release/allowed-assets.mjs windows x64 exe)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: block-installer-windows-x64
          path: dist/release/${{ steps.installer.outputs.name }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release-linux:
    name: Linux x64 deb and AppImage
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMODCACHE: ${{ runner.temp }}/go-mod
      GOCACHE: ${{ runner.temp }}/go-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ hashFiles('go.sum') }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ github.sha }}
          restore-keys: |
            go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Cache appimagetool
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/appimagetool
          key: appimagetool-1.9.1-x86_64
      - name: Install packaging tools
        run: |
          if ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" || sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends patchelf
          fi
          if [ ! -x "$RUNNER_TEMP/appimagetool" ]; then
            curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
              "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
            chmod +x "$RUNNER_TEMP/appimagetool"
          fi
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_ARCH=x86_64" >> "$GITHUB_ENV"
      - name: Build AppImage and deb
        env:
          BLOCK_ARCH: x64
        run: |
          node scripts/release/go-release.mjs linux amd64
          BLOCK_REUSE_BINARY=1 node scripts/release/package-linux.mjs &
          pid_app=$!
          BLOCK_REUSE_BINARY=1 node scripts/release/package-native.mjs &
          pid_deb=$!
          wait "$pid_app"
          wait "$pid_deb"
      - name: Resolve allowlisted Linux installers
        id: installer
        shell: bash
        run: |
          {
            echo "app=$(node scripts/release/allowed-assets.mjs linux x64 AppImage)"
            echo "deb=$(node scripts/release/allowed-assets.mjs linux x64 deb)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: block-installer-linux-x64
          path: |
            dist/release/${{ steps.installer.outputs.app }}
            dist/release/${{ steps.installer.outputs.deb }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [prepare, release-macos, release-windows, release-linux]
    if: >-
      needs.prepare.outputs.should_build == 'yes' &&
      github.ref == 'refs/heads/main' &&
      needs.release-macos.result == 'success' &&
      needs.release-windows.result == 'success' &&
      needs.release-linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: block-installer-*
          merge-multiple: true
          path: dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: block-release-${{ env.SOURCE_SHA }}
          path: dist/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/publish-release.mjs
      - name: Prune and verify release assets
        if: needs.prepare.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: node scripts/release/prune-release-assets.mjs
      - name: Update AUR block-bin
        if: needs.prepare.outputs.publish == 'yes'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash scripts/release/publish-aur.sh
