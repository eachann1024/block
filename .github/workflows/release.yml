# 不要往 GitHub Release 添加允许名单以外的附件。唯一名单是 scripts/release/allowed-assets.mjs 里的 5 个安装包。
# Do not add GitHub Release assets beyond the allowlist. The only list is the 5 installers in scripts/release/allowed-assets.mjs.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'updates/feed.json'
      - '.ai-map.md'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'AGENTS.md'
      - 'DESIGN.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/prune-release-assets.yml'
      - 'scripts/lint_design.py'
      - 'scripts/gen_ai_map.py'
      - 'scripts/dump_ai_state.py'
      - 'scripts/fast-check.sh'
      - 'scripts/build_readme_svgs.py'
      - '**/*_test.go'
  schedule:
    # 每日兜底补偿：若此前 push 触发失败、被取消或命中 300 文件路径过滤上限，自动从上一版补发积压改动。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release after building installers
        type: boolean
        default: true
      force:
        description: Build even when no new user-facing commits exist
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Cancel stale builds immediately when a newer commit or manual release starts;
  # the newer run recomputes the next version from the last published release.
  group: block-release
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  CGO_ENABLED: '0'

jobs:
  prepare:
    name: Select version and release notes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'push' &&
          !(github.event.commits[1] == null &&
            github.event.head_commit.author.name == 'github-actions[bot]' &&
            startsWith(github.event.head_commit.message, 'chore(release): v'))))
    runs-on: ubuntu-24.04
    environment: release-notes
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      should_build: ${{ steps.check.outputs.should_build || steps.preflight.outputs.should_build || 'no' }}
      publish: ${{ steps.check.outputs.publish || steps.preflight.outputs.publish || 'no' }}
      version: ${{ steps.check.outputs.version || steps.preflight.outputs.version }}
      release_tag: ${{ steps.check.outputs.release_tag || steps.preflight.outputs.release_tag }}
      auto_bump: ${{ steps.check.outputs.auto_bump || 'false' }}
      sync_only_tag: ${{ steps.check.outputs.sync_only_tag || steps.preflight.outputs.sync_only_tag || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        run: bash scripts/ci/setup-node.sh 22
      - name: Preflight release check
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish == true }}
          FORCE: ${{ inputs.force == true }}
          BLOCK_PREFLIGHT_PATH: ${{ runner.temp }}/release-preflight.json
        run: node scripts/release/select-release.mjs --preflight
      # 只在 main 确认需要发版（且非仅预览构建）时短时加入 tailnet。身份只存在 Environment release-notes。
      # 更新说明只经 tailnet 用 Magpie：Mac 在线先用 Mac 的 agy-cli/gemini-3.8-flash，再 VPS gpt-6-luna，最后 deepseek-flash。不要用 Google AI Studio key。
      # Magpie 目标只有 100.115.90.80:3425，不要公网地址，不要 3430。
      - name: Detect tailnet identity
        id: tailnet
        if: steps.preflight.outputs.needs_release == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.publish == true)
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_AUDIENCE" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=release-notes::未配置 Environment release-notes 的 TS_OAUTH_CLIENT_ID 或 TS_AUDIENCE，未加入 tailnet，无法生成更新说明。"
          fi
      - name: Join tailnet
        id: tailscale
        if: steps.preflight.outputs.needs_release == 'yes' && steps.tailnet.outputs.ready == 'yes'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-release-notes
          version: "1.104.4"
          ping: "100.115.90.80"
          timeout: 1m
          retry: "2"
          args: --shields-up
      - name: Check Magpie TCP 3425
        id: magpie
        if: steps.preflight.outputs.needs_release == 'yes' && steps.tailscale.outcome == 'success'
        run: |
          if timeout 10 bash -c 'echo >/dev/tcp/100.115.90.80/3425'; then
            echo "reachable=yes" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=release-notes::100.115.90.80:3425 不可达，无法生成更新说明。"
          fi
      - name: Check Mac Magpie TCP 3425
        id: mac_magpie
        if: steps.preflight.outputs.needs_release == 'yes' && steps.tailscale.outcome == 'success'
        run: |
          if timeout 8 bash -c 'echo >/dev/tcp/100.118.27.43/3425'; then
            echo "reachable=yes" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=no" >> "$GITHUB_OUTPUT"
            echo "Mac 不在线，跳过 Mac 上的 gemini-3.8-flash。"
          fi
      - name: Check commits and generate release plan
        id: check
        if: steps.preflight.outputs.needs_release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish == true }}
          FORCE: ${{ inputs.force == true }}
          BLOCK_USE_PREFLIGHT: "1"
          BLOCK_PREFLIGHT_PATH: ${{ runner.temp }}/release-preflight.json
          MAGPIE_BASE_URL: http://100.115.90.80:3425/v1
          MAGPIE_REACHABLE: ${{ steps.magpie.outputs.reachable == 'yes' && 'yes' || 'no' }}
          MAC_MAGPIE_REACHABLE: ${{ steps.mac_magpie.outputs.reachable == 'yes' && 'yes' || 'no' }}
        run: node scripts/release/select-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.should_build == 'yes'
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 5

  release-macos:
    name: macOS arm64 & x64 DMG
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Setup Node & Go
        run: |
          bash scripts/ci/setup-node.sh 22 &
          pid_node=$!
          bash scripts/ci/setup-go.sh &
          pid_go=$!
          wait "$pid_node"
          wait "$pid_go"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ hashFiles('go.sum') }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ github.sha }}
          restore-keys: |
            go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-
            go-build-ci-${{ runner.os }}-${{ runner.arch }}-go1.27-
      - name: Build release .app and DMG
        env:
          BLOCK_ARCHES: arm64,x64
          BLOCK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BLOCK_FEEDBACK_URL: ${{ secrets.BLOCK_FEEDBACK_URL }}
          BLOCK_FEEDBACK_CLIENT_TOKEN: ${{ secrets.BLOCK_FEEDBACK_CLIENT_TOKEN }}
        run: node scripts/release/package-release.mjs
      - name: Resolve allowlisted macOS installers
        id: installer
        shell: bash
        run: |
          {
            echo "arm64=$(node scripts/release/allowed-assets.mjs macos arm64 dmg)"
            echo "x64=$(node scripts/release/allowed-assets.mjs macos x64 dmg)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: block-installer-macos
          path: |
            dist/release/${{ steps.installer.outputs.arm64 }}
            dist/release/${{ steps.installer.outputs.x64 }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release-linux-windows:
    name: Linux & Windows x64 installers
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ hashFiles('go.sum') }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ github.sha }}
          restore-keys: |
            go-build-release-${{ runner.os }}-${{ runner.arch }}-go1.27-
            go-build-ci-${{ runner.os }}-${{ runner.arch }}-go1.27-
      - name: Cache appimagetool
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/appimagetool
          key: appimagetool-1.9.1-x86_64
      - name: Cache Linux packaging deb packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-ubuntu-24.04-patchelf-nsis-v1
      - name: Setup Node, Go, and packaging tools
        run: |
          bash scripts/ci/setup-node.sh 22 &
          pid_node=$!
          bash scripts/ci/setup-go.sh &
          pid_go=$!
          (
            missing=()
            command -v patchelf >/dev/null 2>&1 || missing+=(patchelf)
            command -v makensis >/dev/null 2>&1 || missing+=(nsis)
            if [ "${#missing[@]}" -gt 0 ]; then
              deb_dir="$RUNNER_TEMP/apt-debs"
              mkdir -p "$deb_dir/partial"
              apt_opts=(-o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-")
              sudo apt-get update -qq "${apt_opts[@]}" -o APT::Get::List-Cleanup="0" || sudo apt-get update -qq "${apt_opts[@]}" -o APT::Get::List-Cleanup="0"
              # Cryptographically bind every cached .deb filename (Package_Version_Arch.deb) and SHA-256 to the GPG-verified Ubuntu Packages index; drop any unmatched file so apt downloads fresh.
              sudo python3 - "$deb_dir" "${apt_opts[@]}" <<'PY'
          import glob, hashlib, os, subprocess, sys
          deb_dir, apt_opts = sys.argv[1], sys.argv[2:]
          debs = glob.glob(os.path.join(deb_dir, '*.deb'))
          if debs:
              valid = {}
              targets = subprocess.check_output(
                  ['apt-get', 'indextargets', *apt_opts, '--format', '$(FILENAME)', 'ShortDesc: Packages'],
                  text=True,
              ).splitlines()
              for path in targets:
                  path = path.strip()
                  if not path or not os.path.isfile(path):
                      continue
                  proc = subprocess.Popen(
                      ['/usr/lib/apt/apt-helper', 'cat-file', path],
                      stdout=subprocess.PIPE, text=True, errors='ignore',
                  )
                  stanza = {}
                  file_map = {}
                  def flush():
                      pkg, ver, arch, sha = stanza.get('Package'), stanza.get('Version'), stanza.get('Architecture'), stanza.get('SHA256')
                      if pkg and ver and arch and sha:
                          file_map[f"{pkg}_{ver.replace(':', '%3a')}_{arch}.deb"] = sha.lower()
                      stanza.clear()
                  for line in proc.stdout:
                      s = line.strip()
                      if not s:
                          flush()
                          continue
                      for key in ('Package', 'Version', 'Architecture', 'SHA256'):
                          if line.startswith(key + ': '):
                              stanza[key] = line[len(key) + 2:].strip()
                              break
                  flush()
                  if proc.wait() == 0:
                      valid.update(file_map)
              for deb in debs:
                  expected = valid.get(os.path.basename(deb))
                  h = hashlib.sha256()
                  with open(deb, 'rb') as f:
                      for chunk in iter(lambda: f.read(65536), b''):
                          h.update(chunk)
                  if not expected or h.hexdigest() != expected:
                      os.remove(deb)
          PY
              sudo apt-get install -y -qq --no-install-recommends \
                "${apt_opts[@]}" \
                -o Dir::Cache::archives="$deb_dir" \
                -o APT::Keep-Downloaded-Packages="true" \
                "${missing[@]}"
              rm -rf "$deb_dir/partial" "$deb_dir/lock"
            fi
          ) &
          pid_apt=$!
          (
            APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
            if ! echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c - >/dev/null 2>&1; then
              rm -f "$RUNNER_TEMP/appimagetool"
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" \
                "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
              echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
            fi
            chmod +x "$RUNNER_TEMP/appimagetool"
          ) &
          pid_app=$!
          wait "$pid_node"
          wait "$pid_go"
          wait "$pid_apt"
          wait "$pid_app"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_ARCH=x86_64" >> "$GITHUB_ENV"
      - name: Build Linux and Windows installers
        env:
          BLOCK_ARCH: x64
          BLOCK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BLOCK_FEEDBACK_URL: ${{ secrets.BLOCK_FEEDBACK_URL }}
          BLOCK_FEEDBACK_CLIENT_TOKEN: ${{ secrets.BLOCK_FEEDBACK_CLIENT_TOKEN }}
        run: |
          node scripts/release/go-release.mjs linux amd64
          BLOCK_REUSE_BINARY=1 node scripts/release/package-linux.mjs &
          pid_app=$!
          BLOCK_REUSE_BINARY=1 node scripts/release/package-native.mjs &
          pid_deb=$!
          BLOCK_SKIP_VERSION_SYNC=1 node scripts/release/go-release.mjs windows amd64
          BLOCK_REUSE_BINARY=1 node scripts/release/package-windows.mjs &
          pid_win=$!
          wait "$pid_app"
          wait "$pid_deb"
          wait "$pid_win"
      - name: Resolve allowlisted Linux and Windows installers
        id: installer
        shell: bash
        run: |
          {
            echo "app=$(node scripts/release/allowed-assets.mjs linux x64 AppImage)"
            echo "deb=$(node scripts/release/allowed-assets.mjs linux x64 deb)"
            echo "win=$(node scripts/release/allowed-assets.mjs windows x64 exe)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: block-installer-linux-windows-x64
          path: |
            dist/release/${{ steps.installer.outputs.app }}
            dist/release/${{ steps.installer.outputs.deb }}
            dist/release/${{ steps.installer.outputs.win }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [prepare, release-macos, release-linux-windows]
    if: >-
      needs.prepare.outputs.should_build == 'yes' &&
      github.ref == 'refs/heads/main' &&
      needs.release-macos.result == 'success' &&
      needs.release-linux-windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Setup Node 22
        run: bash scripts/ci/setup-node.sh 22
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: block-installer-*
          merge-multiple: true
          path: dist/release
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish != 'yes'
        with:
          name: block-release-${{ env.SOURCE_SHA }}
          path: dist/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/publish-release.mjs
      - name: Prune and verify release assets
        if: needs.prepare.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: node scripts/release/prune-release-assets.mjs
      - name: Update AUR block-bin
        if: needs.prepare.outputs.publish == 'yes'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash scripts/release/publish-aur.sh

  recover-post-publish:
    name: Recover post-publish feed & AUR sync
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build != 'yes' &&
      needs.prepare.outputs.sync_only_tag != '' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish == true) &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Setup Node 22
        run: bash scripts/ci/setup-node.sh 22
      - name: Sync version manifests and updates/feed.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.sync_only_tag }}
        run: node scripts/release/publish-release.mjs --sync-only --tag "$RELEASE_TAG"
      - name: Update AUR block-bin
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.sync_only_tag }}
        run: bash scripts/release/publish-aur.sh
