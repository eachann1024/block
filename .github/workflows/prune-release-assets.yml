# 发布后或手工上传附件时，按 scripts/release/allowed-assets.mjs 删掉多余文件并核对正好 5 个。
# After a release is published or edited, delete assets outside the allowlist and require exactly those 5.

name: Prune release assets

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to prune
        required: true
        default: v1.0.355
        type: string

permissions:
  contents: write

concurrency:
  group: block-prune-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  prune:
    name: Prune and verify assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        run: bash scripts/ci/setup-node.sh 22
      - name: Prune and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: node scripts/release/prune-release-assets.mjs
