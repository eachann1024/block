name: Sync plugin docs to website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-public:
    runs-on: ubuntu-24.04
    steps:
      - name: Notify eachann1024/public to rebuild block.cooool.top
        env:
          DISPATCH_TOKEN: ${{ secrets.PUBLIC_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "PUBLIC_REPO_DISPATCH_TOKEN is not configured; skipping immediate dispatch (eachann1024/public daily rebuild will still pick up the latest docs)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/eachann1024/public/dispatches \
            -d "{\"event_type\":\"block-docs-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
          echo "Dispatched block-docs-updated for ${GITHUB_SHA} to eachann1024/public." >> "$GITHUB_STEP_SUMMARY"
