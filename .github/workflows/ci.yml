name: CI

on:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'assets/**'
      - 'updates/**'
      - 'scripts/lint_design.py'
      - 'scripts/ci/setup-go.sh'
      - 'scripts/ci/check.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'assets/**'
      - 'updates/**'
      - 'scripts/lint_design.py'
      - 'scripts/ci/setup-go.sh'
      - 'scripts/ci/check.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: block-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'

jobs:
  check:
    name: Go check & cross-platform build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        run: bash scripts/ci/setup-go.sh
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ hashFiles('go.sum') }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-ci-${{ runner.os }}-${{ runner.arch }}-go1.27-${{ github.sha }}
          restore-keys: |
            go-build-ci-${{ runner.os }}-${{ runner.arch }}-go1.27-
      - name: Lint, cross-platform vet & build, and test
        run: bash scripts/ci/check.sh
