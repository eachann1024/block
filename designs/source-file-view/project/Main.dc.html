<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深色 · 代码文件满宽打开</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#9dbcf5}
button{font-family:inherit;font-size:13px;line-height:20px}
button:focus-visible,a:focus-visible{outline:2px solid #779de8;outline-offset:1px}
</style>
</helmet>

<div style="width:1280px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#181818;color:#ececec;font-family:Inter,-apple-system,'PingFang SC',system-ui,sans-serif;font-size:14px;line-height:20px;border-radius:12px;overflow:hidden;border:1px solid #292929;-webkit-font-smoothing:antialiased">

  <header style="height:40px;flex:none;display:flex;align-items:center;padding:0 10px 0 14px;background:#262626;border-bottom:1px solid #292929;box-sizing:border-box;gap:12px">
    <div style="width:226px;display:flex;align-items:center;gap:8px;flex:none">
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:6px;background:#28c840"></span>
      <span style="margin-left:10px;font-weight:500">Block</span>
    </div>
    <nav aria-label="路径" style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden">
      <span style="color:#b4b4b4">internal</span><span style="color:#767676">/</span>
      <span style="color:#b4b4b4">app</span><span style="color:#767676">/</span>
      <span style="font-weight:500">surfaces.go</span>
    </nav>
    <div style="display:flex;align-items:center;gap:2px;flex:none">
      <span style="height:24px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;background:#2c2c2c;color:#b4b4b4;font-size:12px;line-height:16px">Go</span>
      <span style="height:24px;display:inline-flex;align-items:center;padding:0 8px;color:#b4b4b4;font-size:12px;line-height:16px">UTF-8 · LF</span>
      <span style="height:24px;display:inline-flex;align-items:center;padding:0 8px;color:#b4b4b4;font-size:12px;line-height:16px">行 {{cur}}，列 18</span>
      <button type="button" aria-label="自动换行" aria-pressed="false" style="width:28px;height:28px;padding:0;border:0;border-radius:8px;background:transparent;color:#b4b4b4;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h12.5a3.5 3.5 0 010 7H12m0 0l2.5-2.5M12 19l2.5 2.5M4 18h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <button type="button" aria-label="在访达中显示" style="width:28px;height:28px;padding:0;border:0;border-radius:8px;background:transparent;color:#b4b4b4;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 7.5a2 2 0 012-2h4l2 2h7a2 2 0 012 2v7.5a2 2 0 01-2 2h-13a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </button>
    </div>
  </header>

  <div style="flex:1;display:flex;min-height:0">
    <nav aria-label="文件" style="width:240px;flex:none;background:#222222;border-right:1px solid #292929;box-sizing:border-box;padding:10px 8px;display:flex;flex-direction:column;gap:1px;font-size:13px">
      <sc-for list="{{tree}}" as="f" hint-placeholder-count="12">
        <a href="#" aria-current="{{f.current}}" style="height:28px;display:flex;align-items:center;gap:6px;padding:0 8px 0 {{f.indent}};border-radius:6px;text-decoration:none;color:{{f.color}};background:{{f.bg}};font-weight:{{f.weight}}">
          <sc-if value="{{f.isDir}}" hint-placeholder-val="{{false}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none;color:#b4b4b4"><path d="M3.5 7.5a2 2 0 012-2h4l2 2h7a2 2 0 012 2v7.5a2 2 0 01-2 2h-13a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
          </sc-if>
          <sc-if value="{{f.isCode}}" hint-placeholder-val="{{false}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none;color:#b4b4b4"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </sc-if>
          <sc-if value="{{f.isNote}}" hint-placeholder-val="{{true}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none;color:#b4b4b4"><path d="M7 3.5h7l4 4v13H7a1.5 1.5 0 01-1.5-1.5V5A1.5 1.5 0 017 3.5zM9 12h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
          </sc-if>
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.name}}</span>
        </a>
      </sc-for>
    </nav>

    <main aria-label="surfaces.go" style="flex:1;min-width:0;position:relative;overflow:hidden;background:#181818;font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:13px;line-height:20px">
      <div style="padding:8px 0 40px;display:flex;flex-direction:column">
        <sc-for list="{{lines}}" as="ln" hint-placeholder-count="30">
          <div style="height:20px;display:flex;background:{{ln.bg}}">
            <span aria-hidden="true" style="width:56px;flex:none;box-sizing:border-box;padding-right:16px;text-align:right;color:{{ln.numColor}};font-variant-numeric:tabular-nums">{{ln.n}}</span>
            <span style="flex:1;min-width:0;white-space:pre;overflow:hidden;padding-left:4px"><sc-for list="{{ln.tokens}}" as="tk" hint-placeholder-count="3"><span style="color:{{tk.c}}">{{tk.t}}</span></sc-for></span>
          </div>
        </sc-for>
      </div>
      <div aria-hidden="true" style="position:absolute;left:{{caretLeft}};top:{{caretTop}};width:2px;height:20px;background:#779de8;border-radius:1px"></div>
      <div aria-hidden="true" style="position:absolute;right:3px;top:12px;width:6px;height:140px;border-radius:3px;background:#3a3a3a"></div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"currentLine":{"editor":"int","default":12},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  tokenize(line) {
    const C = { kw: '#9dbcf5', str: '#7be0a6', com: '#8a8a8a', num: '#e5a54b', fn: '#f0d48a', base: '#ececec' };
    const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`[^`]*`)|\b(func|return|if|else|for|range|var|const|type|struct|package|import|switch|case|default|nil|true|false|defer|go)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_]\w*)(?=\()/g;
    const out = [];
    let last = 0, m;
    while ((m = re.exec(line))) {
      if (m.index > last) out.push({ t: line.slice(last, m.index), c: C.base });
      const c = m[1] ? C.com : m[2] ? C.str : m[3] ? C.kw : m[4] ? C.num : C.fn;
      out.push({ t: m[0], c });
      last = re.lastIndex;
    }
    if (last < line.length) out.push({ t: line.slice(last), c: C.base });
    if (!out.length) out.push({ t: ' ', c: C.base });
    return out;
  }
  renderVals() {
    const cur = this.props.currentLine ?? 12;
    const src = [
      'func (s *TabSurface) renderSourceEditor(c *ui.Context, onSave func(path, text string, bom bool) error) {',
      '\tpal := theme.Ocean()',
      '\tc.Key("source-surface:" + s.Path)',
      '\touter := ui.Column(c).Fill().Background(pal.Paper)',
      '\tblockui.Probe(outer, "source-surface")',
      '\t_, codeFont, _ := theme.Typography()',
      '\tif strings.TrimSpace(codeFont) == "" {',
      '\t\tcodeFont = "monospace"',
      '\t}',
      '',
      '\t// 满宽：行号栏贴左边，正文从行号栏右侧开始，没有纸面留白',
      '\tlineCount := strings.Count(s.Source.Text, "\\n") + 1',
      '\tgutterW := gutterWidth(lineCount, z)',
      '\tscroll := blockui.Scroll(c).Grow(1).MinHeight(0).FillWidth()',
      '\tscroll.Children(func() {',
      '\t\tui.Row(c).FillWidth().AlignItems(ui.Start).Children(func() {',
      '\t\t\trenderGutter(c, lineCount, s.caretLine, gutterW)',
      '\t\t\trenderCurrentLine(c, s.caretLine, pal.CodeLine)',
      '\t\t\tta := ui.TextAreaBase(c, &s.Source.Text).Grow(1).MinWidth(0)',
      '\t\t\tta.Font(codeFont).FontSize(13 * z).LineHeight(1.54)',
      '\t\t\tif !s.Wrap {',
      '\t\t\t\tta.NoWrap() // 长行横向滚动，不折行',
      '\t\t\t}',
      '\t\t})',
      '\t})',
      '}',
      '',
      'func gutterWidth(lines int, z float32) float32 {',
      '\tdigits := max(len(strconv.Itoa(lines)), 3)',
      '\treturn float32(digits)*8*z + 32',
      '}',
      '',
      'func (s *TabSurface) ToggleWrap() {',
      '\ts.Wrap = !s.Wrap',
      '}',
      ''
    ];
    const lines = src.map((raw, i) => {
      const n = i + 1;
      const on = n === cur;
      return {
        n,
        tokens: this.tokenize(raw.replace(/\t/g, '    ')),
        bg: on ? '#222222' : 'transparent',
        numColor: on ? '#ececec' : '#767676'
      };
    });
    const tree = [
      { name: 'internal', dir: true, depth: 0 },
      { name: 'app', dir: true, depth: 1 },
      { name: 'external_open.go', depth: 2 },
      { name: 'menubar.go', depth: 2 },
      { name: 'surfaces.go', depth: 2, current: true },
      { name: 'titlebar.go', depth: 2 },
      { name: 'workspace.go', depth: 2 },
      { name: 'theme', dir: true, depth: 1 },
      { name: 'tokens.go', depth: 2 },
      { name: 'store', dir: true, depth: 0 },
      { name: 'store-index.json', depth: 1 },
      { name: 'DESIGN.md', note: true, depth: 0 },
      { name: '路线图.md', note: true, depth: 0 }
    ].map(f => ({
      name: f.name,
      isDir: !!f.dir,
      isNote: !!f.note,
      isCode: !f.dir && !f.note,
      indent: (8 + f.depth * 14) + 'px',
      current: f.current ? 'page' : 'false',
      bg: f.current ? '#3a3a3a' : 'transparent',
      color: f.current ? '#ececec' : '#b4b4b4',
      weight: f.current ? '500' : '400'
    }));
    const caretCol = 18;
    return {
      cur,
      lines,
      tree,
      caretTop: (8 + (cur - 1) * 20) + 'px',
      caretLeft: (56 + 4 + caretCol * 7.8) + 'px'
    };
  }
}
</script>
</body>
</html>
