<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>纸面主题选择器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#8ab4ff}a:hover{color:#b9d0ff}
.tile{appearance:none;border:1px solid #34343a;background:#232327;border-radius:10px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;font:inherit;color:#e6e6e8}
.tile:hover{border-color:#4a4a52}
.tile.on{border-color:#6b9bff;box-shadow:0 0 0 1px #6b9bff}
.thumb{height:78px;border-radius:6px;overflow:hidden;position:relative}
.tname{font-size:13px;padding:0 4px;display:flex;justify-content:space-between;align-items:center}
</style>
</helmet>
<div style="width:360px;height:1240px;box-sizing:border-box;background:#1b1b1e;color:#e6e6e8;font-family:'PingFang SC',system-ui,sans-serif;padding:24px 20px;display:flex;flex-direction:column;gap:14px">
<div style="font-size:14px;font-weight:600">纸面主题</div>
<div style="font-size:12px;color:#a1a1aa;letter-spacing:.04em">浅色</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">

<button class="tile on" type="button"><div class="thumb" style="background:#faf8f3;padding:12px 14px;box-sizing:border-box;border-left:2px solid #1a1a1a"><div style="font-family:'Songti SC',serif;font-size:17px;color:#111;font-weight:600">书页 Aa</div><div style="height:0.5px;background:#111;margin:6px 0"></div><div style="font-family:Georgia,serif;font-size:9px;color:#777;text-align:center;margin-top:18px">— 12 —</div></div><div class="tname"><span>黑白素纸</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b9bff" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div></button>

<button class="tile" type="button"><div class="thumb" style="background-color:#fbf5df;background-image:linear-gradient(#c9dcef 1px,transparent 1px),linear-gradient(90deg,#c9dcef 1px,transparent 1px);background-size:8px 8px"><div style="position:absolute;left:16px;top:14px;right:14px;bottom:10px;background:#fffdf4;transform:rotate(-2deg);box-shadow:0 2px 4px rgba(90,60,10,.18);padding:8px 10px;box-sizing:border-box"><div style="position:absolute;top:-6px;left:40%;width:34px;height:11px;background:rgba(240,180,90,.6);transform:rotate(3deg)"></div><div style="font-family:'Kaiti SC',serif;font-size:16px;color:#2a2620">手写便签</div><svg width="60" height="6" viewBox="0 0 60 6" aria-hidden="true"><path d="M0 3q5-4 10 0t10 0 10 0 10 0 10 0 10 0" fill="none" stroke="#d97706" stroke-width="1.4"/></svg></div></div><div class="tname"><span>手账便签</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background-color:#f3ecdc;background-image:radial-gradient(#1d3fa8 0.8px,transparent 1px);background-size:5px 5px;background-position:0 0"><div style="position:absolute;left:14px;top:18px;width:96px;height:30px;background:#ff5aa8;mix-blend-mode:multiply"></div><div style="position:absolute;left:18px;top:16px;font-family:'PingFang SC';font-weight:900;font-size:20px;color:#1d3fa8;mix-blend-mode:multiply">孔版</div><div style="position:absolute;right:12px;bottom:10px;font-family:Menlo,monospace;font-size:9px;color:#1d3fa8">01</div></div><div class="tname"><span>孔版双色</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background:#ede4cf;padding:8px 10px;box-sizing:border-box;text-align:center"><div style="display:flex;justify-content:space-between;font-family:Georgia,serif;font-size:7px;color:#5a5244"><span>11.18</span><span>VOL.12</span></div><div style="font-family:Didot,'Songti SC',serif;font-size:18px;font-weight:700;color:#1a1814;line-height:1.1">块报</div><div style="border-top:2px solid #1a1814;border-bottom:0.5px solid #1a1814;height:2px;margin:3px 0"></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:5px"><div style="height:16px;border-right:0.5px solid #8c826e;background:repeating-linear-gradient(#8c826e 0 1px,transparent 1px 4px)"></div><div style="height:16px;border-right:0.5px solid #8c826e;background:repeating-linear-gradient(#8c826e 0 1px,transparent 1px 4px)"></div><div style="height:16px;background:repeating-linear-gradient(#8c826e 0 1px,transparent 1px 4px)"></div></div></div><div class="tname"><span>铅字报刊</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background:#f2efe9;padding:6px 10px;box-sizing:border-box"><div style="font-family:'PingFang SC';font-weight:900;font-size:30px;line-height:1;color:#141414;letter-spacing:-1px">大<span style="background:#e2471b;color:#fff;padding:0 2px">字</span></div><div style="position:absolute;right:8px;bottom:8px;font-family:Menlo,monospace;font-size:8px;color:#141414;transform:rotate(-90deg);transform-origin:right bottom">2026.11</div></div><div class="tname"><span>大字海报</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background:linear-gradient(160deg,#e8edf3,#dfe5ee);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px"><div style="background:#fff;border:1px solid #e4e1dc;border-radius:8px;height:30px;box-shadow:0 2px 6px rgba(30,50,90,.08);padding:6px 8px;box-sizing:border-box;font-family:Georgia,serif;font-size:12px;color:#0f172a">Mist</div><div style="background:#fff;border:1px solid #e4e1dc;border-radius:8px;height:18px;box-shadow:0 2px 6px rgba(30,50,90,.08)"></div></div><div class="tname"><span>雾面卡片</span></div></button>
</div>

<div style="font-size:12px;color:#a1a1aa;letter-spacing:.04em;margin-top:8px">深色</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">

<button class="tile" type="button"><div class="thumb" style="background:#141311;padding:12px 14px;box-sizing:border-box"><div style="font-family:Georgia,serif;font-size:40px;line-height:.8;color:#3a3833">“</div><div style="font-family:'Songti SC',serif;font-size:15px;color:#f2efe8;letter-spacing:.12em;margin-top:-6px">墨 黑</div><div style="width:30%;height:1px;background:#f2efe8;margin-top:6px"></div></div><div class="tname"><span>墨黑</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background-color:#1d1b18;background-image:linear-gradient(rgba(214,176,92,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(214,176,92,.14) 1px,transparent 1px);background-size:10px 10px"><div style="position:absolute;inset:6px;border:1px solid #c9a352;border-radius:4px"></div><div style="position:absolute;left:14px;top:16px;font-family:'Kaiti SC',serif;font-size:16px;color:#efe6d2">黑卡手账</div><div style="position:absolute;right:12px;top:10px;width:28px;height:28px;border:1.2px solid #c9a352;border-radius:50%;font-family:Menlo,monospace;font-size:7px;color:#c9a352;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)">11·18</div></div><div class="tname"><span>黑卡手账</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background:radial-gradient(circle at 80% 20%,#2a1238 0,#0d0c14 60%);padding:12px;box-sizing:border-box"><div style="font-family:'PingFang SC';font-weight:800;font-size:18px;color:#f4f1ff">夜 <span style="color:transparent;-webkit-text-stroke:1px #ff3d8b;text-shadow:0 0 8px rgba(255,61,139,.7)">NEON</span></div><div style="font-family:Menlo,monospace;font-size:8px;color:#8f8aa8;letter-spacing:.2em;margin-top:10px">— SIGNAL —</div></div><div class="tname"><span>霓虹夜色</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background:#120f0d"><div style="position:absolute;left:0;right:0;top:4px;height:6px;background:repeating-linear-gradient(90deg,#3a2f26 0 6px,transparent 6px 12px)"></div><div style="position:absolute;left:0;right:0;bottom:4px;height:6px;background:repeating-linear-gradient(90deg,#3a2f26 0 6px,transparent 6px 12px)"></div><div style="position:absolute;left:12px;top:18px;font-family:Menlo,monospace;font-size:7px;color:#d9482f">FRAME 03</div><div style="position:absolute;left:12px;top:30px;font-family:'Songti SC',serif;font-size:16px;color:#efe4cf">暗房</div></div><div class="tname"><span>暗房胶片</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background:#211915;padding:10px;box-sizing:border-box"><div style="background:#2c221c;border-radius:10px;height:100%;padding:8px 10px;box-sizing:border-box;box-shadow:0 4px 10px rgba(0,0,0,.4)"><div style="font-family:'Songti SC',serif;font-size:14px;color:#eadcc4">夜读</div><div style="font-family:Georgia,serif;font-size:9px;color:#b8a68a;margin-top:6px"><span style="background:rgba(232,166,66,.28)">a quiet page</span></div></div></div><div class="tname"><span>夜读卡片</span></div></button>

<button class="tile" type="button"><div class="thumb" style="background:#071008;background-image:repeating-linear-gradient(rgba(126,231,135,.06) 0 1px,transparent 1px 3px);padding:8px 10px;box-sizing:border-box;font-family:Menlo,monospace;color:#7ee787"><div style="font-size:9px;color:#3f8a47">┌──────────┐</div><div style="font-size:11px;text-shadow:0 0 6px rgba(126,231,135,.6)">$ note<span style="background:#7ee787;color:#071008">&nbsp;</span></div><div style="font-size:9px;color:#3f8a47">└──────────┘</div></div><div class="tname"><span>终端绿屏</span></div></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1240}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
