<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>工作区 AI 管理</title><script src="./support.js"></script></head><body><x-dc><helmet><style>
div.list{padding:8px 16px}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#20242c}button,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:0;background:transparent;border-radius:8px;padding:8px 10px}button:hover{background:#eef3fc}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #547dd0}.app{height:850px;display:flex;flex-direction:column;background:#fff}.bar{height:40px;background:#f1f1f1;border-bottom:1px solid #e6e6e6;padding:10px 16px;text-align:center;color:#526071}.body{display:flex;flex:1}.side{width:260px;background:#fafafa;border-right:1px solid #e6e6e6;padding:20px 12px}.nav{padding:8px;border-radius:8px}.selected{background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0}.muted{color:#526071}.space{height:26px}.main{flex:1;min-width:0;background:#f8f8f8;overflow:auto}.paper{max-width:720px;margin:52px auto;padding:0 24px}.paper h1{font-size:24px}.section{margin-top:32px}.section h2{font-size:16px}.list{background:#fff;border:1px solid #e4e6ea;border-radius:14px;padding:0 16px}.item{display:flex;align-items:center;min-height:68px;border-bottom:1px solid #e4e6ea;gap:12px}.item:last-child{border:0}.item strong{flex:1}.primary{background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0}.outline{border:1px solid #dcdcdc}.compact{width:360px;border-left:1px solid #e6e6e6;background:white;display:flex;flex-direction:column}.head{height:58px;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #e4e6ea}.head strong{font-size:16px;flex:1}.content{padding:16px;flex:1}.bubble{background:#f1f1f1;border-radius:10px;padding:12px;margin:16px 0}.panel{border:1px solid #e4e6ea;border-radius:10px;padding:12px;margin:12px 0}.panel p{margin:5px 0 12px}.composer{padding:12px 16px;border-top:1px solid #e4e6ea}.composer textarea{width:100%;height:65px;border:1px solid #dcdcdc;border-radius:8px;padding:10px;resize:none}.row{display:flex;justify-content:space-between;align-items:center}.demo{background:#fafafa;border-top:1px solid #e4e6ea;padding:10px 16px}select{border:1px solid #dcdcdc;border-radius:8px;background:#fff;padding:6px}
</style></helmet><div class="app"><div class="bar">Block</div><div class="body"><aside class="side"><strong>工作空间</strong><div class="space"></div><div class="muted nav">工作区设置</div><div class="nav">通用</div><div class="nav selected">AI 管理</div><div class="nav">快捷键</div><div class="space"></div><div class="nav">返回笔记</div></aside><main class="main"><div class="paper"><h1>AI 管理</h1><div class="section"><h2>默认后端</h2><div class="list"><div class="item"><strong>新会话使用</strong><select value="{{agent}}" onChange="{{changeAgent}}" aria-label="默认后端"><option>内置 AI</option><option>Codex</option><option>Claude</option><option>dsh</option></select></div></div></div><div class="section"><h2>可用后端</h2><div class="list"><sc-for list="{{entries}}" as="item" hint-placeholder-count="4"><div class="item"><strong>{{item.name}}</strong><span class="muted">{{item.status}}</span><button class="outline" onClick="{{item.pick}}">设为默认</button></div></sc-for></div></div></div></main><aside class="compact"><div class="head"><strong>AI 助手</strong><span class="muted">{{agent}}</span><button onClick="{{newSession}}">新会话</button></div><div class="content"><div class="muted">当前会话 · {{sessionAgent}}</div><div class="bubble">整理一下当前笔记。</div><p>{{message}}</p><sc-if value="{{approval}}" hint-placeholder-val="{{false}}"><div class="panel"><strong>允许读取当前笔记？</strong><p>执行前需要你的确认。</p><button class="primary" onClick="{{approve}}">允许</button> <button class="outline" onClick="{{stop}}">拒绝</button></div></sc-if><sc-if value="{{error}}" hint-placeholder-val="{{false}}"><div class="panel">请求失败，请检查后端状态。<p><button class="outline" onClick="{{run}}">重试</button></p></div></sc-if></div><div class="composer"><textarea placeholder="向 AI 提问…" aria-label="输入消息"></textarea><div class="row"><span class="muted">当前笔记</span><button class="primary" onClick="{{toggleRun}}">{{sendLabel}}</button></div></div><div class="demo"><label>演示状态 <select value="{{status}}" onChange="{{changeStatus}}"><option>就绪</option><option>未安装</option><option>未登录</option><option>不可用</option><option>运行中</option><option>审批</option><option>停止</option><option>错误</option></select></label></div></aside></div></div></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":850}}'>
class Component extends DCLogic {
  renderVals(){const s=this.state||{},agent=s.agent||'内置 AI',sessionAgent=s.sessionAgent||'内置 AI',status=s.status||'就绪';const messages={'就绪':'可以开始整理当前笔记。','未安装':'未检测到该后端，请先安装。','未登录':'请先在本机完成登录。','不可用':'当前后端不可用，请检查配置。','运行中':'正在整理笔记…','审批':'请求执行前需要你的确认。','停止':'已停止运行。','错误':'本次请求未完成。'};return {agent,sessionAgent,status,message:messages[status],approval:status==='审批',error:status==='错误',sendLabel:status==='运行中'?'停止':'发送',entries:['内置 AI','Codex','Claude','dsh'].map(name=>({name,status:name===agent?status:'查看配置',pick:()=>this.setState({agent:name})})),changeAgent:e=>this.setState({agent:e.target.value}),newSession:()=>this.setState({sessionAgent:agent,status:'就绪'}),changeStatus:e=>this.setState({status:e.target.value}),run:()=>this.setState({status:'运行中'}),stop:()=>this.setState({status:'停止'}),approve:()=>this.setState({status:'运行中'}),toggleRun:()=>this.setState({status:status==='运行中'?'停止':'运行中'})};}
}
</script></body></html>
