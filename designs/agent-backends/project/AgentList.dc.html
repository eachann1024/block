<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Agent 专属会话</title><script src="./support.js"></script></head><body><x-dc><helmet><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#20242c}button,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left}button:hover{background:#eef3fc}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #547dd0}.app{height:850px;display:flex;flex-direction:column}.bar{height:40px;background:#f1f1f1;border-bottom:1px solid #e6e6e6;padding:10px 16px;color:#526071;text-align:center}.body{display:flex;flex:1}.side{width:260px;background:#fafafa;border-right:1px solid #e6e6e6;padding:20px 12px}.nav{padding:8px;border-radius:8px}.selected{background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0}.muted{color:#526071}.space{height:25px}.editor{flex:1;min-width:0}.paper{width:672px;margin:70px auto;font-size:16px;line-height:1.8;color:#1f1e1d}.paper h1{font-size:30px}.agent{width:360px;border-left:1px solid #e6e6e6;display:flex;flex-direction:column}.head{height:58px;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #e4e6ea}.head strong{font-size:16px;flex:1}.content{flex:1;padding:16px;overflow:auto}.entry{display:flex;align-items:center;width:100%;padding:14px 10px;border-bottom:1px solid #e4e6ea;border-radius:0}.entry strong{flex:1}.entry svg{width:18px;height:18px;fill:none;stroke:#547dd0;stroke-width:1.5;margin-right:12px}.session{display:block;width:100%;padding:12px;border:1px solid #e4e6ea;margin:8px 0}.primary{background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0}.outline{border:1px solid #dcdcdc}.bubble{background:#f1f1f1;border-radius:10px;padding:12px;margin:16px 0}.panel{border:1px solid #e4e6ea;border-radius:10px;padding:12px;margin:12px 0}.panel p{margin:5px 0 12px}.composer{padding:12px 16px;border-top:1px solid #e4e6ea}.composer textarea{width:100%;height:65px;border:1px solid #dcdcdc;border-radius:8px;padding:10px;resize:none}.row{display:flex;justify-content:space-between;align-items:center}.demo{background:#fafafa;border-top:1px solid #e4e6ea;padding:10px 16px}select{border:1px solid #dcdcdc;border-radius:8px;background:#fff;padding:6px;margin-left:8px}
</style></helmet><div class="app"><div class="bar">Block</div><div class="body"><aside class="side"><strong>工作空间</strong><div class="space"></div><div class="muted nav">笔记本</div><div class="nav">收件箱</div><div class="nav selected">产品构思</div><div class="nav">阅读记录</div></aside><main class="editor"><article class="paper"><div class="muted">产品构思 / 项目启动会</div><h1>项目启动会</h1><p>这次讨论聚焦下一阶段的产品方向，以及团队需要共同确认的事项。</p><h2>讨论重点</h2><p>讨论产品方向和团队的工作安排。</p></article></main><aside class="agent"><div class="head"><sc-if value="{{notAgents}}" hint-placeholder-val="{{false}}"><button onClick="{{back}}">返回</button></sc-if><strong>{{title}}</strong><sc-if value="{{sessions}}" hint-placeholder-val="{{false}}"><button class="primary" onClick="{{openChat}}">新会话</button></sc-if></div><div class="content"><sc-if value="{{agents}}" hint-placeholder-val="{{true}}"><div class="muted">选择 Agent</div><sc-for list="{{entries}}" as="item" hint-placeholder-count="4"><button class="entry" onClick="{{item.pick}}"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="4"/><path d="M6 10h8M10 6v8"/></svg><strong>{{item.name}}</strong><span class="muted">{{item.status}}</span></button></sc-for></sc-if><sc-if value="{{sessions}}" hint-placeholder-val="{{false}}"><div class="muted">{{agent}} 的会话</div><button class="session" onClick="{{openChat}}">项目启动会<br/><span class="muted">整理会议讨论重点</span></button><button class="session" onClick="{{openChat}}">新功能构思<br/><span class="muted">梳理需求和下一步</span></button></sc-if><sc-if value="{{chat}}" hint-placeholder-val="{{false}}"><div class="muted">{{agent}} · 项目启动会</div><div class="bubble">整理一下当前笔记。</div><p>{{message}}</p><sc-if value="{{approval}}" hint-placeholder-val="{{false}}"><div class="panel"><strong>允许读取当前笔记？</strong><p>执行前需要你的确认。</p><button class="primary" onClick="{{approve}}">允许</button> <button class="outline" onClick="{{stop}}">拒绝</button></div></sc-if><sc-if value="{{error}}" hint-placeholder-val="{{false}}"><div class="panel">请求失败，请检查后端状态。<p><button class="outline" onClick="{{run}}">重试</button></p></div></sc-if></sc-if></div><sc-if value="{{chat}}" hint-placeholder-val="{{false}}"><div class="composer"><textarea placeholder="向 AI 提问…" aria-label="输入消息"></textarea><div class="row"><span class="muted">当前笔记</span><button class="primary" onClick="{{toggleRun}}">{{sendLabel}}</button></div></div></sc-if><div class="demo"><label>演示状态<select value="{{status}}" onChange="{{changeStatus}}"><option>就绪</option><option>未安装</option><option>未登录</option><option>不可用</option><option>运行中</option><option>审批</option><option>停止</option><option>错误</option></select></label></div></aside></div></div></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":850}}'>
class Component extends DCLogic {
  renderVals(){const s=this.state||{}, screen=s.screen||'agents',agent=s.agent||'内置 AI',status=s.status||'就绪';const messages={'就绪':'可以开始整理当前笔记。','未安装':'未检测到该后端，请先安装。','未登录':'请先在本机完成登录。','不可用':'当前后端不可用，请检查配置。','运行中':'正在整理笔记…','审批':'请求执行前需要你的确认。','停止':'已停止运行。','错误':'本次请求未完成。'};return {agent,status,title:screen==='agents'?'AI 助手':screen==='sessions'?agent:'项目启动会',agents:screen==='agents',sessions:screen==='sessions',chat:screen==='chat',notAgents:screen!=='agents',message:messages[status],approval:status==='审批',error:status==='错误',sendLabel:status==='运行中'?'停止':'发送',entries:['内置 AI','Codex','Claude','dsh'].map(name=>({name,status:name===agent?status:'查看会话',pick:()=>this.setState({agent:name,screen:'sessions'})})),back:()=>this.setState({screen:screen==='chat'?'sessions':'agents'}),openChat:()=>this.setState({screen:'chat'}),changeStatus:e=>this.setState({status:e.target.value}),run:()=>this.setState({status:'运行中'}),stop:()=>this.setState({status:'停止'}),approve:()=>this.setState({status:'运行中'}),toggleRun:()=>this.setState({status:status==='运行中'?'停止':'运行中'})};}
}
</script></body></html>
