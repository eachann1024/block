<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>聊天栏选择后端</title><script src="./support.js"></script></head><body>
<x-dc><helmet><style>
.app .bar{padding:8px 16px}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#20242c}button,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:0;background:transparent;border-radius:8px;padding:7px 10px}button:hover{background:#eef3fc}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #547dd0;outline-offset:1px}.app{height:850px;display:flex;flex-direction:column;background:#fff}.bar{height:40px;background:#f1f1f1;border-bottom:1px solid #e6e6e6;display:flex;align-items:center;padding:0 16px;gap:8px}.dot{width:11px;height:11px;border-radius:50%;background:#dcdcdc}.bar-title{margin:auto;color:#526071}.body{display:flex;flex:1;min-height:0}.sidebar{width:260px;flex:none;background:#fafafa;border-right:1px solid #e6e6e6;padding:20px 12px}.label{color:#526071;margin:22px 8px 8px}.nav{padding:7px 9px;border-radius:8px}.nav.active{background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0}.main{flex:1;min-width:0;overflow:auto}.paper{width:672px;margin:70px auto;color:#1f1e1d;font-size:16px;line-height:1.8}.paper h1{font-size:30px;line-height:1.3;margin:0 0 28px}.paper h2{font-size:21px;margin-top:34px}.chat{width:360px;border-left:1px solid #e6e6e6;display:flex;flex-direction:column;background:#fff}.head{padding:12px 16px;border-bottom:1px solid #e4e6ea;display:flex;align-items:center;gap:8px}.head strong{flex:1;font-size:16px}.select{border:1px solid #dcdcdc;border-radius:8px;background:#fff;padding:7px;max-width:170px}.content{padding:20px 16px;flex:1;overflow:auto}.muted{color:#526071}.bubble{background:#f1f1f1;border-radius:10px;padding:12px;margin:14px 0}.reply{padding:10px 0;line-height:1.6}.panel{border:1px solid #e4e6ea;border-radius:10px;padding:12px;margin:12px 0}.panel p{margin:6px 0}.old{background:#f3f1ec;text-decoration:line-through}.new{background:#e5edfc}.actions{display:flex;gap:6px;margin-top:10px}.outline{border:1px solid #dcdcdc}.primary{background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0}.composer{border-top:1px solid #e4e6ea;padding:12px 16px}.composer textarea{width:100%;height:68px;border:1px solid #dcdcdc;border-radius:8px;resize:none;padding:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.demo{background:#fafafa;border-top:1px solid #e4e6ea;padding:9px 16px}.demo select{margin-left:8px}.icon{width:16px;height:16px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style></helmet>
<div class="app"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="bar-title">Block</span></div><div class="body"><aside class="sidebar"><strong>工作空间</strong><div class="label">笔记本</div><div class="nav">收件箱</div><div class="nav active">产品构思</div><div class="nav">阅读记录</div><div class="label">最近访问</div><div class="nav">项目启动会</div></aside><main class="main"><article class="paper"><div class="muted">产品构思 / 项目启动会</div><h1>项目启动会</h1><p>这次讨论聚焦下一阶段的产品方向，以及团队需要共同确认的事项。</p><h2>讨论重点</h2><p>{{noteText}}</p><h2>下一步</h2><p>整理会议结论，明确负责人和预计时间。</p></article></main><aside class="chat"><div class="head"><strong>AI 助手</strong><select class="select" aria-label="后端选择" value="{{backend}}" onChange="{{changeBackend}}"><option>内置 AI</option><option>Codex</option><option>Claude</option><option>dsh</option></select><button onClick="{{newSession}}" aria-label="新会话"><svg class="icon" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></button></div><div class="content"><div class="muted">当前会话 · {{backend}}</div><div class="bubble">帮我整理讨论重点，表达更清楚一些。</div><div class="reply">{{message}}</div><sc-if value="{{approval}}" hint-placeholder-val="{{false}}"><div class="panel"><strong>需要审批</strong><p>允许读取当前笔记并生成修改建议？</p><div class="actions"><button class="primary" onClick="{{approve}}">允许</button><button class="outline" onClick="{{deny}}">拒绝</button></div></div></sc-if><sc-if value="{{showDiff}}" hint-placeholder-val="{{true}}"><div class="panel"><strong>笔记修改建议</strong><p class="old">讨论产品方向和团队的工作安排。</p><p class="new">明确产品方向，分配下一阶段的任务与负责人。</p><div class="actions"><button class="primary" onClick="{{accept}}">接受</button><button class="outline" onClick="{{reject}}">拒绝</button></div></div></sc-if><sc-if value="{{accepted}}" hint-placeholder-val="{{false}}"><div class="panel"><span>已接受修改</span><button class="outline" onClick="{{undo}}">撤销</button></div></sc-if><sc-if value="{{error}}" hint-placeholder-val="{{false}}"><div class="panel">无法启动后端。请检查安装或登录状态。<div class="actions"><button class="outline" onClick="{{retry}}">重试</button></div></div></sc-if></div><div class="composer"><textarea aria-label="输入消息" placeholder="向 AI 提问…"></textarea><div class="row"><span class="muted">当前笔记</span><button class="primary" onClick="{{send}}">{{sendLabel}}</button></div></div><div class="demo"><label>演示状态<select class="select" value="{{status}}" onChange="{{changeStatus}}"><option>就绪</option><option>未安装</option><option>未登录</option><option>不可用</option><option>运行中</option><option>审批</option><option>停止</option><option>错误</option></select></label></div></aside></div></div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":850}}'>
class Component extends DCLogic {
  renderVals() {
    const s=this.state||{}, backend=s.backend||'内置 AI', status=s.status||'就绪', diff=s.diff||'pending';
    const messages={'就绪':'我整理了一处修改建议，确认后才会写入笔记。','未安装':'未检测到该后端，请先安装。','未登录':'请先在本机完成登录。','不可用':'当前后端不可用，请检查配置。','运行中':'正在整理笔记…','审批':'请求执行前需要你的确认。','停止':'已停止运行。','错误':'本次请求未完成。'};
    return {backend,status,message:messages[status],noteText:diff==='accepted'?'明确产品方向，分配下一阶段的任务与负责人。':'讨论产品方向和团队的工作安排。',showDiff:status==='就绪'&&diff==='pending',accepted:diff==='accepted',approval:status==='审批',error:status==='错误',sendLabel:status==='运行中'?'停止':'发送',changeBackend:e=>this.setState({backend:e.target.value,status:'就绪',diff:'pending'}),changeStatus:e=>this.setState({status:e.target.value}),newSession:()=>this.setState({status:'就绪',diff:'pending'}),send:()=>this.setState({status:status==='运行中'?'停止':'运行中'}),approve:()=>this.setState({status:'就绪'}),deny:()=>this.setState({status:'停止'}),accept:()=>this.setState({diff:'accepted'}),reject:()=>this.setState({diff:'rejected'}),undo:()=>this.setState({diff:'pending'}),retry:()=>this.setState({status:'运行中'})};
  }
}
</script></body></html>
