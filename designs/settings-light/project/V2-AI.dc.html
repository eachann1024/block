<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V2 · AI 助手</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#9dbcf5}
button,input{font-family:inherit;font-size:14px;line-height:20px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #779de8;outline-offset:1px}
input::placeholder{color:#8a8a8a}
</style>
</helmet>

<div style="width:1000px;height:1100px;box-sizing:border-box;display:flex;flex-direction:column;background:#222222;color:#ececec;font-family:Inter,-apple-system,'PingFang SC',system-ui,sans-serif;font-size:14px;line-height:20px;border-radius:12px;overflow:hidden;border:1px solid #292929;-webkit-font-smoothing:antialiased">

  <header style="height:40px;flex:none;display:flex;align-items:center;padding:0 14px;box-sizing:border-box">
    <div style="width:226px;display:flex;align-items:center;gap:8px;flex:none">
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:6px;background:#28c840"></span>
      <span style="margin-left:10px;font-weight:460">Block</span>
    </div>
    <div style="flex:1;display:flex;gap:6px;color:#b4b4b4">
      <span>设置</span><span>/</span><span style="color:#ececec">AI 助手</span>
    </div>
  </header>

  <div style="flex:1;display:flex;min-height:0">
    <nav aria-label="设置分类" style="width:240px;flex:none;box-sizing:border-box;padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px">
      <a href="#" style="height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;color:#b4b4b4;text-decoration:none;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>返回
      </a>
      <div style="height:6px"></div>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <sc-if value="{{n.sep}}" hint-placeholder-val="{{ false }}">
          <div style="height:1px;background:#2c2c2c;margin:8px 8px"></div>
        </sc-if>
        <a href="#" aria-current="{{n.current}}" style="height:32px;display:flex;align-items:center;gap:10px;padding:0 8px;color:{{n.color}};background:{{n.bg}};font-weight:{{n.weight}};text-decoration:none;border-radius:8px">
          <span aria-hidden="true" style="width:16px;height:16px;border-radius:4px;border:1.5px solid currentColor;box-sizing:border-box;opacity:.7;flex:none"></span>
          <span style="flex:1">{{n.label}}</span>
          <sc-if value="{{n.beta}}" hint-placeholder-val="{{ false }}">
            <span style="font-size:11px;line-height:16px;color:#b4b4b4">Beta</span>
          </sc-if>
        </a>
      </sc-for>
    </nav>

    <main style="flex:1;min-width:0;margin:0 8px 8px 0;background:#181818;border:1px solid #292929;border-radius:10px;overflow:hidden">
      <div style="max-width:600px;margin:0 auto;padding:40px 32px 56px;display:flex;flex-direction:column;gap:32px">

        <h1 style="margin:0;font-size:20px;line-height:28px;font-weight:560">AI 助手</h1>

        <section style="display:flex;flex-direction:column;margin-top:-8px">
          <div style="min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #292929;border-bottom:1px solid #292929">
            <label for="ai-on">启用 AI 助手</label>
            <button id="ai-on" type="button" role="switch" aria-checked="true" style="width:30px;height:18px;padding:2px;border:0;border-radius:9px;background:#779de8;display:flex;justify-content:flex-end;cursor:pointer;box-sizing:border-box;flex:none">
              <span style="width:14px;height:14px;border-radius:7px;background:#ffffff"></span>
            </button>
          </div>
        </section>

        <section style="display:flex;flex-direction:column">
          <div style="height:28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <h2 style="margin:0;font-size:14px;line-height:20px;font-weight:560">API 供应商</h2>
            <button type="button" style="height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;margin-right:-8px;border:0;border-radius:8px;background:transparent;color:#779de8;font-size:13px;line-height:18px;cursor:pointer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>添加
            </button>
          </div>

          <sc-for list="{{providers}}" as="p" hint-placeholder-count="3">
            <div style="border-top:1px solid #292929">
              <div style="height:48px;display:flex;align-items:center;gap:10px">
                <span aria-hidden="true" style="width:20px;height:20px;border-radius:5px;background:#262626;color:#b4b4b4;font-size:11px;line-height:20px;text-align:center;flex:none">{{p.mono}}</span>
                <span style="flex:none">{{p.name}}</span>
                <span style="flex:1;min-width:0;font-family:'JetBrains Mono',Menlo,monospace;font-size:12px;line-height:16px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.host}}</span>
                <button type="button" aria-label="{{p.toggleLabel}}" aria-expanded="{{p.expanded}}" style="width:26px;height:26px;padding:0;border:0;border-radius:6px;background:transparent;color:#8a8a8a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="transform:{{p.chevron}}"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
                <button type="button" role="switch" aria-checked="{{p.on}}" aria-label="{{p.switchLabel}}" style="width:30px;height:18px;padding:2px;border:0;border-radius:9px;background:{{p.track}};display:flex;justify-content:{{p.side}};cursor:pointer;box-sizing:border-box;flex:none">
                  <span style="width:14px;height:14px;border-radius:7px;background:{{p.knob}}"></span>
                </button>
              </div>

              <sc-if value="{{p.open}}" hint-placeholder-val="{{ false }}">
                <div style="padding:2px 0 18px 30px;display:flex;flex-direction:column;gap:10px">
                  <div style="display:flex;align-items:center;gap:12px">
                    <span style="width:72px;flex:none;font-size:13px;line-height:18px;color:#b4b4b4">协议类型</span>
                    <div role="radiogroup" aria-label="协议类型" style="display:flex;gap:2px;padding:2px;border-radius:8px;border:1px solid #2c2c2c">
                      <button type="button" role="radio" aria-checked="false" style="height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#b4b4b4;font-size:13px;line-height:18px;cursor:pointer">OpenAI 协议</button>
                      <button type="button" role="radio" aria-checked="true" style="height:24px;padding:0 10px;border:0;border-radius:6px;background:#333333;color:#ececec;font-size:13px;line-height:18px;cursor:pointer">Claude 协议</button>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:12px">
                    <label for="ep" style="width:72px;flex:none;font-size:13px;line-height:18px;color:#b4b4b4">接口地址</label>
                    <input id="ep" value="https://api.anthropic.com/v1" style="flex:1;min-width:0;height:32px;box-sizing:border-box;padding:0 10px;border:1px solid #2c2c2c;border-radius:8px;background:#1d1d1d;color:#ececec;outline:none">
                  </div>
                  <div style="display:flex;align-items:center;gap:12px">
                    <label for="key" style="width:72px;flex:none;font-size:13px;line-height:18px;color:#b4b4b4">API 密钥</label>
                    <div style="flex:1;min-width:0;height:32px;box-sizing:border-box;display:flex;align-items:center;border:1px solid #2c2c2c;border-radius:8px;background:#1d1d1d;padding:0 4px 0 10px">
                      <input id="key" placeholder="sk-…" style="flex:1;min-width:0;height:28px;padding:0;border:0;background:transparent;color:#ececec;outline:none">
                      <button type="button" style="height:24px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#b4b4b4;font-size:13px;line-height:18px;cursor:pointer">显示</button>
                    </div>
                  </div>
                  <div style="display:flex;justify-content:flex-end;padding-top:2px">
                    <button type="button" style="height:28px;display:inline-flex;align-items:center;padding:0 10px;border:1px solid #3a3a3a;border-radius:8px;background:transparent;color:#ececec;font-size:13px;line-height:18px;cursor:pointer">连接测试</button>
                  </div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </section>

        <section style="display:flex;flex-direction:column">
          <div style="height:28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <h2 style="margin:0;font-size:14px;line-height:20px;font-weight:560">本机 Agent</h2>
            <button type="button" style="height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;margin-right:-8px;border:0;border-radius:8px;background:transparent;color:#779de8;font-size:13px;line-height:18px;cursor:pointer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>添加
            </button>
          </div>
          <sc-for list="{{agents}}" as="g" hint-placeholder-count="3">
            <div style="height:48px;display:flex;align-items:center;gap:10px;border-top:1px solid #292929">
              <span aria-hidden="true" style="width:20px;height:20px;border-radius:5px;background:#262626;color:#b4b4b4;font-size:11px;line-height:20px;text-align:center;flex:none">{{g.mono}}</span>
              <span style="flex:none">{{g.name}}</span>
              <span style="flex:1;min-width:0;font-family:'JetBrains Mono',Menlo,monospace;font-size:12px;line-height:16px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{g.ver}}</span>
              <button type="button" aria-label="{{g.delLabel}}" style="width:26px;height:26px;padding:0;border:0;border-radius:6px;background:transparent;color:#8a8a8a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{g.delOpacity}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
              <button type="button" aria-label="{{g.toggleLabel}}" style="width:26px;height:26px;padding:0;border:0;border-radius:6px;background:transparent;color:#8a8a8a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
              <button type="button" role="switch" aria-checked="true" aria-label="{{g.switchLabel}}" style="width:30px;height:18px;padding:2px;border:0;border-radius:9px;background:#779de8;display:flex;justify-content:flex-end;cursor:pointer;box-sizing:border-box;flex:none">
                <span style="width:14px;height:14px;border-radius:7px;background:#ffffff"></span>
              </button>
            </div>
          </sc-for>
        </section>

        <section style="display:flex;flex-direction:column">
          <h2 style="margin:0 0 6px;font-size:14px;line-height:28px;font-weight:560">普通功能</h2>
          <div style="min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #292929">
            <label for="anno">标注功能</label>
            <button id="anno" type="button" role="switch" aria-checked="true" style="width:30px;height:18px;padding:2px;border:0;border-radius:9px;background:#779de8;display:flex;justify-content:flex-end;cursor:pointer;box-sizing:border-box;flex:none">
              <span style="width:14px;height:14px;border-radius:7px;background:#ffffff"></span>
            </button>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const navItems = [
      ['AI 助手', true], ['外观与字体'], ['文件夹'], ['快捷键'],
      ['应用商店', false, false, true], ['图床上传', false, true], ['笔记迁移', false, true], ['同步', false, true]
    ];
    const providers = [
      { mono: 'D', name: 'DeepSeek', host: 'api.deepseek.com', on: true },
      { mono: 'O', name: 'OpenAI 兼容', host: '127.0.0.1:3425', on: true },
      { mono: 'C', name: 'Claude 协议', host: 'api.anthropic.com', on: false, open: true }
    ];
    const agents = [
      { mono: 'Cx', name: 'Codex', ver: 'v0.169.0-alpha.11.1' },
      { mono: 'Cl', name: 'Claude', ver: 'v2.1.328', hover: true },
      { mono: 'A', name: 'agy', ver: 'v1.5.12' }
    ];
    return {
      nav: navItems.map(([label, cur, beta, sep]) => ({
        label, beta: !!beta, sep: !!sep,
        current: cur ? 'page' : 'false',
        color: cur ? '#ececec' : '#b4b4b4',
        bg: cur ? '#333333' : 'transparent',
        weight: cur ? '460' : '400'
      })),
      providers: providers.map(p => ({
        ...p,
        on: p.on ? 'true' : 'false',
        open: !!p.open,
        expanded: p.open ? 'true' : 'false',
        chevron: p.open ? 'rotate(180deg)' : 'none',
        track: p.on ? '#779de8' : '#3a3a3a',
        knob: p.on ? '#ffffff' : '#b4b4b4',
        side: p.on ? 'flex-end' : 'flex-start',
        toggleLabel: (p.open ? '收起 ' : '展开 ') + p.name,
        switchLabel: '启用 ' + p.name
      })),
      agents: agents.map(g => ({
        ...g,
        delOpacity: g.hover ? '1' : '0',
        delLabel: '移除 ' + g.name,
        toggleLabel: '展开 ' + g.name,
        switchLabel: '启用 ' + g.name
      }))
    };
  }
}
</script>
</body>
</html>
