                  <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 4px; box-shadow: inset 0 0 0 1px #c9d1de; background: #ffffff; font-family: 'JetBrains Mono',Menlo,monospace; font-size: 12px; line-height: 20px; text-align: center; color: #526071">↵</span>
                </sc-if>
              </button>
            </sc-for>
          </sc-if>
          <sc-if value="{{hasCmds}}" hint-placeholder-val="{{ true }}">
            <div style="padding: 10px 10px 4px; font-size: 12px; line-height: 16px; font-weight: 560; color: #5f6b7b">命令</div>
            <sc-for list="{{cmds}}" as="c" hint-placeholder-count="4">
              <button type="button" class="{{c.cls}}" onClick="{{c.pick}}" onMouseEnter="{{c.hover}}" style="width: 100%; height: 36px; box-sizing: border-box; border: none; border-radius: 8px; background: transparent; padding: 0 10px; display: flex; align-items: center; gap: 10px; color: #20242c; font-size: 14px; text-align: left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 8l4 4-4 4"></path><path d="M12 17h7" stroke="#547dd0"></path></svg>
                <span style="flex: 1; font-weight: 460">{{c.t0}}<span style="color: #3d63b0; font-weight: 600">{{c.t1}}</span>{{c.t2}}</span>
                <span style="display: flex; gap: 3px">
                  <sc-for list="{{c.k}}" as="key" hint-placeholder-count="2">
                    <span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px #dcdcdc; background: #f7f7f8; font-family: 'JetBrains Mono',Menlo,monospace; font-size: 12px; line-height: 20px; text-align: center; color: #526071">{{key}}</span>
                  </sc-for>
                </span>
              </button>
            </sc-for>
          </sc-if>
          <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 20px 10px 12px; font-size: 14px; color: #5f6b7b; text-align: center">没有找到「{{qTrim}}」</div>
            <button type="button" class="pi on" onClick="{{close}}" style="width: 100%; height: 36px; box-sizing: border-box; border: none; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; color: #20242c; font-size: 14px; text-align: left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#c9d8f3" stroke="#20242c" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3H14l4.5 4.5v11A2.5 2.5 0 0 1 16 21H6.5A2.5 2.5 0 0 1 4 18.5v-13A2.5 2.5 0 0 1 6.5 3z"></path><path d="M11.2 10.5v6M8.2 13.5h6" stroke="#547dd0" stroke-linecap="round"></path></svg>
              <span style="flex: 1; font-weight: 460">新建页面「{{qTrim}}」</span>
              <span style="width: 20px; height: 20px; border-radius: 4px; box-shadow: inset 0 0 0 1px #c9d1de; background: #ffffff; font-family: 'JetBrains Mono',Menlo,monospace; font-size: 12px; line-height: 20px; text-align: center; color: #526071">↵</span>
            </button>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(32,36,44,0.12); pointer-events: none; z-index: 30"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["expanded","collapsed"],"default":"expanded","label":"侧栏"},"search":{"editor":"boolean","default":false,"label":"搜索面板"},"query":{"editor":"text","default":"","label":"搜索词"},"$preview":{"width":1200,"height":760}}'>
const NOTES = [
  { t: '明天汇报', p: '创业团队', b: '本次更新重点：英、韩两站新增四大美容护理扩展产线' },
  { t: '更深入调研', p: '创业团队', b: '汇报前补齐竞品定价与渠道数据' },
  { t: '官网', p: '创业团队', b: '日本站：https://yangvela.com/jp' },
  { t: '周会纪要', p: 'backups', b: '下周一向投资人汇报 Q4 目标' },
  { t: '苹果账号购买', p: '创业团队', b: '美区账号与礼品卡充值步骤' }
];
const CMDS = [
  { t: '新建页面', k: ['⌘', 'N'] },
  { t: '新建文件夹', k: ['⇧', '⌘', 'N'] },
  { t: '切换侧栏', k: ['⌥', 'B'] },
  { t: '打开设置', k: ['⌘', ','] }
];
function split(s, q) {
  if (!q) return [s, '', ''];
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return [s, '', ''];
  return [s.slice(0, i), s.slice(i, i + q.length), s.slice(i + q.length)];
}
class Component extends DCLogic {
  componentDidUpdate(prevProps, prevState) {
    const was = prevState && prevState.open;
    if (this.state && this.state.open && !was && this.inp && this.inp.current) this.inp.current.focus();
  }
  renderVals() {
    const s = this.state || {};
    const P = this.props;
    this.inp = this.inp || React.createRef();
    const collapsed = s.collapsed ?? (P.mode === 'collapsed');
    const open = s.open ?? (P.search === true || P.search === 'true');
    const qRaw = s.q ?? (P.query || '');
    const q = qRaw.trim();
    const lq = q.toLowerCase();
    const noteHits = q ? NOTES.filter((n) => n.t.toLowerCase().includes(lq) || n.b.toLowerCase().includes(lq)) : NOTES.slice(0, 4);
    const cmdHits = q ? CMDS.filter((c) => c.t.toLowerCase().includes(lq)) : CMDS;
    const empty = !!q && noteHits.length + cmdHits.length === 0;
    const total = Math.max(noteHits.length + cmdHits.length, 1);
    const active = Math.min(s.active ?? 0, total - 1);
    const close = () => this.setState({ open: false, q: '', active: 0 });
    const notes = noteHits.map((n, i) => {
      const [t0, t1, t2] = split(n.t, q);
      const [b0, b1, b2] = split(n.b, q);
      return { p: n.p, t0, t1, t2, b0, b1, b2, snippet: !!q && !t1 && !!b1, on: i === active, cls: i === active ? 'pi on' : 'pi', pick: close, hover: () => this.setState({ active: i }) };
    });
    const cmds = cmdHits.map((c, j) => {
      const i = noteHits.length + j;
      const [t0, t1, t2] = split(c.t, q);
      return { k: c.k, t0, t1, t2, cls: i === active ? 'pi on' : 'pi', pick: close, hover: () => this.setState({ active: i }) };
    });
    return {
      collapsed,
      expanded: !collapsed,
      leftW: collapsed ? 'auto' : '260px',
      crumbPad: collapsed ? '2px' : '2px',
      cardLeft: collapsed ? '8px' : '0px',
      toggleLabel: collapsed ? '展开侧栏' : '收起侧栏',
      open,
      qRaw,
      qTrim: q,
      inp: this.inp,
      notes,
      cmds,
      hasNotes: notes.length > 0,
      hasCmds: cmds.length > 0,
      notesLabel: q ? '页面' : '最近打开',
      empty,
      toggle: () => this.setState({ collapsed: !collapsed }),
      openSearch: () => this.setState({ open: true, active: 0 }),
      close,
      onQuery: (e) => this.setState({ q: e.target.value, active: 0 }),
      onKey: (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ active: (active + 1) % total }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ active: (active - 1 + total) % total }); }
        else if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); close(); }
      }
    };
  }
}
</script>
