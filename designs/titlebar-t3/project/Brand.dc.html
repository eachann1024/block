<style>
body{margin:0;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:default}
.t-light{--ground:#f1f1f1;--card:#ffffff;--card-line:#e4e6ea;--text:#20242c;--text2:#526071;--text3:#6b7686;--text4:#5f6b7b;--ph:#7a8594;--accent:#547dd0;--hit:#3d63b0;--hover:rgba(32,36,44,0.07);--card-hover:#eef3fc;--sel-bg:#e5edfc;--icon-fill:#c9d8f3;--badge-fg:#2f4f8f;--field-bg:#ffffff;--field-line:#e1e4e9;--field-line-h:#c9d1de;--kbd-bg:#f3f4f6;--kbd-line:#dcdcdc;--kbd2-bg:#ffffff;--kbd2-line:#c9d1de;--tip-bg:#20242c;--tip-fg:#ffffff;--tip-kbd:#b8c2d0;--disabled:#b6bcc6;--menu:#ffffff;--menu-shadow:0 0 0 1px rgba(32,36,44,0.08),0 24px 56px rgba(32,36,44,0.2),0 4px 12px rgba(32,36,44,0.08);--scrim:rgba(32,36,44,0.22);--pi-on:#eef3fc;--divider:#eceef1;--edge:rgba(32,36,44,0.12);--body:#1f1e1d;--body2:#3a3936;--link:#3d63b0;--link-h:#2f4f8f}
.t-dark{--ground:#222222;--card:#181818;--card-line:#2e2e2e;--text:#ececec;--text2:#b4b4b4;--text3:#9a9a9a;--text4:#9a9a9a;--ph:#7c7c7c;--accent:#779de8;--hit:#9dbcf5;--hover:rgba(255,255,255,0.07);--card-hover:#262626;--sel-bg:#2e3442;--icon-fill:#31456a;--badge-fg:#b9cdf5;--field-bg:#2a2a2a;--field-line:#3a3a3a;--field-line-h:#4c4c4c;--kbd-bg:#303030;--kbd-line:#444444;--kbd2-bg:#2c2c2c;--kbd2-line:#4a4a4a;--tip-bg:#3a3a3a;--tip-fg:#ececec;--tip-kbd:#9a9a9a;--disabled:#5c5c5c;--menu:#262626;--menu-shadow:0 0 0 1px #3a3a3a,0 24px 56px rgba(0,0,0,0.5),0 4px 12px rgba(0,0,0,0.3);--scrim:rgba(0,0,0,0.5);--pi-on:#313131;--divider:#333333;--edge:rgba(255,255,255,0.09);--body:#e6e6e6;--body2:#c4c4c4;--link:#8fb0f0;--link-h:#b3cbf7}
a{color:var(--link)}a:hover{color:var(--link-h)}
.ib{width:28px;height:28px;padding:0;border:none;border-radius:6px;background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s,color .12s}
.ib:hover{background:var(--hover);color:var(--text)}
.ib:disabled{color:var(--disabled)}
.ib:disabled:hover{background:transparent;color:var(--disabled)}
.card .ib:hover{background:var(--card-hover)}
.tw{position:relative;display:flex}
.tw .tip{position:absolute;top:34px;left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .1s;white-space:nowrap;z-index:5}
.tw:hover .tip{opacity:1;transition-delay:.45s}
.field{transition:box-shadow .12s,background .12s}
.field:hover{box-shadow:0 0 0 1px var(--field-line-h),0 1px 2px rgba(0,0,0,0.05)}
.row{transition:background .12s}
.row:hover{background:var(--hover)}
.crumb:hover{background:var(--hover);color:var(--text)}
.pi{transition:background .08s}
.pi.on{background:var(--pi-on)}
input{caret-color:var(--accent)}
input::placeholder{color:var(--ph)}
.dk{-webkit-mask-image:linear-gradient(to bottom,#000 52%,transparent);mask-image:linear-gradient(to bottom,#000 52%,transparent)}
.no-orb .orb{display:none}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-260px)}}
.dr1{animation:drift 38s linear infinite}
.dr2{animation:drift 26s linear infinite}
.dr3{animation:drift 18s linear infinite}
.drs{animation:drift 90s linear infinite}
.drs2{animation:drift 140s linear infinite}
@keyframes sway{0%,100%{transform:skewX(-7deg)}50%{transform:skewX(7deg)}}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.6s ease-in-out infinite}
@keyframes st{0%,100%{opacity:.2}50%{opacity:1}}
.st{animation:st 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:.9}}
.glow{animation:glow 7s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-120}}
.wl{stroke-dasharray:22 98;animation:flow 6s linear infinite}
@keyframes shoot{0%,84%{opacity:0;transform:translate(0,0)}86%{opacity:1}94%,100%{opacity:0;transform:translate(52px,18px)}}
.shoot{animation:shoot 13s ease-out infinite}
@keyframes bird{from{transform:translate(-30px,0)}to{transform:translate(290px,-10px)}}
.bird{animation:bird 46s linear infinite}
@keyframes ffm{0%,100%{transform:translate(0,0)}25%{transform:translate(5px,-4px)}50%{transform:translate(-3px,-7px)}75%{transform:translate(-6px,-2px)}}
.ffm{animation:ffm 8s ease-in-out infinite}
@keyframes ffb{0%,100%{opacity:.15}40%,60%{opacity:1}}
.ffb{animation:ffb 3.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.dk *,.th *{animation:none !important}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","label":"主题"},"deco":{"editor":"enum","options":["time","dawn","meadow","breeze","dusk","daybreak","firefly","night","moon","off"],"default":"time","label":"品牌装饰"},"hour":{"editor":"int","min":-1,"max":23,"step":1,"default":-1,"label":"模拟时刻（-1 为当前）"},"orb":{"editor":"boolean","default":true,"label":"显示日月"},"mark":{"editor":"boolean","default":true,"label":"显示 Logo 与名称"},"mode":{"editor":"enum","options":["expanded","collapsed"],"default":"expanded","label":"侧栏"},"search":{"editor":"boolean","default":false,"label":"搜索面板"},"query":{"editor":"text","default":"","label":"搜索词"},"$preview":{"width":1200,"height":760}}'>
