<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B 嵌槽圆珠</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#395fb0}
button{font-family:inherit;padding:0;border:0;background:transparent;cursor:pointer}
button:focus-visible{outline:2px solid #547dd0;outline-offset:2px}
</style>
</helmet>
<div style="width: 560px; height: 700px; box-sizing: border-box; padding: 32px 60px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: {{stageBg}}; font-family: -apple-system, 'PingFang SC', 'SF Pro Text', system-ui, sans-serif; color: {{textCol}}">

<div style="width: 440px; height: 88px; box-sizing: border-box; border-radius: 14px; background: {{paperBg}}; border: 1px solid {{winBorder}}; box-shadow: {{loupeShadow}}; display: flex; align-items: center; justify-content: center">
<div style="height: 52px; padding: 0 18px; border-radius: 999px; background: {{trackBg}}; border: 1.5px solid {{trackBorder}}; box-shadow: {{trackInset}}; display: flex; align-items: center; gap: 18px">
<sc-for list="{{macroDots}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.pick}}" aria-label="{{m.label}}" aria-pressed="{{m.active}}" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
<span style="width: {{m.beadSize}}; height: {{m.beadSize}}; box-sizing: border-box; border-radius: 999px; background: {{m.beadBg}}; border: {{m.beadBorder}}; box-shadow: {{m.beadShadow}}; display: flex; align-items: center; justify-content: center; transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1)">
<span style="width: {{m.pipSize}}; height: {{m.pipSize}}; border-radius: 999px; background: {{m.pipBg}}; transition: all 0.16s ease"></span>
</span>
</button>
</sc-for>
</div>
</div>

<div style="width: 440px; height: 520px; box-sizing: border-box; border-radius: 14px; background: {{paperBg}}; border: 1px solid {{winBorder}}; box-shadow: {{winShadow}}; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header onWheel="{{onHeaderWheel}}" style="height: 44px; flex-shrink: 0; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; position: relative; user-select: none">
<nav aria-label="速记页切换" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<div style="height: 20px; padding: 0 5px; border-radius: 999px; background: {{trackBg}}; border: 1px solid {{trackBorder}}; display: flex; align-items: center; gap: 2px; pointer-events: auto">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{d.pick}}" onMouseEnter="{{d.enter}}" onMouseLeave="{{clearHover}}" aria-label="{{d.label}}" aria-pressed="{{d.active}}" style="width: 20px; height: 20px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
<span style="width: {{d.beadSize}}; height: {{d.beadSize}}; box-sizing: border-box; border-radius: 999px; background: {{d.beadBg}}; border: {{d.beadBorder}}; box-shadow: {{d.beadShadow}}; display: flex; align-items: center; justify-content: center; transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1)">
<span style="width: {{d.pipSize}}; height: {{d.pipSize}}; border-radius: 999px; background: {{d.pipBg}}; transition: all 0.16s ease"></span>
</span>
</button>
</sc-for>
</div>
</nav>

<button type="button" aria-label="存入正式笔记" style="width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: {{iconCol}}">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M6.75 3.75H13.5L18.75 9V18.5A1.75 1.75 0 0 1 17 20.25H6.75A1.75 1.75 0 0 1 5 18.5V5.5A1.75 1.75 0 0 1 6.75 3.75ZM13.5 3.75V8A1 1 0 0 0 14.5 9H18.75"></path>
<path d="M8.75 14.25L11 16.5L15.5 11.75" stroke="{{accent}}"></path>
</svg>
</button>
<button type="button" aria-label="关闭" style="width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: {{iconCol}}">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
<path d="M6.5 6.5L17.5 17.5M17.5 6.5L6.5 17.5"></path>
</svg>
</button>
</header>

<sc-if value="{{showTip}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 44px; left: 50%; transform: translateX(-50%); z-index: 10; height: 30px; padding: 0 12px; border-radius: 8px; background: {{tipBg}}; border: 1px solid {{tipBorder}}; box-shadow: 0 4px 14px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 7px; pointer-events: none; white-space: nowrap">
<span style="font-size: 13px; font-weight: 560; color: {{tipFg}}">{{tipTitle}}</span>
<span style="width: 1px; height: 12px; background: {{tipDivider}}"></span>
<span style="font-size: 13px; color: {{tipMuted}}">点击或上下滚动切换</span>
</div>
</sc-if>

<main style="flex: 1; padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{on1}}" hint-placeholder-val="{{true}}">
<h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; color: {{textCol}}">产品双周复盘备忘</h2>
<p style="margin: 0; font-size: 16px; line-height: 26px; color: {{textCol}}">把导航层级收敛在一屏之内，不增加多余入口。</p>
<p style="margin: 0; font-size: 16px; line-height: 26px; color: {{textSecondary}}">周五前确认桌面端新版圆点指示器的过渡手感。</p>
</sc-if>
<sc-if value="{{on2}}" hint-placeholder-val="{{false}}">
<h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; color: {{textCol}}">阅读摘录</h2>
<p style="margin: 0; font-size: 16px; line-height: 26px; color: {{textCol}}">好的设计尽可能少，把注意力留给正在书写的内容本身。</p>
<p style="margin: 0; font-size: 16px; line-height: 26px; color: {{textSecondary}}">《设计中的设计》· 留白与器物秩序</p>
</sc-if>
<sc-if value="{{on3}}" hint-placeholder-val="{{false}}">
<h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; color: {{textCol}}">周末采购清单</h2>
<p style="margin: 0; font-size: 16px; line-height: 26px; color: {{textCol}}">浅烘手冲豆、A5 方格笔记本、桌面理线夹。</p>
</sc-if>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"浅色","options":["浅色","深色"]},"$preview":{"width":560,"height":700}}'>
class Component extends DCLogic {
  constructor() {
    super();
    this.state = { slot: 2, hover: 0 };
    this._lastWheel = 0;
  }
  renderVals() {
    const dark = (this.props.theme ?? '浅色') === '深色';
    const slot = this.state.slot || 2;
    const hover = this.state.hover || 0;
    const accent = dark ? '#779de8' : '#547dd0';
    const rimCol = dark ? '#181818' : '#ffffff';
    const pipCol = dark ? '#eef4ff' : '#eef4ff';
    const idleDot = dark ? '#4d5565' : '#bcc4d2';
    const hoverDot = dark ? '#8d97ab' : '#7b869a';

    const ids = [1, 2, 3];
    const dots = ids.map((id) => {
      const active = slot === id;
      const isHover = hover === id;
      return {
        label: '速记页 ' + id,
        active,
        beadSize: active ? '12px' : (isHover ? '5.5px' : '4.5px'),
        beadBg: active ? accent : (isHover ? hoverDot : idleDot),
        beadBorder: active ? ('2px solid ' + rimCol) : '0px solid transparent',
        beadShadow: active
          ? (dark ? '0 1px 3px rgba(0,0,0,0.65)' : '0 1px 3px rgba(46,79,150,0.32)')
          : 'none',
        pipSize: active ? '2.5px' : '0px',
        pipBg: active ? pipCol : 'transparent',
        pick: () => this.setState({ slot: id }),
        enter: () => this.setState({ hover: id })
      };
    });

    const macroDots = ids.map((id) => {
      const active = slot === id;
      return {
        label: '放大检视 速记页 ' + id,
        active,
        beadSize: active ? '34px' : '13px',
        beadBg: active ? accent : idleDot,
        beadBorder: active ? ('5px solid ' + rimCol) : '0px solid transparent',
        beadShadow: active
          ? (dark ? '0 3px 8px rgba(0,0,0,0.65)' : '0 3px 9px rgba(46,79,150,0.32)')
          : 'none',
        pipSize: active ? '7px' : '0px',
        pipBg: active ? pipCol : 'transparent',
        pick: () => this.setState({ slot: id })
      };
    });

    return {
      stageBg: dark ? '#111215' : '#f3f4f6',
      paperBg: dark ? '#181818' : '#ffffff',
      winBorder: dark ? '#2e3138' : '#e2e5ec',
      trackBg: dark ? '#24272f' : '#f1f3f7',
      trackBorder: dark ? '#333844' : '#e2e6ee',
      trackInset: dark ? 'inset 0 1px 2px rgba(0,0,0,0.35)' : 'inset 0 1px 2px rgba(15,23,42,0.04)',
      loupeShadow: dark ? '0 8px 24px rgba(0,0,0,0.35)' : '0 4px 16px rgba(15,23,42,0.05)',
      winShadow: dark ? '0 18px 44px rgba(0,0,0,0.5)' : '0 16px 40px rgba(15,23,42,0.08)',
      textCol: dark ? '#ececec' : '#1f1e1d',
      textSecondary: dark ? '#b4b4b4' : '#52514e',
      iconCol: dark ? '#b4b4b4' : '#52514e',
      accent,
      tipBg: dark ? '#25272d' : '#ffffff',
      tipBorder: dark ? '#3a3e48' : '#e2e5ec',
      tipFg: dark ? '#f2f4f8' : '#1f1e1d',
      tipDivider: dark ? '#3a3e48' : '#e4e6ea',
      tipMuted: dark ? '#b4bccb' : '#52514e',
      showTip: hover > 0,
      tipTitle: '速记页 ' + (hover || slot),
      on1: slot === 1,
      on2: slot === 2,
      on3: slot === 3,
      dots,
      macroDots,
      clearHover: () => this.setState({ hover: 0 }),
      onHeaderWheel: (e) => {
        if (!e) return;
        if (e.preventDefault) e.preventDefault();
        const now = Date.now();
        if (now - this._lastWheel < 160) return;
        const raw = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        if (Math.abs(raw) < 2) return;
        this._lastWheel = now;
        const dir = raw > 0 ? 1 : -1;
        const next = ((slot - 1 + dir + 3) % 3) + 1;
        this.setState({ slot: next });
      }
    };
  }
}
</script>
</body>
</html>
