<!doctype html>
<html lang="zh-CN">
<head>

</head>
<body>

  </style>

<div style="width: 920px; height: 680px; background: #f8f8f8; color: #20242c; font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">

      <button type="button" style="height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid #f0c9c9; background: #fdf5f5; color: #b93c3c; font-size: 14px; font-weight: 460; cursor: pointer;">卸载</button>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #526071;">磁盘总占用</span>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 26px; line-height: 32px; font-weight: 560; color: #20242c;">102.7 MiB</span>
          <span style="font-size: 13px; color: #526071;">2,853 个文件</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 20px;">
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
          <span style="font-size: 12px; color: #526071;">物理内存</span>
          <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 15px; font-weight: 560; color: #20242c;">285.7 MiB</span>
        </div>
        <div style="width: 1px; height: 28px; background: #eceef2;"></div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
          <span style="font-size: 12px; color: #526071;">CPU</span>
          <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 15px; font-weight: 560; color: #20242c;">18.6%</span>
        </div>
        <div style="width: 1px; height: 28px; background: #eceef2;"></div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
          <span style="font-size: 12px; color: #526071;">统计时间</span>
          <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 15px; font-weight: 560; color: #20242c;">15:44:21</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: grid; grid-template-columns: 1.85fr 1fr; gap: 10px;">
        <sc-for list="{{ primaryTiles }}" as="tile" hint-placeholder-count="2">
          <button type="button" onMouseEnter="{{ tile.pick }}" onFocus="{{ tile.pick }}" onClick="{{ tile.pick }}" style="{{ tile.cardStyle }}">
            <div style="display: flex; align-items: baseline; justify-content: space-between; width: 100%; gap: 8px;">
              <span style="font-size: 14px; font-weight: 560; color: #20242c;">{{ tile.label }}</span>
              <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 12px; color: #526071;">{{ tile.pct }}</span>
            </div>
            <div style="display: flex; align-items: baseline; justify-content: space-between; width: 100%; gap: 8px;">
              <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 20px; line-height: 26px; font-weight: 560; color: #20242c;">{{ tile.size }}</span>
              <span style="font-size: 12px; color: #526071;">{{ tile.countText }}</span>
            </div>
          </button>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px;">
        <sc-for list="{{ secondaryTiles }}" as="tile" hint-placeholder-count="5">
          <button type="button" onMouseEnter="{{ tile.pick }}" onFocus="{{ tile.pick }}" onClick="{{ tile.pick }}" style="{{ tile.cardStyle }}">
            <span style="font-size: 13px; font-weight: 560; color: #20242c; white-space: nowrap;">{{ tile.label }}</span>
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
              <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 14px; line-height: 20px; font-weight: 560; color: #20242c;">{{ tile.size }}</span>
              <span style="font-size: 11px; color: #526071;">{{ tile.subMeta }}</span>
            </div>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; border-top: 1px solid #eceef2; padding-top: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 14px; font-weight: 560; color: #20242c;">{{ active.label }}</span>
          <span style="font-size: 12px; color: #526071;">{{ active.meta }}</span>
        </div>
        <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 13px; font-weight: 560; color: #20242c;">{{ active.totalLine }}</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <sc-for list="{{ activeEntries }}" as="ent" hint-placeholder-count="6">
          <div style="position: relative; height: 30px; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; gap: 12px; background: #fafafa;">
            <div style="{{ ent.barBgStyle }}"></div>
            <span style="position: relative; z-index: 1; font-size: 13px; color: #20242c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{ ent.name }}</span>
            <span style="position: relative; z-index: 1; font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 12px; color: #526071; white-space: nowrap; flex-shrink: 0;">{{ ent.sizePct }}</span>
          </div>
        </sc-for>

        <sc-if value="{{ hasRest }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 0 10px;">
            <span style="font-size: 12px; color: #526071;">{{ active.restLabel }}</span>
            <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 12px; color: #526071;">{{ active.restSizePct }}</span>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"initialCategory":{"editor":"enum","default":"history","options":["assets","config","notes","history","recovery","logs","ai_sessions"],"label":"默认悬停分类"},"$preview":{"width":920,"height":680}}'>
const DATA = [
  {
    id: 'assets', tier: 'primary', label: '资源图片', detail: '图片与资源文件', size: '71.2 MiB', pct: '69.3%', count: 1859,
    entries: [
      { name: 'agents/skills/design/scripts/editor/assets/index-CYLuwRoc.js', sizePct: '6.4 MiB · 8.9%', pctNum: 8.9 },
      { name: 'agents/skills/design/scripts/editor/artifact-type/babel.min.js', sizePct: '3.0 MiB · 4.2%', pctNum: 4.2 },
      { name: 'agents/skills/design/scripts/editor/artifact-type/fast-edit-worker.js', sizePct: '2.3 MiB · 3.2%', pctNum: 3.2 },
      { name: '提示词/assets/asset_8eb04242-3cd1-45ce-b576-63de26bbc801.png', sizePct: '2.2 MiB · 3.1%', pctNum: 3.1 },
      { name: '提示词/assets/img_1794210976334_58cc633f.png', sizePct: '1.8 MiB · 2.6%', pctNum: 2.6 }
    ],
    restLabel: '其余 1,854 个文件', restSizePct: '55.5 MiB · 78.0%'
  },
  {
    id: 'config', tier: 'primary', label: '配置状态', detail: '设置与状态数据', size: '23.7 MiB', pct: '23.1%', count: 23,
    entries: [
      { name: 'fonts/HarmonyOS_Sans_SC_Regular.ttf', sizePct: '7.9 MiB · 33.2%', pctNum: 33.2 },
      { name: 'fonts/HarmonyOS_Sans_SC_Medium.ttf', sizePct: '7.8 MiB · 33.1%', pctNum: 33.1 },
      { name: 'fonts/HarmonyOS_Sans_SC_Bold.ttf', sizePct: '7.8 MiB · 32.8%', pctNum: 32.8 },
      { name: 'apps/block-sync · 3 项', sizePct: '96.0 KiB · 0.4%', pctNum: 0.4 },
      { name: 'app-updates/feed-cache.json', sizePct: '40.0 KiB · 0.2%', pctNum: 0.2 }
    ],
    restLabel: '其余 14 个文件', restSizePct: '76.0 KiB · 0.3%'
  },
  {
    id: 'notes', tier: 'secondary', label: '笔记', detail: 'Markdown 文档', size: '3.4 MiB', pct: '3.3%', count: 430,
    entries: [
      { name: 'agents/skills/vercel-react-best-practices/AGENTS.md', sizePct: '108.0 KiB · 3.1%', pctNum: 3.1 },
      { name: 'agents/skills/impeccable/reference/new-work.md', sizePct: '64.0 KiB · 1.8%', pctNum: 1.8 },
      { name: 'agents/skills/impeccable/reference/critique.md', sizePct: '48.0 KiB · 1.4%', pctNum: 1.4 },
      { name: 'Note/好文归档/2000 PR 工作流.md', sizePct: '48.0 KiB · 1.4%', pctNum: 1.4 },
      { name: 'Note/AI 账号汇总.md', sizePct: '48.0 KiB · 1.4%', pctNum: 1.4 }
    ],
    restLabel: '其余 425 个文件', restSizePct: '3.1 MiB · 90.9%'
  },
  {
    id: 'history', tier: 'secondary', label: '历史快照', detail: '按笔记聚合', size: '2.5 MiB', pct: '2.5%', count: 522,
    entries: [
      { name: '创业团队/更深入调研.md · 60 项', sizePct: '540.0 KiB · 21.1%', pctNum: 21.1 },
      { name: 'Note/Agent 的经验.md · 42 项', sizePct: '380.0 KiB · 14.8%', pctNum: 14.8 },
      { name: 'Note/好文归档/2000 PR 工作流.md · 31 项', sizePct: '296.0 KiB · 11.6%', pctNum: 11.6 },
      { name: 'quick/slot-1.md · 18 项', sizePct: '184.0 KiB · 7.2%', pctNum: 7.2 },
      { name: 'Note/AI 账号汇总.md · 14 项', sizePct: '128.0 KiB · 5.0%', pctNum: 5.0 }
    ],
    restLabel: '其余 357 个快照文件', restSizePct: '1.0 MiB · 40.3%'
  },
  {
    id: 'recovery', tier: 'secondary', label: '恢复缓存', detail: '恢复缓存与临时文件', size: '1.2 MiB', pct: '1.2%', count: 13,
    entries: [
      { name: 'Cache/font-atlas.bin', sizePct: '920.0 KiB · 74.9%', pctNum: 74.9 },
      { name: 'Recovery/autosave-latest.json', sizePct: '240.0 KiB · 19.5%', pctNum: 19.5 },
      { name: 'quick/slot-1.md', sizePct: '44.0 KiB · 3.6%', pctNum: 3.6 },
      { name: 'quick/slot-2.md', sizePct: '24.0 KiB · 2.0%', pctNum: 2.0 }
    ],
    restLabel: '', restSizePct: ''
  },
  {
    id: 'logs', tier: 'secondary', label: '日志', detail: '应用运行日志', size: '436 KiB', pct: '0.4%', count: 2,
    entries: [
      { name: 'logs/block.log', sizePct: '388.0 KiB · 89.0%', pctNum: 89.0 },
      { name: 'logs/block.prev.log', sizePct: '48.0 KiB · 11.0%', pctNum: 11.0 }
    ],
    restLabel: '', restSizePct: ''
  },
  {
    id: 'ai_sessions', tier: 'secondary', label: 'AI 会话', detail: '对话记录与草稿', size: '212 KiB', pct: '0.2%', count: 4,
    entries: [
      { name: 'ai-chats.json', sizePct: '200.0 KiB · 94.3%', pctNum: 94.3 },
      { name: 'ai-annotations.json', sizePct: '4.0 KiB · 1.9%', pctNum: 1.9 },
      { name: 'ai-backends.json', sizePct: '4.0 KiB · 1.9%', pctNum: 1.9 },
      { name: 'ai.json', sizePct: '4.0 KiB · 1.9%', pctNum: 1.9 }
    ],
    restLabel: '', restSizePct: ''
  }
];

class Component extends DCLogic {
  renderVals() {
    const activeId = (this.state && this.state.activeId) || this.props.initialCategory || 'history';
    const activeObj = DATA.find((d) => d.id === activeId) || DATA[0];

    const makeCard = (d, isPrimary) => {
      const isHot = d.id === activeObj.id;
      const bg = isHot ? '#e8f0fe' : (isPrimary ? '#f6f8fc' : '#fafafa');
      const bd = isHot ? '1.5px solid #547dd0' : '1px solid #e4e6ea';
      return {
        id: d.id,
        label: d.label,
        size: d.size,
        pct: d.pct,
        countText: d.count + ' 个文件',
        subMeta: d.pct + ' · ' + d.count + ' 项',
        pick: () => this.setState({ activeId: d.id }),
        cardStyle:
          'width: 100%; height: ' + (isPrimary ? '86px' : '78px') + '; padding: ' + (isPrimary ? '14px 16px' : '11px 12px') +
          '; border-radius: 10px; border: ' + bd + '; background: ' + bg +
          '; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; cursor: pointer; transition: background 140ms ease, border-color 140ms ease;'
      };
    };

    const primaryTiles = DATA.filter((d) => d.tier === 'primary').map((d) => makeCard(d, true));
    const secondaryTiles = DATA.filter((d) => d.tier === 'secondary').map((d) => makeCard(d, false));

    const maxPct = Math.max(...activeObj.entries.map((e) => e.pctNum), 1);
    const activeEntries = activeObj.entries.map((e) => {
      const relW = Math.max(4, Math.min(100, Math.round((e.pctNum / maxPct) * 100)));
      return {
        name: e.name,
        sizePct: e.sizePct,
        barBgStyle: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + relW + '%; background: #eef3fc; border-radius: 6px;'
      };
    });

    return {
      primaryTiles,
      secondaryTiles,
      active: {
        label: activeObj.label,
        meta: activeObj.detail + ' · 共 ' + activeObj.count + ' 个文件',
        totalLine: activeObj.size + ' (' + activeObj.pct + ')',
        restLabel: activeObj.restLabel,
        restSizePct: activeObj.restSizePct
      },
      activeEntries,
      hasRest: Boolean(activeObj.restLabel)
    };
  }
}
</script>
</body>
</html>
