<!doctype html>

  </style>
</helmet>
<div style="width: 920px; height: 680px; background: #f8f8f8; color: #20242c; font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">

      <button type="button" style="height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid #f0c9c9; background: #fdf5f5; color: #b93c3c; font-size: 14px; font-weight: 460; cursor: pointer;">卸载</button>

    <div style="display: flex; flex-direction: column; gap: 4px; padding-right: 12px; border-right: 1px solid #eceef2;">
      <span style="font-size: 12px; line-height: 16px; color: #526071;">物理内存</span>
      <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 18px; line-height: 24px; font-weight: 560; color: #20242c;">285.7 MiB</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding-right: 12px; border-right: 1px solid #eceef2;">
      <span style="font-size: 12px; line-height: 16px; color: #526071;">CPU</span>

    </div>
  </div>

  <div style="flex: 1; min-height: 0; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
      <span style="font-size: 15px; line-height: 22px; font-weight: 560; color: #20242c;">磁盘空间分布</span>
      <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #526071;">7 类 · 2,853 个文件</span>
    </div>

    <div style="display: flex; width: 100%; height: 14px; border-radius: 999px; background: #f1f3f6; padding: 2px; gap: 3px; overflow: hidden;">
      <sc-for list="{{ segments }}" as="seg" hint-placeholder-count="7">
        <button type="button" aria-label="{{ seg.ariaLabel }}" onMouseEnter="{{ seg.pick }}" onFocus="{{ seg.pick }}" onClick="{{ seg.pick }}" style="{{ seg.barStyle }}"></button>
      </sc-for>
    </div>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 276px minmax(0, 1fr); gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 4px; padding-right: 16px; border-right: 1px solid #eceef2; overflow-y: auto;">
        <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="7">
          <button type="button" onMouseEnter="{{ cat.pick }}" onFocus="{{ cat.pick }}" onClick="{{ cat.pick }}" style="{{ cat.rowStyle }}">
            <span style="display: flex; align-items: center; gap: 8px; min-width: 0;">
              <span style="{{ cat.swatchStyle }}"></span>
              <span style="font-size: 14px; line-height: 20px; font-weight: 460; color: #20242c; white-space: nowrap;">{{ cat.label }}</span>
              <span style="font-size: 12px; line-height: 16px; color: #526071; white-space: nowrap;">{{ cat.countShort }}</span>
            </span>
            <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #20242c; white-space: nowrap;">{{ cat.size }}</span>
          </button>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow-y: auto;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #eceef2;">
          <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0;">
            <span style="font-size: 15px; line-height: 22px; font-weight: 560; color: #20242c; white-space: nowrap;">{{ active.label }}</span>
            <span style="font-size: 13px; line-height: 18px; color: #526071; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ active.meta }}</span>
          </div>
          <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 14px; line-height: 20px; font-weight: 560; color: #20242c; white-space: nowrap;">{{ active.totalLine }}</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
          <sc-for list="{{ activeEntries }}" as="ent" hint-placeholder-count="6">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0;">
                <span style="font-size: 13px; line-height: 18px; color: #20242c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{ ent.name }}</span>
                <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 12px; line-height: 18px; color: #526071; white-space: nowrap; flex-shrink: 0;">{{ ent.sizePct }}</span>
              </div>
              <div style="width: 100%; height: 4px; border-radius: 999px; background: #f1f3f6; overflow: hidden;">
                <div style="{{ ent.fillStyle }}"></div>
              </div>
            </div>
          </sc-for>

          <sc-if value="{{ hasRest }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; border-top: 1px dashed #eceef2;">
              <span style="font-size: 12px; line-height: 18px; color: #526071;">{{ active.restLabel }}</span>
              <span style="font-family: 'JetBrains Mono', Menlo, ui-monospace, monospace; font-size: 12px; line-height: 18px; color: #526071;">{{ active.restSizePct }}</span>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"initialCategory":{"editor":"enum","default":"assets","options":["assets","config","notes","history","recovery","logs","ai_sessions"],"label":"默认选中分类"},"$preview":{"width":920,"height":680}}'>

      { name: 'fonts/HarmonyOS_Sans_SC_Medium.ttf', sizePct: '7.8 MiB · 33.1%', pctNum: 33.1 },

    restLabel: '', restSizePct: ''

];

class Component extends DCLogic {
  renderVals() {
    const activeId = (this.state && this.state.activeId) || this.props.initialCategory || 'assets';
    const activeObj = DATA.find((d) => d.id === activeId) || DATA[0];

    const segments = DATA.map((d) => {
      const isActive = d.id === activeObj.id;
      return {
        id: d.id,
        ariaLabel: d.label + ' ' + d.size,
        pick: () => this.setState({ activeId: d.id }),
        barStyle:
          'flex: ' + d.barWeight + ' 0 12px; height: 100%; border: none; padding: 0; border-radius: 999px; cursor: pointer; background: ' +
          d.tone + '; opacity: ' + (isActive ? '1' : '0.45') + '; transition: opacity 140ms ease;'
      };
    });

    const categories = DATA.map((d) => {
      const isActive = d.id === activeObj.id;
      return {
        id: d.id,
        label: d.label,
        size: d.size,
        countShort: d.count + ' 项',
        pick: () => this.setState({ activeId: d.id }),
        swatchStyle: 'width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; background: ' + d.tone + ';',
        rowStyle:
          'width: 100%; height: 42px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; text-align: left; border: 1px solid ' +
          (isActive ? '#c9d8f3' : 'transparent') + '; background: ' + (isActive ? '#eef3fc' : 'transparent') + ';'
      };
    });

    const maxPct = Math.max(...activeObj.entries.map((e) => e.pctNum), 1);
    const activeEntries = activeObj.entries.map((e) => {
      const relW = Math.max(4, Math.min(100, Math.round((e.pctNum / maxPct) * 100)));
      return {
        name: e.name,
        sizePct: e.sizePct,
        fillStyle: 'width: ' + relW + '%; height: 100%; border-radius: 999px; background: #7798db;'
      };
    });

    return {
      segments,
      categories,
      active: {
        label: activeObj.label,
        meta: activeObj.detail + ' · 共 ' + activeObj.count + ' 个文件',
        totalLine: activeObj.size + ' (' + activeObj.pct + ')',
        restLabel: activeObj.restLabel,
        restSizePct: activeObj.restSizePct
      },
      activeEntries,
      hasRest: Boolean(activeObj.restLabel)
    };
  }
}
