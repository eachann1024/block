          <div style="display: flex; flex-direction: column; gap: 7px;">
            <sc-for list="{{ activeEntries }}" as="ent" hint-placeholder-count="5">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0;">

            <sc-if value="{{ hasRest }}" hint-placeholder-val="{{ true }}">

class Component extends DCLogic {
  renderVals() {
    const hasState = this.state && Object.prototype.hasOwnProperty.call(this.state, 'hoveredId');
    const hoveredId = hasState ? this.state.hoveredId : (this.props.previewHover === 'none' ? '' : (this.props.previewHover || 'config'));

    const tile = (id, baseBg, extra) => {
      const isHot = hoveredId === id;
      const bg = isHot ? '#e8f0fe' : baseBg;
      const bd = isHot ? '1.5px solid #547dd0' : '1px solid #e4e6ea';
      return {
        hover: () => this.setState({ hoveredId: id }),
        style:
          'border-radius: 10px; border: ' + bd + '; background: ' + bg +
          '; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; cursor: pointer; transition: background 140ms ease, border-color 140ms ease; ' +
          extra
      };
    };

    const active = DATA[hoveredId] || DATA.config;
    const showPopover = Boolean(hoveredId && DATA[hoveredId]);
    const posCss = active.side === 'right'
      ? 'right: 16px; top: 18px;'
      : 'left: 16px; bottom: 18px;';

    return {
      clearHover: () => this.setState({ hoveredId: '' }),
      tAssets: tile('assets', '#f3f7fe', 'height: 100%; width: 100%; padding: 22px;'),
      tConfig: tile('config', '#f7f9fc', 'height: 164px; width: 100%; flex-shrink: 0;'),

      tHistory: tile('history', '#fafafa', 'height: 100%; width: 100%;'),
      tRecovery: tile('recovery', '#fcfcfc', 'height: 100%; width: 100%; padding: 12px;'),

      active,
      activeEntries: active.entries,
      hasRest: Boolean(active.restLabel),

        ' width: 410px; max-width: calc(100% - 32px); background: rgba(255,255,255,0.98); border: 1px solid #d5dff0; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 14px 34px rgba(32, 36, 44, 0.14); pointer-events: none; z-index: 10;'
