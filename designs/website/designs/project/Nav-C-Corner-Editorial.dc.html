    <!-- 方案 C 顶栏：仅保留左上角品牌与右上角细描边下载键，中轴完全腾空给正文大标题 -->

      <a href="#top" style="display:inline-flex;align-items:center;gap:10px;height:44px;font-size:17px;font-weight:650;color:#f5f7fc">
        <img src="/_blob/9b52e670533ab8f9c6df70d44b57da15" alt="" style="width:28px;height:28px;border-radius:7px">
        <span>Block</span>

      <a href="#download" style="height:44px;padding:0 20px;border-radius:999px;background:rgba(47,92,184,0.24);border:1px solid rgba(148,184,255,0.52);color:#f4f7ff;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px">
        <span>免费下载</span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        </svg>
      </a>
    </header>

    <!-- 右侧书签式纵向章节刻度（不占用顶部 1px 高度） -->
    <nav class="side-rail" aria-label="右侧章节刻度" style="position:absolute;right:28px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
      <sc-for list="{{railItems}}" as="item" hint-placeholder-count="6">
        <button type="button" onClick="{{item.pick}}" style="height:44px;padding:0 6px;border:0;background:transparent;display:inline-flex;align-items:center;gap:10px">
          <span style="{{item.labelStyle}}">{{item.label}}</span>
          <span style="{{item.tickStyle}}"></span>
        </button>
      </sc-for>
    </nav>

    <!-- 顶部零干扰，标题一出来就是视觉绝对中心 -->
    <div style="position:relative;z-index:3;max-width:880px;margin:4px auto 0;text-align:center;display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-size:50px;line-height:1.2;font-weight:700;letter-spacing:-0.015em;color:#f4f7ff">笔记再多，也是秒开</h2>
      <p style="margin:0;font-size:18px;line-height:1.65;color:#c2cad9">写上几十万字，打开和翻页还是跟新文档一样快。</p>
    </div>

    <div style="position:relative;z-index:3;margin-top:auto;padding-top:270px;display:flex;flex-direction:column;align-items:center;gap:18px">
      <div style="display:inline-flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums">
        <span style="font-size:104px;line-height:1;font-weight:700;letter-spacing:-0.02em;color:#f4f7ff;text-shadow:0 8px 36px rgba(8,11,20,0.92),0 0 36px rgba(119,157,232,0.28)">{{formattedCount}}</span>
        <span style="font-size:26px;font-weight:600;color:{{accent}}">段</span>
      </div>
      <button type="button" onClick="{{replayRoll}}" style="height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(148,184,255,0.32);background:rgba(20,23,32,0.65);color:#d5e2ff;font-size:14px;display:inline-flex;align-items:center;gap:8px">
        <span>重播快速滚动计数</span>
      </button>
    </div>

  </section>

  <!-- ==================== 第二屏：首屏视野对比 ==================== -->
  <section style="position:relative;min-height:860px;padding:0 44px 80px;background:radial-gradient(640px 420px at 50% 46%,rgba(119,157,232,0.16),transparent 72%),#141720;display:flex;flex-direction:column;justify-content:space-between">

    <header style="height:76px;max-width:1360px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between">
      <a href="#top" style="display:inline-flex;align-items:center;gap:10px;height:44px;font-size:17px;font-weight:650;color:#f5f7fc">
        <img src="/_blob/9b52e670533ab8f9c6df70d44b57da15" alt="" style="width:28px;height:28px;border-radius:7px">
        <span>Block</span>
      </a>
      <a href="#download" style="height:44px;padding:0 20px;border-radius:999px;background:rgba(47,92,184,0.24);border:1px solid rgba(148,184,255,0.52);color:#f4f7ff;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px">
        <span>免费下载</span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3v7.5M4.5 7.5L8 11l3.5-3.5M3.5 13h9"></path>
        </svg>

    <div style="max-width:880px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px">
      <h1 style="margin:0;font-size:96px;line-height:1.1;font-weight:700;letter-spacing:0.01em;color:#f4f7ff">落笔成块，快若无物</h1>
      <p style="margin:0;font-size:20px;line-height:1.65;color:#cfd6e4">不用注册登录，打开就能写，笔记全存在自己电脑里。</p>
      <div style="margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:12px">
        <a href="#download" style="height:52px;padding:0 34px;border-radius:12px;background:{{ctaBg}};border:1px solid rgba(154,187,252,0.48);color:#ffffff;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center">免费下载 Block</a>
        <span style="font-size:14px;color:#9da8be">支持 Mac、Windows、Linux · 完全免费</span>

    <div style="height:24px"></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#94b8ff","options":["#94b8ff","#779de8","#a8c7ff"]},"ctaBg":{"editor":"color","default":"#2f5cb8","options":["#2f5cb8","#3562be","#2850a4"]},"$preview":{"width":1440,"height":1720}}'>
class Component extends DCLogic {
  constructor() {
    super();
    this.state = { activeIdx: 0, count: 100000 };
    this._raf = null;
    this._start = 0;
  }
  componentDidMount() {
    this._startRoll();
  }
  componentWillUnmount() {
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  _startRoll() {
    if (this._raf) cancelAnimationFrame(this._raf);
    this._start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - this._start) / 2600);
      const eased = 1 - Math.pow(1 - t, 3);
      const val = t >= 1 ? 100000 : Math.max(1, Math.round((eased * 1000)) * 100);
      this.setState({ count: val });
      if (t < 1) {
        this._raf = requestAnimationFrame(step);
      } else {
        this._raf = null;
      }
    };
    this._raf = requestAnimationFrame(step);
  }
  renderVals() {
    const accent = this.props.accent ?? '#94b8ff';
    const ctaBg = this.props.ctaBg ?? '#2f5cb8';
    const labels = ['秒开', '好写好改', '随手记', 'AI 改稿', '转长图', '对比'];
    const railItems = labels.map((label, idx) => {
      const on = idx === this.state.activeIdx;
      return {
        label,
        pick: () => this.setState({ activeIdx: idx }),
        labelStyle: 'font-size:13.5px;font-weight:' + (on ? '600' : '450') + ';color:' + (on ? '#f4f7ff' : '#9aa6bd') + ';transition:color 160ms ease',
        tickStyle: 'width:' + (on ? '24px' : '10px') + ';height:2px;border-radius:999px;background:' + (on ? accent : '#4a556d') + ';transition:all 180ms ease'
      };
    });
    return {
      accent,
      ctaBg,
      railItems,
      formattedCount: this.state.count.toLocaleString('en-US'),
      replayRoll: () => this._startRoll()
    };
  }
}
</script>
</body>
