<helmet>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#141413;color:#ECEAE3;font-family:Inter,"IBM Plex Sans",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
a{color:#ECEAE3;text-decoration:none}
a:hover{color:#FAF9F5;text-decoration:underline}
.nav-item{color:#CFCBC0;font-size:15px;line-height:22px;font-weight:500;padding:6px 12px;border-radius:6px;text-decoration:none;transition:color 140ms ease,background-color 140ms ease}
.nav-item:hover{color:#ECEAE3;background:rgba(236,234,227,0.08);text-decoration:none}
.nav-cta{height:36px;padding:0 16px;border:1px solid #D97757;border-radius:6px;background:#C4613F;color:#FAF9F5;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:background-color 140ms ease}
.nav-cta:hover{background:#B0552F;color:#FAF9F5;text-decoration:none}
.cta-main{height:46px;padding:0 24px;border:1px solid #D97757;border-radius:8px;background:#C4613F;color:#FAF9F5;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;box-shadow:0 10px 32px rgba(217,119,87,0.28);transition:background-color 140ms ease}
.cta-main:hover{background:#B0552F;color:#FAF9F5;text-decoration:none}
.brand-link:hover{color:#FAF9F5;text-decoration:none}

/* 光晕层：只在 #top 内，动画只动 transform / opacity */
.glow{position:absolute;border-radius:50%;pointer-events:none;will-change:transform,opacity;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;filter:blur(68px)}
.glow-a{animation-name:glow-drift-a;animation-delay:0s}
.glow-b{animation-name:glow-drift-b;animation-delay:-5.5s}
.glow-c{animation-name:glow-rise-c;animation-delay:-3.2s}
@keyframes glow-drift-a{
  0%{transform:translate3d(0,0,0) scale(0.84);opacity:var(--a-lo)}
  50%{transform:translate3d(380px,240px,0) scale(1.24);opacity:var(--a-hi)}
  100%{transform:translate3d(180px,360px,0) scale(0.92);opacity:var(--a-mid)}
}
@keyframes glow-drift-b{
  0%{transform:translate3d(0,0,0) scale(1.22);opacity:var(--b-hi)}
  50%{transform:translate3d(-360px,280px,0) scale(0.82);opacity:var(--b-lo)}
  100%{transform:translate3d(-420px,110px,0) scale(1.18);opacity:var(--b-mid)}
}
@keyframes glow-rise-c{
  0%{transform:translate3d(-50%,140px,0) scale(0.82,0.8);opacity:var(--c-lo)}
  50%{transform:translate3d(-34%,-120px,0) scale(1.25,1.18);opacity:var(--c-hi)}
  100%{transform:translate3d(-64%,-220px,0) scale(0.94,1.08);opacity:var(--c-mid)}
}
/* 静帧开关与滚出首屏暂停：animation-play-state 置于 animation 规则之后避免被重置 */
.glow-root[data-still="true"] .glow{animation:none}
.glow-root[data-paused="true"] .glow{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){
  .glow{animation:none !important}
  *,*::before,*::after{transition-duration:0.01ms !important}
}
@media (max-width: 920px){
  .grid-12{display:flex !important;flex-direction:column !important}
  .editor-stage{min-height:520px !important}
}
</style>
</helmet>

<div style="width:100%;display:flex;flex-direction:column;background:#141413;color:#ECEAE3">

<!-- 首个视口：暮色深墨底 + 光晕，底边平滑过渡至次级深色区块 -->
<section id="top" class="glow-root" ref="{{setHero}}" data-paused="{{pausedAttr}}" data-still="{{stillAttr}}" data-fx="hero-glow" data-fx-pause="intersection-observer" style="position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#141413 0%,#141413 86%,#1B1A18 100%)">

<!-- 特效层：绝对定位，mask 在首屏底边前完全淡出，下一节干净无光晕 -->
<div aria-hidden="true" style="position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 66%,transparent 98%);mask-image:linear-gradient(180deg,#000 0%,#000 66%,transparent 98%)">
<div class="glow glow-a" style="left:-8%;top:-220px;width:960px;height:800px;background:radial-gradient(closest-side,{{warm}} 0%,{{warm}} 26%,transparent 100%);--a-lo:{{opALo}};--a-mid:{{opAMid}};--a-hi:{{opAHi}};opacity:{{opAMid}};animation-duration:{{durA}}"></div>
<div class="glow glow-b" style="right:-12%;top:-140px;width:1060px;height:880px;background:radial-gradient(closest-side,{{cool}} 0%,{{cool}} 28%,transparent 100%);--b-lo:{{opBLo}};--b-mid:{{opBMid}};--b-hi:{{opBHi}};opacity:{{opBMid}};animation-duration:{{durB}}"></div>
<div class="glow glow-c" style="left:50%;top:360px;width:1560px;height:560px;background:radial-gradient(closest-side,{{ember}} 0%,{{ember}} 22%,transparent 100%);--c-lo:{{opCLo}};--c-mid:{{opCMid}};--c-hi:{{opCHi}};opacity:{{opCMid}};transform:translate3d(-50%,140px,0);animation-duration:{{durC}}"></div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","default":1,"min":0.5,"max":2,"step":0.1,"section":"动效"},"intensity":{"editor":"range","default":1,"min":0.3,"max":1.4,"step":0.05,"section":"动效"},"still":{"editor":"boolean","default":false,"section":"动效"},"warm":{"editor":"color","default":"#D97757","options":["#D97757","#C4613F","#E39A6F"],"section":"配色"},"cool":{"editor":"color","default":"#2F6B5C","options":["#2F6B5C","#24544F","#3A6E73"],"section":"配色"},"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
    this.hero = null;
    this.io = null;
    this.onVisibility = () => {
      if (document.hidden) this.setState({ paused: true });
      else if (this.inView !== false) this.setState({ paused: false });
    };
  }
  componentDidMount() {
    if (this.hero && typeof IntersectionObserver !== 'undefined') {
      this.io = new IntersectionObserver((entries) => {
        const entry = entries[0];
        this.inView = entry.isIntersecting;
        this.setState({ paused: !entry.isIntersecting || document.hidden });
      }, { threshold: 0 });
      this.io.observe(this.hero);
    }
    document.addEventListener('visibilitychange', this.onVisibility);
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    document.removeEventListener('visibilitychange', this.onVisibility);
  }
  renderVals() {
    const speed = Math.max(0.1, Number(this.props.speed ?? 1));
    const k = Math.max(0, Number(this.props.intensity ?? 1));
    const clamp = (v) => Math.min(1, Math.max(0, v)).toFixed(3);
    const warm = this.props.warm ?? '#D97757';
    return {
      warm: warm,
      cool: this.props.cool ?? '#2F6B5C',
      ember: '#C4613F',
      durA: (16 / speed).toFixed(1) + 's',
      durB: (20 / speed).toFixed(1) + 's',
      durC: (13 / speed).toFixed(1) + 's',
      opALo: clamp(0.36 * k),
      opAMid: clamp(0.68 * k),
      opAHi: clamp(0.96 * k),
      opBLo: clamp(0.35 * k),
      opBMid: clamp(0.72 * k),
      opBHi: clamp(0.98 * k),
      opCLo: clamp(0.35 * k),
      opCMid: clamp(0.65 * k),
      opCHi: clamp(0.95 * k),
      pausedAttr: this.state.paused ? 'true' : 'false',
      stillAttr: this.props.still ? 'true' : 'false',
      setHero: (el) => { this.hero = el; }
    };
  }
}
</script>
