<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>方案 B · 轻量列表</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #547dd0; text-decoration: none; }
    a:hover { color: #456ec2; }
    * { box-sizing: border-box; }
    button, input { font-family: inherit; font-size: 14px; line-height: 20px; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .nav { width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; color: var(--text2); font-weight: 460; }
    .nav:hover { background: var(--hover); color: var(--text1); }
    .nav.on { background: var(--selected); color: var(--text1); }
    .tab { height: 28px; padding: 0 2px; border: 0; background: transparent; color: var(--text2); font-weight: 460; }
    .tab:hover { color: var(--text1); }
    .tab.on { color: var(--text1); }
    .ghost { width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--text2); display: inline-flex; align-items: center; justify-content: center; }
    .ghost:hover { background: var(--hover); color: var(--text1); }
    .row { width: 100%; min-height: 64px; padding: 12px 14px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; }
    .row:hover { background: var(--hover); }
    .row .chev { opacity: 0; transition: opacity .12s; }
    .row:hover .chev, .row:focus-visible .chev { opacity: 1; }
    .ico { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--iconbg); color: var(--text1); display: inline-flex; align-items: center; justify-content: center; }
    .inp { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 1px solid var(--btnborder); border-radius: 8px; background: transparent; outline: none; }
    .inp:focus { border-color: var(--accent); }
    .inp::placeholder { color: var(--text2); }
    .txtbtn { height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--text2); font-weight: 460; }
    .txtbtn:hover { background: var(--hover); color: var(--text1); }
    .primary { height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--onaccent); font-weight: 460; }
    .danger:hover { color: #e0706a; }
  </style>
</helmet>

<div style="width: 100%; min-height: 900px; display: flex; --bg: {{c.bg}}; --side: {{c.side}}; --text1: {{c.text1}}; --text2: {{c.text2}}; --hover: {{c.hover}}; --selected: {{c.selected}}; --border: {{c.border}}; --btnborder: {{c.btnborder}}; --iconbg: {{c.iconbg}}; --accent: {{c.accent}}; --onaccent: {{c.onaccent}}; --duo: {{c.duo}}; background: var(--bg); color: var(--text1); font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased">

  <aside style="width: 260px; flex: none; padding: 16px 12px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px">
    <button class="nav" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"></path></svg>返回
    </button>
    <div style="height: 10px"></div>
    <button class="nav" type="button">AI 助手</button>
    <button class="nav" type="button">外观与字体</button>
    <button class="nav" type="button">文件夹</button>
    <button class="nav" type="button">快捷键</button>
    <div style="height: 1px; margin: 10px 10px; background: var(--border)"></div>
    <button class="nav on" type="button">应用商店</button>
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="4">
      <button class="nav" type="button" onClick="{{a.pick}}" style="padding-left: 22px">{{a.name}}</button>
    </sc-for>
  </aside>

  <main style="flex: 1; min-width: 0; padding: 40px 28px 64px">
    <div style="max-width: 720px; margin: 0 auto">

      <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap">
          <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 560; flex: 1">应用商店</h1>
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="{{tabAllCls}}" type="button" onClick="{{showAll}}">全部</button>
            <button class="{{tabMineCls}}" type="button" onClick="{{showMine}}">已安装</button>
          </div>
          <div style="display: flex; align-items: center; gap: 2px">
            <button class="ghost" type="button" aria-label="手动安装" onClick="{{toggleManual}}">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
            </button>
            <button class="ghost" type="button" aria-label="刷新">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5"></path></svg>
            </button>
          </div>
        </div>

        <sc-if value="{{manual}}" hint-placeholder-val="{{ false }}">
          <form style="display: flex; gap: 8px; margin: 0 0 20px">
            <label for="src" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">安装来源</label>
            <input id="src" class="inp" placeholder="owner/repo、压缩包 URL 或本地目录">
            <button class="txtbtn" type="button">本地目录</button>
          </form>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 2px; margin: 0 -14px">
          <sc-for list="{{apps}}" as="a" hint-placeholder-count="4">
            <button class="row" type="button" onClick="{{a.pick}}">
              <span class="ico" aria-hidden="true">
                <sc-if value="{{a.isSync}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 7.5A5.5 5.5 0 0 0 4.4 5.4M3.5 10.5a5.5 5.5 0 0 0 10.1 2.1"></path><path d="M4 2.8v2.8h2.8M14 15.2v-2.8h-2.8" stroke="var(--accent)"></path></svg></sc-if>
                <sc-if value="{{a.isImage}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.75" y="3.25" width="12.5" height="11.5" rx="2.5" fill="var(--duo)"></rect><path d="M3 12.5l3.5-3.5 3 3 2-2 3.5 3.5"></path><circle cx="11.5" cy="6.75" r="1.1" stroke="var(--accent)"></circle></svg></sc-if>
                <sc-if value="{{a.isMigrate}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.75H5a2 2 0 0 0-2 2v8.5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7.25z" fill="var(--duo)"></path><path d="M6.5 10h5M9.75 8.25L11.5 10l-1.75 1.75" stroke="var(--accent)"></path></svg></sc-if>
                <sc-if value="{{a.isPerf}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6.25" fill="var(--duo)"></circle><path d="M4.5 9.5h2l1.25-2.5 2.25 4.5 1.25-2h2.25" stroke="var(--accent)"></path></svg></sc-if>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; line-height: 22px; font-weight: 560; color: var(--text1)">{{a.name}}</span>
                <span style="color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.desc}}</span>
              </span>
              <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"></path></svg>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
        <button class="txtbtn" type="button" onClick="{{back}}" style="margin: 0 0 24px -12px; height: 32px; display: inline-flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"></path></svg>应用商店
        </button>
        <h1 style="margin: 0 0 8px; font-size: 24px; line-height: 32px; font-weight: 560">{{cur.name}}</h1>
        <p style="margin: 0 0 6px; color: var(--text1); max-width: 560px">{{cur.desc}}</p>
        <p style="margin: 0 0 28px; color: var(--text2)">{{cur.meta}}</p>
        <div style="display: flex; align-items: center; gap: 4px">
          <button class="primary" type="button">{{cur.action}}</button>
          <button class="txtbtn danger" type="button" style="height: 34px">卸载</button>
        </div>
      </sc-if>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'list', pick: null, tab: 'all', manual: false };
  }
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const c = dark
      ? { bg: '#181818', side: '#222222', text1: '#ececec', text2: '#b4b4b4', hover: '#242424', selected: '#3a3a3a', border: '#292929', btnborder: '#444444', iconbg: '#262626', accent: '#779de8', onaccent: '#10151f', duo: '#31456a' }
      : { bg: '#f8f8f8', side: '#fafafa', text1: '#20242c', text2: '#526071', hover: '#f0f0ef', selected: '#e5e5e3', border: '#e4e6ea', btnborder: '#dcdcdc', iconbg: '#f1f1f1', accent: '#547dd0', onaccent: '#ffffff', duo: '#c9d8f3' };
    const base = [
      { id: 'sync', name: '同步', desc: '本地目录镜像、WebDAV 与 Git 仓库的多端增量同步', meta: 'v1.2.10 · Block Community', action: '配置同步' },
      { id: 'image', name: '图床上传', desc: '笔记图片自动上传到 Cloudflare R2、S3 兼容存储或 GitHub 仓库', meta: 'v1.1.7 · Block Community', action: '打开' },
      { id: 'migrate', name: '笔记迁移', desc: '从 Obsidian、Notion 与语雀导出目录迁移笔记，清洗语法并拷贝附件', meta: 'v1.1.8 · Block Community', action: '打开' },
      { id: 'perf', name: '性能与占用', desc: '实时查看 Block 的 CPU、内存与磁盘空间占用', meta: 'v1.2.10 · Block Community', action: '打开' }
    ];
    const apps = base.map((a) => ({
      ...a,
      isSync: a.id === 'sync', isImage: a.id === 'image', isMigrate: a.id === 'migrate', isPerf: a.id === 'perf',
      pick: () => this.setState({ view: 'detail', pick: a.id })
    }));
    const cur = apps.find((a) => a.id === this.state.pick) || apps[0];
    return {
      c, apps, cur,
      isList: this.state.view === 'list',
      isDetail: this.state.view === 'detail',
      manual: this.state.manual,
      tabAllCls: this.state.tab === 'all' ? 'tab on' : 'tab',
      tabMineCls: this.state.tab === 'mine' ? 'tab on' : 'tab',
      showAll: () => this.setState({ tab: 'all' }),
      showMine: () => this.setState({ tab: 'mine' }),
      toggleManual: () => this.setState({ manual: !this.state.manual }),
      back: () => this.setState({ view: 'list' })
    };
  }
}
</script>
</body>
</html>
