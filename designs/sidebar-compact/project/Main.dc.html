<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 A · 纯净文件树</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
a{color:#547dd0}a:hover{color:#3d63b0}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 40px; background: #e9eaec; display: flex">
<div style="flex: 1; border-radius: 12px; overflow: hidden; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.12); display: flex; flex-direction: column; position: relative">

  <div style="height: 40px; display: flex; background: #f1f1f1; border-bottom: 1px solid #e6e6e6; flex-shrink: 0">
    <div style="width: 260px; box-sizing: border-box; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px; border-right: 1px solid #e6e6e6">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
      <span style="flex: 1"></span>
      <button type="button" aria-label="收起侧栏" style="width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #526071; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path><path d="M15 10l-2 2 2 2" stroke="#547dd0"></path></svg>
      </button>
    </div>
    <div style="flex: 1; padding: 0 16px 0 20px; display: flex; align-items: center; gap: 6px">
      <span style="font-size: 14px; font-weight: 460; color: #20242c; flex: 1">明天汇报</span>
      <button type="button" aria-label="评论" style="width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #526071; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8M8 12h5"></path></svg></button>
      <button type="button" aria-label="AI" style="width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #526071; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4l1.6 4.4L16 10l-4.4 1.6L10 16l-1.6-4.4L4 10l4.4-1.6z"></path><path d="M18 3v4M16 5h4"></path></svg></button>
      <button type="button" aria-label="更多" style="width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #526071; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></svg></button>
    </div>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">
    <div style="width: 260px; box-sizing: border-box; background: #fafafa; border-right: 1px solid #e6e6e6; display: flex; flex-direction: column">
      <div style="padding: 8px 8px 0; display: flex; flex-direction: column; gap: 2px">
        <div style="height: 32px; border-radius: 6px; padding: 0 8px; display: flex; align-items: center; gap: 8px; color: #20242c; font-size: 14px; font-weight: 460">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          <span>backups</span>
        </div>
        <div style="height: 32px; border-radius: 6px; padding: 0 8px 0 30px; display: flex; align-items: center; gap: 8px; color: #20242c; font-size: 14px; font-weight: 460"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h4"></path></svg><span>更深入调研</span></div>
        <div style="height: 32px; border-radius: 6px; padding: 0 8px 0 30px; display: flex; align-items: center; gap: 8px; color: #20242c; font-size: 14px; font-weight: 460"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h4"></path></svg><span>官网</span></div>
        <div style="height: 32px; border-radius: 6px; padding: 0 8px 0 30px; display: flex; align-items: center; gap: 8px; color: #20242c; font-size: 14px; font-weight: 460"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h4"></path></svg><span>苹果账号购买</span></div>
        <div style="height: 32px; border-radius: 6px; padding: 0 8px 0 30px; display: flex; align-items: center; gap: 8px; color: #20242c; font-size: 14px; font-weight: 460; background: #e5edfc; box-shadow: inset 0 0 0 1px #547dd0"><svg width="16" height="16" viewBox="0 0 24 24" fill="#c9d8f3" stroke="#547dd0" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h4"></path></svg><span>明天汇报</span></div>
        <div style="height: 32px; border-radius: 6px; padding: 0 8px 0 30px; display: flex; align-items: center; gap: 8px; color: #20242c; font-size: 14px; font-weight: 460"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h4"></path></svg><span>claude</span></div>
      </div>
      <button type="button" aria-label="侧栏空白处" onClick="{{toggleMenu}}" style="flex: 1; border: none; background: transparent; cursor: context-menu"></button>
      <div style="height: 48px; border-top: 1px solid #e6e6e6; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#20242c" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span style="font-size: 14px; font-weight: 460; color: #20242c; flex: 1">创业团队</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
        <span style="width: 1px; height: 16px; background: #e4e6ea; margin: 0 4px"></span>
        <button type="button" aria-label="设置" style="width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #526071; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
      </div>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 56px 0 0 120px; display: flex; flex-direction: column; gap: 18px; color: #1f1e1d; font-size: 16px; line-height: 28px">
      <div>日本站：https://yangvela.com/jp</div>
      <div>英文全球站：https://yangvela.com/?lang=en</div>
      <div>韩国站：https://yangvela.com/kr</div>
      <div style="max-width: 640px">本次更新重点：英、韩两站新增四大美容护理扩展产线并换上全新首屏封面。</div>
    </div>
  </div>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ true }}">
    <div role="menu" style="position: absolute; left: 96px; top: 300px; width: 200px; box-sizing: border-box; padding: 4px; border-radius: 8px; background: #ffffff; box-shadow: 0 0 0 1px #e4e6ea, 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 1px">
      <button type="button" role="menuitem" style="height: 32px; border: none; border-radius: 6px; background: #eef3fc; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #20242c; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#c9d8f3" stroke="#20242c" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M12 11v6M9 14h6" stroke="#547dd0" stroke-linecap="round"></path></svg>
        <span style="flex: 1">新建页面</span><span style="font-family: 'JetBrains Mono',Menlo,monospace; font-size: 12px; color: #526071">⌘N</span>
      </button>
      <button type="button" role="menuitem" style="height: 32px; border: none; border-radius: 6px; background: transparent; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #20242c; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#c9d8f3" stroke="#20242c" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M12 10v6M9 13h6" stroke="#547dd0" stroke-linecap="round"></path></svg>
        <span style="flex: 1">新建文件夹</span><span style="font-family: 'JetBrains Mono',Menlo,monospace; font-size: 12px; color: #526071">⇧⌘N</span>
      </button>
      <div style="height: 1px; background: #e4e6ea; margin: 3px 4px"></div>
      <button type="button" role="menuitem" style="height: 32px; border: none; border-radius: 6px; background: transparent; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #20242c; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#20242c" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span style="flex: 1">在访达中显示</span>
      </button>
    </div>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: true };
  }
  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen })
    };
  }
}
</script>
</body>
</html>
