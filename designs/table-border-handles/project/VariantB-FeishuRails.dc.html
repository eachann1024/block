<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>版本 B · 飞书分段边框导轨与就地浮动工具条</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #779de8; text-decoration: none; }
    a:hover { color: #9dbcf5; text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #547dd0; outline-offset: 2px; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 100%; min-height: 880px; display: flex; flex-direction: column; background: {{paperBg}}; color: {{textPrimary}}; font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased">

  <header style="min-height: 44px; padding: 6px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: {{shellBg}}; border-bottom: 1px solid {{sidebarBorder}}">
    <div style="display: flex; align-items: center; gap: 10px">
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; margin-right: 6px">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
      </div>
      <span style="font-size: 14px; font-weight: 560; color: {{textPrimary}}">账号与订阅清单</span>
      <span style="height: 22px; padding: 0 8px; border-radius: 5px; background: {{selectedBg}}; box-shadow: inset 0 0 0 1px {{accent}}; color: {{textPrimary}}; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center">版本 B · 飞书分段导轨 + 浮动工具条</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <div role="group" aria-label="飞书导轨状态切换" style="display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: {{paperBg}}; border: 1px solid {{borderCol}}; border-radius: 8px">
        <sc-for list="{{modeTabs}}" as="tab" hint-placeholder-count="4">
          <button type="button" onClick="{{tab.pick}}" style="height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: {{tab.bg}}; box-shadow: {{tab.ring}}; color: {{tab.fg}}; font-size: 14px; font-weight: {{tab.weight}}">{{tab.label}}</button>
        </sc-for>
      </div>

      <button type="button" onClick="{{toggleTheme}}" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid {{btnBorder}}; background: {{menuBg}}; color: {{textPrimary}}; font-size: 14px; font-weight: 460">{{themeBtnLabel}}</button>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 38px 28px 88px; background: {{paperBg}}">
    <div style="width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 18px">

      <div style="padding-left: 42px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; color: {{textPrimary}}">服务账号与 2FA 备份表</h1>
        <span style="font-size: 14px; color: {{textSecondary}}">{{statusHint}}</span>
      </div>

      <div style="padding-left: 42px; min-height: 42px; display: flex; align-items: center">
        <sc-if value="{{showFloatingBar}}" hint-placeholder-val="{{true}}">
          <div role="toolbar" aria-label="表格边框浮动快捷工具条" style="position: relative; min-height: 40px; padding: 4px 8px; border-radius: 10px; background: {{menuBg}}; border: 1px solid {{borderCol}}; box-shadow: {{barShadow}}; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px">

            <span style="height: 26px; padding: 0 9px; border-radius: 6px; background: {{selectedBg}}; box-shadow: inset 0 0 0 1px {{accent}}; color: {{textPrimary}}; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; margin-right: 2px">
              <span>{{selectionBadge}}</span>
            </span>

            <button type="button" onClick="{{insertBefore}}" style="height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: {{textPrimary}}; font-size: 13px; display: inline-flex; align-items: center; gap: 5px">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg>
              <span>{{beforeBtnLabel}}</span>
            </button>

            <button type="button" onClick="{{insertAfter}}" style="height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: {{textPrimary}}; font-size: 13px; display: inline-flex; align-items: center; gap: 5px">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg>
              <span>{{afterBtnLabel}}</span>
            </button>

            <span aria-hidden="true" style="width: 1px; height: 18px; background: {{borderCol}}; margin: 0 2px"></span>

            <sc-for list="{{alignBtns}}" as="ab" hint-placeholder-count="3">
              <button type="button" onClick="{{ab.pick}}" aria-label="{{ab.aria}}" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: {{ab.bg}}; box-shadow: {{ab.ring}}; color: {{ab.fg}}; display: inline-flex; align-items: center; justify-content: center">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="{{ab.path}}"></path></svg>
              </button>
            </sc-for>

            <button type="button" onClick="{{sortSelectedCol}}" aria-label="按当前列升降序排列" style="height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: {{textPrimary}}; font-size: 13px; display: inline-flex; align-items: center; gap: 5px">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v10M5 13l-2.2-2.2M5 13l2.2-2.2M10 4.5h3.5M10 8h2.5M10 11.5h1.5"></path></svg>
              <span>{{sortLabel}}</span>
            </button>

            <button type="button" onClick="{{toggleHeaderFreeze}}" aria-label="冻结或固定首行表头" style="height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: {{freezeBg}}; box-shadow: {{freezeRing}}; color: {{freezeFg}}; font-size: 13px; display: inline-flex; align-items: center; gap: 5px">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v3h-11zM2.5 6.5v6h11v-6"></path></svg>
              <span>表头冻结</span>
            </button>

            <span aria-hidden="true" style="width: 1px; height: 18px; background: {{borderCol}}; margin: 0 2px"></span>

            <div role="group" aria-label="快速底色圆点" style="display: inline-flex; align-items: center; gap: 5px; padding: 0 4px">
              <sc-for list="{{tintSwatches}}" as="sw" hint-placeholder-count="4">
                <button type="button" onClick="{{sw.pick}}" aria-label="{{sw.aria}}" style="width: 16px; height: 16px; padding: 0; border-radius: 8px; border: 1px solid {{sw.border}}; background: {{sw.fill}}; box-shadow: {{sw.ring}}"></button>
              </sc-for>
            </div>

            <span aria-hidden="true" style="width: 1px; height: 18px; background: {{borderCol}}; margin: 0 2px"></span>

            <button type="button" onClick="{{copySelection}}" aria-label="复制选区为 Markdown 或 TSV" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: {{textSecondary}}; display: inline-flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5"></rect><path d="M3 10.5V4a1 1 0 0 1 1-1h6.5"></path></svg>
            </button>

            <button type="button" onClick="{{deleteSelection}}" aria-label="{{deleteAria}}" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: {{dangerFg}}; display: inline-flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M4 4.5l.7 8.5a1 1 0 0 0 1 1h4.6a1 1 0 0 0 1-1l.7-8.5"></path></svg>
            </button>

            <button type="button" onClick="{{toggleMorePop}}" aria-label="更多表格功能" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: {{moreBtnBg}}; color: {{textPrimary}}; display: inline-flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.25"></circle><circle cx="8" cy="8" r="1.25"></circle><circle cx="12.5" cy="8" r="1.25"></circle></svg>
            </button>

            <sc-if value="{{moreOpen}}" hint-placeholder-val="{{false}}">
              <div role="menu" aria-label="更多表格命令" style="position: absolute; top: 44px; right: 0; z-index: 40; width: 196px; padding: 5px; border-radius: 9px; background: {{menuBg}}; border: 1px solid {{borderCol}}; box-shadow: {{barShadow}}; display: flex; flex-direction: column; gap: 2px">
                <button type="button" role="menuitem" onClick="{{autoFitCols}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{textPrimary}}; font-size: 14px; text-align: left">按内容适配列宽</button>
                <button type="button" role="menuitem" onClick="{{clearSelectedCells}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{textPrimary}}; font-size: 14px; text-align: left">清空选区内容</button>
                <button type="button" role="menuitem" onClick="{{exportCSV}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{textPrimary}}; font-size: 14px; text-align: left">导出为 CSV 文件</button>
              </div>
            </sc-if>

          </div>
        </sc-if>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 8px">

        <div style="width: 26px; padding-top: 22px; display: flex; justify-content: center; flex-shrink: 0">
          <button type="button" onClick="{{selectAllTable}}" aria-label="块拖拽把手" style="width: 24px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: {{textSecondary}}; display: inline-flex; align-items: center; justify-content: center">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <circle cx="5.5" cy="3.5" r="1.3"></circle><circle cx="10.5" cy="3.5" r="1.3"></circle>
              <circle cx="5.5" cy="8" r="1.3"></circle><circle cx="10.5" cy="8" r="1.3"></circle>
              <circle cx="5.5" cy="12.5" r="1.3"></circle><circle cx="10.5" cy="12.5" r="1.3"></circle>
            </svg>
          </button>
        </div>

        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">

          <div style="display: flex; align-items: stretch; gap: 6px">

            <div style="flex: 1; min-width: 0; overflow-x: auto">
              <div style="min-width: 838px; display: flex; flex-direction: column; position: relative">

                <div style="display: flex; align-items: stretch; height: 16px; margin-bottom: 3px">
                  <button type="button" onClick="{{selectAllTable}}" aria-label="全选整张表格边框" style="width: 16px; height: 16px; margin-right: 3px; padding: 0; border: 1px solid {{cornerBorder}}; border-radius: 4px; background: {{cornerBg}}; color: {{cornerFg}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">
                    <span style="width: 6px; height: 6px; border-radius: 1.5px; background: currentColor"></span>
                  </button>

                  <div style="flex: 1; display: grid; grid-template-columns: 52px 196px 124px 206px 114px minmax(128px, 1fr); gap: 2px">
                    <sc-for list="{{colRails}}" as="cr" hint-placeholder-count="6">
                      <button type="button" onClick="{{cr.pick}}" aria-label="{{cr.aria}}" style="height: 16px; padding: 0; border: 1px solid {{cr.border}}; border-radius: 4px; background: {{cr.bg}}; color: {{cr.fg}}; display: flex; align-items: center; justify-content: center">
                        <span style="width: 14px; height: 2.5px; border-radius: 2px; background: currentColor"></span>
                      </button>
                    </sc-for>
                  </div>
                </div>

                <div style="display: flex; align-items: stretch">

                  <div style="width: 16px; margin-right: 3px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
                    <sc-for list="{{rowRails}}" as="rr" hint-placeholder-count="5">
                      <button type="button" onClick="{{rr.pick}}" aria-label="{{rr.aria}}" style="flex: {{rr.flex}}; width: 16px; padding: 0; border: 1px solid {{rr.border}}; border-radius: 4px; background: {{rr.bg}}; color: {{rr.fg}}; display: flex; align-items: center; justify-content: center">
                        <span style="width: 2.5px; height: 14px; border-radius: 2px; background: currentColor"></span>
                      </button>
                    </sc-for>
                  </div>

                  <div style="flex: 1; min-width: 0; position: relative; border-radius: 8px; border: {{outerTableBorder}}; box-shadow: {{outerTableRing}}; background: {{paperBg}}; overflow: hidden">

                    <sc-for list="{{tableRows}}" as="row" hint-placeholder-count="5">
                      <div style="display: grid; grid-template-columns: 52px 196px 124px 206px 114px minmax(128px, 1fr); border-bottom: {{row.bottomRule}}; box-shadow: {{row.rowRing}}">
                        <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="6">
                          <button type="button" onClick="{{cell.pick}}" style="min-height: {{row.minH}}; padding: 10px 12px; border: 0; border-right: {{cell.rightRule}}; background: {{cell.bg}}; box-shadow: {{cell.colRing}}; color: {{cell.fg}}; font-family: {{cell.font}}; font-size: {{cell.size}}; line-height: 20px; font-weight: {{cell.weight}}; text-align: {{cell.align}}; display: flex; align-items: center; justify-content: {{cell.justify}}; word-break: break-all">{{cell.text}}</button>
                        </sc-for>
                      </div>
                    </sc-for>

                    <sc-if value="{{isSeamMode}}" hint-placeholder-val="{{false}}">
                      <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 247px; width: 2px; background: {{accent}}; pointer-events: none"></div>
                      <div style="position: absolute; top: 10px; left: 256px; height: 26px; padding: 0 9px; border-radius: 6px; background: {{menuBg}}; border: 1px solid {{accent}}; color: {{textPrimary}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; display: inline-flex; align-items: center; gap: 6px">
                        <span>列宽 196px · 拖拽或双击适配</span>
                      </div>
                      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 100px; height: 2px; background: {{accent}}; pointer-events: none"></div>
                    </sc-if>

                  </div>

                </div>

                <sc-if value="{{isSeamMode}}" hint-placeholder-val="{{false}}">
                  <button type="button" onClick="{{insertSeamCol}}" aria-label="在账号与密码导轨交界处插入新列" style="position: absolute; top: -3px; left: 256px; width: 20px; height: 20px; padding: 0; border: 2px solid {{paperBg}}; border-radius: 10px; background: {{solidAccentBg}}; color: {{solidAccentFg}}; display: inline-flex; align-items: center; justify-content: center">
                    <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg>
                  </button>
                  <button type="button" onClick="{{insertSeamRow}}" aria-label="在第1行与第2行导轨交界处插入新行" style="position: absolute; top: 109px; left: -2px; width: 20px; height: 20px; padding: 0; border: 2px solid {{paperBg}}; border-radius: 10px; background: {{solidAccentBg}}; color: {{solidAccentFg}}; display: inline-flex; align-items: center; justify-content: center">
                    <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg>
                  </button>
                </sc-if>

              </div>
            </div>

            <button type="button" onClick="{{appendCol}}" aria-label="在右侧末尾追加一列" style="width: 24px; margin-top: 19px; border: 1px solid {{borderCol}}; border-radius: 6px; background: {{addBarBg}}; color: {{textSecondary}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg>
            </button>

          </div>

          <div style="padding-left: 19px; padding-right: 30px">
            <button type="button" onClick="{{appendRow}}" aria-label="在底部末尾追加一行" style="width: 100%; height: 24px; border: 1px solid {{borderCol}}; border-radius: 6px; background: {{addBarBg}}; color: {{textSecondary}}; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg>
            </button>
          </div>

        </div>

      </div>

    </div>
  </main>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"],"section":"Appearance"},"initialMode":{"editor":"enum","default":"col","options":["col","row","all","seam"],"section":"Interaction"},"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  constructor() {
    super();
    this.state = {
      themeOverride: null,
      modeOverride: null,
      activeCol: 1,
      activeRow: 2,
      freezeHeader: true,
      moreOpen: false,
      sortAsc: true,
      colAligns: ['left', 'left', 'left', 'left', 'left', 'left'],
      colTints: ['none', 'none', 'none', 'none', 'none', 'none'],
      rowTints: ['none', 'none', 'none', 'none', 'none'],
      feedback: '',
      rows: [
        ['#', '账号', '密码', '2FA密钥', '订阅到期', '备注'],
        ['1', 'i.sedudip@example.com', 'BcOisyfPkICN', 'lz3bwbtlkjvswprn6ji4zr6te2nvwyx6', '2026-09-29', ''],
        ['2', 'poliana.m16@example.com', 'ap2rkp9tc', '3ap6dpugj33mquerwbc5gsfqr2wldmns', '2026-09-29', '双重验证已通过'],
        ['3', 'anshad.k@example.com', '89316904', 'ipsikhmpxo7sht3b4m44pvr4ufkcjaqh', '2026-09-29', '备用号；双重验证已通过'],
        ['4', 'giulia.nd@example.com', 'uajt1fduydk', '46higai2hocpinm6g3dek25d4vvc35ih', '2026-09-29', '双重验证已通过']
      ]
    };
  }

  renderVals() {
    const theme = this.state.themeOverride ?? this.props.theme ?? 'dark';
    const isDark = theme === 'dark';
    const mode = this.state.modeOverride ?? this.props.initialMode ?? 'col';

    const pal = isDark ? {
      shellBg: '#343434',
      sidebarBorder: '#333333',
      paperBg: '#181818',
      menuBg: '#222222',
      headerBg: '#242424',
      railBg: '#242424',
      addBarBg: '#222222',
      borderCol: '#2e2e2e',
      btnBorder: '#444444',
      textPrimary: '#ececec',
      textSecondary: '#b4b4b4',
      accent: '#779de8',
      linkFg: '#8bb0f6',
      hoverBg: '#2c2c2c',
      selectedBg: '#343434',
      selTint: '#1f2b40',
      solidAccentBg: '#779de8',
      solidAccentFg: '#141820',
      dangerFg: '#f28b82',
      barShadow: '0 10px 26px rgba(0, 0, 0, 0.42)',
      tints: {
        none: 'transparent',
        slate: '#2a2d32',
        ocean: '#1f2d46',
        emerald: '#1c3329'
      }
    } : {
      shellBg: '#f1f1f1',
      sidebarBorder: '#e6e6e6',
      paperBg: '#ffffff',
      menuBg: '#ffffff',
      headerBg: '#f3f1ec',
      railBg: '#f4f3ef',
      addBarBg: '#f5f4f0',
      borderCol: '#e4e6ea',
      btnBorder: '#dcdcdc',
      textPrimary: '#1f1e1d',
      textSecondary: '#52514e',
      accent: '#547dd0',
      linkFg: '#256abf',
      hoverBg: '#eef3fc',
      selectedBg: '#e5edfc',
      selTint: '#eef3fc',
      solidAccentBg: '#3d63b0',
      solidAccentFg: '#ffffff',
      dangerFg: '#c5342d',
      barShadow: '0 8px 22px rgba(15, 23, 42, 0.10)',
      tints: {
        none: 'transparent',
        slate: '#f1f3f6',
        ocean: '#e8f0fe',
        emerald: '#e7f5ee'
      }
    };

    const modeDefs = [
      { id: 'col', label: '列导轨选中 + 浮动条' },
      { id: 'row', label: '行导轨选中 + 浮动条' },
      { id: 'all', label: '左上角全表边框选中' },
      { id: 'seam', label: '导轨缝隙插入 + 列宽标尺' }
    ];
    const modeTabs = modeDefs.map((m) => {
      const on = mode === m.id;
      return {
        label: m.label,
        bg: on ? pal.selectedBg : 'transparent',
        ring: on ? ('inset 0 0 0 1px ' + pal.accent) : 'none',
        fg: on ? pal.textPrimary : pal.textSecondary,
        weight: on ? 500 : 400,
        pick: () => this.setState({ modeOverride: m.id, moreOpen: false, feedback: '' })
      };
    });

    const rows = this.state.rows;
    const rowCount = rows.length;
    const colCount = rows[0].length;
    const activeCol = Math.min(this.state.activeCol, colCount - 1);
    const activeRow = Math.min(this.state.activeRow, rowCount - 1);

    const colRails = rows[0].map((colName, cIdx) => {
      const active = (mode === 'col' && cIdx === activeCol) || mode === 'all';
      return {
        aria: '点击顶部导轨选中第 ' + (cIdx + 1) + ' 列（' + (colName || '新列') + '）',
        bg: active ? pal.solidAccentBg : pal.railBg,
        fg: active ? pal.solidAccentFg : pal.textSecondary,
        border: active ? pal.accent : pal.borderCol,
        pick: () => this.setState({ modeOverride: 'col', activeCol: cIdx, moreOpen: false, feedback: '' })
      };
    });

    const rowRails = rows.map((_, rIdx) => {
      const active = (mode === 'row' && rIdx === activeRow) || mode === 'all';
      return {
        aria: rIdx === 0 ? '点击左侧导轨选中表头行' : ('点击左侧导轨选中第 ' + rIdx + ' 行'),
        flex: rIdx === 0 ? '0 0 42px' : '1 1 58px',
        bg: active ? pal.solidAccentBg : pal.railBg,
        fg: active ? pal.solidAccentFg : pal.textSecondary,
        border: active ? pal.accent : pal.borderCol,
        pick: () => this.setState({ modeOverride: 'row', activeRow: rIdx, moreOpen: false, feedback: '' })
      };
    });

    const tableRows = rows.map((rCells, rIdx) => {
      const isHeader = rIdx === 0 && this.state.freezeHeader;
      const isRowSelected = mode === 'row' && rIdx === activeRow;
      const rTint = this.state.rowTints[rIdx] || 'none';

      const cells = rCells.map((txt, cIdx) => {
        const isColSelected = mode === 'col' && cIdx === activeCol;
        const cTint = this.state.colTints[cIdx] || 'none';
        let bg = isHeader ? pal.headerBg : pal.paperBg;
        if (cTint !== 'none') bg = pal.tints[cTint];
        if (rTint !== 'none') bg = pal.tints[rTint];
        if (isColSelected || isRowSelected || mode === 'all') {
          bg = pal.selTint;
        }

        let colRing = 'none';
        if (isColSelected) {
          const topS = rIdx === 0 ? ('inset 0 1.5px 0 0 ' + pal.accent + ',') : '';
          const botS = rIdx === rowCount - 1 ? ('inset 0 -1.5px 0 0 ' + pal.accent + ',') : '';
          colRing = topS + botS + 'inset 1.5px 0 0 0 ' + pal.accent + ', inset -1.5px 0 0 0 ' + pal.accent;
        }

        const align = this.state.colAligns[cIdx] || 'left';
        const justify = align === 'center' ? 'center' : (align === 'right' ? 'flex-end' : 'flex-start');
        const isEmailLink = rIdx > 1 && cIdx === 1 && txt.indexOf('@') > -1;
        const isMonoCol = rIdx > 0 && (cIdx === 2 || cIdx === 3 || cIdx === 4);

        return {
          text: txt,
          bg,
          colRing,
          rightRule: cIdx < colCount - 1 ? ('1px solid ' + pal.borderCol) : '0',
          fg: isEmailLink ? pal.linkFg : (isHeader ? pal.textSecondary : pal.textPrimary),
          font: isMonoCol ? "'JetBrains Mono', ui-monospace, monospace" : 'inherit',
          size: isMonoCol ? '13px' : '14px',
          weight: isHeader ? 560 : 400,
          align,
          justify,
          pick: () => this.setState({ modeOverride: 'col', activeCol: cIdx, activeRow: rIdx, moreOpen: false, feedback: '' })
        };
      });

      return {
        minH: rIdx === 0 ? '42px' : '58px',
        bottomRule: rIdx < rowCount - 1 ? ('1px solid ' + pal.borderCol) : '0',
        rowRing: isRowSelected ? ('inset 0 0 0 1.5px ' + pal.accent) : 'none',
        cells
      };
    });

    const curAlign = this.state.colAligns[activeCol] || 'left';
    const alignDefs = [
      { id: 'left', aria: '左对齐', path: 'M2.5 4h11M2.5 8h7.5M2.5 12h9.5' },
      { id: 'center', aria: '居中对齐', path: 'M2.5 4h11M4.5 8h7M3.5 12h9' },
      { id: 'right', aria: '右对齐', path: 'M2.5 4h11M6 8h7.5M4 12h9.5' }
    ];
    const alignBtns = alignDefs.map((a) => {
      const on = curAlign === a.id;
      return {
        aria: a.aria,
        path: a.path,
        bg: on ? pal.selectedBg : 'transparent',
        ring: on ? ('inset 0 0 0 1px ' + pal.accent) : 'none',
        fg: on ? pal.textPrimary : pal.textSecondary,
        pick: () => {
          if (mode === 'all') {
            this.setState({ colAligns: rows[0].map(() => a.id), feedback: '已将全表设为' + a.aria });
          } else {
            const next = this.state.colAligns.slice();
            next[activeCol] = a.id;
            this.setState({ colAligns: next, feedback: '已将当前列设为' + a.aria });
          }
        }
      };
    });

    const activeTint = mode === 'row' ? (this.state.rowTints[activeRow] || 'none') : (this.state.colTints[activeCol] || 'none');
    const swatchDefs = [
      { id: 'none', aria: '无底色', fill: pal.paperBg },
      { id: 'slate', aria: '石墨灰底色', fill: isDark ? '#3a3f47' : '#dfe4ec' },
      { id: 'ocean', aria: 'Ocean 海蓝底色', fill: isDark ? '#314972' : '#c9d8f3' },
      { id: 'emerald', aria: '翠绿标记底色', fill: isDark ? '#275340' : '#bce6d1' }
    ];
    const tintSwatches = swatchDefs.map((sw) => {
      const on = activeTint === sw.id;
      return {
        aria: sw.aria,
        fill: sw.fill,
        border: on ? pal.accent : pal.btnBorder,
        ring: on ? ('0 0 0 2px ' + pal.accent) : 'none',
        pick: () => {
          if (mode === 'row') {
            const next = this.state.rowTints.slice();
            next[activeRow] = sw.id;
            this.setState({ rowTints: next, feedback: '已标记第 ' + activeRow + ' 行底色' });
          } else {
            const next = this.state.colTints.slice();
            next[activeCol] = sw.id;
            this.setState({ colTints: next, feedback: '已标记第 ' + (activeCol + 1) + ' 列底色' });
          }
        }
      };
    });

    let selectionBadge = '第 ' + (activeCol + 1) + ' 列 · ' + (rows[0][activeCol] || '新列');
    let beforeBtnLabel = '左插列';
    let afterBtnLabel = '右插列';
    let deleteAria = '删除当前选中列';
    if (mode === 'row') {
      selectionBadge = activeRow === 0 ? '表头行' : ('第 ' + activeRow + ' 行');
      beforeBtnLabel = '上插行';
      afterBtnLabel = '下插行';
      deleteAria = '删除当前选中行';
    } else if (mode === 'all') {
      selectionBadge = '全表 ' + rowCount + '×' + colCount;
      beforeBtnLabel = '加一行';
      afterBtnLabel = '加一列';
      deleteAria = '删除整张表格';
    }

    const defaultHints = {
      col: '飞书分段导轨：点击顶轨任意段一键框选整列，上方就地浮现单层扁平工具条，零二级菜单直达高频功能',
      row: '点击左轨任意段框选整行，浮动工具条自动切换为上插行 / 下插行 / 行底色与删除',
      all: '点击左上角 16×16 交汇方块一键全选整表边框，统一设置对齐、表头冻结、复制与导出',
      seam: '悬停导轨段缝隙直接弹出 + 锚点与实时列宽标尺（196px），指哪插哪、拖拽调宽'
    };

    const allOn = mode === 'all';

    return {
      ...pal,
      themeBtnLabel: isDark ? '切换浅色' : '切换深色',
      toggleTheme: () => this.setState({ themeOverride: isDark ? 'light' : 'dark' }),
      modeTabs,
      statusHint: this.state.feedback || defaultHints[mode],
      showFloatingBar: mode !== 'seam',
      selectionBadge,
      beforeBtnLabel,
      afterBtnLabel,
      insertBefore: () => {
        if (mode === 'row') this.insertRowAt(Math.max(1, activeRow));
        else if (mode === 'all') this.insertRowAt(rowCount);
        else this.insertColAt(activeCol);
      },
      insertAfter: () => {
        if (mode === 'row') this.insertRowAt(activeRow + 1);
        else if (mode === 'all') this.insertColAt(colCount);
        else this.insertColAt(activeCol + 1);
      },
      alignBtns,
      sortLabel: this.state.sortAsc ? '升序' : '降序',
      sortSelectedCol: () => {
        const head = rows[0];
        const body = rows.slice(1).sort((a, b) => {
          const va = String(a[activeCol] || '');
          const vb = String(b[activeCol] || '');
          return this.state.sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        this.setState({ rows: [head, ...body], sortAsc: !this.state.sortAsc, feedback: '已按「' + rows[0][activeCol] + '」重排' });
      },
      freezeBg: this.state.freezeHeader ? pal.selectedBg : 'transparent',
      freezeRing: this.state.freezeHeader ? ('inset 0 0 0 1px ' + pal.accent) : 'none',
      freezeFg: this.state.freezeHeader ? pal.textPrimary : pal.textSecondary,
      toggleHeaderFreeze: () => this.setState({ freezeHeader: !this.state.freezeHeader }),
      tintSwatches,
      copySelection: () => this.setState({ feedback: '已将当前选区复制为 Markdown 与 TSV' }),
      deleteAria,
      deleteSelection: () => {
        if (mode === 'col' && colCount > 2) {
          const next = rows.map((r) => r.filter((_, ci) => ci !== activeCol));
          this.setState({ rows: next, activeCol: Math.max(0, activeCol - 1), feedback: '已删除选中列' });
        } else if (mode === 'row' && rowCount > 2) {
          const idxToDel = Math.max(1, activeRow);
          const next = rows.filter((_, ri) => ri !== idxToDel);
          this.setState({ rows: next, activeRow: Math.max(1, idxToDel - 1), feedback: '已删除选中行' });
        } else {
          this.setState({ feedback: '已触发整表删除确认（演示保留示例数据）' });
        }
      },
      moreOpen: this.state.moreOpen,
      moreBtnBg: this.state.moreOpen ? pal.selectedBg : 'transparent',
      toggleMorePop: () => this.setState({ moreOpen: !this.state.moreOpen }),
      autoFitCols: () => this.setState({ moreOpen: false, feedback: '已按最长文本自动适配列宽' }),
      clearSelectedCells: () => {
        const next = rows.map((r, ri) => r.map((c, ci) => {
          if (ri === 0) return c;
          if (mode === 'all') return '—';
          if (mode === 'row' && ri === activeRow) return '—';
          if (mode === 'col' && ci === activeCol) return '—';
          return c;
        }));
        this.setState({ rows: next, moreOpen: false, feedback: '已清空选区单元格内容' });
      },
      exportCSV: () => this.setState({ moreOpen: false, feedback: '已生成 CSV 导出预览' }),
      selectAllTable: () => this.setState({ modeOverride: 'all', moreOpen: false, feedback: '' }),
      cornerBg: allOn ? pal.solidAccentBg : pal.railBg,
      cornerFg: allOn ? pal.solidAccentFg : pal.textSecondary,
      cornerBorder: allOn ? pal.accent : pal.borderCol,
      colRails,
      rowRails,
      outerTableBorder: allOn ? ('1.5px solid ' + pal.accent) : ('1px solid ' + pal.borderCol),
      outerTableRing: allOn ? ('0 0 0 2px ' + (isDark ? 'rgba(119,157,232,0.22)' : 'rgba(84,125,208,0.20)')) : 'none',
      tableRows,
      isSeamMode: mode === 'seam',
      insertSeamCol: () => this.insertColAt(2),
      insertSeamRow: () => this.insertRowAt(2),
      appendCol: () => this.insertColAt(colCount),
      appendRow: () => this.insertRowAt(rowCount)
    };
  }

  insertColAt(idx) {
    const rows = this.state.rows;
    if (rows[0].length >= 8) {
      this.setState({ feedback: '演示画板最多保留 8 列' });
      return;
    }
    const next = rows.map((r, ri) => {
      const val = ri === 0 ? '新列' : '—';
      return r.slice(0, idx).concat([val], r.slice(idx));
    });
    const aligns = this.state.colAligns.slice(0, idx).concat(['left'], this.state.colAligns.slice(idx));
    const tints = this.state.colTints.slice(0, idx).concat(['none'], this.state.colTints.slice(idx));
    this.setState({ rows: next, colAligns: aligns, colTints: tints, modeOverride: 'col', activeCol: idx, moreOpen: false, feedback: '已在导轨第 ' + (idx + 1) + ' 列位置插入新列' });
  }

  insertRowAt(idx) {
    const rows = this.state.rows;
    if (rows.length >= 8) {
      this.setState({ feedback: '演示画板最多保留 8 行' });
      return;
    }
    const colCount = rows[0].length;
    const emptyRow = Array.from({ length: colCount }, (_, ci) => (ci === 0 ? String(rows.length) : (ci === 4 ? '2026-10-15' : '—')));
    const next = rows.slice(0, idx).concat([emptyRow], rows.slice(idx));
    const rTints = this.state.rowTints.slice(0, idx).concat(['none'], this.state.rowTints.slice(idx));
    this.setState({ rows: next, rowTints: rTints, modeOverride: 'row', activeRow: idx, moreOpen: false, feedback: '已在导轨第 ' + idx + ' 行位置插入新行' });
  }
}
</script>
