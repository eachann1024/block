<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 A · 紧凑汇总模态卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #547dd0; outline-offset: 1px; }
</style>
</helmet>

<div style="{{rootStyle}}">
  <div style="{{dialogStyle}}">
    <div style="{{headerStyle}}">
      <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1">
        <div style="{{appIconBoxStyle}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="4"></rect>
            <path d="M12 8v8"></path>
            <path d="M8.5 11.5L12 8l3.5 3.5"></path>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
            <h1 style="{{titleStyle}}">{{titleText}}</h1>
            <span style="{{bundlePillStyle}}">{{bundleText}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px">
            <span style="{{versionTextStyle}}">v1.0.379 → v1.0.385</span>
            <span style="{{dotSepStyle}}"></span>
            <span style="{{metaTextStyle}}">{{releaseDateText}}</span>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0">
        <button type="button" onClick="{{toggleLang}}" style="{{langBtnStyle}}">{{langLabel}}</button>
        <button type="button" aria-label="{{closeLabel}}" onClick="{{handleLater}}" style="{{closeBtnStyle}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
    </div>

    <div style="{{toolbarStyle}}">
      <div style="{{segTrackStyle}}">
        <button type="button" onClick="{{pickGrouped}}" style="{{groupedBtnStyle}}">{{groupedLabel}}</button>
        <button type="button" onClick="{{pickVersions}}" style="{{versionsBtnStyle}}">{{versionsLabel}}</button>
      </div>

      <div style="display: flex; align-items: center; gap: 6px">
        <div style="{{segTrackStyle}}">
          <sc-for list="{{sources}}" as="src" hint-placeholder-count="3">
            <button type="button" onClick="{{src.pick}}" style="{{src.btnStyle}}">{{src.label}}</button>
          </sc-for>
        </div>
        <span style="{{pingStyle}}">{{activePing}}</span>
      </div>
    </div>

    <div style="{{bodyScrollStyle}}">
      <sc-if value="{{isGrouped}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <sc-for list="{{groupedSections}}" as="sec" hint-placeholder-count="3">
            <div style="{{sectionCardStyle}}">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px">
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="{{sec.badgeStyle}}">{{sec.title}}</span>
                </div>
                <span style="{{sec.countStyle}}">{{sec.countText}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{sec.items}}" as="item" hint-placeholder-count="3">
                  <div style="display: flex; align-items: flex-start; gap: 10px">
                    <span style="{{itemBulletStyle}}"></span>
                    <span style="{{itemTextStyle}}">{{item.text}}</span>
                    <span style="{{itemVerTagStyle}}">{{item.ver}}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{isVersions}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{versionItems}}" as="ver" hint-placeholder-count="4">
            <div style="{{sectionCardStyle}}">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px">
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="{{ver.verCodeStyle}}">{{ver.version}}</span>
                  <sc-if value="{{ver.isLatest}}" hint-placeholder-val="{{ true }}">
                    <span style="{{latestPillStyle}}">{{latestText}}</span>
                  </sc-if>
                </div>
                <span style="{{ver.dateStyle}}">{{ver.date}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <sc-for list="{{ver.notes}}" as="note" hint-placeholder-count="2">
                  <div style="display: flex; align-items: flex-start; gap: 10px">
                    <span style="{{itemBulletStyle}}"></span>
                    <span style="{{itemTextStyle}}">{{note.text}}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="{{footerStyle}}">
      <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%">
          <span style="{{footerInfoStyle}}">{{idleInfoText}}</span>
          <div style="display: flex; align-items: center; gap: 8px">
            <button type="button" onClick="{{handleLater}}" style="{{secondaryBtnStyle}}">{{laterLabel}}</button>
            <button type="button" onClick="{{startDownload}}" style="{{primaryBtnStyle}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 4v11"></path>
                <path d="M7.5 11.5L12 16l4.5-4.5"></path>
                <path d="M5 20h14"></path>
              </svg>
              <span>{{updateNowLabel}}</span>
            </button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isDownloading}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="{{downloadingTextStyle}}">{{downloadingStatus}}</span>
              <span style="{{speedTextStyle}}">{{speedText}}</span>
            </div>
            <button type="button" onClick="{{cancelDownload}}" style="{{secondaryCompactBtnStyle}}">{{cancelLabel}}</button>
          </div>
          <div style="{{progressTrackStyle}}">
            <div style="{{progressFillStyle}}"></div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%">
          <div style="display: flex; align-items: center; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{successColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M8.5 12.5l2.5 2.5 4.5-5"></path>
            </svg>
            <span style="{{readyTextStyle}}">{{readyInfoText}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <button type="button" onClick="{{handleLater}}" style="{{secondaryBtnStyle}}">{{laterLabel}}</button>
            <button type="button" onClick="{{triggerRestart}}" style="{{primaryBtnStyle}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"></path>
              </svg>
              <span>{{restartUpdateLabel}}</span>
            </button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isRestarting}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%">
          <div style="display: flex; align-items: center; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 3a9 9 0 1 0 9 9"></path>
            </svg>
            <span style="{{readyTextStyle}}">{{restartingText}}</span>
          </div>
          <button type="button" onClick="{{resetDemo}}" style="{{secondaryBtnStyle}}">{{resetLabel}}</button>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"initialStage":{"editor":"enum","options":["idle","downloading","ready"],"default":"idle"},"$preview":{"width":720,"height":660}}'>

  constructor(props) {
    super(props);
    var stage = props.initialStage || 'idle';
    this.state = {
      lang: 'zh',
      viewMode: 'grouped',
      source: 'auto',
      stage: stage,
      progress: stage === 'downloading' ? 58 : (stage === 'ready' ? 100 : 0),
      dismissedCount: 0
    };
    this._timer = null;
  }

  componentDidUpdate(prevProps) {
    if (prevProps.initialStage !== this.props.initialStage) {
      this._stopTimer();
      var nextStage = this.props.initialStage || 'idle';
      this.setState({
        stage: nextStage,
        progress: nextStage === 'downloading' ? 58 : (nextStage === 'ready' ? 100 : 0)
      });
    }
  }

  componentWillUnmount() {
    this._stopTimer();
  }

  _stopTimer() {
    if (this._timer) {
      clearInterval(this._timer);
      this._timer = null;
    }
  }

  _beginDownload() {
    this._stopTimer();
    this.setState({ stage: 'downloading', progress: 12 });
    var self = this;
    this._timer = setInterval(function () {
      var next = self.state.progress + 14;
      if (next >= 100) {
        self._stopTimer();
        self.setState({ progress: 100, stage: 'ready' });
      } else {
        self.setState({ progress: next });
      }
    }, 220);
  }

      shadow: '0 2px 6px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.14)'

    var sourceDefs = [
      { id: 'auto', zh: '自动优选', en: 'Auto', pingZh: '42 ms · 镜像优先', pingEn: '42 ms · Mirror' },
      { id: 'mirror', zh: '国内镜像', en: 'CN Mirror', pingZh: '38 ms · 稳定节点', pingEn: '38 ms · Fast CDN' },
      { id: 'github', zh: 'GitHub', en: 'GitHub', pingZh: '186 ms · 直连', pingEn: '186 ms · Direct' }
    ];

    var activeSrc = sourceDefs[0];

    var versionItems = versionsData.map(function (v) {
      return {

        verCodeStyle: 'font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 560; color: ' + pal.text,

      secondaryBtnStyle: 'height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid ' + pal.btnBorder + '; background: transparent; color: ' + pal.text + '; font-size: 13px; font-weight: 460',
      secondaryCompactBtnStyle: 'height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid ' + pal.btnBorder + '; background: transparent; color: ' + pal.text + '; font-size: 12px; font-weight: 460',
      primaryBtnStyle: 'height: 34px; padding: 0 16px; border-radius: 8px; border: none; background: ' + pal.accent + '; color: ' + pal.accentText + '; font-size: 13px; font-weight: 560; display: inline-flex; align-items: center; gap: 6px',
      downloadingTextStyle: 'font-size: 13px; font-weight: 560; color: ' + pal.text,
      speedTextStyle: 'font-size: 12px; color: ' + pal.textSec,
      progressTrackStyle: 'width: 100%; height: 6px; border-radius: 999px; background: ' + (dark ? '#333333' : '#e4e6ea') + '; overflow: hidden',
      progressFillStyle: 'width: ' + progress + '%; height: 100%; border-radius: 999px; background: ' + pal.accent + '; transition: width 180ms ease',
      readyTextStyle: 'font-size: 13px; font-weight: 560; color: ' + pal.text,

      titleText: zh ? '发现新版本' : 'Update Available',
      bundleText: zh ? '汇总 4 个版本' : '4 Releases',
      releaseDateText: zh ? '更新摘要 · 2026-11-18' : 'Summary · Nov 18, 2026',
      langLabel: zh ? 'English' : '中文',
      closeLabel: zh ? '关闭' : 'Close',
      groupedLabel: zh ? '分类合并' : 'By Category',
      versionsLabel: zh ? '按版本明细' : 'By Version',
      latestText: zh ? '最新' : 'Latest',
      laterLabel: zh ? '稍后提醒' : 'Later',
      updateNowLabel: zh ? '立即更新' : 'Update Now',
      cancelLabel: zh ? '取消' : 'Cancel',
      restartUpdateLabel: zh ? '重启并更新' : 'Restart & Update',
      resetLabel: zh ? '重置演示' : 'Reset Demo',
      downloadingStatus: (zh ? '正在下载 v1.0.385 · ' : 'Downloading v1.0.385 · ') + progress + '%',
      speedText: speedVal,
      readyInfoText: zh ? 'v1.0.385 已下载就绪，重启后完成替换' : 'v1.0.385 ready to install on restart',
      restartingText: zh ? '正在重启 Block 并应用更新…' : 'Restarting Block to apply update…',
      idleInfoText: idleInfoText,

      activePing: zh ? activeSrc.pingZh : activeSrc.pingEn,
      sources: sources,
      groupedSections: groupedSections,
      versionItems: versionItems,
      isGrouped: isGrouped,
      isVersions: isVersions,
      isIdle: stage === 'idle',
      isDownloading: stage === 'downloading',
      isReady: stage === 'ready',
      isRestarting: stage === 'restarting',

      toggleLang: function () { self.setState({ lang: zh ? 'en' : 'zh' }); },
      pickGrouped: function () { self.setState({ viewMode: 'grouped' }); },
      pickVersions: function () { self.setState({ viewMode: 'versions' }); },
      startDownload: function () { self._beginDownload(); },
      cancelDownload: function () {
        self._stopTimer();
        self.setState({ stage: 'idle', progress: 0 });
      },
      triggerRestart: function () {
        self._stopTimer();
        self.setState({ stage: 'restarting' });
      },
      resetDemo: function () {
        self._stopTimer();
        self.setState({ stage: 'idle', progress: 0 });
      },
      handleLater: function () {
        self.setState({ dismissedCount: self.state.dismissedCount + 1 });
      }
    };
  }
}
</script>
</body>
</html>
