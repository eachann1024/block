<style>
body{margin:0}
@keyframes trace{0%{stroke-dashoffset:64}45%{stroke-dashoffset:0}70%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
@keyframes charge{0%,40%{opacity:0}55%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes halo{0%,40%{opacity:0;transform:scale(.8)}58%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.a-trace{stroke-dasharray:64;animation:trace 2.4s cubic-bezier(.6,0,.3,1) infinite}
.a-fill{animation:charge 2.4s ease-in-out infinite}
.a-halo{transform-origin:12px 12px;animation:halo 2.4s ease-out infinite}
</style>
</helmet>
<div style="width: 520px; height: 360px; box-sizing: border-box; background: #1c1d20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; font-family: Inter, system-ui, sans-serif">

<path class="a-fill" d="M13.5 2 L5 13.5 H11 L10 22 L19 9.5 H13 Z" fill="#5b8dff"></path>
