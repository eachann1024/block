<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>速记小窗 · 方案 B · 三槽圆点（Shift + 滚轮切换）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#3559a8}a:hover{color:#233f7d}
button{font-family:inherit}
.ib-close{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;padding:0;cursor:pointer;flex:none;transition:background-color .14s ease,color .14s ease}
.ib-close:hover{background:#e81123;color:#ffffff}
.ib-save{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;padding:0;cursor:pointer;flex:none;transition:background-color .14s ease,color .14s ease}
.ib-save:hover{background:rgba(128,128,128,0.12)}
.dot-btn{width:22px;height:24px;border:0;background:transparent;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div onWheel="{{onWheel}}" style="width:440px;height:520px;box-sizing:border-box;display:flex;flex-direction:column;background:{{paperBg}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:{{textPrimary}};font-size:16px;line-height:24px;overflow:hidden;border:1px solid {{borderCol}};border-radius:14px;-webkit-font-smoothing:antialiased">

<header style="height:44px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px 0 16px;box-sizing:border-box">
<div style="display:flex;align-items:center">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none">
<span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
<span style="width:12px;height:12px;border-radius:6px;background:{{dotMuted}}"></span>
<span style="width:12px;height:12px;border-radius:6px;background:{{dotMuted}}"></span>
</div>
</sc-if>
</div>

<nav aria-label="切换速记便签（支持 Shift + 上下滚轮）" title="点击或按住 Shift 上下滚动切换便签" style="display:flex;align-items:center;gap:2px">
<button type="button" class="dot-btn" onClick="{{pick1}}" aria-label="便签 1" aria-pressed="{{on1}}">
<span style="width:{{w1}};height:6px;border-radius:999px;background:{{bg1}};transition:width .16s ease,background-color .16s ease"></span>
</button>
<button type="button" class="dot-btn" onClick="{{pick2}}" aria-label="便签 2" aria-pressed="{{on2}}">
<span style="width:{{w2}};height:6px;border-radius:999px;background:{{bg2}};transition:width .16s ease,background-color .16s ease"></span>
</button>
<button type="button" class="dot-btn" onClick="{{pick3}}" aria-label="便签 3" aria-pressed="{{on3}}">
<span style="width:{{w3}};height:6px;border-radius:999px;background:{{bg3}};transition:width .16s ease,background-color .16s ease"></span>
</button>
</nav>

<div style="display:flex;align-items:center;justify-content:flex-end;gap:4px">
<button type="button" class="ib-save" aria-label="存入正式笔记" title="存入正式笔记" style="color:{{iconCol}}">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M9.5 2H4.2C3.54 2 3 2.54 3 3.2v9.6c0 .66.54 1.2 1.2 1.2h7.6c.66 0 1.2-.54 1.2-1.2V5.5L9.5 2z"></path>
<path d="M9.2 2.2v3.3h3.3"></path>
<path d="M6 9.3l1.5 1.5L10.3 8" stroke="{{accent}}" stroke-width="1.5"></path>
</svg>
</button>
<sc-if value="{{isWin}}" hint-placeholder-val="{{false}}">
<button type="button" class="ib-close" aria-label="隐藏速记" style="color:{{iconCol}}">
<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg>
</button>
</sc-if>
</div>
</header>

<main style="flex:1;min-height:0;overflow:hidden;padding:12px 28px 28px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
<sc-if value="{{on1}}" hint-placeholder-val="{{true}}">
<p style="margin:0;font-size:16px;line-height:24px;color:{{textPrimary}}">周五回看只记录偏差，不复述进度。</p>
<p style="margin:0;font-size:16px;line-height:24px;color:{{textPrimary}}">右上角可一键存入笔记本，默认隐藏滚动条且不会唤醒已隐藏的主窗口。</p>
<ul style="margin:0;padding-left:20px;font-size:16px;line-height:24px;color:{{textPrimary}};display:flex;flex-direction:column;gap:4px">
<li>按住 Shift 上下滚动滚轮，或点击圆点切换 3 个便签</li>
<li>输入 / 或 、 紧贴当前行弹出命令菜单</li>
</ul>
<p style="margin:0;font-size:16px;line-height:24px;color:{{textPrimary}}">明天确认一下签名证书的续期时间<span aria-hidden="true" style="display:inline-block;width:1.5px;height:18px;background:{{accent}};vertical-align:-3px;margin-left:2px;border-radius:1px"></span></p>
</sc-if>

<sc-if value="{{on2}}" hint-placeholder-val="{{false}}">
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">下个版本只保留最高频使用的快捷入口。</p>
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">把所有次要说明收进设置页，保持编辑界面绝对干净<span aria-hidden="true" style="display:inline-block;width:2px;height:19px;background:{{accent}};vertical-align:-4px;margin-left:2px;border-radius:1px"></span></p>
</sc-if>

<sc-if value="{{on3}}" hint-placeholder-val="{{false}}">
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">书单备忘：《设计中的设计》《网格系统与版式设计》<span aria-hidden="true" style="display:inline-block;width:2px;height:19px;background:{{accent}};vertical-align:-4px;margin-left:2px;border-radius:1px"></span></p>
</sc-if>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","default":"macOS","options":["macOS","Windows / Linux"],"label":"系统平台"},"theme":{"editor":"enum","default":"浅色","options":["浅色","深色"],"label":"外观主题"},"$preview":{"width":440,"height":520}}'>
class Component extends DCLogic {
constructor() {
super();
this.state = { slot: 1 };
this._lastWheel = 0;
}
renderVals() {
const isWin = this.props.platform === 'Windows / Linux';
const isMac = !isWin;
const dark = this.props.theme === '深色';
const s = this.state.slot || 1;
const accent = dark ? '#6f96ec' : '#3559a8';
const idleDot = dark ? '#384152' : '#c6cfd9';
return {
isMac,
isWin,
on1: s === 1,
on2: s === 2,
on3: s === 3,
w1: s === 1 ? '18px' : '6px',
w2: s === 2 ? '18px' : '6px',
w3: s === 3 ? '18px' : '6px',
bg1: s === 1 ? accent : idleDot,
bg2: s === 2 ? accent : idleDot,
bg3: s === 3 ? accent : idleDot,
paperBg: dark ? '#161920' : '#ffffff',
borderCol: dark ? '#2a303c' : '#dcdcdc',
textPrimary: dark ? '#eef2f8' : '#181c23',
iconCol: dark ? '#98a4b8' : '#475467',
dotMuted: dark ? '#343b48' : '#dcdcdc',
accent,
pick1: () => this.setState({ slot: 1 }),
pick2: () => this.setState({ slot: 2 }),
pick3: () => this.setState({ slot: 3 }),
onWheel: (e) => {
if (!e || !e.shiftKey) return;
if (e.preventDefault) e.preventDefault();
const now = Date.now();
if (now - this._lastWheel < 140) return;
const raw = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
if (Math.abs(raw) < 2) return;
this._lastWheel = now;
const dir = raw > 0 ? 1 : -1;
const next = ((s - 1 + dir + 3) % 3) + 1;
this.setState({ slot: next });
}
};
}
}
</script>
</body>
</html>
