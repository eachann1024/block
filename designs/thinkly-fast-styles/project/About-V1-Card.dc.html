<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>关于 Block · 方案 A · 居中名片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400..500&amp;display=swap">
<style>
body{margin:0}
a{color:#3d63b0}a:hover{color:#2f4f92}
.lk{position:relative;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;text-decoration:none;cursor:pointer;background:var(--pill-bg);border:1px solid var(--pill-bd);box-shadow:0 2px 0 var(--rim-idle);transition:transform .2s cubic-bezier(.16,1,.3,1),background-color .18s ease,border-color .18s ease,box-shadow .2s cubic-bezier(.16,1,.3,1)}
.lk:hover{transform:translateY(-2px);background:var(--hover);border-color:var(--accent);box-shadow:0 4px 0 var(--rim),0 10px 20px var(--glow)}
.lk:active{transform:translateY(0);box-shadow:0 1px 0 var(--rim)}
.lk-arrow{transition:transform .2s cubic-bezier(.16,1,.3,1),color .18s ease}
.lk:hover .lk-arrow{transform:translate(2px,-2px);color:var(--accent)}
.bubbles{position:absolute;left:28px;top:0;right:28px;height:0;pointer-events:none}
.b{position:absolute;border-radius:999px;background:var(--bubble-bg);border:1px solid var(--bubble-bd);opacity:0;transform:translateY(6px) scale(.55);transition:transform .38s cubic-bezier(.16,1,.3,1),opacity .26s ease}
.b1{width:10px;height:10px;left:18px;top:-11px;transition-delay:0s}
.b2{width:18px;height:18px;left:24px;top:-18px;transition-delay:.03s}
.b3{width:11px;height:11px;left:36px;top:-9px;transition-delay:.06s}
.b4{width:12px;height:12px;left:54px;top:-15px;transition-delay:.04s}
.b5{width:9px;height:9px;right:34px;top:-12px;transition-delay:.07s}
.lk:hover .b{opacity:1;transform:translateY(-5px) scale(1)}
.btn{height:38px;padding:0 16px;border-radius:10px;font:inherit;font-size:14px;font-weight:460;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.btn:hover{background:var(--hover);border-color:var(--accent)}
</style>
</helmet>
<div style="width:640px;height:560px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:{{t.backdrop}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{t.text}};--hover:{{t.hover}};--accent:{{t.accent}};--pill-bg:{{t.pillBg}};--pill-bd:{{t.btn}};--rim-idle:{{t.rimIdle}};--rim:{{t.rim}};--glow:{{t.glow}};--bubble-bg:{{t.bubbleBg}};--bubble-bd:{{t.bubbleBd}}">
<section aria-labelledby="about-title" style="width:368px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 24px 22px;background:{{t.menu}};border:1px solid {{t.border}};border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,0.12)">
<img src="/_blob/6768a211187044ad08d09ce47a61554d" alt="" style="width:84px;height:84px">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
<h1 id="about-title" style="margin:0;font-size:22px;line-height:30px;font-weight:560">Block</h1>
<p style="margin:0;color:{{t.sub}};font-family:'JetBrains Mono',Menlo,monospace">{{s.version}}</p>
<p style="margin:0;color:{{t.sub}}">{{s.author}}</p>
</div>
<nav aria-label="{{s.links}}" style="width:100%;display:flex;flex-direction:column;gap:12px;border-top:1px solid {{t.border}};padding-top:16px">
<a class="lk" href="https://github.com/eachann1024" target="_blank" rel="noopener noreferrer" style="color:{{t.text}}">
<span class="bubbles" aria-hidden="true"><span class="b b1"></span><span class="b b2"></span><span class="b b3"></span><span class="b b4"></span><span class="b b5"></span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
<span style="flex:1;font-weight:460">{{s.profile}}</span>
<span style="color:{{t.sub}};font-family:'JetBrains Mono',Menlo,monospace">eachann1024</span>
<svg class="lk-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.sub}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg>
</a>
<a class="lk" href="https://github.com/eachann1024/block" target="_blank" rel="noopener noreferrer" style="color:{{t.text}}">
<span class="bubbles" aria-hidden="true"><span class="b b1"></span><span class="b b2"></span><span class="b b3"></span><span class="b b4"></span><span class="b b5"></span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l-4 3 4 3"></path><path d="M16 9l4 3-4 3"></path><path d="M13.5 7l-3 10"></path></svg>
<span style="flex:1;font-weight:460">{{s.repo}}</span>
<span style="color:{{t.sub}};font-family:'JetBrains Mono',Menlo,monospace">eachann1024/block</span>
<svg class="lk-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.sub}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg>
</a>
</nav>
<button type="button" class="btn" style="align-self:stretch;background:{{t.paper}};color:{{t.text}};border:1px solid {{t.btn}}">{{s.close}}</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["zh","en"],"default":"zh"},"dark":{"editor":"boolean","default":false},"$preview":{"width":640,"height":560}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
const en = (this.props.lang ?? 'zh') === 'en';
const t = dark
? { backdrop:'#111111', menu:'#222222', paper:'#2a2a2a', pillBg:'#262626', text:'#ececec', sub:'#b4b4b4', border:'#383838', btn:'#444444', hover:'#2c3548', accent:'#779de8', rimIdle:'rgba(0,0,0,0.28)', rim:'#476bb5', glow:'rgba(119,157,232,0.22)', bubbleBg:'rgba(119,157,232,0.28)', bubbleBd:'rgba(119,157,232,0.55)' }
: { backdrop:'#d9dadc', menu:'#ffffff', paper:'#ffffff', pillBg:'#f8f9fc', text:'#1f1e1d', sub:'#52514e', border:'#e4e4e4', btn:'#dcdcdc', hover:'#e5edfc', accent:'#547dd0', rimIdle:'rgba(84,125,208,0.12)', rim:'#547dd0', glow:'rgba(84,125,208,0.20)', bubbleBg:'rgba(84,125,208,0.22)', bubbleBd:'rgba(84,125,208,0.45)' };
const s = en
? { version:'Version 1.0.225', author:'Made by eachann', links:'Links', profile:'My Profile', repo:'Project Source', close:'Close' }
: { version:'版本 1.0.225', author:'作者 eachann', links:'链接', profile:'我的主页', repo:'项目源码', close:'关闭' };
return { t, s };
}
}
</script>
</body>
</html>
