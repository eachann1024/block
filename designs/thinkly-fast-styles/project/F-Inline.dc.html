<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button,input{font-family:inherit}
.tb{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;gap:2px;border:0;border-radius:8px;background:transparent;color:#e8eaee;padding:0;cursor:pointer;flex:none}
.tb:hover{background:#3a3e46}
.tb.on{background:#33415c;color:#9dbcf5}
.tb.wide{width:auto;padding:0 6px}
.sep{width:1px;height:20px;background:#454a53;margin:0 4px;flex:none}
.pill{display:inline-flex;align-items:center;gap:2px;padding:4px;background:#26282d;border:1px solid #3a3e46;border-radius:12px;box-shadow:0 10px 30px rgba(20,22,26,.22)}
.sel{background:#d6e3fb;color:#2f5bb7}
.lnk{color:#3d6fd6;text-decoration:none;border-bottom:1px solid #9dbcf5}
.h{position:absolute;width:10px;height:10px;background:#ffffff;border:1.5px solid #547dd0;border-radius:3px;box-sizing:border-box}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#e8eaee;padding:0;cursor:pointer}
.ib:hover{background:#3a3e46}
.cap{font-size:12px;line-height:16px;color:#526071;margin:0 0 8px}
</style>

<div style="width:100%;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;font-size:14px;line-height:20px;overflow:hidden">

<div style="flex:1;text-align:center;font-size:13px;color:#526071">周日行程</div>

<button class="tb" aria-label="删除线"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16M16 6.5A4 3 0 0 0 12 5c-2.5 0-4 1.3-4 3 0 1.2.8 2.2 2.3 2.8M8 17.5c.8 1 2.3 1.5 4 1.5 2.5 0 4-1.3 4-3 0-.6-.2-1.2-.6-1.6"></path></svg></button>

<button class="tb wide" aria-label="文字颜色"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6h1.9a4.6 4.6 0 0 0 4.7-4.7C21 6.6 17 3 12 3z"></path><circle cx="7.5" cy="11" r=".9"></circle><circle cx="10" cy="7" r=".9"></circle><circle cx="15" cy="7" r=".9"></circle></svg><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button class="tb wide" aria-label="列表"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span class="sep" aria-hidden="true"></span>
<button class="tb" aria-label="链接 ⌘⇧K"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></button>
<button class="tb" aria-label="生成图片"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M20.5 16l-5-5-8 8.5"></path></svg></button>
</div>
<p style="margin:10px 0 0;font-size:17px;line-height:1.5">周日 11/1<span class="sel"><strong>5 坐潮汕站 18:23 的 G6315，20:54 到广州南</strong></span>。在广州南换乘 C7777，23:07 到阳江站。</p>
</div></section>

<section aria-label="链接浮层" style="display:flex;gap:8px"><div style="width:44px;flex:none"></div>
<div style="flex:1;min-width:0;max-width:720px">

<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
<div role="toolbar" aria-label="链接操作" class="pill" style="padding:4px 4px 4px 12px">
<span style="font-size:13px;color:#e8eaee;white-space:nowrap">https://m.gmw.cn/2026-10/10/cont…3994.htm</span>
<span class="sep" aria-hidden="true"></span>
<button class="ib" aria-label="打开链接"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button>

<button class="ib" aria-label="移除链接"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l1.3-1.3M19 10l.7-.7a4 4 0 0 0-5.7-5.7L13 4.6M14 10a4 4 0 0 0-5.7 0L7 11.3M5 14l-.7.7a4 4 0 0 0 5.7 5.7L11 19.4M4 4l16 16"></path></svg></button>
</div>
<div class="pill" style="padding:4px 4px 4px 10px;gap:6px">
<label style="display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">链接地址</span><input value="https://m.gmw.cn/2026-10/10/content_3994.htm" style="width:260px;height:28px;border:0;outline:0;border-radius:6px;padding:0 8px;background:#33363c;color:#e8eaee;font-size:13px"></label>
<button style="font:inherit;height:28px;padding:0 10px;border:0;border-radius:7px;background:#547dd0;color:#ffffff;font-size:12px;font-weight:500;cursor:pointer">确定</button>
</div>
</div>
<p style="margin:10px 0 0;font-size:17px;line-height:1.5">出发前再核对一次 <a class="lnk" href="https://m.gmw.cn/">车次时刻表</a>，晚点就改坐 G3815。</p>
</div></section>

<section aria-label="图片缩放" style="display:flex;gap:8px"><div style="width:44px;flex:none"></div>
<div style="flex:1;min-width:0;max-width:720px">
<p class="cap">图片 · 选中后四角拖拽缩放，浮条显示比例；⌘= / ⌘− 步进 10%</p>
<div style="position:relative;width:62%;">
<div role="img" aria-label="[图片：站台照片]" style="height:220px;border-radius:6px;background:#e9edf3;display:flex;align-items:center;justify-content:center;color:#526071;font-size:13px;box-shadow:0 0 0 2px #547dd0">[图片：站台照片]</div>
<span class="h" aria-hidden="true" style="top:-5px;left:-5px"></span>
<span class="h" aria-hidden="true" style="top:-5px;right:-5px"></span>
<span class="h" aria-hidden="true" style="bottom:-5px;left:-5px"></span>
<span class="h" aria-hidden="true" style="bottom:-5px;right:-5px"></span>

<span style="min-width:40px;text-align:center;font-size:12px;color:#e8eaee;font-variant-numeric:tabular-nums">62%</span>

<span class="sep" aria-hidden="true"></span>
<button class="ib" aria-label="原始宽度"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"></path></svg></button>
</div>
</div>
</div></section>

</div>
</main>
</div>
