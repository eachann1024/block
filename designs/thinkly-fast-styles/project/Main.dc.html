<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工作区 · 多标签页与可折叠侧栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button{font-family:inherit}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#526071;padding:0;cursor:pointer;flex:none}
.ib:hover{background:#eef3fc;color:#20242c}
.tab{font:inherit;font-size:13px;line-height:18px;font-weight:460;height:28px;min-width:104px;max-width:196px;flex:0 1 176px;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 10px;border:0;border-radius:6px;background:transparent;color:#526071;cursor:pointer;box-sizing:border-box}
.tab:hover{background:#eef3fc;color:#20242c}
.tab-active{background:#e5edfc;color:#20242c;box-shadow:inset 0 0 0 1px #547dd0}
.tab-close{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:#526071;padding:0;cursor:pointer;flex:none}
.tab-close:hover{background:#d6e3fb;color:#20242c}
.tab-label{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-align:left}
.row{font:inherit;font-size:14px;line-height:20px;font-weight:400;width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#20242c;text-align:left;cursor:pointer;box-sizing:border-box}
.row:hover{background:#eef3fc}
.hbtn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#526071;padding:0;cursor:pointer}
.hbtn:hover{background:#eef3fc;color:#20242c}
.kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;line-height:15px;padding:1px 5px;border-radius:4px;background:#f3f4f6;color:#526071;border:1px solid #e2e5ea}
</style>
</helmet>
<div style="width:100%;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;font-size:14px;line-height:20px;overflow:hidden">

<header style="height:40px;flex:none;display:flex;align-items:center;border-bottom:1px solid #e6e6e6;box-sizing:border-box;background:#f1f1f1">
<div style="width:{{leftHeaderW}};flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 10px 0 16px;border-right:1px solid #e6e6e6;transition:width .16s ease">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<button class="ib" onClick="{{toggleSidebar}}" aria-label="{{toggleTip}}" title="{{toggleTip}} ⌘\" style="margin-left:auto">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M3.75 4.75H9.25V19.25H5.75A2 2 0 0 1 3.75 17.25V6.75A2 2 0 0 1 5.75 4.75Z" fill="#c9d8f3"></path>
<rect x="3.75" y="4.75" width="16.5" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"></rect>
<path d="M9.25 4.75V19.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
<path d="M15.75 9.75L13.25 12L15.75 14.25" stroke="#547dd0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
</sc-if>
<sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">
<path d="M13.5 9.75L16 12L13.5 14.25" stroke="#547dd0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
</sc-if>
</svg>
</button>
</div>

<nav aria-label="已打开标签页" style="flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:4px;padding:0 10px;overflow:hidden">
<div class="tab tab-active" role="tab" aria-selected="true">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#547dd0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z" fill="#c9d8f3" stroke="none"></path><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span class="tab-label">周会 11-03</span>
<button class="tab-close" aria-label="关闭 周会 11-03"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="tab" role="tab" aria-selected="false">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span class="tab-label">产品原则</span>
</div>
<div class="tab" role="tab" aria-selected="false">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span class="tab-label">发布清单</span>
</div>
<button class="ib" aria-label="新建标签页"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</nav>
</header>

<div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">
<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
<aside aria-label="文件列表" style="position:relative;width:260px;flex:none;background:#fafafa;border-right:1px solid #e6e6e6;box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
<div style="padding:12px 12px 8px">
<button onClick="{{toggleVaultMenu}}" style="font:inherit;font-size:13px;font-weight:460;width:100%;height:34px;padding:0 10px;border-radius:8px;background:#ffffff;color:#20242c;border:1px solid #dcdcdc;display:flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z" fill="#c9d8f3" stroke="none"></path><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z"></path></svg>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left">本地笔记</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
<div style="padding:0 12px 8px">
<button style="font:inherit;font-size:13px;width:100%;height:32px;padding:0 10px;border-radius:8px;background:#ffffff;color:#526071;border:1px solid #dcdcdc;display:flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="#c9d8f3" stroke="none"></circle><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.2 4.2"></path></svg>
<span style="flex:1;text-align:left">搜索笔记</span>
<span class="kbd">⇧⌘K</span>
</button>
</div>
<div style="display:flex;align-items:center;gap:2px;padding:4px 12px 6px 20px;font-size:12px;color:#526071">
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">本地笔记</span>
<button class="ib" aria-label="新建笔记" style="width:24px;height:24px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.75H6.75a1.5 1.5 0 0 0-1.5 1.5v13.5a1.5 1.5 0 0 0 1.5 1.5h10.5a1.5 1.5 0 0 0 1.5-1.5V8.5z"></path><path d="M12 10v6M9 13h6" stroke="#547dd0"></path></svg></button>
<button class="ib" aria-label="新建文件夹" style="width:24px;height:24px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z"></path><path d="M12 11v5M9.5 13.5h5" stroke="#547dd0"></path></svg></button>
</div>
<div style="flex:1;min-height:0;overflow:auto;padding:2px 8px 12px;display:flex;flex-direction:column;gap:2px">
<button class="row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z" fill="#c9d8f3" stroke="none"></path><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z"></path></svg>会议记录</button>
<button class="row" aria-pressed="true" style="padding-left:28px;background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0;font-weight:460"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#547dd0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.75h8l4 4V20.25H6z" fill="#c9d8f3" stroke="none"></path><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>周会 11-03</button>
<button class="row" style="padding-left:28px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>需求评审</button>
<button class="row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z" fill="#c9d8f3" stroke="none"></path><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z"></path></svg>归档</button>
<button class="row"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>产品原则</button>
<button class="row"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>发布清单</button>
</div>
<div style="padding:6px 8px;border-top:1px solid #ececec">
<button class="row" style="color:#526071"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#c9d8f3"></circle><circle cx="15" cy="12" r="2" fill="#c9d8f3"></circle><circle cx="10" cy="17" r="2" fill="#c9d8f3"></circle></svg><span style="flex:1">设置</span><span class="kbd">⌘,</span></button>
</div>
</aside>
</sc-if>

<main style="flex:999 1 560px;min-width:0;background:#ffffff;overflow:auto">
<div style="box-sizing:border-box;width:100%;max-width:816px;margin:0 auto;padding:36px 28px 64px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<h1 style="flex:1;min-width:0;max-width:720px;margin:0;font-size:28px;line-height:1.35;font-weight:560;letter-spacing:-0.01em">把周会改成异步</h1>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">上周排了三场同步会，两场结束时没有结论。人到齐，并不等于事情被推进。</p>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none;display:flex;justify-content:flex-end;gap:2px;padding-top:1px">
<button class="hbtn" aria-label="拖动块"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="5" cy="2.5" r="1" fill="#526071"></circle><circle cx="9" cy="2.5" r="1" fill="#526071"></circle><circle cx="5" cy="7" r="1" fill="#526071"></circle><circle cx="9" cy="7" r="1" fill="#526071"></circle><circle cx="5" cy="11.5" r="1" fill="#526071"></circle><circle cx="9" cy="11.5" r="1" fill="#526071"></circle></svg></button>
</div>
<p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">与其等所有人空出同一段时间，不如把状态写在这里：这周要什么、卡在哪、需要谁看一眼。</p>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none;display:flex;justify-content:flex-end;padding-top:1px">
<button class="hbtn" aria-label="添加块"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5;color:#6d7784">输入文字…</p>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<blockquote style="flex:1;min-width:0;max-width:720px;margin:0;padding:2px 0 2px 14px;border-left:2px solid #d5dbe3;font-size:17px;line-height:1.5">会议是例外，不是节奏。一段文字能说清的，不要再约三十分钟。</blockquote>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<h2 style="flex:1;min-width:0;max-width:720px;margin:0;font-size:22px;line-height:1.4;font-weight:560">保留下来的三件事</h2>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<div style="flex:1;min-width:0;max-width:720px;display:flex;flex-direction:column;gap:4px">
<label style="display:flex;align-items:flex-start;gap:8px;font-size:17px;line-height:1.5"><input type="checkbox" checked="checked" aria-label="已完成" style="width:16px;height:16px;margin:5px 0 0;accent-color:#547dd0;flex:none"><span>周一前写好本周目标，一句话即可</span></label>
<label style="display:flex;align-items:flex-start;gap:8px;font-size:17px;line-height:1.5"><input type="checkbox" aria-label="未完成" style="width:16px;height:16px;margin:5px 0 0;accent-color:#547dd0;flex:none"><span>阻塞写在文档里，直接点名负责人</span></label>
<label style="display:flex;align-items:flex-start;gap:8px;font-size:17px;line-height:1.5"><input type="checkbox" aria-label="未完成" style="width:16px;height:16px;margin:5px 0 0;accent-color:#547dd0;flex:none"><span>周五只回看偏差，不复述进度</span></label>
</div>
</div>

</div>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sidebarOpen":{"editor":"boolean","default":true,"label":"展开左侧栏"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
init() {
this.open = null;
}
toggleSidebar() {
const cur = this.open === null ? (this.props.sidebarOpen !== false) : this.open;
this.open = !cur;
this.rerender();
}
toggleVaultMenu() {}
renderVals() {
const isOpen = this.open === null ? (this.props.sidebarOpen !== false) : this.open;
return {
isOpen,
isClosed: !isOpen,
leftHeaderW: isOpen ? '260px' : '106px',
toggleTip: isOpen ? '收起侧栏' : '展开侧栏'
};
}
}
</script>
</body>
</html>
