<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>速记小窗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button,input{font-family:inherit}
.slot{font:inherit;width:26px;height:24px;border:0;border-radius:6px;background:transparent;color:#526071;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.slot:hover{background:#eef3fc;color:#20242c}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#526071;padding:0;cursor:pointer}
.ib:hover{background:#eef3fc;color:#20242c}
.ib-close:hover{background:#e81123;color:#ffffff}
.kbd{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:4px;background:#f1f1f1;border:1px solid #e1e1e1;font-size:11px;color:#526071}
</style>
</helmet>
<div style="width:480px;height:620px;box-sizing:border-box;display:flex;flex-direction:column;background:#ffffff;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;font-size:14px;line-height:20px;overflow:hidden;border:1px solid #dcdcdc;border-radius:12px">

<header style="height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;background:#fafafa;border-bottom:1px solid #ececec">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="display:flex;gap:7px;flex:none"><span style="width:11px;height:11px;border-radius:6px;background:#ff5f57"></span><span style="width:11px;height:11px;border-radius:6px;background:#dcdcdc"></span><span style="width:11px;height:11px;border-radius:6px;background:#dcdcdc"></span></div>
</sc-if>
<nav aria-label="速记槽位" style="display:flex;gap:2px">
<button class="slot" aria-pressed="true" style="background:#e5edfc;color:#20242c;box-shadow:inset 0 0 0 1px #547dd0">1</button>
<button class="slot">2</button>
<button class="slot">3</button>
<button class="slot">4</button>
<button class="slot">5</button>
</nav>
<button style="font:inherit;flex:1;min-width:0;border:0;background:transparent;font-size:13px;font-weight:500;color:#20242c;text-align:center;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" aria-label="重命名槽位">灵感</button>
<button style="font:inherit;height:28px;padding:0 10px;border:1px solid #dcdcdc;border-radius:7px;background:#ffffff;color:#20242c;font-size:12px;font-weight:460;cursor:pointer;display:inline-flex;align-items:center;gap:5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M10 14l2 2 4-4"></path></svg>保存到笔记</button>
<button class="ib" aria-label="使用说明"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6M12 17h.01"></path></svg></button>
<sc-if value="{{isWin}}" hint-placeholder-val="{{false}}">
<button class="ib ib-close" type="button" aria-label="隐藏速记"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg></button>
</sc-if>
</header>

<main style="flex:1;min-height:0;overflow:auto;padding:18px 20px 12px;display:flex;flex-direction:column;gap:10px">
<p style="margin:0;font-size:16px;line-height:1.55">周五回看只记录偏差，不复述进度。</p>
<p style="margin:0;font-size:16px;line-height:1.55">导出图片时默认带日期，标题可关。</p>
<ul style="margin:0;padding-left:22px;font-size:16px;line-height:1.55;display:flex;flex-direction:column;gap:2px">
<li>小窗不显示文字工具栏和拖拽手柄</li>
<li>{{kSlot}} 切换槽位，内容自动保存</li>
</ul>
<p style="margin:0;font-size:16px;line-height:1.55;color:#20242c">明天问一下签名证书的续期时间<span aria-hidden="true" style="display:inline-block;width:2px;height:19px;background:#547dd0;vertical-align:-4px;margin-left:1px"></span></p>
</main>

<footer style="height:32px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid #f0f0f0;font-size:11px;color:#526071">
<span style="display:flex;align-items:center;gap:4px"><span class="kbd">{{kToggle}}</span>呼出 / 隐藏</span>
<span style="display:flex;align-items:center;gap:4px"><span class="kbd">{{kSlot}}</span>切换</span>
<span style="display:flex;align-items:center;gap:4px"><span class="kbd">{{kFind}}</span>查找</span>
<span style="margin-left:auto">已保存</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","default":"macOS","options":["macOS","Windows / Linux"],"label":"系统平台"},"$preview":{"width":480,"height":620}}'>
class Component extends DCLogic {
renderVals() {
const isWin = this.props.platform === 'Windows / Linux';
const isMac = !isWin;
return {
isMac,
isWin,
kToggle: isMac ? '⌥N' : 'Alt+N',
kSlot: isMac ? '⌘1–5' : 'Ctrl+1–5',
kFind: isMac ? '⌘F' : 'Ctrl+F'
};
}
}
</script>
</body>
</html>
