<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>速记小窗 · 方案 A · 纯白素纸</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#3559a8}a:hover{color:#233f7d}
button{font-family:inherit}
.ib-close{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;padding:0;cursor:pointer;flex:none;transition:background-color .14s ease,color .14s ease}
.ib-close:hover{background:#e81123;color:#ffffff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:440px;height:520px;box-sizing:border-box;display:flex;flex-direction:column;background:{{paperBg}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:{{textPrimary}};font-size:16px;line-height:26px;overflow:hidden;border:1px solid {{borderCol}};border-radius:14px;-webkit-font-smoothing:antialiased">

<header style="height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;box-sizing:border-box">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none">
<span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
<span style="width:12px;height:12px;border-radius:6px;background:{{dotMuted}}"></span>
<span style="width:12px;height:12px;border-radius:6px;background:{{dotMuted}}"></span>
</div>
</sc-if>
<sc-if value="{{isWin}}" hint-placeholder-val="{{false}}">
<button type="button" class="ib-close" aria-label="隐藏速记" style="margin-left:auto;color:{{iconCol}}">
<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg>
</button>
</sc-if>
</header>

<main style="flex:1;min-height:0;overflow:auto;padding:12px 28px 28px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">周五回看只记录偏差，不复述进度。</p>
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">小窗与主窗口独立运行，随手记完自动保存，Esc 隐藏。</p>
<ul style="margin:0;padding-left:20px;font-size:16px;line-height:26px;color:{{textPrimary}};display:flex;flex-direction:column;gap:4px">
<li>小窗呼出即写，不放多余状态栏与按钮</li>
<li>独立悬浮面板，不唤醒或干扰已隐藏的主窗口</li>
</ul>
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">明天确认一下签名证书的续期时间<span aria-hidden="true" style="display:inline-block;width:2px;height:19px;background:{{accent}};vertical-align:-4px;margin-left:2px;border-radius:1px"></span></p>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","default":"macOS","options":["macOS","Windows / Linux"],"label":"系统平台"},"theme":{"editor":"enum","default":"浅色","options":["浅色","深色"],"label":"外观主题"},"$preview":{"width":440,"height":520}}'>
class Component extends DCLogic {
renderVals() {
const isWin = this.props.platform === 'Windows / Linux';
const isMac = !isWin;
const dark = this.props.theme === '深色';
return {
isMac,
isWin,
paperBg: dark ? '#161920' : '#ffffff',
borderCol: dark ? '#2a303c' : '#dcdcdc',
textPrimary: dark ? '#eef2f8' : '#181c23',
iconCol: dark ? '#98a4b8' : '#475467',
dotMuted: dark ? '#343b48' : '#dcdcdc',
accent: dark ? '#6f96ec' : '#3559a8'
};
}
}
</script>
</body>
</html>
