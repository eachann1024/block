<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>几何直角</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button{font-family:inherit}
.ico{width:24px;height:24px;display:block;color:#20242c}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px 8px}
.name{font-size:12px;line-height:16px;color:#526071;text-align:center}
.cap{margin:0;font-size:12px;line-height:16px;color:#526071;letter-spacing:.04em}
.row{font:inherit;font-size:13px;line-height:18px;width:100%;height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:2px;background:transparent;color:#20242c;text-align:left;cursor:pointer;box-sizing:border-box}
.row:hover{background:#eef3fc}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:2px;background:transparent;color:#20242c;padding:0;cursor:pointer}
.ib:hover{background:#eef3fc}
.hbtn{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:2px;background:transparent;color:#526071;padding:0;cursor:pointer}
.hbtn:hover{background:#eef3fc;color:#20242c}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;padding:32px 40px 28px;display:flex;flex-direction:column;gap:22px;background:#ffffff;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c">

<header style="display:flex;align-items:baseline;justify-content:space-between;gap:24px">
<div style="display:flex;align-items:baseline;gap:16px">
<h1 style="margin:0;font-size:28px;line-height:36px;font-weight:560;letter-spacing:-0.02em">几何直角</h1>
<p style="margin:0;font-size:14px;line-height:20px;color:#526071">1.75px 线宽，方端与斜接连接，转角取 90°，笔画落在整数网格上。</p>
</div>
<p class="cap">24 × 24 · currentColor</p>
</header>

<div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px 0">

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 8h7l2 2h9v9H3z"></path><path d="M3 8V6h6l1 2"></path></svg>
<span class="name">文件夹</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9h18v10H3z"></path><path d="M3 9V7h6l2 2"></path><path d="M3 13h18"></path></svg>
<span class="name">文件夹展开</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h6M9 17h4"></path></svg>
<span class="name">笔记文件</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 3h7l5 5v6"></path><path d="M13 3v5h5"></path><path d="M14 16h8M18 12v8"></path></svg>
<span class="name">新建笔记</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 8h6l2 2h10v9H3z"></path><path d="M3 8V6h5l1 2"></path><path d="M15 13l2 2 4-4"></path></svg>
<span class="name">选择文件夹</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
<span class="name">展开箭头</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
<span class="name">折叠箭头</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span class="name">加号</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="8" y="4" width="2" height="2"></rect><rect x="14" y="4" width="2" height="2"></rect><rect x="8" y="11" width="2" height="2"></rect><rect x="14" y="11" width="2" height="2"></rect><rect x="8" y="18" width="2" height="2"></rect><rect x="14" y="18" width="2" height="2"></rect></svg>
<span class="name">拖动把手</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M7 19l4-14h2l4 14M8.5 14h7"></path></svg>
<span class="name">加粗</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M14 5l-4 14M10 5h7M7 19h7"></path></svg>
<span class="name">斜体</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 12h12M8 7l-2 10M18 7l-2 10"></path></svg>
<span class="name">删除线</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"></path></svg>
<span class="name">行内代码</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 15l-3 0 0-3 8-8 3 3z"></path><path d="M12 6l3 3"></path><path d="M15 9l3 0 0 3-8 8-3-3z"></path></svg>
<span class="name">链接</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 6h14M5 12h10M5 18h14"></path></svg>
<span class="name">标题</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M8 6h8v12H8z"></path><path d="M8 10h8M11 6v12"></path></svg>
<span class="name">引用</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 6h10M9 12h10M9 18h10"></path><rect x="4" y="5" width="2" height="2" fill="currentColor" stroke="none"></rect><rect x="4" y="11" width="2" height="2" fill="currentColor" stroke="none"></rect><rect x="4" y="17" width="2" height="2" fill="currentColor" stroke="none"></rect></svg>
<span class="name">无序列表</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M10 6h9M10 12h9M10 18h9"></path><path d="M4 8V5h2M4 12h3M5.5 10v5M4 19h3"></path></svg>
<span class="name">有序列表</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="4" y="4" width="16" height="16"></rect><path d="M8 12l3 3 5-6"></path></svg>
<span class="name">待办</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="5" width="18" height="14"></rect><path d="M3 16l6-5 4 3 3-2 5 4"></path><rect x="7" y="8" width="3" height="3" fill="currentColor" stroke="none"></rect></svg>
<span class="name">生成图片</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="6" width="12" height="10"></rect><path d="M15 10h6v8H9"></path><path d="M6 17l2 2 4-4"></path></svg>
<span class="name">选中生成</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="8" y="8" width="12" height="12"></rect><path d="M16 8V4H4v12h4"></path></svg>
<span class="name">复制</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 4v5h8V4"></path><path d="M8 20v-5h8v5"></path></svg>
<span class="name">保存</span>
</div>

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="11" width="2" height="2"></rect><rect x="11" y="11" width="2" height="2"></rect><rect x="18" y="11" width="2" height="2"></rect></svg>
<span class="name">更多</span>
</div>

</div>

<div style="margin-top:auto;display:flex;gap:16px;align-items:stretch">

<section style="flex:1;min-width:0;background:#fafafa;border:1px solid #e6e6e6;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px">
<p class="cap">文件树 · 16px</p>
<div style="display:flex;flex-direction:column;gap:2px">
<button class="row"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9h18v10H3z"></path><path d="M3 9V7h6l2 2"></path><path d="M3 13h18"></path></svg>会议记录</button>
<button class="row" style="padding-left:30px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h6M9 17h4"></path></svg>需求评审</button>
<button class="row" aria-pressed="true" style="padding-left:30px;background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h6M9 17h4"></path></svg>周会 11-03</button>
</div>
</section>

<section style="flex:1.35;min-width:0;background:#ffffff;border:1px solid #e6e6e6;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px">
<p class="cap">选中工具栏 · 16px</p>
<div style="display:flex;align-items:center;gap:2px;padding:4px;border:1px solid #e4e4e4;width:max-content;background:#ffffff">
<button class="ib" aria-label="加粗"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M7 19l4-14h2l4 14M8.5 14h7"></path></svg></button>
<button class="ib" aria-label="斜体"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M14 5l-4 14M10 5h7M7 19h7"></path></svg></button>
<button class="ib" aria-label="删除线"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 12h12M8 7l-2 10M18 7l-2 10"></path></svg></button>
<button class="ib" aria-label="行内代码"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"></path></svg></button>
<button class="ib" aria-label="链接"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 15l-3 0 0-3 8-8 3 3z"></path><path d="M12 6l3 3"></path><path d="M15 9l3 0 0 3-8 8-3-3z"></path></svg></button>
<button class="ib" aria-label="标题"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 6h14M5 12h10M5 18h14"></path></svg></button>
<button class="ib" aria-label="生成图片"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="5" width="18" height="14"></rect><path d="M3 16l6-5 4 3 3-2 5 4"></path><rect x="7" y="8" width="3" height="3" fill="currentColor" stroke="none"></rect></svg></button>
</div>
</section>

<section style="width:220px;flex:none;background:#ffffff;border:1px solid #e6e6e6;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px">
<p class="cap">编辑器把手 · 16px</p>
<div style="display:flex;align-items:center;gap:8px;color:#526071">
<button class="hbtn" aria-label="添加块"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button class="hbtn" aria-label="拖动块"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="8" y="4" width="2" height="2"></rect><rect x="14" y="4" width="2" height="2"></rect><rect x="8" y="11" width="2" height="2"></rect><rect x="14" y="11" width="2" height="2"></rect><rect x="8" y="18" width="2" height="2"></rect><rect x="14" y="18" width="2" height="2"></rect></svg></button>
<span style="font-size:14px;line-height:20px;color:#20242c">段落</span>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

return {};
}
}
</script>
</body>
</html>
