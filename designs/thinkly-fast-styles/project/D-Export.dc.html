<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成图片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #111111; } a:hover { color: #d6501f; }
button:focus-visible, input:focus-visible { outline: 1px solid #d6501f; outline-offset: 1px; }
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 900px; height: 100vh; background: #ececec; display: flex; flex-direction: column; font-family: Inter, 'PingFang SC', 'Hiragino Sans GB', sans-serif; color: #111111; font-variant-numeric: tabular-nums;">
  <header style="height: 40px; flex-shrink: 0; display: flex; align-items: center; background: #ffffff; border-bottom: 1px solid #d9d9d9; box-sizing: border-box;">
    <div style="width: 280px; flex-shrink: 0; height: 100%; box-sizing: border-box; border-right: 1px solid #d9d9d9; display: flex; align-items: center; gap: 8px; padding: 0 14px;">
      <div style="display: flex; gap: 6px; align-items: center;" aria-hidden="true">
        <span style="width: 12px; height: 12px; background: #ff5f57; border: 1px solid #e0443e; display: block;"></span>
        <span style="width: 12px; height: 12px; background: #febc2e; border: 1px solid #d9a322; display: block;"></span>
        <span style="width: 12px; height: 12px; background: #28c840; border: 1px solid #1aab31; display: block;"></span>
      </div>
      <span style="margin-left: 8px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #555555; font-weight: 600;">Thinkly</span>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <a href="D-Workspace.dc.html" style="font-size: 12px; font-weight: 600; text-decoration: none; letter-spacing: 0.04em;">返回编辑</a>
        <span style="color: #d9d9d9;">/</span>
        <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #555555; font-weight: 600;">Export</span>
        <span style="font-size: 13px; font-weight: 600;">生成图片</span>
      </div>
      <span style="font-size: 11px; color: #555555; letter-spacing: 0.06em; flex-shrink: 0;">选中生成 · 标准宽度</span>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap;">
    <section style="flex: 999 1 560px; min-width: 0; background: #ececec; display: flex; flex-direction: column; min-height: 420px; border-right: 1px solid #d9d9d9; box-sizing: border-box;">
      <div style="height: 32px; flex-shrink: 0; border-bottom: 1px solid #d9d9d9; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
        <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: #555555;">Preview</span>
        <span style="font-size: 11px; color: #555555; font-variant-numeric: tabular-nums;">720 × 248 · PNG</span>
      </div>
      <div style="flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; padding: 40px 24px;">
        <figure style="margin: 0; width: 100%; max-width: 640px; background: #ffffff; border: 1px solid #111111; box-sizing: border-box;">
          <div style="height: 28px; border-bottom: 1px solid #d9d9d9; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
            <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: #555555;">Thinkly</span>
            <span style="font-size: 10px; letter-spacing: 0.08em; color: #555555;">选中块</span>
          </div>
          <div style="padding: 28px 32px 24px;">
            <p style="margin: 0 0 8px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #555555; font-weight: 600;">快速编辑器的块约定</p>
            <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #111111; border-left: 2px solid #d6501f; padding-left: 12px;">块是最小的编辑单元：标题、段落、列表、引用和待办。悬停在块上时，左侧出现把手：拖动点阵和加号。</p>
          </div>
          <div style="height: 28px; border-top: 1px solid #d9d9d9; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
            <span style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #555555;">Thinkly Fast</span>
            <span style="font-size: 10px; color: #555555; font-variant-numeric: tabular-nums;">720</span>
          </div>
        </figure>
      </div>
    </section>

    <aside style="width: 320px; flex: 0 1 320px; background: #ffffff; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box;">
      <div style="height: 32px; flex-shrink: 0; border-bottom: 1px solid #d9d9d9; display: flex; align-items: center; padding: 0 16px;">
        <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: #555555;">Options</span>
      </div>

      <div style="padding: 16px; display: flex; flex-direction: column; gap: 18px; border-bottom: 1px solid #d9d9d9;">
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
          <legend style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: #555555; padding: 0; margin-bottom: 4px;">范围</legend>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid #d9d9d9;">
            <label style="height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; border-right: 1px solid #d9d9d9; font-size: 13px; cursor: pointer; color: #555555;">
              <input type="radio" name="range" style="accent-color: #d6501f; margin: 0;">
              整篇
            </label>
            <label style="height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; background: #ffffff; box-shadow: inset 0 -2px 0 #d6501f;">
              <input type="radio" name="range" checked="checked" style="accent-color: #d6501f; margin: 0;">
              选中
            </label>
          </div>
        </fieldset>

        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
          <legend style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: #555555; padding: 0; margin-bottom: 4px;">主题</legend>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid #d9d9d9;">
            <label style="height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; border-right: 1px solid #d9d9d9; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: inset 0 -2px 0 #d6501f;">
              <input type="radio" name="theme" checked="checked" style="accent-color: #d6501f; margin: 0;">
              浅色
            </label>
            <label style="height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; cursor: pointer; color: #555555;">
              <input type="radio" name="theme" style="accent-color: #d6501f; margin: 0;">
              深色
            </label>
          </div>
        </fieldset>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: #555555;">宽度</span>
          <div style="height: 36px; border: 1px solid #d9d9d9; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px;">
            <span>标准</span>
            <span style="color: #555555; font-variant-numeric: tabular-nums;">720 px</span>
          </div>
        </div>

        <label style="height: 36px; border: 1px solid #d9d9d9; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; cursor: pointer;">
          <span>水印</span>
          <input type="checkbox" checked="checked" style="width: 16px; height: 16px; margin: 0; accent-color: #d6501f;">
        </label>
      </div>

      <div style="margin-top: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #d9d9d9;">
        <button type="button" style="height: 40px; width: 100%; box-sizing: border-box; border: 1px solid #d6501f; background: #d6501f; color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer;">保存 PNG</button>
        <button type="button" style="height: 40px; width: 100%; box-sizing: border-box; border: 1px solid #111111; background: #ffffff; color: #111111; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer;">复制</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
