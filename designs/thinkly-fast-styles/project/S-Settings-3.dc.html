<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 独立页面（左侧分类导航单页切换 + 方案 C 三联 AI 服务商直选）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button,input{font-family:inherit}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;padding:0;cursor:pointer;flex:none}
.row{font:inherit;font-size:14px;line-height:20px;width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;box-sizing:border-box}
.btn{font:inherit;font-size:14px;line-height:20px;font-weight:460;height:34px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;white-space:nowrap;flex:none}
.seg{font:inherit;font-size:14px;line-height:20px;font-weight:460;height:32px;padding:0 12px;border:0;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;white-space:nowrap}
.pcard{font:inherit;flex:1;min-width:0;padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;box-sizing:border-box}
.field-input{font:inherit;font-size:14px;line-height:20px;height:34px;padding:0 10px;border-radius:8px;box-sizing:border-box;outline:none}
.tray-btn{font:inherit;height:32px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;cursor:pointer;box-sizing:border-box}
.tray-static{font:inherit;height:32px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;box-sizing:border-box}
.keycap{font-family:'JetBrains Mono',Inter,ui-monospace,monospace;font-variant-numeric:tabular-nums;height:22px;min-width:22px;padding:0 6px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:14px;font-weight:500;box-sizing:border-box;white-space:nowrap}
.keycap-sym{font-family:Inter,-apple-system,'SF Pro Text',system-ui,sans-serif;height:22px;min-width:22px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:14px;font-weight:500;box-sizing:border-box;white-space:nowrap}
.menu-opt{font:inherit;font-size:14px;line-height:20px;width:100%;height:32px;padding:0 8px;border:0;border-radius:4px;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:{{shellBg}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:{{textPrimary}};font-size:14px;line-height:20px;overflow:hidden;-webkit-font-smoothing:antialiased">

<header style="height:40px;flex:none;display:flex;align-items:center;border-bottom:1px solid {{sidebarBorder}};box-sizing:border-box;background:{{shellBg}}">
<div style="width:260px;flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 10px 0 16px;border-right:1px solid {{sidebarBorder}}">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
</sc-if>
<button type="button" class="ib" aria-label="收起侧栏" style="margin-left:auto;color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M3.75 4.75H9.25V19.25H5.75A2 2 0 0 1 3.75 17.25V6.75A2 2 0 0 1 5.75 4.75Z" fill="{{iconFill}}"></path>
<rect x="3.75" y="4.75" width="16.5" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"></rect>
<path d="M9.25 4.75V19.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
<path d="M15.75 9.75L13.25 12L15.75 14.25" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>

<div style="flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box">
<div style="display:flex;align-items:center;gap:6px;color:{{textSecondary}}">
<span style="color:{{textSecondary}}">设置</span>
<span>/</span>
<span style="color:{{textPrimary}};font-weight:460">{{activeTabTitle}}</span>
</div>

<div style="display:flex;align-items:center;gap:8px">
<button type="button" class="btn" onClick="{{toggleDarkPreview}}" style="height:28px;padding:0 10px;background:{{cardBg}};color:{{textPrimary}};border:1px solid {{btnBorder}}">{{themeToggleLabel}}</button>
</div>
</div>
</header>

<div style="flex:1;min-height:0;display:flex">

<aside aria-label="设置分类导航" style="width:260px;flex:none;background:{{sidebarBg}};border-right:1px solid {{sidebarBorder}};box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
<div style="padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between">
<span style="font-size:18px;line-height:24px;font-weight:560;color:{{textPrimary}}">设置</span>
</div>

<nav aria-label="设置分类" style="flex:1;min-height:0;padding:4px 10px;display:flex;flex-direction:column;gap:4px">
<button type="button" class="row" onClick="{{selectAi}}" style="background:{{navAiBg}};color:{{navAiCol}};box-shadow:{{navAiRing}};font-weight:{{navAiWeight}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<path d="M12 3.5L14.2 9.3L20 11.5L14.2 13.7L12 19.5L9.8 13.7L4 11.5L9.8 9.3L12 3.5Z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
<path d="M18.5 4V7M17 5.5H20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
<span>AI 助手</span>
</button>

<button type="button" class="row" onClick="{{selectAppearance}}" style="background:{{navAppBg}};color:{{navAppCol}};box-shadow:{{navAppRing}};font-weight:{{navAppWeight}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<rect x="3.5" y="4.5" width="17" height="12" rx="2" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5"></rect>
<path d="M8 20H16M12 16.5V20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
<span>外观与字体</span>
</button>

<button type="button" class="row" onClick="{{selectGeneral}}" style="background:{{navGenBg}};color:{{navGenCol}};box-shadow:{{navGenRing}};font-weight:{{navGenWeight}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
<circle cx="9" cy="7" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle>
<circle cx="15" cy="12" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle>
<circle cx="10" cy="17" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle>
</svg>
<span>通用与编辑</span>
</button>

<button type="button" class="row" onClick="{{selectShortcuts}}" style="background:{{navScBg}};color:{{navScCol}};box-shadow:{{navScRing}};font-weight:{{navScWeight}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<rect x="3.25" y="5.75" width="17.5" height="12.5" rx="2" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5"></rect>
<path d="M7 10H8.5M11.25 10H12.75M15.5 10H17M7.5 14H16.5" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
<span>基础快捷键</span>
</button>

<button type="button" class="row" onClick="{{selectStorage}}" style="background:{{navStBg}};color:{{navStCol}};box-shadow:{{navStRing}};font-weight:{{navStWeight}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
<path d="M8.5 13.5H15.5" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
<span>本地文件夹</span>
</button>
</nav>

<div style="flex:none;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid {{sidebarBorder}}">
<span style="color:{{textSecondary}}">本地笔记</span>
<button type="button" onClick="{{selectAi}}" style="height:28px;padding:0 10px;border:1px solid {{btnBorder}};border-radius:6px;background:{{cardBg}};color:{{textPrimary}};font-size:14px;font-weight:460;display:inline-flex;align-items:center;gap:6px;cursor:pointer">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 6.25L4.75 12L10.5 17.75"></path><path d="M5.25 12H19.25"></path></svg>
<span>返回笔记</span>
</button>
</div>
</aside>

<main style="flex:1;min-width:0;background:{{settingsBg}};overflow:auto">
<div style="box-sizing:border-box;width:100%;max-width:720px;margin:0 auto;padding:40px 28px 64px;display:flex;flex-direction:column;gap:24px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<h1 style="margin:0;font-size:24px;line-height:32px;font-weight:560;color:{{textPrimary}}">{{activeTabTitle}}</h1>
<button type="button" class="btn" onClick="{{selectAi}}" style="background:{{cardBg}};color:{{textPrimary}};border:1px solid {{btnBorder}}">返回编辑</button>
</div>

<sc-if value="{{isTabAi}}" hint-placeholder-val="{{true}}">
<section aria-label="AI 服务商与连接" style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:560;color:{{textPrimary}}">服务商与连接</h2>
<button type="button" onClick="{{toggleAiEnabled}}" style="height:32px;padding:0 12px;border-radius:8px;border:1px solid {{aiToggleBorder}};background:{{aiToggleBg}};color:{{textPrimary}};font-size:14px;font-weight:460;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box">
<span style="width:8px;height:8px;border-radius:4px;background:{{aiDotCol}}"></span>
<span>{{aiToggleLabel}}</span>
</button>
</div>

<div style="display:flex;gap:10px">
<button type="button" class="pcard" onClick="{{selectDeepseek}}" style="background:{{cardDsBg}};border:1px solid {{cardDsBorder}};box-shadow:{{cardDsRing}}">
<div style="width:28px;height:28px;border-radius:6px;background:{{cardIconWellBg}};border:1px solid {{borderCol}};display:flex;align-items:center;justify-content:center;flex:none;color:{{textPrimary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#4D6BFE" aria-hidden="true">
<path d="M23.748 4.482c-.254-.124-.364.113-.512.234-.051.039-.094.09-.137.136-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.156-.708-.311-.955-.65-.172-.241-.219-.51-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.093.172.187.129.323-.082.28-.18.552-.266.833-.055.179-.137.217-.329.14a5.526 5.526 0 01-1.736-1.18c-.857-.828-1.631-1.742-2.597-2.458a11.365 11.365 0 00-.689-.471c-.985-.957.13-1.743.388-1.836.27-.098.093-.432-.779-.428-.872.004-1.67.295-2.687.684a3.055 3.055 0 01-.465.137 9.597 9.597 0 00-2.883-.102c-1.885.21-3.39 1.102-4.497 2.623C.082 8.606-.231 10.684.152 12.85c.403 2.284 1.569 4.175 3.36 5.653 1.858 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.133-.284 4.994-1.86.47.234.962.327 1.78.397.63.059 1.236-.03 1.705-.128.735-.156.684-.837.419-.961-2.155-1.004-1.682-.595-2.113-.926 1.096-1.296 2.746-2.642 3.392-7.003.05-.347.007-.565 0-.845-.004-.17.035-.237.23-.256a4.173 4.173 0 001.545-.475c1.396-.763 1.96-2.015 2.093-3.517.02-.23-.004-.467-.247-.588z"></path>
</svg>
</div>
<div style="flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:500;color:{{textPrimary}};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">DeepSeek</div>
</button>

<button type="button" class="pcard" onClick="{{selectOpenai}}" style="background:{{cardOaBg}};border:1px solid {{cardOaBorder}};box-shadow:{{cardOaRing}}">
<div style="width:28px;height:28px;border-radius:6px;background:{{cardIconWellBg}};border:1px solid {{borderCol}};display:flex;align-items:center;justify-content:center;flex:none;color:{{textPrimary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#10A37F" aria-hidden="true">

</svg>
</div>
<div style="flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:500;color:{{textPrimary}};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">OpenAI 协议</div>
</button>

<button type="button" class="pcard" onClick="{{selectClaude}}" style="background:{{cardClBg}};border:1px solid {{cardClBorder}};box-shadow:{{cardClRing}}">
<div style="width:28px;height:28px;border-radius:6px;background:{{cardIconWellBg}};border:1px solid {{borderCol}};display:flex;align-items:center;justify-content:center;flex:none;color:{{textPrimary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#D97757" aria-hidden="true">
<path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z"></path>
</svg>
</div>
<div style="flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:500;color:{{textPrimary}};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">Claude 协议</div>
</button>
</div>

<div style="width:100%;min-width:0;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px">
<label for="ai-base-url" style="flex:none;white-space:nowrap;color:{{textPrimary}}">Base URL</label>
<div style="flex:1;min-width:0;max-width:380px;display:flex">
<input id="ai-base-url" type="url" value="{{currentBaseUrl}}" onInput="{{onBaseUrlInput}}" class="field-input" style="flex:1;min-width:0;width:100%;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}};font-family:'JetBrains Mono',monospace">
</div>
</div>

<div style="width:100%;min-width:0;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px">
<label for="ai-api-key" style="flex:none;white-space:nowrap;color:{{textPrimary}}">API Key</label>
<div style="flex:1;min-width:0;max-width:380px;display:flex;align-items:center;gap:8px">
<input id="ai-api-key" type="{{apiKeyInputType}}" value="{{currentApiKey}}" onInput="{{onApiKeyInput}}" class="field-input" style="flex:1;min-width:0;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}};font-family:'JetBrains Mono',monospace">
<button type="button" class="btn" onClick="{{toggleShowKey}}" style="background:{{shellBg}};color:{{textSecondary}};border:1px solid {{borderCol}}">{{showKeyLabel}}</button>
</div>
</div>
</section>

<section aria-label="AI 模型与连接" style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:16px">
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:560;color:{{textPrimary}}">模型与连接</h2>

<div style="width:100%;min-width:0;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative">

      setThemeDark: () => this.setState({ darkOverride: 'dark' }),

      setLangSystem: () => this.setState({ langChoice: 'system' }),
      setLangZh: () => this.setState({ langChoice: 'zh' }),
      setLangEn: () => this.setState({ langChoice: 'en' }),

      toggleAiEnabled: () => this.setState({ aiEnabled: !st.aiEnabled }),
      toggleShowKey: () => this.setState({ showKey: !st.showKey }),
      toggleModelMenu: () => this.setState({ modelMenuOpen: !st.modelMenuOpen }),

      pickModel0: () => pickModel(0),
      pickModel1: () => pickModel(1),
      pickModel2: () => pickModel(2),

      onBaseUrlInput: (e) => { if (e && e.target) updateField('baseUrl', e.target.value); },
      onApiKeyInput: (e) => { if (e && e.target) updateField('apiKey', e.target.value); },
      refreshModels: () => this.setState({ refreshed: true }),
      runTestConnection: () => this.setState({ testConnected: true }),

      setFontSans: () => this.setState({ fontChoice: 'sans' }),
      setFontSerif: () => this.setState({ fontChoice: 'serif' }),

      resetShortcuts: () => this.setState({ recordingIdx: null, scResetDone: true }),
      recordSc0: () => this.setState({ recordingIdx: st.recordingIdx === 0 ? null : 0, scResetDone: false }),
      recordSc1: () => this.setState({ recordingIdx: st.recordingIdx === 1 ? null : 1, scResetDone: false }),
      openInFinder: () => this.setState({ finderOpened: !st.finderOpened }),
      switchWorkspaceDir: () => this.setState({ workspaceAlt: !st.workspaceAlt })
    };
  }
}
</script>
</body>
</html>
