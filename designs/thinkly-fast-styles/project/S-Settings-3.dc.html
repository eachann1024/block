<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 独立分键键帽（按当前系统自适应）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button,input{font-family:inherit}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#526071;padding:0;cursor:pointer;flex:none}
.ib:hover{background:#eef3fc;color:#20242c}
.tab{font:inherit;font-size:13px;line-height:18px;font-weight:460;height:28px;min-width:104px;max-width:196px;flex:0 1 176px;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;box-sizing:border-box}
.row{font:inherit;font-size:14px;line-height:20px;font-weight:400;width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;box-sizing:border-box}
.btn{font:inherit;font-size:14px;font-weight:460;height:32px;padding:0 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;white-space:nowrap}
.seg{font:inherit;font-size:14px;font-weight:460;height:34px;padding:0 14px;border:0;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;white-space:nowrap}
.tray-btn{font:inherit;height:32px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;cursor:pointer;box-sizing:border-box}
.tray-static{font:inherit;height:32px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;box-sizing:border-box}
.keycap{font-family:'JetBrains Mono',Inter,ui-monospace,monospace;font-variant-numeric:tabular-nums;height:22px;min-width:22px;padding:0 6px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:14px;font-weight:500;box-sizing:border-box;white-space:nowrap}
.keycap-sym{font-family:Inter,-apple-system,'SF Pro Text',system-ui,sans-serif;height:22px;min-width:22px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:14px;font-weight:500;box-sizing:border-box;white-space:nowrap}
.keycap-sm{font-family:'JetBrains Mono',Inter,ui-monospace,monospace;height:20px;min-width:20px;padding:0 5px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:14px;font-weight:500;box-sizing:border-box;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:100%;min-height:940px;box-sizing:border-box;display:flex;flex-direction:column;background:{{shellBg}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:{{textPrimary}};font-size:14px;line-height:20px;overflow:hidden;-webkit-font-smoothing:antialiased">

<header style="height:40px;flex:none;display:flex;align-items:center;border-bottom:1px solid {{borderCol}};box-sizing:border-box;background:{{shellBg}}">
<div style="width:260px;flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 10px 0 16px;border-right:1px solid {{borderCol}}">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<button class="ib" aria-label="收起侧边栏" style="margin-left:auto;color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M3.75 4.75H9.25V19.25H5.75A2 2 0 0 1 3.75 17.25V6.75A2 2 0 0 1 5.75 4.75Z" fill="#c9d8f3"></path>
<rect x="3.75" y="4.75" width="16.5" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"></rect>
<path d="M9.25 4.75V19.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
<path d="M15.75 9.75L13.25 12L15.75 14.25" stroke="#547dd0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>

<nav aria-label="已打开标签页" style="flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:4px;padding:0 10px;overflow:hidden">
<button class="tab" style="color:{{textSecondary}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-align:left">01-编辑体验</span>
</button>
<button class="tab" style="color:{{textSecondary}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-align:left">02-完整验收</span>
</button>
<button class="tab" style="color:{{textSecondary}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-align:left">未命名</span>
</button>
<button class="ib" aria-label="新建标签页" style="color:{{textSecondary}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</nav>
</header>

<div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">
<aside aria-label="文件列表" style="width:260px;flex:none;background:{{sidebarBg}};border-right:1px solid {{borderCol}};box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
<div style="padding:12px 12px 8px">
<button style="font:inherit;font-size:13px;font-weight:460;width:100%;height:34px;padding:0 10px;border-radius:8px;background:{{paperBg}};color:{{textPrimary}};border:1px solid {{btnBorder}};display:flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z" fill="#c9d8f3" stroke="none"></path><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z"></path></svg>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left">thinkly-fast-manual.WLrcF0</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{textSecondary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>

<div style="padding:0 12px 8px">
<button style="font:inherit;font-size:13px;width:100%;height:34px;padding:0 8px 0 10px;border-radius:8px;background:{{paperBg}};color:{{textSecondary}};border:1px solid {{btnBorder}};display:flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="#c9d8f3" stroke="none"></circle><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.2 4.2"></path></svg>
<span style="flex:1;text-align:left">搜索笔记</span>
<span style="display:inline-flex;align-items:center;gap:3px">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<span class="keycap-sm" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textSecondary}}">⇧</span>
<span class="keycap-sm" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textSecondary}}">⌘</span>
<span class="keycap-sm" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textSecondary}}">K</span>
</sc-if>
<sc-if value="{{isNotMac}}" hint-placeholder-val="{{false}}">
<span class="keycap-sm" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textSecondary}}">Ctrl</span>
<span class="keycap-sm" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textSecondary}}">Shift</span>
<span class="keycap-sm" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textSecondary}}">K</span>
</sc-if>
</span>
</button>
</div>

<div style="display:flex;align-items:center;gap:2px;padding:4px 12px 6px 20px;font-size:12px;color:{{textSecondary}}">
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">thinkly-fast-manual.WLrcF0</span>
<button class="ib" aria-label="新建笔记" style="width:24px;height:24px;color:{{textSecondary}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.75H6.75a1.5 1.5 0 0 0-1.5 1.5v13.5a1.5 1.5 0 0 0 1.5 1.5h10.5a1.5 1.5 0 0 0 1.5-1.5V8.5z"></path><path d="M12 10v6M9 13h6" stroke="#547dd0"></path></svg></button>
<button class="ib" aria-label="新建文件夹" style="width:24px;height:24px;color:{{textSecondary}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z"></path><path d="M12 11v5M9.5 13.5h5" stroke="#547dd0"></path></svg></button>
</div>

<div style="flex:1;min-height:0;overflow:auto;padding:2px 8px 12px;display:flex;flex-direction:column;gap:2px">
<button class="row" style="color:{{textPrimary}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{textSecondary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z" fill="#c9d8f3" stroke="none"></path><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z"></path></svg>assets</button>
<button class="row" style="padding-left:24px;color:{{textPrimary}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>01-编辑体验</button>
<button class="row" style="padding-left:24px;color:{{textPrimary}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>02-完整验收</button>
<button class="row" style="padding-left:24px;color:{{textPrimary}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>未命名</button>
</div>

<div style="flex:none;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid {{borderCol}}">
<span style="font-size:13px;color:{{textSecondary}}">本地笔记</span>
<button aria-label="设置中" style="height:28px;padding:0 10px;border:0;border-radius:6px;background:{{selectedBg}};color:{{textPrimary}};box-shadow:inset 0 0 0 1px {{accent}};font-size:13px;font-weight:460;display:inline-flex;align-items:center;gap:6px;cursor:pointer">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#c9d8f3"></circle><circle cx="15" cy="12" r="2" fill="#c9d8f3"></circle><circle cx="10" cy="17" r="2" fill="#c9d8f3"></circle></svg>
<span>设置中</span>
</button>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;background:{{settingsBg}};overflow:auto">
<div style="box-sizing:border-box;width:100%;max-width:720px;margin:0 auto;padding:40px 28px 64px;display:flex;flex-direction:column;gap:28px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<h1 style="margin:0;font-size:24px;line-height:32px;font-weight:560;color:{{textPrimary}}">设置</h1>
<button class="btn" style="background:{{paperBg}};color:{{textPrimary}};border:1px solid {{btnBorder}}">返回编辑</button>
</div>

<section aria-label="外观与字体" style="background:{{paperBg}};border:1px solid {{borderCol}};border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:16px">
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:560;color:{{textPrimary}}">外观与字体</h2>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">界面语言</span>
<div role="group" aria-label="界面语言" style="display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}}">
<button class="seg" sc-on:click="setLangSystem" style="background:{{langSysBg}};color:{{langSysCol}};box-shadow:{{langSysRing}}">跟随系统</button>
<button class="seg" sc-on:click="setLangZh" style="background:{{langZhBg}};color:{{langZhCol}};box-shadow:{{langZhRing}}">简体中文</button>
<button class="seg" sc-on:click="setLangEn" style="background:{{langEnBg}};color:{{langEnCol}};box-shadow:{{langEnRing}}">English</button>
</div>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">外观主题</span>
<div role="group" aria-label="外观主题" style="display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}}">
<button class="seg" sc-on:click="setThemeSystem" style="background:{{themeSysBg}};color:{{themeSysCol}};box-shadow:{{themeSysRing}}">跟随系统</button>
<button class="seg" sc-on:click="setThemeLight" style="background:{{themeLightBg}};color:{{themeLightCol}};box-shadow:{{themeLightRing}}">浅色</button>
<button class="seg" sc-on:click="setThemeDark" style="background:{{themeDarkBg}};color:{{themeDarkCol}};box-shadow:{{themeDarkRing}}">深色</button>
</div>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">正文字体</span>
<div role="group" aria-label="正文字体" style="display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}}">
<button class="seg" sc-on:click="setFontSans" style="background:{{fontSansBg}};color:{{fontSansCol}};box-shadow:{{fontSansRing}}">无衬线</button>
<button class="seg" sc-on:click="setFontSerif" style="background:{{fontSerifBg}};color:{{fontSerifCol}};box-shadow:{{fontSerifRing}}">衬线</button>
</div>
</div>
</section>

<section aria-label="基础快捷键" style="background:{{paperBg}};border:1px solid {{borderCol}};border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:560;color:{{textPrimary}}">基础快捷键</h2>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">搜索与全局唤起</span>
<button class="tray-btn" sc-on:click="toggleRecordSearch" style="background:{{recSearchTrayBg}};border:1px solid {{recSearchTrayBorder}}" aria-label="录制搜索与全局唤起快捷键">
<sc-if value="{{isRecSearch}}" hint-placeholder-val="{{false}}">
<span style="padding:0 6px;font-size:13px;font-weight:500;color:{{accent}}">按下快捷键…</span>
</sc-if>
<sc-if value="{{notRecSearch}}" hint-placeholder-val="{{true}}">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<span class="keycap-sym" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">⇧</span>
<span class="keycap-sym" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">⌘</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">K</span>
</sc-if>
<sc-if value="{{isNotMac}}" hint-placeholder-val="{{false}}">
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">Ctrl</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">Shift</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">K</span>
</sc-if>
</sc-if>
</button>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">速记小窗</span>
<button class="tray-btn" sc-on:click="toggleRecordQuick" style="background:{{recQuickTrayBg}};border:1px solid {{recQuickTrayBorder}}" aria-label="录制速记小窗快捷键">
<sc-if value="{{isRecQuick}}" hint-placeholder-val="{{false}}">
<span style="padding:0 6px;font-size:13px;font-weight:500;color:{{accent}}">按下快捷键…</span>
</sc-if>
<sc-if value="{{notRecQuick}}" hint-placeholder-val="{{true}}">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<span class="keycap-sym" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">⌥</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">N</span>
</sc-if>
<sc-if value="{{isNotMac}}" hint-placeholder-val="{{false}}">
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">Alt</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">N</span>
</sc-if>
</sc-if>
</button>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">当前笔记查找</span>
<span class="tray-static" style="background:{{trayBg}};border:1px solid {{borderCol}}">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<span class="keycap-sym" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">⌘</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">F</span>
</sc-if>
<sc-if value="{{isNotMac}}" hint-placeholder-val="{{false}}">
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">Ctrl</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">F</span>
</sc-if>
</span>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">新建笔记</span>
<span class="tray-static" style="background:{{trayBg}};border:1px solid {{borderCol}}">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<span class="keycap-sym" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">⌘</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">N</span>
</sc-if>
<sc-if value="{{isNotMac}}" hint-placeholder-val="{{false}}">
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">Ctrl</span>
<span class="keycap" style="background:{{keycapBg}};border:1px solid {{keycapBorder}};color:{{textPrimary}}">N</span>
</sc-if>
</span>
</div>
</section>

<section aria-label="AI 助手" style="background:{{paperBg}};border:1px solid {{borderCol}};border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:560;color:{{textPrimary}}">AI 助手</h2>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">启用 AI 助手</span>
<button sc-on:click="toggleAi" style="height:34px;padding:0 14px;border-radius:8px;border:1px solid {{aiToggleBorder}};background:{{aiToggleBg}};color:{{textPrimary}};font-size:14px;font-weight:460;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box">
<span style="width:8px;height:8px;border-radius:4px;background:{{aiDotCol}}"></span>
<span>{{aiToggleLabel}}</span>
</button>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<label for="ai-base-url" style="font-size:14px;color:{{textPrimary}}">Base URL</label>
<input id="ai-base-url" type="url" value="https://api.openai.com/v1" readonly style="width:360px;max-width:100%;height:34px;padding:0 10px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}};font-size:14px;box-sizing:border-box">
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<label for="ai-api-key" style="font-size:14px;color:{{textPrimary}}">API Key</label>
<div style="width:360px;max-width:100%;display:flex;align-items:center;gap:8px">
<input id="ai-api-key" type="password" value="sk-thinkly-demo-key" readonly style="flex:1;min-width:0;height:34px;padding:0 10px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}};font-size:14px;box-sizing:border-box">
<button class="btn" style="height:34px;background:{{shellBg}};color:{{textSecondary}};border:1px solid {{borderCol}};font-size:13px">显示</button>
</div>
</div>

<div style="min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<span style="font-size:14px;color:{{textPrimary}}">默认模型</span>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<button style="width:220px;height:34px;padding:0 10px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}};font-size:14px;display:inline-flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;box-sizing:border-box">
<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">gpt-4.1-mini</span>
<span style="font-size:11px;color:{{textSecondary}}">▾</span>
</button>
<button class="btn" style="height:34px;background:{{shellBg}};color:{{textPrimary}};border:1px solid {{btnBorder}};font-size:13px">重新获取模型</button>
<button class="btn" style="height:34px;background:{{shellBg}};color:{{textPrimary}};border:1px solid {{btnBorder}};font-size:13px">连接测试</button>
</div>
</div>
</section>

</div>
</main>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"text","default":"macos"},"theme":{"editor":"text","default":"light"},"font":{"editor":"text","default":"sans"},"$preview":{"width":1440,"height":940}}'>
class Component extends DCLogic {
  init() {
    this.state = {
      lang: 'system',
      theme: this.props.theme ?? 'light',
      font: this.props.font ?? 'sans',
      rec: '',
      aiEnabled: true,
    };
  }
  setLangSystem() { this.state.lang = 'system'; this.rerender(); }
  setLangZh() { this.state.lang = 'zh'; this.rerender(); }
  setLangEn() { this.state.lang = 'en'; this.rerender(); }
  setThemeSystem() { this.state.theme = 'system'; this.rerender(); }
  setThemeLight() { this.state.theme = 'light'; this.rerender(); }
  setThemeDark() { this.state.theme = 'dark'; this.rerender(); }
  setFontSans() { this.state.font = 'sans'; this.rerender(); }
  setFontSerif() { this.state.font = 'serif'; this.rerender(); }
  toggleRecordSearch() {
    this.state.rec = this.state.rec === 'search' ? '' : 'search';
    this.rerender();
  }
  toggleRecordQuick() {
    this.state.rec = this.state.rec === 'quick' ? '' : 'quick';
    this.rerender();
  }
  toggleAi() {
    this.state.aiEnabled = !this.state.aiEnabled;
    this.rerender();
  }
  renderVals() {
    const os = this.props.platform ?? 'macos';
    const lang = this.state.lang || 'system';
    const theme = this.state.theme || this.props.theme || 'light';
    const font = this.state.font || this.props.font || 'sans';
    const dark = theme === 'dark';

    const shellBg = dark ? '#343434' : '#f1f1f1';
    const sidebarBg = dark ? '#222222' : '#fafafa';
    const settingsBg = dark ? '#181818' : '#f8f8f8';
    const paperBg = dark ? '#181818' : '#ffffff';
    const textPrimary = dark ? '#ececec' : '#20242c';
    const textSecondary = dark ? '#b4b4b4' : '#526071';
    const accent = dark ? '#779de8' : '#547dd0';
    const selectedBg = dark ? '#343434' : '#e5edfc';
    const borderCol = dark ? '#2e2e2e' : '#e4e6ea';
    const btnBorder = dark ? '#444444' : '#dcdcdc';
    const trayBg = dark ? '#242424' : '#f1f1f1';
    const keycapBg = dark ? '#343434' : '#ffffff';
    const keycapBorder = dark ? '#444444' : '#dcdcdc';
    const activeRing = 'inset 0 0 0 1px ' + accent;

    const isRecSearch = this.state.rec === 'search';
    const isRecQuick = this.state.rec === 'quick';
    const aiOn = !!this.state.aiEnabled;

    return {
      shellBg,
      sidebarBg,
      settingsBg,
      paperBg,
      textPrimary,
      textSecondary,
      accent,
      selectedBg,
      borderCol,
      btnBorder,
      trayBg,
      keycapBg,
      keycapBorder,
      isMac: os === 'macos',
      isNotMac: os !== 'macos',
      langSysBg: lang === 'system' ? selectedBg : 'transparent',
      langSysCol: lang === 'system' ? textPrimary : textSecondary,
      langSysRing: lang === 'system' ? activeRing : 'none',
      langZhBg: lang === 'zh' ? selectedBg : 'transparent',
      langZhCol: lang === 'zh' ? textPrimary : textSecondary,
      langZhRing: lang === 'zh' ? activeRing : 'none',
      langEnBg: lang === 'en' ? selectedBg : 'transparent',
      langEnCol: lang === 'en' ? textPrimary : textSecondary,
      langEnRing: lang === 'en' ? activeRing : 'none',
      themeSysBg: theme === 'system' ? selectedBg : 'transparent',
      themeSysCol: theme === 'system' ? textPrimary : textSecondary,
      themeSysRing: theme === 'system' ? activeRing : 'none',
      themeLightBg: theme === 'light' ? selectedBg : 'transparent',
      themeLightCol: theme === 'light' ? textPrimary : textSecondary,
      themeLightRing: theme === 'light' ? activeRing : 'none',
      themeDarkBg: theme === 'dark' ? selectedBg : 'transparent',
      themeDarkCol: theme === 'dark' ? textPrimary : textSecondary,
      themeDarkRing: theme === 'dark' ? activeRing : 'none',
      fontSansBg: font === 'sans' ? selectedBg : 'transparent',
      fontSansCol: font === 'sans' ? textPrimary : textSecondary,
      fontSansRing: font === 'sans' ? activeRing : 'none',
      fontSerifBg: font === 'serif' ? selectedBg : 'transparent',
      fontSerifCol: font === 'serif' ? textPrimary : textSecondary,
      fontSerifRing: font === 'serif' ? activeRing : 'none',
      isRecSearch,
      notRecSearch: !isRecSearch,
      recSearchTrayBg: isRecSearch ? selectedBg : trayBg,
      recSearchTrayBorder: isRecSearch ? accent : btnBorder,
      isRecQuick,
      notRecQuick: !isRecQuick,
      recQuickTrayBg: isRecQuick ? selectedBg : trayBg,
      recQuickTrayBorder: isRecQuick ? accent : btnBorder,
      aiToggleBg: aiOn ? selectedBg : shellBg,
      aiToggleBorder: aiOn ? accent : btnBorder,
      aiDotCol: aiOn ? accent : textSecondary,
      aiToggleLabel: aiOn ? '已开启' : '已关闭',
    };
  }
}
</script>
</body>
</html>
