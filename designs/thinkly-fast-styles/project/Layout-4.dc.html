<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>树内行</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button{font-family:inherit}
.row{font:inherit;font-size:14px;line-height:20px;font-weight:400;width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#20242c;text-align:left;cursor:pointer;box-sizing:border-box}
.row:hover{background:#eef3fc}
.ghost{font:inherit;font-size:14px;line-height:20px;font-weight:400;width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#526071;text-align:left;cursor:pointer;box-sizing:border-box}
.ghost:hover{background:#eef3fc;color:#20242c}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#526071;padding:0;cursor:pointer}
.ib:hover{background:#eef3fc;color:#20242c}
.hbtn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:#526071;padding:0;cursor:pointer}
.hbtn:hover{background:#eef3fc;color:#20242c}
.mini{width:22px;height:22px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:#526071;padding:0;cursor:pointer}
.mini:hover{background:#ffffff;color:#20242c}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:100%;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;font-size:14px;line-height:20px;overflow:hidden">

<header style="height:40px;flex:none;display:flex;align-items:center;padding:0 16px;gap:12px">
<div aria-hidden="true" style="display:flex;gap:8px;width:52px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<div style="flex:1;text-align:center;font-size:13px;color:#526071">周会 11-03</div>
<div aria-hidden="true" style="width:52px;flex:none"></div>
</header>

<div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">

<aside aria-label="文件列表" style="width:260px;flex:none;background:#fafafa;border-right:1px solid #e6e6e6;box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
<div style="flex:1;min-height:0;overflow:auto;padding:8px 8px 12px;display:flex;flex-direction:column;gap:2px">
<button class="ghost" aria-label="新建笔记，⌘N" title="新建笔记 ⌘N"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>新建笔记</button>
<div class="row" style="background:#eef3fc;gap:4px;padding-right:4px">
<button class="row" aria-label="选择文件夹，⌘O" title="选择文件夹 ⌘O" style="flex:1;min-width:0;width:auto;padding:0 4px;background:transparent"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="min-width:0;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent)">本地笔记</span></button>
<button class="mini" aria-label="更换文件夹，⌘O" title="更换文件夹 ⌘O"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2"></path><path d="M3 11h13l-3-3"></path><path d="M16 14l3 3-3 3"></path><path d="M19 17H6"></path></svg></button>
</div>
<button class="row" style="padding-left:26px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>会议记录</button>
<button class="row" aria-pressed="true" style="padding-left:46px;background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0;font-weight:460">周会 11-03</button>
<button class="row" style="padding-left:46px">需求评审</button>
<div class="row" style="background:#eef3fc;gap:4px;padding-left:26px;padding-right:4px">
<button class="row" style="flex:1;min-width:0;width:auto;padding:0 4px;background:transparent"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 6l6 6-6 6"></path></svg><span style="min-width:0;overflow:hidden;white-space:nowrap">归档</span></button>
<button class="mini" aria-label="在归档内新建笔记" title="在归档内新建笔记"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<button class="row" style="padding-left:26px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>阅读</button>
<button class="row" style="padding-left:26px">产品原则</button>
<button class="row" style="padding-left:26px">发布清单</button>
<button class="row" style="padding-left:26px">速记</button>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;background:#ffffff;overflow:auto">
<div style="box-sizing:border-box;width:100%;max-width:816px;margin:0 auto;padding:36px 28px 64px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<h1 style="flex:1;min-width:0;max-width:720px;margin:0;font-size:28px;line-height:1.35;font-weight:560;letter-spacing:-0.01em">把周会改成异步</h1>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">上周排了三场同步会，两场结束时没有结论。人到齐，并不等于事情被推进。</p>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none;display:flex;justify-content:flex-end;gap:2px;padding-top:1px">
<button class="hbtn" aria-label="拖动块"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="5" cy="2.5" r="1" fill="#526071"></circle><circle cx="9" cy="2.5" r="1" fill="#526071"></circle><circle cx="5" cy="7" r="1" fill="#526071"></circle><circle cx="9" cy="7" r="1" fill="#526071"></circle><circle cx="5" cy="11.5" r="1" fill="#526071"></circle><circle cx="9" cy="11.5" r="1" fill="#526071"></circle></svg></button>
<button class="hbtn" aria-label="添加块"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">与其等所有人空出同一段时间，不如把状态写在这里：这周要什么、卡在哪、需要谁看一眼。</p>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none;display:flex;justify-content:flex-end;padding-top:1px">
<button class="hbtn" aria-label="添加块"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5;color:#6d7784">输入文字…</p>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<blockquote style="flex:1;min-width:0;max-width:720px;margin:0;padding:2px 0 2px 14px;border-left:2px solid #d5dbe3;font-size:17px;line-height:1.5">会议是例外，不是节奏。一段文字能说清的，不要再约三十分钟。</blockquote>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<h2 style="flex:1;min-width:0;max-width:720px;margin:0;font-size:22px;line-height:1.4;font-weight:560">保留下来的三件事</h2>
</div>

<div style="display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<div style="flex:1;min-width:0;max-width:720px;display:flex;flex-direction:column;gap:4px">
<label style="display:flex;align-items:flex-start;gap:8px;font-size:17px;line-height:1.5"><input type="checkbox" checked="checked" aria-label="已完成" style="width:16px;height:16px;margin:5px 0 0;accent-color:#547dd0;flex:none"><span>周一前写好本周目标，一句话即可</span></label>
<label style="display:flex;align-items:flex-start;gap:8px;font-size:17px;line-height:1.5"><input type="checkbox" aria-label="未完成" style="width:16px;height:16px;margin:5px 0 0;accent-color:#547dd0;flex:none"><span>阻塞写在文档里，直接点名负责人</span></label>
<label style="display:flex;align-items:flex-start;gap:8px;font-size:17px;line-height:1.5"><input type="checkbox" aria-label="未完成" style="width:16px;height:16px;margin:5px 0 0;accent-color:#547dd0;flex:none"><span>周五只回看偏差，不复述进度</span></label>
</div>
</div>

<div style="position:relative;display:flex;align-items:flex-start;gap:8px">
<div style="width:44px;flex:none"></div>
<p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">试点两周。周五回看时<span style="background:#d6e3fb;border-radius:2px">只记录偏差</span>，不把进度再讲一遍。</p>
<div style="position:absolute;left:168px;bottom:calc(100% + 6px);display:flex;align-items:center;gap:2px;padding:4px;background:#ffffff;border:1px solid #e4e4e4;border-radius:8px;z-index:2">
<button class="ib" aria-label="加粗" style="font-weight:600;font-size:14px;color:#20242c">B</button>
<button class="ib" aria-label="斜体" style="font-style:italic;font-size:14px;color:#20242c">I</button>
<button class="ib" aria-label="删除线" style="font-size:14px;text-decoration:line-through;color:#20242c">S</button>
<button class="ib" aria-label="行内代码"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"></path></svg></button>
<button class="ib" aria-label="链接"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"></path></svg></button>
<button class="ib" aria-label="标题级别" style="width:auto;padding:0 8px;gap:4px;font-size:13px;font-weight:460;color:#20242c">标题<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button class="ib" aria-label="生成图片" style="width:auto;padding:0 8px;gap:4px;font-size:13px;font-weight:460;color:#20242c"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.4"></circle><path d="M21 16l-5-5-9 8"></path></svg>生成图片</button>
</div>
</div>

</div>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

</body>
</html>
