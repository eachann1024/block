<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 B · 单一预览槽</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#3559a8}a:hover{color:#233f7d}
button{font-family:inherit}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#3d4856;padding:0;cursor:pointer;flex:none}
.ib:hover{background:#e6eefc;color:#181c23}
.tab-pill{height:28px;min-width:128px;max-width:228px;flex:0 1 206px;display:inline-flex;align-items:center;padding:0 4px 0 2px;border-radius:6px;background:transparent;color:#3d4856;box-sizing:border-box}
.tab-pill:hover{background:#e8effc;color:#181c23}
.tab-pill-active{background:#dfe9fc;color:#181c23;box-shadow:inset 0 0 0 1px #476ec2}
.tab-pill-preview{background:#edf2fb;color:#28313e;box-shadow:inset 0 0 0 1px #7393d6}
.tab-main{font:inherit;font-size:14px;line-height:20px;font-weight:460;flex:1;min-width:0;height:100%;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 8px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left}
.tab-main-preview{font:inherit;font-size:14px;line-height:20px;font-style:italic;font-weight:440;flex:1;min-width:0;height:100%;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 8px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left}
.tab-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-act{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:#3559a8;padding:0;cursor:pointer;flex:none}
.tab-act:hover{background:#cddcf8;color:#181c23}
.tab-close{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:#3d4856;padding:0;cursor:pointer;flex:none}
.tab-close:hover{background:#cddcf8;color:#181c23}
.row{font:inherit;font-size:14px;line-height:20px;font-weight:400;width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#181c23;text-align:left;cursor:pointer;box-sizing:border-box}
.row:hover{background:#e8effc}
.row-active{background:#dfe9fc;box-shadow:inset 0 0 0 1px #476ec2;font-weight:500}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#181c23;font-size:14px;line-height:20px;overflow:hidden">

<header style="height:42px;flex:none;display:flex;align-items:center;border-bottom:1px solid #e2e4e8;box-sizing:border-box;background:#f1f1f1">
<div style="width:260px;flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 10px 0 16px;border-right:1px solid #e2e4e8">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
</div>

<nav aria-label="已打开标签页" style="flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:6px;padding:0 10px;overflow:hidden">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
<div class="{{tab.pillClass}}">
<button type="button" class="{{tab.mainClass}}" onClick="{{tab.select}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{tab.iconStroke}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z" fill="{{tab.iconFill}}" stroke="none"></path><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span class="tab-label">{{tab.title}}</span>
</button>
<sc-if value="{{tab.isPreview}}" hint-placeholder-val="{{false}}">
<button type="button" class="tab-act" aria-label="固定为常驻标签页" title="转为常驻标签页（双击或编辑也会自动转正）" onClick="{{tab.keep}}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 7 3 3v2H6v-2l3-3-1-7z"></path></svg>
</button>
</sc-if>
<button type="button" class="tab-close" aria-label="{{tab.closeLabel}}" onClick="{{tab.close}}">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
</sc-for>
</nav>
</header>

<div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">
<aside aria-label="文件列表" style="width:260px;flex:none;background:#fafafa;border-right:1px solid #e2e4e8;box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
<div style="padding:14px 12px 10px;border-bottom:1px solid #eceef2;display:flex;flex-direction:column;gap:6px">
<div style="font-size:14px;font-weight:560;color:#181c23">单击复用唯一「预览槽」</div>
<div style="font-size:14px;line-height:20px;color:#3d4856">随便单击未固定的笔记，永远只替换最右侧那个斜体预览标签；编辑或点图钉才转正。</div>
</div>

<div style="flex:1;min-height:0;overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:4px">
<sc-for list="{{notes}}" as="item" hint-placeholder-count="6">
<button type="button" class="{{item.rowClass}}" onClick="{{item.click}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{item.stroke}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z" fill="{{item.fill}}" stroke="none"></path><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{item.title}}</span>
<span style="font-size:14px;color:#3d4856">{{item.badge}}</span>
</button>
</sc-for>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;background:#ffffff;overflow:auto">
<div style="box-sizing:border-box;width:100%;max-width:816px;margin:0 auto;padding:44px 36px 72px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-radius:10px;background:#f4f7fd;border:1px solid #d7e2f8;color:#24324b;font-size:14px;line-height:20px">
<span>{{statusBanner}}</span>
<sc-if value="{{isCurrentPreview}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{promoteCurrent}}" style="font:inherit;font-size:14px;height:28px;padding:0 12px;border-radius:6px;border:1px solid #476ec2;background:#ffffff;color:#24324b;cursor:pointer">模拟打字编辑 / 双击（转为常驻标签）</button>
</sc-if>
</div>

<h1 style="margin:8px 0 0;font-size:28px;line-height:1.35;font-weight:600;letter-spacing:-0.02em;color:#181c23">{{activeTitle}}</h1>
<p style="margin:0;font-size:17px;line-height:1.65;color:#242a33;max-width:68ch">{{activeLead}}</p>
<p style="margin:0;font-size:17px;line-height:1.65;color:#242a33;max-width:68ch">{{activeBody}}</p>
</div>
</main>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const NOTES = [
  {
    id: 'weekly',
    title: '周会 11-03',
    lead: '这篇笔记已经处于「常驻标签」状态（正体标题），在你翻阅其他笔记时不会被顶掉。',
    body: '当你正在写周会纪要、同时去左侧列表快速翻看其他几篇参考资料时，所有翻看动作都共用右侧唯一的斜体预览槽。'
  },
  {
    id: 'review',
    title: '需求评审',
    lead: '当前处于「预览槽」状态（顶栏斜体标题）。再点左侧其他笔记，会直接复用这一个槽位。',
    body: '如果你决定留下这篇笔记慢慢改，只要在正文里敲一个字、双击左侧文件行、或点标签上的图钉，它就会立刻转正。'
  },
  {
    id: 'principles',
    title: '产品原则',
    lead: '试试连续点击左侧「发布清单」「读书摘录」「四季度规划」——你会发现顶栏永远只增加这 1 个预览标签。',
    body: 'VS Code 与 Zed 采用这种模式：已编辑的文档稳稳留住，随手点开的文档用完即替。'
  },
  {
    id: 'release',
    title: '发布清单',
    lead: '打包前确认签名身份，执行构建脚本后替换本地应用并启动验证。',
    body: '在预览槽里看一眼命令、复制完就能直接点下一篇，不需要手动去关标签页。'
  },
  {
    id: 'reading',
    title: '读书摘录',
    lead: '斜体标签代表「我只是路过看一眼」，正体标签代表「我正在处理这篇笔记」。',
    body: '点击上方提示条里的「模拟打字编辑 / 双击」按钮，可以把当前预览标签转为常驻标签。'
  },
  {
    id: 'roadmap',
    title: '四季度规划',
    lead: '不论左侧有多少篇笔记，未编辑的浏览永远只占 1 个预览槽位。',
    body: '这样既保留了多标签对照能力，又彻底消灭了随手翻一圈留下十几个标签页的问题。'
  }
];

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      kept: ['weekly'],
      previewId: 'review',
      activeId: 'review'
    };
  }
  clickNote(id) {
    const kept = [...this.state.kept];
    let previewId = this.state.previewId;
    let activeId = this.state.activeId;
    if (kept.includes(id)) {
      activeId = id;
    } else if (previewId === id) {
      kept.push(id);
      previewId = null;
      activeId = id;
    } else {
      previewId = id;
      activeId = id;
    }
    this.setState({ kept, previewId, activeId });
  }
  promoteCurrent() {
    const { previewId, kept } = this.state;
    if (previewId && !kept.includes(previewId)) {
      this.setState({ kept: [...kept, previewId], previewId: null });
    }
  }
  renderVals() {
    const { kept, previewId, activeId } = this.state;
    const allTabs = [...kept];
    if (previewId && !allTabs.includes(previewId)) {
      allTabs.push(previewId);
    }
    const activeNote = NOTES.find((n) => n.id === activeId) || NOTES[0];
    const isCurrentPreview = activeId === previewId;

    return {
      isCurrentPreview,
      promoteCurrent: () => this.promoteCurrent(),
      statusBanner: isCurrentPreview
        ? '当前笔记在「单一预览槽」中：继续单击左侧其他笔记会直接替换它；再次点击同一篇或点右侧按钮即可转正。'
        : '当前笔记已是「常驻标签」：随便单击左侧未打开的笔记，会在右侧单独复用 1 个斜体预览槽。',
      activeTitle: activeNote.title,
      activeLead: activeNote.lead,
      activeBody: activeNote.body,
      tabs: allTabs.map((id) => {
        const note = NOTES.find((n) => n.id === id) || NOTES[0];
        const isPrev = id === previewId;
        const isAct = id === activeId;
        return {
          title: isPrev ? note.title + ' · 预览' : note.title,
          pillClass: isAct ? (isPrev ? 'tab-pill tab-pill-preview' : 'tab-pill tab-pill-active') : 'tab-pill',
          mainClass: isPrev ? 'tab-main-preview' : 'tab-main',
          iconStroke: isAct ? '#3559a8' : '#3d4856',
          iconFill: isAct ? '#c5d6f5' : 'none',
          isPreview: isPrev,
          closeLabel: '关闭 ' + note.title,
          select: () => this.setState({ activeId: id }),
          keep: () => {
            if (previewId === id) {
              this.setState({ kept: [...kept, id], previewId: null, activeId: id });
            }
          },
          close: () => {
            let nextKept = [...kept];
            let nextPreview = previewId;
            let nextActive = activeId;
            if (isPrev) {
              nextPreview = null;
            } else {
              nextKept = nextKept.filter((k) => k !== id);
            }
            const remaining = [...nextKept, ...(nextPreview ? [nextPreview] : [])];
            if (remaining.length === 0) {
              nextPreview = 'weekly';
              nextActive = 'weekly';
            } else if (nextActive === id) {
              nextActive = remaining[remaining.length - 1];
            }
            this.setState({ kept: nextKept, previewId: nextPreview, activeId: nextActive });
          }
        };
      }),
      notes: NOTES.map((n) => {
        const isAct = n.id === activeId;
        const isKept = kept.includes(n.id);
        const isPrev = n.id === previewId;
        return {
          title: n.title,
          rowClass: isAct ? 'row row-active' : 'row',
          stroke: isAct ? '#3559a8' : '#3d4856',
          fill: isAct ? '#c5d6f5' : 'none',
          badge: isKept ? '常驻' : (isPrev ? '预览中' : ''),
          click: () => this.clickNote(n.id)
        };
      })
    };
  }
}
</script>
</body>
</html>
