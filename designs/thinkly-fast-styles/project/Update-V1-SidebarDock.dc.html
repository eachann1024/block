<helmet>
<style>
body{margin:0}
a{color:#2f5ec4}a:hover{color:#1f4494}
button{font-family:inherit;cursor:pointer}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#3d4856;padding:0;cursor:pointer;flex:none}
.ib:hover{background:#eef3fc;color:#20242c}
.top-act{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #dcdcdc;border-radius:8px;background:#ffffff;color:#20242c;padding:0;cursor:pointer;flex:none;box-sizing:border-box}
.top-act:hover{background:#eef3fc;border-color:#547dd0}
.row{font:inherit;font-size:14px;line-height:20px;font-weight:400;width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#20242c;text-align:left;cursor:pointer;box-sizing:border-box}
.row:hover{background:#eef3fc}
.row-active{font:inherit;font-size:14px;line-height:20px;font-weight:500;width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:6px;background:#e5edfc;color:#20242c;box-shadow:inset 0 0 0 1px #547dd0;text-align:left;cursor:pointer;box-sizing:border-box}
.vault-ghost{font:inherit;font-size:14px;line-height:20px;font-weight:500;flex:1;min-width:0;height:30px;padding:0 8px;border-radius:6px;background:transparent;color:#20242c;border:0;display:inline-flex;align-items:center;gap:7px;cursor:pointer;box-sizing:border-box;text-align:left}
.vault-ghost:hover{background:#eef3fc}
.dock-btn{width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#3d4856;padding:0;cursor:pointer;box-sizing:border-box;position:relative}
.dock-btn:hover{background:#eef3fc;color:#20242c}

/* 方案 B 底栏更新按钮：1. 气泡先出 -> 2. 图标落位 -> 3. 折返涂鸦乱线播完即隐 + 悬停双色 Duo */
@keyframes dockPuffA1{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(-22px,-22px) scale(1);opacity:0}}
@keyframes dockPuffA2{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(-9px,-30px) scale(1.05);opacity:0}}
@keyframes dockPuffA3{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(10px,-29px) scale(1);opacity:0}}
@keyframes dockPuffA4{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(25px,-18px) scale(1.04);opacity:0}}
@keyframes dockPuffA5{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(-27px,-4px) scale(.95);opacity:0}}
@keyframes dockPuffA6{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(28px,2px) scale(.95);opacity:0}}
@keyframes dockPuffA7{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(0px,-34px) scale(.92);opacity:0}}

@keyframes dockPuffB1{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(-22px,-22px) scale(1);opacity:0}}
@keyframes dockPuffB2{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(-9px,-30px) scale(1.05);opacity:0}}
@keyframes dockPuffB3{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(10px,-29px) scale(1);opacity:0}}
@keyframes dockPuffB4{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(25px,-18px) scale(1.04);opacity:0}}
@keyframes dockPuffB5{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(-27px,-4px) scale(.95);opacity:0}}
@keyframes dockPuffB6{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(28px,2px) scale(.95);opacity:0}}
@keyframes dockPuffB7{0%{transform:translate(0,5px) scale(.2);opacity:0}15%{opacity:.96}100%{transform:translate(0px,-34px) scale(.92);opacity:0}}

@keyframes dockIconA{0%,22%{transform:translateY(8px) scale(0);opacity:0}42%{transform:translateY(-3px) scale(1.12);opacity:1}54%{transform:translateY(1px) scale(.97);opacity:1}64%,100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes dockIconB{0%,22%{transform:translateY(8px) scale(0);opacity:0}42%{transform:translateY(-3px) scale(1.12);opacity:1}54%{transform:translateY(1px) scale(.97);opacity:1}64%,100%{transform:translateY(0) scale(1);opacity:1}}

@keyframes dockTangleA{0%,36%{stroke-dashoffset:520;opacity:0}40%{opacity:1}68%{stroke-dashoffset:0;opacity:1}80%{stroke-dashoffset:0;opacity:.9}98%,100%{stroke-dashoffset:-520;opacity:0}}
@keyframes dockTangleB{0%,36%{stroke-dashoffset:520;opacity:0}40%{opacity:1}68%{stroke-dashoffset:0;opacity:1}80%{stroke-dashoffset:0;opacity:.9}98%,100%{stroke-dashoffset:-520;opacity:0}}
@keyframes dockZigA{0%,40%{stroke-dashoffset:320;opacity:0}44%{opacity:1}72%{stroke-dashoffset:0;opacity:1}82%{stroke-dashoffset:0;opacity:.85}99%,100%{stroke-dashoffset:-320;opacity:0}}
@keyframes dockZigB{0%,40%{stroke-dashoffset:320;opacity:0}44%{opacity:1}72%{stroke-dashoffset:0;opacity:1}82%{stroke-dashoffset:0;opacity:.85}99%,100%{stroke-dashoffset:-320;opacity:0}}

.dock-anim-a .mp1{animation:dockPuffA1 .85s cubic-bezier(.215,.61,.355,1) forwards}
.dock-anim-a .mp2{animation:dockPuffA2 .92s cubic-bezier(.215,.61,.355,1) .02s forwards}
.dock-anim-a .mp3{animation:dockPuffA3 .84s cubic-bezier(.215,.61,.355,1) .04s forwards}
.dock-anim-a .mp4{animation:dockPuffA4 .96s cubic-bezier(.215,.61,.355,1) .01s forwards}
.dock-anim-a .mp5{animation:dockPuffA5 .90s cubic-bezier(.215,.61,.355,1) .05s forwards}
.dock-anim-a .mp6{animation:dockPuffA6 .94s cubic-bezier(.215,.61,.355,1) .03s forwards}
.dock-anim-a .mp7{animation:dockPuffA7 .88s cubic-bezier(.215,.61,.355,1) .06s forwards}
.dock-anim-a .u-icon{animation:dockIconA 1.35s cubic-bezier(.22,1,.36,1) forwards}
.dock-anim-a .s-tangle{stroke-dasharray:520;animation:dockTangleA 1.85s cubic-bezier(.22,1,.36,1) forwards}
.dock-anim-a .s-zig{stroke-dasharray:320;animation:dockZigA 1.95s cubic-bezier(.22,1,.36,1) forwards}

.dock-anim-b .mp1{animation:dockPuffB1 .85s cubic-bezier(.215,.61,.355,1) forwards}
.dock-anim-b .mp2{animation:dockPuffB2 .92s cubic-bezier(.215,.61,.355,1) .02s forwards}
.dock-anim-b .mp3{animation:dockPuffB3 .84s cubic-bezier(.215,.61,.355,1) .04s forwards}
.dock-anim-b .mp4{animation:dockPuffB4 .96s cubic-bezier(.215,.61,.355,1) .01s forwards}
.dock-anim-b .mp5{animation:dockPuffB5 .90s cubic-bezier(.215,.61,.355,1) .05s forwards}
.dock-anim-b .mp6{animation:dockPuffB6 .94s cubic-bezier(.215,.61,.355,1) .03s forwards}
.dock-anim-b .mp7{animation:dockPuffB7 .88s cubic-bezier(.215,.61,.355,1) .06s forwards}
.dock-anim-b .u-icon{animation:dockIconB 1.35s cubic-bezier(.22,1,.36,1) forwards}
.dock-anim-b .s-tangle{stroke-dasharray:520;animation:dockTangleB 1.85s cubic-bezier(.22,1,.36,1) forwards}
.dock-anim-b .s-zig{stroke-dasharray:320;animation:dockZigB 1.95s cubic-bezier(.22,1,.36,1) forwards}

.duo-btn{
  width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #dcdcdc;border-radius:6px;background:#ffffff;color:#52514e;padding:0;cursor:pointer;box-sizing:border-box;position:relative;
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.duo-btn .duo-fill-tray{fill:#c9d8f3;opacity:0;transform:scaleX(.4);transform-origin:12px 17px;transition:opacity .22s ease,transform .24s cubic-bezier(.22,1,.36,1)}
.duo-btn .duo-fill-wing{fill:#c9d8f3;opacity:0;transform:translateY(-2px) scale(.55);transform-origin:12px 12px;transition:opacity .22s ease,transform .24s cubic-bezier(.22,1,.36,1)}
.duo-btn .duo-line{stroke:#52514e;transition:stroke .2s ease,transform .24s cubic-bezier(.22,1,.36,1)}
.duo-btn .duo-accent{stroke:#52514e;transition:stroke .2s ease}
.duo-btn:hover{background:#eef3fc;border-color:#547dd0;box-shadow:0 4px 12px rgba(84,125,208,0.18)}
.duo-btn:hover .duo-fill-tray{opacity:1;transform:scaleX(1)}
.duo-btn:hover .duo-fill-wing{opacity:1;transform:translateY(1px) scale(1)}
.duo-btn:hover .duo-line{stroke:#1f1e1d;transform:translateY(1px)}
.duo-btn:hover .duo-accent{stroke:#547dd0}

.puff-fill{position:absolute;top:50%;left:50%;border-radius:50%;background:#c9d8f3;box-shadow:inset 0 0 0 1.5px #547dd0;pointer-events:none}
.puff-acc{position:absolute;top:50%;left:50%;border-radius:50%;background:rgba(84,125,208,0.26);box-shadow:inset 0 0 0 1.5px #20242c;pointer-events:none}
.btn-secondary{height:34px;padding:0 16px;border-radius:8px;border:1px solid #dcdcdc;background:#ffffff;color:#20242c;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-secondary:hover{background:#f5f6f8}
.btn-primary{height:34px;padding:0 18px;border-radius:8px;border:1px solid #3d63b8;background:#476ec2;color:#ffffff;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-primary:hover{background:#3b5fb0}
</style>
</helmet>

<div style="width:100%;min-height:900px;position:relative;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;font-size:14px;line-height:20px;overflow:hidden">

  <header style="height:40px;flex:none;display:flex;align-items:center;border-bottom:1px solid #e6e6e6;box-sizing:border-box;background:#f1f1f1">
    <div style="width:260px;flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 10px 0 16px;border-right:1px solid #e6e6e6">
      <div aria-hidden="true" style="display:flex;gap:8px;flex:none;margin-right:auto">
        <span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
        <span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span>
        <span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span>
      </div>
      <button type="button" class="ib" aria-label="{{s.sidebarToggleAria}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.75 4.75H9.25V19.25H5.75A2 2 0 0 1 3.75 17.25V6.75A2 2 0 0 1 5.75 4.75Z" fill="#c9d8f3"></path><rect x="3.75" y="4.75" width="16.5" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"></rect><path d="M9.25 4.75V19.25" stroke="currentColor" stroke-width="1.5"></path></svg>
      </button>
    </div>
    <nav aria-label="{{s.openTabsAria}}" style="flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px">
      <button type="button" style="font:inherit;font-size:14px;font-weight:500;height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:6px;background:#e5edfc;color:#20242c;box-shadow:inset 0 0 0 1px #547dd0;cursor:pointer">
        <span>{{s.activeDocTitle}}</span>
      </button>
      <button type="button" onClick="{{replayAnim}}" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid #d5dbe3;background:#ffffff;color:#1d3f8a;font-size:14px;font-weight:500">重播左下角更新图标动效</button>
    </nav>
  </header>

  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">
    <aside aria-label="{{s.sidebarAria}}" style="width:260px;flex:none;background:#fafafa;border-right:1px solid #e6e6e6;box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
      <div style="padding:10px 10px 8px;display:flex;align-items:center;gap:6px">
        <button type="button" style="font:inherit;font-size:14px;flex:1;min-width:0;height:32px;padding:0 9px;border-radius:8px;background:#ffffff;color:#526071;border:1px solid #dcdcdc;display:flex;align-items:center;gap:6px;cursor:pointer;box-sizing:border-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="#c9d8f3" stroke="currentColor" stroke-width="1.5"></circle><path d="M15.25 15.25L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
          <span style="flex:1;text-align:left">{{s.searchLabel}}</span>
          <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:#526071">⇧⌘K</span>

        </button>
      </div>

      <div style="flex:1;min-height:0;overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px">

          <span>{{s.activeDocTitle}}</span>
        </button>
        <button type="button" class="row">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.75 3.75H13.5L18.75 9V18.5A1.75 1.75 0 0 1 17 20.25H6.75A1.75 1.75 0 0 1 5 18.5V5.5A1.75 1.75 0 0 1 6.75 3.75Z" fill="#c9d8f3" stroke="currentColor" stroke-width="1.5"></path></svg>
          <span>{{s.doc2Title}}</span>
        </button>
        <button type="button" class="row">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.75 3.75H13.5L18.75 9V18.5A1.75 1.75 0 0 1 17 20.25H6.75A1.75 1.75 0 0 1 5 18.5V5.5A1.75 1.75 0 0 1 6.75 3.75Z" fill="#c9d8f3" stroke="currentColor" stroke-width="1.5"></path></svg>
          <span>{{s.doc3Title}}</span>
        </button>
      </div>

      <div style="padding:6px 8px;border-top:1px solid #e4e6ea;display:flex;align-items:center;gap:4px;background:#fafafa;overflow:visible">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.75 18.75V7.5A2.25 2.25 0 0 1 6 5.25H9L12 8.25H18A2.25 2.25 0 0 1 20.25 10.5V18.75Z" fill="#c9d8f3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{s.vaultName}}</span>
        </button>
        <div aria-hidden="true" style="width:1px;height:16px;background:#e4e6ea"></div>
        <!-- 方案 B 三步进场动画包裹层（1. 气泡先出 -> 2. 显示图标 -> 3. 折返涂鸦乱线播完即隐 + 悬停双色 Duo） -->
        <div class="{{dockAnimClass}}" style="position:relative;width:30px;height:30px;display:flex;align-items:center;justify-content:center;overflow:visible">

            <span class="puff-fill mp5" style="width:9px;height:9px;margin-left:-4.5px;margin-top:-4.5px"></span>
            <span class="puff-acc mp6" style="width:12px;height:12px;margin-left:-6px;margin-top:-6px"></span>
            <span class="puff-fill mp7" style="width:10px;height:10px;margin-left:-5px;margin-top:-5px"></span>
          </div>
          <svg width="60" height="54" viewBox="0 0 240 210" fill="none" aria-hidden="true" style="position:absolute;left:-15px;top:-14px;pointer-events:none;overflow:visible">

        </button>

        <div style="flex:1;min-height:0;overflow:auto;padding:28px 32px 24px;display:flex;flex-direction:column;gap:24px">
          <section style="display:flex;flex-direction:column;gap:12px;padding-bottom:22px;border-bottom:1px solid #eceef2">
