<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>双色</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button{font-family:inherit}
.ico{width:24px;height:24px;display:block;color:#20242c}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px 8px}
.name{font-size:12px;line-height:16px;color:#526071;text-align:center}
.cap{margin:0;font-size:12px;line-height:16px;color:#526071;letter-spacing:.04em}
.swatch{display:inline-flex;align-items:center;gap:6px}
.chip{width:12px;height:12px;background:#c9d8f3;border:1px solid #547dd0;box-sizing:border-box}
.row{font:inherit;font-size:13px;line-height:18px;width:100%;height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#20242c;text-align:left;cursor:pointer;box-sizing:border-box}
.row:hover{background:#eef3fc}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#20242c;padding:0;cursor:pointer}
.ib:hover{background:#eef3fc}
.hbtn{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:#526071;padding:0;cursor:pointer}
.hbtn:hover{background:#eef3fc;color:#20242c}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;padding:32px 40px 28px;display:flex;flex-direction:column;gap:22px;background:#ffffff;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c">

<header style="display:flex;align-items:baseline;justify-content:space-between;gap:24px">

<p style="margin:0;font-size:14px;line-height:20px;color:#526071">1.5px 圆端主线用 currentColor，浅色面 #c9d8f3 标出关键部位，16px 仍可辨认。</p>
</div>
<p class="cap swatch"><span class="chip" aria-hidden="true"></span>24 × 24 · #c9d8f3 / #547dd0</p>
</header>

<div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px 0">

<div class="cell">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h7l2 2h9v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="#c9d8f3"></path><path d="M3 9V7.5A1.5 1.5 0 0 1 4.5 6H9l2 2"></path></svg>

<div class="cell">

<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.6" fill="#c9d8f3"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="18" cy="12" r="1.6" fill="#547dd0"></circle></svg>

<p class="cap">文件树 · 16px</p>
<div style="display:flex;flex-direction:column;gap:2px">
<button class="row"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="#c9d8f3" stroke="none"></path><path d="M6 9l6 6 6-6"></path></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="#c9d8f3"></path><path d="M3 10V8a1 1 0 0 1 1-1h5l2 2"></path><path d="M3 14h18"></path></svg>会议记录</button>
