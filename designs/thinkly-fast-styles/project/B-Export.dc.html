<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>石墨 · 生成图片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: #6cb6c9; }
a:hover { color: #9ed0dc; }
</style>
</helmet>
<div style="height: 900px; box-sizing: border-box; background: #1c1c1e; color: #ececec; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1c1c1e; border-bottom: 1px solid #2c2c2e; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 6px; flex: none">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57; display: block"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e; display: block"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840; display: block"></span>
    </div>
    <div style="flex: 1; min-width: 0; text-align: center; color: #a8a8ad; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">生成图片 — 周会笔记</div>
    <div style="width: 52px; flex: none"></div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex">

    <section style="flex: 1; min-width: 0; background: #18181a; display: flex; flex-direction: column; min-height: 0" aria-label="图片预览">
      <div style="height: 36px; flex: none; display: flex; align-items: center; padding: 0 16px; color: #a8a8ad; font-size: 12px; border-bottom: 1px solid #2c2c2e; box-sizing: border-box">预览 · 选中的 1 个块</div>
      <div style="flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; padding: 36px 32px 48px; box-sizing: border-box">
        <div style="width: 100%; max-width: 560px; align-self: flex-start; background: #18181a; border: 1px solid #2c2c2e; border-radius: 6px; box-sizing: border-box; padding: 36px 32px 28px; display: flex; flex-direction: column; gap: 20px">
          <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #ececec">选中这一段时，工具栏只留加粗、斜体、删除线、行内代码、链接、标题级别，再加一个生成图片。</p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid #2c2c2e">
            <span style="color: #a8a8ad; font-size: 12px">周会笔记</span>
            <span style="color: #6cb6c9; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">THINKLY</span>
          </div>
        </div>
      </div>
    </section>

    <aside style="width: 280px; flex: none; background: #222224; border-left: 1px solid #2c2c2e; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box">
      <div style="flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 18px">

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="color: #a8a8ad; font-size: 12px; font-weight: 500">范围</div>
          <div style="display: flex; gap: 6px">
            <button type="button" style="flex: 1; height: 28px; box-sizing: border-box; background: transparent; color: #a8a8ad; border: 1px solid #3a3a3c; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer">整篇</button>
            <button type="button" style="flex: 1; height: 28px; box-sizing: border-box; background: transparent; color: #ececec; border: 1px solid #6cb6c9; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">选中生成</button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="color: #a8a8ad; font-size: 12px; font-weight: 500">主题</div>
          <div style="display: flex; gap: 6px">
            <button type="button" style="flex: 1; height: 28px; box-sizing: border-box; background: transparent; color: #a8a8ad; border: 1px solid #3a3a3c; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer">浅色</button>
            <button type="button" style="flex: 1; height: 28px; box-sizing: border-box; background: transparent; color: #ececec; border: 1px solid #6cb6c9; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">深色</button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="color: #a8a8ad; font-size: 12px; font-weight: 500">宽度</div>
          <div style="height: 28px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border: 1px solid #3a3a3c; border-radius: 6px; color: #ececec">标准 · 720</div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px">
          <label for="wm" style="color: #ececec; font-size: 13px">水印</label>
          <input id="wm" type="checkbox" checked aria-label="水印" style="width: 16px; height: 16px; margin: 0; accent-color: #6cb6c9; cursor: pointer">
        </div>

      </div>

      <div style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid #2c2c2e">
        <button type="button" style="height: 32px; box-sizing: border-box; background: #6cb6c9; color: #101416; border: none; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">保存 PNG</button>
        <button type="button" style="height: 32px; box-sizing: border-box; background: transparent; color: #ececec; border: 1px solid #3a3a3c; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">复制</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
