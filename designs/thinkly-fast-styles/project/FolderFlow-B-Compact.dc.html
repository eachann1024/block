<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文件夹设置 B · 紧凑单卡与纯名称排除标签</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button,input{font-family:inherit}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;padding:0;cursor:pointer;flex:none}
.nav-row{font:inherit;font-size:14px;line-height:20px;width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;box-sizing:border-box}
.btn{font:inherit;font-size:14px;line-height:20px;font-weight:460;height:34px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;white-space:nowrap;flex:none}
.field-input{font:inherit;font-size:14px;line-height:20px;height:34px;padding:0 10px;border-radius:8px;box-sizing:border-box;outline:none}
.tag-chip{font-size:13px;line-height:18px;height:30px;padding:0 8px 0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:{{shellBg}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:{{textPrimary}};font-size:14px;line-height:20px;overflow:hidden;-webkit-font-smoothing:antialiased">

<header style="height:40px;flex:none;display:flex;align-items:center;border-bottom:1px solid {{sidebarBorder}};box-sizing:border-box;background:{{shellBg}}">
<div style="width:260px;flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 10px 0 16px;border-right:1px solid {{sidebarBorder}}">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<button type="button" class="ib" aria-label="收起侧栏" style="margin-left:auto;color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M3.75 4.75H9.25V19.25H5.75A2 2 0 0 1 3.75 17.25V6.75A2 2 0 0 1 5.75 4.75Z" fill="{{iconFill}}"></path>
<rect x="3.75" y="4.75" width="16.5" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"></rect>
<path d="M9.25 4.75V19.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
<path d="M15.75 9.75L13.25 12L15.75 14.25" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>

<div style="flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box">
<div style="display:flex;align-items:center;gap:6px;color:{{textSecondary}}">
<span>设置</span>
<span>/</span>
<span style="color:{{textPrimary}};font-weight:460">文件夹</span>
</div>
<div style="display:flex;align-items:center;gap:8px">
<button type="button" class="btn" onClick="{{toggleDarkPreview}}" style="height:28px;padding:0 10px;background:{{cardBg}};color:{{textPrimary}};border:1px solid {{btnBorder}}">{{themeToggleLabel}}</button>
</div>
</div>
</header>

<div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">

<aside aria-label="设置分类导航" style="width:260px;flex:none;background:{{sidebarBg}};border-right:1px solid {{sidebarBorder}};box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
<div style="padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between">
<span style="font-size:18px;line-height:24px;font-weight:560;color:{{textPrimary}}">设置</span>
</div>
<nav aria-label="设置分类" style="flex:1;min-height:0;padding:4px 10px;display:flex;flex-direction:column;gap:4px">
<button type="button" class="nav-row" style="color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><path d="M12 3.5L14.2 9.3L20 11.5L14.2 13.7L12 19.5L9.8 13.7L4 11.5L9.8 9.3L12 3.5Z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><path d="M18.5 4V7M17 5.5H20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>AI 助手</span>
</button>
<button type="button" class="nav-row" style="color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><rect x="3.5" y="4.5" width="17" height="12" rx="2" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5"></rect><path d="M8 20H16M12 16.5V20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>外观与字体</span>
</button>
<button type="button" class="nav-row" style="background:{{selectedBg}};color:{{textPrimary}};box-shadow:{{activeRing}};font-weight:460">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><path d="M3.75 6.75h5.5l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
<span>文件夹</span>
</button>
<button type="button" class="nav-row" style="color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><rect x="3.25" y="5.75" width="17.5" height="12.5" rx="2" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5"></rect><path d="M7 10H8.5M11.25 10H12.75M15.5 10H17M7.5 14H16.5" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>快捷键</span>
</button>
</nav>
<div style="flex:none;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid {{sidebarBorder}}">
<span style="color:{{textSecondary}}">本地笔记</span>
<button type="button" style="height:28px;padding:0 10px;border:1px solid {{btnBorder}};border-radius:6px;background:{{cardBg}};color:{{textPrimary}};font-size:14px;font-weight:460;display:inline-flex;align-items:center;gap:6px;cursor:pointer">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 6.25L4.75 12L10.5 17.75"></path><path d="M5.25 12H19.25"></path></svg>
<span>返回笔记</span>
</button>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;background:{{settingsBg}};overflow:auto">
<div style="box-sizing:border-box;width:100%;max-width:720px;margin:0 auto;padding:40px 28px 64px;display:flex;flex-direction:column;gap:20px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<h1 style="margin:0;font-size:24px;line-height:32px;font-weight:560;color:{{textPrimary}}">文件夹设置</h1>
<button type="button" class="btn" style="background:{{cardBg}};color:{{textPrimary}};border:1px solid {{btnBorder}}">完成</button>
</div>

<section aria-label="资源与排除设置" style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:20px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<div>
<div style="font-weight:500;color:{{textPrimary}}">图片保存目录</div>
<div style="font-size:13px;color:{{textSecondary}};margin-top:2px">插入与粘贴的本地图片自动存入此目录</div>
</div>
<div style="display:flex;align-items:center;gap:8px">
<input type="text" value="{{assetsDir}}" onInput="{{onAssetsDirInput}}" class="field-input" style="width:160px;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}};font-family:'JetBrains Mono',monospace">
<span style="height:34px;padding:0 10px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textSecondary}};font-family:'JetBrains Mono',monospace;display:inline-flex;align-items:center">{{assetsPathPreview}}</span>
<sc-if value="{{isAssetsCustom}}" hint-placeholder-val="{{false}}">
<button type="button" class="btn" onClick="{{resetAssetsDir}}" style="height:34px;background:{{shellBg}};color:{{textSecondary}};border:1px solid {{borderCol}}">重置</button>
</sc-if>
</div>
</div>

<div style="height:1px;background:{{borderCol}}"></div>

<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<div>
<div style="font-weight:500;color:{{textPrimary}}">隐藏文件夹</div>
<div style="font-size:13px;color:{{textSecondary}};margin-top:2px">隐藏后不出现在侧栏与搜索中，不删除本地文件</div>
</div>
</div>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:36px;padding:10px 12px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}}">
<sc-if value="{{hasAssetsHidden}}" hint-placeholder-val="{{true}}">
<span class="tag-chip" style="background:{{cardBg}};border:1px solid {{borderCol}};color:{{textPrimary}}">
<span style="font-family:'JetBrains Mono',monospace">{{assetsDir}}</span>
<span style="font-size:11px;color:{{accent}};padding:1px 4px;border-radius:4px;background:{{selectedBg}}">资源</span>
<button type="button" class="ib" onClick="{{removeAssetsHidden}}" aria-label="显示 assets" style="width:18px;height:18px;color:{{textSecondary}}">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
</button>
</span>
</sc-if>
<sc-if value="{{hasTempHidden}}" hint-placeholder-val="{{true}}">
<span class="tag-chip" style="background:{{cardBg}};border:1px solid {{borderCol}};color:{{textPrimary}}">
<span style="font-family:'JetBrains Mono',monospace">temp</span>
<button type="button" class="ib" onClick="{{removeTempHidden}}" aria-label="显示 temp" style="width:18px;height:18px;color:{{textSecondary}}">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
</button>
</span>
</sc-if>
<sc-if value="{{hasArchiveHidden}}" hint-placeholder-val="{{true}}">
<span class="tag-chip" style="background:{{cardBg}};border:1px solid {{borderCol}};color:{{textPrimary}}">
<span style="font-family:'JetBrains Mono',monospace">archive</span>
<button type="button" class="ib" onClick="{{removeArchiveHidden}}" aria-label="显示 archive" style="width:18px;height:18px;color:{{textSecondary}}">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
</button>
</span>
</sc-if>
</div>

<div style="display:flex;align-items:center;gap:8px">
<input type="text" placeholder="输入文件夹名称，如 dist 或 cache..." class="field-input" style="flex:1;background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}}">
<button type="button" class="btn" style="background:{{cardBg}};color:{{textPrimary}};border:1px solid {{btnBorder}}">添加隐藏</button>
</div>
</div>

<details style="border-top:1px solid {{borderCol}};padding-top:12px">
<summary style="font-size:13px;color:{{textSecondary}};cursor:pointer;user-select:none">高级规则（正则表达式）</summary>
<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
<input type="text" placeholder="^(temp|archive|\..*)$" class="field-input" style="background:{{shellBg}};border:1px solid {{borderCol}};color:{{textPrimary}};font-family:'JetBrains Mono',monospace">
<span style="font-size:12px;color:{{textSecondary}}">直接输入文件夹名即可精准隐藏；正则表达式供需要模式匹配的复杂场景使用。</span>
</div>
</details>

</section>

</div>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      darkOverride: null,
      assetsDir: 'assets',
      hideAssets: true,
      hideTemp: true,
      hideArchive: true
    };
  }

  renderVals() {
    const st = this.state || {};
    const props = this.props || {};
    const mode = st.darkOverride ?? (props.theme ?? 'light');
    const dark = mode === 'dark';

    const shellBg = dark ? '#343434' : '#f1f1f1';
    const sidebarBg = dark ? '#222222' : '#fafafa';
    const settingsBg = dark ? '#181818' : '#f8f8f8';
    const cardBg = dark ? '#222222' : '#ffffff';
    const textPrimary = dark ? '#ececec' : '#20242c';
    const textSecondary = dark ? '#b4b4b4' : '#526071';
    const accent = dark ? '#779de8' : '#547dd0';
    const iconFill = dark ? '#31456a' : '#c9d8f3';
    const selectedBg = dark ? '#343434' : '#e5edfc';
    const borderCol = dark ? '#2e2e2e' : '#e4e6ea';
    const sidebarBorder = dark ? '#333333' : '#e6e6e6';
    const btnBorder = dark ? '#444444' : '#dcdcdc';
    const activeRing = 'inset 0 0 0 1px ' + accent;

    const rawAssets = (st.assetsDir ?? 'assets').trim();
    const assetsDir = rawAssets || 'assets';

    return {
      shellBg, sidebarBg, settingsBg, cardBg, textPrimary, textSecondary,
      accent, iconFill, selectedBg, borderCol, sidebarBorder, btnBorder, activeRing,
      assetsDir,
      assetsPathPreview: './' + assetsDir + '/',
      isAssetsCustom: assetsDir !== 'assets',
      themeToggleLabel: dark ? '深色' : '浅色',
      hasAssetsHidden: st.hideAssets ?? true,
      hasTempHidden: st.hideTemp ?? true,
      hasArchiveHidden: st.hideArchive ?? true,

      toggleDarkPreview: () => this.setState({ darkOverride: dark ? 'light' : 'dark' }),
      onAssetsDirInput: (e) => { if (e && e.target) this.setState({ assetsDir: e.target.value }); },
      resetAssetsDir: () => this.setState({ assetsDir: 'assets' }),
      removeAssetsHidden: () => this.setState({ hideAssets: false }),
      removeTempHidden: () => this.setState({ hideTemp: false }),
      removeArchiveHidden: () => this.setState({ hideArchive: false })
    };
  }
}
</script>
</body>
</html>
