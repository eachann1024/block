<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>全局搜索</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button,input{font-family:inherit}
.row{font:inherit;font-size:14px;line-height:20px;width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#20242c;text-align:left;cursor:pointer;box-sizing:border-box}
.btn{font:inherit;font-size:13px;font-weight:460;height:36px;padding:0 8px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;white-space:nowrap}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}
.btn-1{background:#2f3540;color:#ffffff;border:0}
.kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:#f1f1f1;border:1px solid #e1e1e1;font-size:11px;color:#526071}
.hit{font:inherit;width:100%;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;color:#20242c}
.hit:hover{background:#eef3fc}
mark{background:#fbe7a6;color:inherit;border-radius:2px}
</style>
</helmet>
<div style="width:100%;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;font-size:14px;line-height:20px;overflow:hidden;position:relative">

<header style="height:40px;flex:none;display:flex;align-items:center;padding:0 16px;gap:12px">
<div aria-hidden="true" style="display:flex;gap:8px;width:52px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<div style="flex:1;text-align:center;font-size:13px;color:#526071">周会 11-03</div>
<div aria-hidden="true" style="width:52px;flex:none"></div>
</header>

<div style="flex:1;min-height:0;display:flex">
<aside aria-label="文件列表" style="width:260px;flex:none;background:#fafafa;border-right:1px solid #e6e6e6;box-sizing:border-box;display:flex;flex-direction:column">
<div style="display:flex;gap:8px;padding:12px 12px 8px">
<button class="btn btn-2" style="flex:1;min-width:0">选择文件夹</button>
<button class="btn btn-1" style="flex:1;min-width:0">新建笔记</button>
</div>
<div style="padding:0 12px 8px">
<button class="btn btn-2" style="width:100%;justify-content:flex-start;height:32px;color:#526071;font-weight:400;box-shadow:inset 0 0 0 1px #547dd0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg><span style="flex:1;text-align:left">搜索笔记</span><span class="kbd">⌘⇧K</span></button>
</div>
<div style="padding:4px 20px 6px;font-size:12px;line-height:16px;color:#526071">本地笔记</div>
<div style="padding:0 8px;display:flex;flex-direction:column;gap:2px">
<button class="row">会议记录</button>
<button class="row" style="padding-left:28px;background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0">周会 11-03</button>
<button class="row" style="padding-left:28px">需求评审</button>
<button class="row">产品原则</button>
<button class="row">发布清单</button>
</div>
</aside>
<main style="flex:1;min-width:0;background:#ffffff"></main>
</div>

<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(32,36,44,.18)"></div>

<div role="dialog" aria-label="搜索笔记" style="position:absolute;top:96px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 48px));background:#ffffff;border:1px solid #e4e4e4;border-radius:12px;box-shadow:0 24px 60px rgba(32,36,44,.18);display:flex;flex-direction:column;overflow:hidden">
<label style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid #ececec">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">搜索全部笔记</span>
<input value="异步" placeholder="搜索标题与正文" style="flex:1;min-width:0;height:36px;border:0;outline:0;font-size:16px;color:#20242c;background:transparent">
<span class="kbd">esc</span>
</label>

<div style="padding:8px;display:flex;flex-direction:column;gap:2px;max-height:460px;overflow:auto">
<div style="padding:6px 12px 2px;font-size:12px;line-height:16px;color:#526071">标题匹配</div>
<button class="hit" style="background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0">
<span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>把周会改成<mark>异步</mark><span style="margin-left:auto;font-size:12px;font-weight:400;color:#526071">会议记录 / 周会 11-03</span></span>
<span style="padding-left:22px;font-size:13px;color:#526071">上周排了三场同步会，两场结束时没有结论……</span>
</button>
<div style="padding:10px 12px 2px;font-size:12px;line-height:16px;color:#526071">正文匹配 · 3 处</div>
<button class="hit">
<span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>产品原则<span style="margin-left:auto;font-size:12px;font-weight:400;color:#526071">2 处</span></span>
<span style="padding-left:22px;font-size:13px;color:#526071">……默认<mark>异步</mark>沟通，只有需要当场拍板时才开会……</span>
</button>
<button class="hit">
<span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#526071" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>需求评审<span style="margin-left:auto;font-size:12px;font-weight:400;color:#526071">会议记录 / 需求评审</span></span>
<span style="padding-left:22px;font-size:13px;color:#526071">……评审意见改为<mark>异步</mark>批注，周三前收齐……</span>
</button>
</div>

<div style="display:flex;align-items:center;gap:16px;height:36px;padding:0 16px;border-top:1px solid #ececec;background:#fafafa;font-size:12px;color:#526071">
<span style="display:flex;align-items:center;gap:6px"><span class="kbd">↑</span><span class="kbd">↓</span>选择</span>
<span style="display:flex;align-items:center;gap:6px"><span class="kbd">↵</span>打开</span>
<span style="display:flex;align-items:center;gap:6px"><span class="kbd">esc</span>关闭</span>
<span style="margin-left:auto">⌘⇧K 搜索与全局唤起</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
