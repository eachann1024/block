<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成图片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button{font-family:inherit}
.ib{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#526071;padding:0;cursor:pointer}
.ib:hover{background:#eef3fc;color:#20242c}
.btn{font:inherit;font-size:13px;font-weight:460;height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}
.btn-2:hover{background:#f7f7f7}
.btn-1{background:#2f3540;color:#ffffff;border:0}
.btn-1:hover{background:#3b4250}
.seg{font:inherit;font-size:13px;font-weight:460;flex:1;height:28px;border:0;border-radius:6px;cursor:pointer;color:#526071;background:transparent}
.seg:hover{color:#20242c}
.sw{position:relative;width:30px;height:18px;border-radius:9px;border:0;padding:0;cursor:pointer;background:#547dd0}
.sw span{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transform:translateX(12px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:100%;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;font-size:14px;line-height:20px;overflow:hidden">

<header style="height:40px;flex:none;display:flex;align-items:center;padding:0 16px;gap:12px">
<div aria-hidden="true" style="display:flex;gap:8px;width:52px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0">
<button class="ib" aria-label="返回笔记"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span style="font-size:13px;font-weight:560">生成图片</span>
<span style="font-size:13px;color:#526071">周会 11-03</span>
</div>
<div aria-hidden="true" style="width:52px;flex:none"></div>
</header>

<div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">

<main style="flex:999 1 560px;min-width:0;background:#e9e9e9;overflow:auto">
<div style="min-height:100%;box-sizing:border-box;display:flex;justify-content:center;align-items:flex-start;padding:48px 32px">
<div style="width:100%;max-width:480px;background:#ffffff;border:1px solid #ececec;border-radius:10px;box-sizing:border-box;padding:32px 28px 20px;display:flex;flex-direction:column;gap:14px">
<div style="font-size:12px;line-height:16px;color:#526071">周会 11-03</div>
<p style="margin:0;font-size:17px;line-height:1.5">试点两周。周五回看时只记录偏差，不把进度再讲一遍。</p>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:12px;border-top:1px solid #f0f0f0;font-size:12px;line-height:16px;color:#526071">
<span>thinkly-fast</span>
<span>2026-11-03</span>
</div>
</div>
</div>
</main>

<aside aria-label="生成选项" style="width:300px;flex:none;background:#ffffff;border-left:1px solid #e6e6e6;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0;overflow:auto">
<section style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;line-height:16px;color:#526071;font-weight:460">范围</div>
<div style="display:flex;padding:2px;background:#f1f1f1;border-radius:8px">
<button class="seg">整篇</button>
<button class="seg" aria-pressed="true" style="background:#e5edfc;color:#20242c;box-shadow:inset 0 0 0 1px #547dd0">选中生成</button>
</div>
</section>
<section style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;line-height:16px;color:#526071;font-weight:460">主题</div>
<div style="display:flex;padding:2px;background:#f1f1f1;border-radius:8px">
<button class="seg" aria-pressed="true" style="background:#ffffff;color:#20242c;box-shadow:0 1px 2px rgba(0,0,0,.08)">浅色</button>
<button class="seg">深色</button>
</div>
</section>
<section style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;line-height:16px;color:#526071;font-weight:460">宽度</div>
<div style="height:36px;display:flex;align-items:center;padding:0 10px;border-radius:8px;background:#fafafa;color:#526071;font-size:13px">标准 · 720</div>
</section>
<div style="display:flex;align-items:center;justify-content:space-between;height:32px">
<span style="font-size:13px">水印</span>
<button class="sw" role="switch" aria-checked="true" aria-label="水印"><span></span></button>
</div>
<div style="flex:1"></div>
<button class="btn btn-1" style="width:100%"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>保存 PNG</button>
<button class="btn btn-2" style="width:100%"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>复制</button>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
