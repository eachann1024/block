<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自定义字体 · 方案 C 分栏实时预览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400;600&amp;family=LXGW+WenKai+TC:wght@400;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;600&amp;family=Fira+Code:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Lora:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
button,input{font-family:inherit}
.row{font:inherit;font-size:14px;line-height:20px;width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;box-sizing:border-box;transition:background-color 140ms ease-out}
.row:hover{background:var(--hover)}
.seg{font:inherit;font-size:14px;line-height:20px;font-weight:460;height:30px;padding:0 12px;border:0;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;white-space:nowrap;transition:background-color 180ms cubic-bezier(.16,1,.3,1),box-shadow 180ms cubic-bezier(.16,1,.3,1),color 180ms ease-out}
.chip{font:inherit;font-size:14px;line-height:20px;height:28px;padding:0 10px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;box-sizing:border-box;white-space:nowrap;transition:background-color 160ms ease-out,box-shadow 180ms cubic-bezier(.16,1,.3,1),color 160ms ease-out}
.chip:hover{background:var(--hover)}
.font{font-size:15px;line-height:20px;width:100%;padding:0 10px;border:0;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;box-sizing:border-box;overflow:hidden;transition:background-color 120ms ease-out,box-shadow 160ms cubic-bezier(.16,1,.3,1),height 260ms cubic-bezier(.16,1,.3,1),opacity 260ms cubic-bezier(.16,1,.3,1)}
.font:hover{background:var(--hover)}
.region{font:inherit;display:block;width:100%;margin:0;padding:6px 10px;border:0;border-radius:8px;text-align:left;cursor:pointer;box-sizing:border-box;transition:background-color 200ms ease-out,box-shadow 220ms cubic-bezier(.16,1,.3,1)}
.region:hover{background:var(--hover)}
.import{font:inherit;font-size:14px;line-height:20px;width:100%;height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box;transition:background-color 120ms ease-out}
.import:hover{background:var(--hover)}
.range{flex:1;min-width:0;accent-color:var(--accent);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:{{shellBg}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:{{textPrimary}};font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;--hover:{{hoverBg}};--accent:{{accent}};transition:background-color 200ms ease-out,color 200ms ease-out">

<header style="height:40px;flex:none;display:flex;align-items:center;border-bottom:1px solid {{sidebarBorder}};box-sizing:border-box">
<div style="width:260px;flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 16px;border-right:1px solid {{sidebarBorder}}">
<div aria-hidden="true" style="display:flex;gap:8px"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
</div>
<div style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 16px;color:{{textSecondary}}">
<span>设置</span><span>/</span><span style="color:{{textPrimary}};font-weight:460">外观与字体</span>
</div>
</header>

<div style="flex:1;min-height:0;display:flex">

<aside aria-label="设置分类导航" style="width:260px;flex:none;background:{{sidebarBg}};border-right:1px solid {{sidebarBorder}};box-sizing:border-box;display:flex;flex-direction:column">
<div style="padding:18px 16px 10px"><span style="font-size:18px;line-height:24px;font-weight:560">设置</span></div>
<nav aria-label="设置分类" style="padding:4px 10px;display:flex;flex-direction:column;gap:4px">
<button type="button" class="row" style="color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><path d="M12 3.5L14.2 9.3L20 11.5L14.2 13.7L12 19.5L9.8 13.7L4 11.5L9.8 9.3L12 3.5Z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><path d="M18.5 4V7M17 5.5H20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>AI 助手</span>
</button>
<button type="button" class="row" aria-current="page" style="background:{{selectedBg}};color:{{textPrimary}};box-shadow:inset 0 0 0 1px {{accent}};font-weight:460">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><rect x="3.5" y="4.5" width="17" height="12" rx="2" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5"></rect><path d="M8 20H16M12 16.5V20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>外观与字体</span>
</button>
<button type="button" class="row" style="color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><circle cx="9" cy="7" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle><circle cx="15" cy="12" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle><circle cx="10" cy="17" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle></svg>
<span>通用与编辑</span>
</button>
<button type="button" class="row" style="color:{{textSecondary}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><rect x="3.25" y="5.75" width="17.5" height="12.5" rx="2" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5"></rect><path d="M7 10H8.5M11.25 10H12.75M15.5 10H17M7.5 14H16.5" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>基础快捷键</span>
</button>
</nav>
</aside>

<main style="flex:1;min-width:0;background:{{settingsBg}};overflow:auto;transition:background-color 200ms ease-out">
<div style="max-width:720px;margin:0 auto;padding:40px 28px 64px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<h1 style="margin:0;font-size:24px;line-height:32px;font-weight:560">外观与字体</h1>
<div role="group" aria-label="外观主题" style="display:flex;gap:2px;padding:3px;background:{{shellBg}};border:1px solid {{borderCol}};border-radius:8px">
<sc-for list="{{themeSegs}}" as="s" hint-placeholder-count="2">
<button type="button" class="seg" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="background:{{s.bg}};color:{{s.col}};box-shadow:{{s.ring}}">{{s.label}}</button>
</sc-for>
</div>
</div>

<section style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:14px;display:flex;flex-wrap:wrap;overflow:hidden;transition:background-color 200ms ease-out,border-color 200ms ease-out">

<div style="flex:1 1 236px;max-width:100%;box-sizing:border-box;padding:14px 10px 10px;border-right:1px solid {{borderCol}};display:flex;flex-direction:column;gap:10px">
<label style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;margin:0 2px;border-radius:8px;background:{{shellBg}};border:1px solid {{btnBorder}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{textSecondary}}" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">搜索字体</span>
<input type="text" placeholder="搜索字体" value="{{query}}" onChange="{{onQuery}}" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;line-height:20px;color:{{textPrimary}};padding:0">
</label>
<div role="group" aria-label="字体分类" style="display:flex;flex-wrap:wrap;gap:4px;padding:0 2px">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="4">
<button type="button" class="chip" aria-pressed="{{ch.on}}" onClick="{{ch.pick}}" style="border:0;background:{{ch.bg}};color:{{ch.col}};box-shadow:{{ch.ring}}">{{ch.label}}</button>
</sc-for>
</div>
<div role="listbox" aria-label="{{roleLabel}}字体" onMouseLeave="{{endHover}}" style="height:300px;overflow:auto;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{fonts}}" as="f" hint-placeholder-count="8">
<button type="button" class="font" role="option" aria-selected="{{f.on}}" onClick="{{f.pick}}" onMouseEnter="{{f.hover}}" onFocus="{{f.hover}}" style="flex:none;height:{{f.h}}px;opacity:{{f.opacity}};background:{{f.bg}};box-shadow:{{f.ring}};color:{{textPrimary}}">
<span style="font-family:{{f.fam}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.name}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;opacity:{{f.check}};transition:opacity 140ms ease-out"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>
</sc-for>
<sc-if value="{{noResult}}" hint-placeholder-val="{{false}}">
<div style="padding:16px 10px;color:{{textSecondary}}">没有匹配的字体</div>
</sc-if>
</div>
<div style="border-top:1px solid {{borderCol}};padding-top:6px">
<sc-if value="{{importing}}" hint-placeholder-val="{{false}}">
<div style="height:34px;padding:0 10px;display:flex;flex-direction:column;justify-content:center;gap:6px">
<span style="color:{{textSecondary}}">Lora-Regular.ttf</span>
<div style="height:3px;border-radius:2px;background:{{shellBg}};overflow:hidden"><div style="height:100%;width:{{progress}}%;background:{{accent}};border-radius:2px;transition:width 900ms cubic-bezier(.22,1,.36,1)"></div></div>
</div>
</sc-if>
<sc-if value="{{canImport}}" hint-placeholder-val="{{true}}">
<button type="button" class="import" onClick="{{startImport}}" style="color:{{accent}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M5 17v1.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>导入字体文件…</span>
</button>
</sc-if>
</div>
</div>

<div style="flex:999 1 360px;min-width:0;box-sizing:border-box;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px;background:{{paperBg}};transition:background-color 200ms ease-out">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<div role="tablist" aria-label="字体用途" style="display:flex;gap:2px;padding:3px;background:{{shellBg}};border:1px solid {{borderCol}};border-radius:8px">
<sc-for list="{{roleTabs}}" as="rt" hint-placeholder-count="3">
<button type="button" role="tab" class="seg" aria-selected="{{rt.on}}" onClick="{{rt.pick}}" style="background:{{rt.bg}};color:{{rt.col}};box-shadow:{{rt.ring}}">{{rt.label}}</button>
</sc-for>
</div>
<span style="color:{{textSecondary}};font-family:{{activeFam}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 160ms ease-out">{{activeName}}</span>
</div>

<div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:8px 4px">
<button type="button" class="region" aria-label="设置标题字体" onClick="{{pickHeading}}" style="background:{{rgHeadingBg}};box-shadow:{{rgHeadingRing}}">
<span style="display:block;font-family:{{headingFam}};font-size:{{headingSize}}px;line-height:1.35;font-weight:600;color:{{editorText}};transition:font-size 200ms cubic-bezier(.16,1,.3,1)">关于慢读</span>
</button>
<button type="button" class="region" aria-label="设置正文字体" onClick="{{pickBody}}" style="background:{{rgBodyBg}};box-shadow:{{rgBodyRing}}">
<span style="display:block;font-family:{{bodyFam}};font-size:{{size}}px;line-height:1.75;color:{{editorText}};transition:font-size 200ms cubic-bezier(.16,1,.3,1)">读一本书，最好的速度是能听见自己思考的速度。把打动你的句子抄下来，再用自己的话复述一遍——Reading slowly is a way of writing.</span>
</button>
<button type="button" class="region" aria-label="设置代码字体" onClick="{{pickCode}}" style="background:{{rgCodeBg}};box-shadow:{{rgCodeRing}}">
<span style="display:block;padding:8px 12px;border-radius:6px;background:{{codeBg}};font-family:{{codeFam}};font-size:{{codeSize}}px;line-height:1.6;color:{{editorText}};white-space:pre;overflow:hidden;text-overflow:ellipsis;transition:font-size 200ms cubic-bezier(.16,1,.3,1),background-color 200ms ease-out">let words = note.split_whitespace().count();</span>
</button>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:0 4px">
<label for="v3-size" style="flex:none">字号</label>
<input id="v3-size" class="range" type="range" min="13" max="22" step="1" value="{{size}}" onChange="{{onSize}}">
<span style="width:44px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:460">{{size}} px</span>
</div>
</div>
</section>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { dark: null, role: 'body', filter: 'all', query: '', hover: null, fonts: { body: 'wenkai', heading: 'follow', code: 'jetbrains' }, imported: false, importing: false, progress: 0, entering: false, size: 16 };
  }

  catalog() {
    const list = [
      { id: 'system', name: '系统默认', fam: "-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif", grp: 'zh' },
      { id: 'notosans', name: '思源黑体', fam: "'Noto Sans SC',sans-serif", grp: 'zh' },
      { id: 'notoserif', name: '思源宋体', fam: "'Noto Serif SC',serif", grp: 'zh' },
      { id: 'wenkai', name: '霞鹜文楷', fam: "'LXGW WenKai TC','Noto Serif SC',serif", grp: 'zh' },
      { id: 'inter', name: 'Inter', fam: "Inter,'PingFang SC',sans-serif", grp: 'latin' },
      { id: 'sourceserif', name: 'Source Serif 4', fam: "'Source Serif 4','Noto Serif SC',serif", grp: 'latin' },
      { id: 'jetbrains', name: 'JetBrains Mono', fam: "'JetBrains Mono',ui-monospace,monospace", grp: 'mono' },
      { id: 'fira', name: 'Fira Code', fam: "'Fira Code',ui-monospace,monospace", grp: 'mono' },
      { id: 'plex', name: 'IBM Plex Mono', fam: "'IBM Plex Mono',ui-monospace,monospace", grp: 'mono' }
    ];
    if (this.state.imported) list.unshift({ id: 'lora', name: 'Lora', fam: "Lora,'Noto Serif SC',serif", grp: 'imported' });
    return list;
  }

  setRole(role) {
    this.setState({ role, hover: null, query: '', filter: role === 'code' ? 'mono' : 'all' });
  }

  startImport() {
    this.setState({ importing: true, progress: 0 });
    setTimeout(() => this.setState({ progress: 100 }), 30);
    setTimeout(() => {
      this.setState((s) => ({ importing: false, imported: true, entering: true, filter: 'all', query: '', fonts: { ...s.fonts, [s.role]: 'lora' } }));
      setTimeout(() => this.setState({ entering: false }), 30);
    }, 1000);
  }

  renderVals() {
    const st = this.state;
    const dark = st.dark ?? ((this.props.theme ?? 'light') === 'dark');
    const t = {
      shellBg: dark ? '#343434' : '#f1f1f1', sidebarBg: dark ? '#222222' : '#fafafa', settingsBg: dark ? '#181818' : '#f8f8f8',
      cardBg: dark ? '#222222' : '#ffffff', paperBg: dark ? '#181818' : '#ffffff',
      textPrimary: dark ? '#ececec' : '#20242c', textSecondary: dark ? '#b4b4b4' : '#526071', editorText: dark ? '#ececec' : '#1f1e1d',
      accent: dark ? '#779de8' : '#547dd0', iconFill: dark ? '#31456a' : '#c9d8f3', selectedBg: dark ? '#343434' : '#e5edfc',
      hoverBg: dark ? '#2c2c2c' : '#eef3fc', borderCol: dark ? '#2e2e2e' : '#e4e6ea', sidebarBorder: dark ? '#333333' : '#e6e6e6',
      btnBorder: dark ? '#444444' : '#dcdcdc', codeBg: dark ? '#242424' : '#f3f1ec'
    };
    const ring = 'inset 0 0 0 1px ' + t.accent;
    const all = this.catalog();
    const byId = (id) => all.find((f) => f.id === id) || all.find((f) => f.id === 'system');
    const role = st.role;
    // Live font per role: the hovered row previews on the active role without committing.
    const eff = { ...st.fonts };
    if (st.hover) eff[role] = st.hover;
    const bodyF = byId(eff.body);
    const fontOf = (r) => (r === 'heading' && eff.heading === 'follow' ? { name: '跟随正文', fam: bodyF.fam } : byId(eff[r]));
    const q = st.query.trim().toLowerCase();
    let pool = all.filter((f) => (st.filter === 'all' ? (role === 'code' ? true : f.grp !== 'mono') : f.grp === st.filter) && (!q || f.name.toLowerCase().includes(q)));
    if (role === 'heading' && st.filter === 'all' && (!q || '跟随正文'.includes(q))) pool = [{ id: 'follow', name: '跟随正文', fam: byId(st.fonts.body).fam }].concat(pool);
    const fonts = pool.map((f) => {
      const on = st.fonts[role] === f.id; const fresh = f.id === 'lora' && st.entering;
      return {
        name: f.name, fam: f.fam, on, check: on ? 1 : 0,
        h: fresh ? 0 : 36, opacity: fresh ? 0 : 1,
        bg: on ? t.selectedBg : 'transparent', ring: on ? ring : 'none',
        hover: () => { if (this.state.hover !== f.id) this.setState({ hover: f.id }); },
        pick: () => this.setState((s) => ({ fonts: { ...s.fonts, [role]: f.id } }))
      };
    });
    const chipDefs = [['all', '全部'], ['zh', '中文'], ['latin', '西文'], ['mono', '等宽']];
    if (st.imported) chipDefs.push(['imported', '已导入']);
    const chips = chipDefs.map(([k, label]) => {
      const on = st.filter === k;
      return { label, on, pick: () => this.setState({ filter: k, hover: null }), bg: on ? t.selectedBg : 'transparent', col: on ? t.textPrimary : t.textSecondary, ring: on ? ring : 'none' };
    });
    const labels = { body: '正文', heading: '标题', code: '代码' };
    const seg = (on) => ({ bg: on ? t.selectedBg : 'transparent', col: on ? t.textPrimary : t.textSecondary, ring: on ? ring : 'none' });
    const roleTabs = ['body', 'heading', 'code'].map((k) => ({ label: labels[k], on: role === k, pick: () => this.setRole(k), ...seg(role === k) }));
    const mode = dark ? 'dark' : 'light';
    const themeSegs = [['light', '浅色'], ['dark', '深色']].map(([k, label]) => ({ label, on: mode === k, pick: () => this.setState({ dark: k === 'dark' }), ...seg(mode === k) }));
    const rg = (r) => (role === r ? { bg: t.selectedBg, ring: st.hover ? 'inset 0 0 0 1px ' + t.accent + ', 0 0 0 3px ' + (dark ? 'rgba(119,157,232,0.25)' : 'rgba(84,125,208,0.18)') : ring } : { bg: 'transparent', ring: 'none' });
    const active = fontOf(role);
    return {
      ...t, fonts, chips, roleTabs, themeSegs, roleLabel: labels[role], noResult: !pool.length,
      query: st.query, onQuery: (e) => this.setState({ query: e.target.value, hover: null }),
      endHover: () => this.setState({ hover: null }),
      importing: st.importing, progress: st.progress, canImport: !st.importing && !st.imported, startImport: () => this.startImport(),
      size: st.size, onSize: (e) => this.setState({ size: Number(e.target.value) }),
      headingSize: Math.round(st.size * 1.5), codeSize: st.size - 2,
      bodyFam: bodyF.fam, headingFam: fontOf('heading').fam, codeFam: fontOf('code').fam,
      activeName: active.name, activeFam: active.fam,
      pickHeading: () => this.setRole('heading'), pickBody: () => this.setRole('body'), pickCode: () => this.setRole('code'),
      rgHeadingBg: rg('heading').bg, rgHeadingRing: rg('heading').ring, rgBodyBg: rg('body').bg, rgBodyRing: rg('body').ring, rgCodeBg: rg('code').bg, rgCodeRing: rg('code').ring
    };
  }
}
</script>
</body>
</html>
