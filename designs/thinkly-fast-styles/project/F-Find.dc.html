<div style="box-sizing:border-box;width:100%;max-width:816px;margin:0 auto;padding:36px 28px 64px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:8px"><div style="width:44px;flex:none"></div><h1 style="flex:1;min-width:0;max-width:720px;margin:0;font-size:28px;line-height:1.35;font-weight:560;letter-spacing:-0.01em">把周会改成异步</h1></div>
<div style="display:flex;gap:8px"><div style="width:44px;flex:none"></div><p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">上周排了三场同步会，两场结束时没有结论。会上大部分时间在对齐<mark>偏差</mark>来源，而不是解决它。</p></div>
<div style="display:flex;gap:8px"><div style="width:44px;flex:none"></div><p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">与其等所有人空出同一段时间，不如把状态写在这里：这周要什么、卡在哪、需要谁看一眼。</p></div>
<div style="display:flex;gap:8px"><div style="width:44px;flex:none"></div><h2 style="flex:1;min-width:0;max-width:720px;margin:0;font-size:22px;line-height:1.4;font-weight:560">保留下来的三件事</h2></div>

<div style="flex:1;min-width:0;max-width:720px;display:flex;flex-direction:column;gap:4px">

<label style="display:flex;gap:8px;font-size:17px;line-height:1.5"><input type="checkbox" style="width:16px;height:16px;margin:5px 0 0;accent-color:#547dd0;flex:none"><span>周五只回看<mark class="cur">偏差</mark>，不复述进度</span></label>
</div></div>
<div style="display:flex;gap:8px"><div style="width:44px;flex:none"></div><p style="flex:1;min-width:0;max-width:720px;margin:0;font-size:17px;line-height:1.5">试点两周。周五回看时只记录<mark>偏差</mark>，不把进度再讲一遍。</p></div>
