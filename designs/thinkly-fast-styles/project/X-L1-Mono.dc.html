<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导出 · 黑白素纸</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#111}a:hover{color:#000}
</style>
</helmet>
<div style="width:816px;height:1040px;box-sizing:border-box;background:{{paper}};color:#111111;font-family:'PingFang SC',-apple-system,system-ui,sans-serif;padding:72px 48px 40px;display:flex;flex-direction:column;position:relative">
<div aria-hidden="true" style="position:absolute;left:24px;top:24px;right:24px;bottom:24px;border:1px solid #111111"></div>
<div aria-hidden="true" style="position:absolute;left:24px;top:24px;width:10px;height:10px;background:#111111"></div>
<div aria-hidden="true" style="position:absolute;right:24px;bottom:24px;width:10px;height:10px;background:#111111"></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:2px;padding-bottom:14px;border-bottom:3px solid #111111">
<span>NO. 1103</span>
<span>周会记录</span>
</div>
<h1 style="margin:36px 0 18px;font-size:40px;line-height:1.2;font-weight:700;letter-spacing:-0.5px">周会 · 11 月 3 日</h1>
<p style="margin:0 0 22px;font-size:17px;line-height:1.7">试点两周。周五回看时只记录偏差，不把进度再讲一遍。</p>
<h2 style="margin:8px 0 12px;font-size:22px;line-height:1.4;font-weight:700">本周决定</h2>
<ul style="margin:0 0 22px;padding:0;list-style:none;font-size:17px;line-height:1.7;display:flex;flex-direction:column;gap:6px">
<li style="display:flex;gap:14px;align-items:baseline"><span aria-hidden="true" style="width:7px;height:7px;background:#111111;flex:none;transform:translateY(-3px)"></span>统一周报模板，只留三栏</li>
<li style="display:flex;gap:14px;align-items:baseline"><span aria-hidden="true" style="width:7px;height:7px;background:#111111;flex:none;transform:translateY(-3px)"></span>导出图片改为八种纸面</li>
<li style="display:flex;gap:14px;align-items:baseline"><span aria-hidden="true" style="width:7px;height:7px;background:#111111;flex:none;transform:translateY(-3px)"></span>下周三前合并到主干</li>
</ul>
<blockquote style="margin:6px 0 24px;padding:4px 0 4px 20px;border-left:3px solid #111111;font-size:19px;line-height:1.6;font-weight:600">少讲进度，多讲偏差。</blockquote>
<div style="background:#f2f2f2;padding:14px 16px;font-family:'SF Mono',Menlo,monospace;font-size:14px;line-height:1.6;color:#111111">$ bun run build</div>
<div style="flex:1"></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid #111111;font-size:12px;letter-spacing:2px">
<span style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:8px;height:8px;background:#111111"></span>THINKLY FAST</span>
<span>2026-11-03</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paper":{"editor":"color","default":"#ffffff"},"$preview":{"width":816,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
return { paper: this.props.paper ?? '#ffffff' };
}
}
</script>
</body>
</html>
