<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>列表与空行 C · 引线</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
*{box-sizing:border-box}
button{font-family:inherit;font-size:14px;line-height:20px;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #547dd0;outline-offset:1px}
@keyframes grFade{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
.gr-caret{animation:grFade 1.2s cubic-bezier(.4,0,.2,1) infinite}
.gr-row{display:flex;align-items:flex-start;font-size:16px;line-height:26px}
.gr-mark{flex:none;width:22px;height:26px;display:flex;align-items:center;justify-content:center}
.gr-num{flex:none;height:26px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-family:'JetBrains Mono',Menlo,ui-monospace,monospace;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.gr-kids{display:flex;flex-direction:column;gap:4px;margin-top:4px}
</style>
</helmet>

<div style="width:100%;min-height:1000px;display:flex;flex-direction:column;background:{{shellBg}};color:{{textPrimary}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased">

  <header style="height:48px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:{{sidebarBg}};border-bottom:1px solid {{borderCol}};flex:none">
    <span style="font-size:15px;font-weight:560">C · 引线</span>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="display:inline-flex;padding:3px;gap:2px;background:{{shellBg}};border:1px solid {{borderCol}};border-radius:8px">
        <sc-for list="{{modeTabs}}" as="tab" hint-placeholder-count="2">
          <button type="button" onClick="{{tab.pick}}" style="height:28px;padding:0 10px;border:0;border-radius:6px;background:{{tab.bg}};box-shadow:{{tab.ring}};color:{{tab.col}};font-weight:{{tab.weight}}">{{tab.label}}</button>
        </sc-for>
      </div>
      <button type="button" onClick="{{toggleTheme}}" style="height:30px;padding:0 12px;border-radius:8px;border:1px solid {{borderCol}};background:{{shellBg}};color:{{textPrimary}}">{{themeLabel}}</button>
    </div>
  </header>

  <main style="flex:1;background:{{paperBg}};padding:64px 48px 80px">
    <div style="width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;color:{{textPrimary}}">

      <div style="font-size:30px;line-height:40px;font-weight:600;margin:0 0 18px 48px">读书笔记</div>

      <sc-if value="{{isPara}}" hint-placeholder-val="{{true}}">
        <div class="gr-row" style="margin-bottom:22px">
          <div style="width:48px;height:30px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding-right:10px">
            <button type="button" aria-label="添加块" style="width:22px;height:22px;padding:0;border:0;border-radius:6px;background:transparent;color:{{handleCol}};display:inline-flex;align-items:center;justify-content:center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
          <div style="flex:1;height:30px;display:flex;align-items:center;justify-content:space-between;margin-left:-8px;padding:0 8px;border-radius:6px;background:{{lineBg}}">
            <div style="display:flex;align-items:center">
              <span class="gr-caret" style="width:2px;height:20px;border-radius:1px;background:{{accent}};flex:none"></span>
              <span style="margin-left:6px;color:{{placeholderCol}};white-space:nowrap">开始输入…</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;color:{{placeholderCol}};font-size:13px">
              <span style="display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:20px;padding:0 5px;border-radius:5px;box-shadow:inset 0 0 0 1px {{kbdBorder}};font-family:'JetBrains Mono',Menlo,ui-monospace,monospace;font-size:12px;color:{{kbdText}}">/</span>
              <span style="display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:20px;padding:0 5px;border-radius:5px;box-shadow:inset 0 0 0 1px {{kbdBorder}};font-family:'JetBrains Mono',Menlo,ui-monospace,monospace;font-size:12px;color:{{kbdText}}">、</span>
              <span>菜单</span>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isHeading}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;align-items:center;height:38px;margin-bottom:18px">
          <div style="width:48px;flex:none"></div>
          <div style="flex:1;height:38px;display:flex;align-items:center;margin-left:-8px;padding:0 8px;border-radius:6px;background:{{lineBg}}">
            <span class="gr-caret" style="width:2px;height:26px;border-radius:1px;background:{{accent}};flex:none"></span>
            <span style="margin-left:6px;font-size:22px;line-height:34px;font-weight:600;color:{{placeholderCol}}">标题 2</span>
          </div>
        </div>
      </sc-if>

      <div style="padding-left:48px;display:flex;flex-direction:column;gap:4px">
        <div>
          <div class="gr-row"><div class="gr-mark"><span style="width:6px;height:6px;border-radius:50%;background:{{accent}}"></span></div><div style="flex:1;min-width:0;padding-left:4px">先写下最想记住的一句话</div></div>
          <div class="gr-kids" style="margin-left:10.5px;padding-left:11.5px;border-left:1px solid {{guideCol}}">
            <div class="gr-row"><div class="gr-mark"><span style="width:5px;height:5px;border-radius:50%;background:{{bulletCol}}"></span></div><div style="flex:1;min-width:0;padding-left:4px">再补充它为什么重要。长句子会自然换行，第二行与第一行文字保持左对齐，左侧引线把同一层级串起来。</div></div>
            <div class="gr-kids" style="margin-left:10.5px;padding-left:11.5px;border-left:1px solid {{guideCol}}">
              <div class="gr-row"><div class="gr-mark"><span style="width:5px;height:5px;border-radius:50%;box-shadow:inset 0 0 0 1.25px {{bulletCol}}"></span></div><div style="flex:1;min-width:0;padding-left:4px">第三层用来放细节和例子</div></div>
            </div>
            <div class="gr-row"><div class="gr-mark"><span style="width:5px;height:5px;border-radius:50%;background:{{bulletCol}}"></span></div><div style="flex:1;min-width:0;padding-left:4px">引用原文时标上页码</div></div>
          </div>
        </div>
        <div class="gr-row"><div class="gr-mark"><span style="width:6px;height:6px;border-radius:50%;background:{{accent}}"></span></div><div style="flex:1;min-width:0;padding-left:4px">每天睡前回顾一次</div></div>
      </div>

      <div style="height:22px"></div>

      <div style="padding-left:48px;display:flex;flex-direction:column;gap:4px">
        <div class="gr-row"><div class="gr-num" style="width:34px;color:{{accent}}">8</div><div style="flex:1;min-width:0">收集：把灵感先放进收件箱</div></div>
        <div>
          <div class="gr-row"><div class="gr-num" style="width:34px;color:{{accent}}">9</div><div style="flex:1;min-width:0">整理：按主题归档，删掉重复的条目</div></div>
          <div class="gr-kids" style="margin-left:29px;padding-left:5px;border-left:1px solid {{guideCol}}">
            <div class="gr-row"><div class="gr-num" style="width:22px;color:{{numSub}}">1</div><div style="flex:1;min-width:0">先按项目分</div></div>
            <div class="gr-row"><div class="gr-num" style="width:22px;color:{{numSub}}">2</div><div style="flex:1;min-width:0">再按时间排序，最近一周的内容放在最前面，方便第二天直接接着写。</div></div>
          </div>
        </div>
        <div class="gr-row"><div class="gr-num" style="width:34px;color:{{accent}}">10</div><div style="flex:1;min-width:0">输出：写成一篇完整的文章</div></div>
      </div>

      <div style="height:22px"></div>

      <div style="padding-left:48px;display:flex;flex-direction:column;gap:4px">
        <div class="gr-row"><div class="gr-mark"><span style="width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1.5px {{boxBorder}}"></span></div><div style="flex:1;min-width:0;padding-left:6px">本周读完第三章</div></div>
        <div class="gr-row"><div class="gr-mark"><span style="width:15px;height:15px;border-radius:50%;background:{{accent}};display:inline-flex;align-items:center;justify-content:center;color:{{paperBg}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></div><div style="flex:1;min-width:0;padding-left:6px;color:{{doneCol}};text-decoration:line-through;text-decoration-color:{{doneLine}}">整理上周的摘抄</div></div>
      </div>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"mode":{"editor":"enum","default":"para","options":["para","heading"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? 'dark';
    const mode = this.state.mode ?? this.props.mode ?? 'para';
    const isDark = theme === 'dark';
    const shellBg = isDark ? '#343434' : '#f1f1f1';
    const sidebarBg = isDark ? '#222222' : '#fafafa';
    const paperBg = isDark ? '#181818' : '#ffffff';
    const textPrimary = isDark ? '#ececec' : '#1f1e1d';
    const textSecondary = isDark ? '#b4b4b4' : '#52514e';
    const accent = isDark ? '#779de8' : '#547dd0';
    const selectedBg = isDark ? '#343434' : '#e5edfc';
    const borderCol = isDark ? '#2e2e2e' : '#e4e6ea';
    const tabs = [{ id: 'para', label: '正文空行' }, { id: 'heading', label: '标题空行' }];
    return {
      shellBg, sidebarBg, paperBg, textPrimary, accent, borderCol,
      placeholderCol: isDark ? '#7a7975' : '#9b9a95',
      handleCol: isDark ? '#6e6d68' : '#a8a7a2',
      lineBg: isDark ? '#1e1e1e' : '#f8f8f6',
      kbdText: isDark ? '#a5a4a0' : '#6f6e69',
      kbdBorder: isDark ? '#3a3a3a' : '#dedcd6',
      bulletCol: isDark ? '#a9a8a4' : '#6f6e69',
      guideCol: isDark ? '#333333' : '#e6e4df',
      numSub: textSecondary,
      boxBorder: isDark ? '#6e6d68' : '#b7b6b1',
      doneCol: isDark ? '#7a7975' : '#9b9a95',
      doneLine: isDark ? '#5a5955' : '#c4c3be',
      isPara: mode === 'para',
      isHeading: mode === 'heading',
      themeLabel: isDark ? '深色' : '浅色',
      modeTabs: tabs.map((t) => ({
        label: t.label,
        bg: mode === t.id ? selectedBg : 'transparent',
        ring: mode === t.id ? ('inset 0 0 0 1px ' + accent) : 'none',
        col: mode === t.id ? textPrimary : textSecondary,
        weight: mode === t.id ? '560' : '400',
        pick: () => this.setState({ mode: t.id })
      })),
      toggleTheme: () => this.setState({ theme: isDark ? 'light' : 'dark' })
    };
  }
}
</script>
</body>
</html>
