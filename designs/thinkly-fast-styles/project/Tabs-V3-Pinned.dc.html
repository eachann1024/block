<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 C · 常驻钉选胶囊与单篇阅读流</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#3559a8}a:hover{color:#233f7d}
button{font-family:inherit}
.pin-chip{font:inherit;font-size:14px;line-height:20px;font-weight:460;height:28px;padding:0 10px;border-radius:14px;border:1px solid #d5dce8;background:#ffffff;color:#28313e;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-sizing:border-box}
.pin-chip:hover{background:#e8effc;border-color:#b8cae8}
.pin-chip-active{background:#dfe9fc;border-color:#476ec2;color:#181c23;font-weight:500}
.row{font:inherit;font-size:14px;line-height:20px;font-weight:400;width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#181c23;text-align:left;cursor:pointer;box-sizing:border-box}
.row:hover{background:#e8effc}
.row-active{background:#dfe9fc;box-shadow:inset 0 0 0 1px #476ec2;font-weight:500}
.pin-toggle{font:inherit;font-size:14px;line-height:20px;height:28px;padding:0 10px;border-radius:6px;border:1px solid #cfd6e2;background:#ffffff;color:#28313e;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.pin-toggle-on{border-color:#476ec2;background:#dfe9fc;color:#181c23;font-weight:500}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#181c23;font-size:14px;line-height:20px;overflow:hidden">

<header style="height:42px;flex:none;display:flex;align-items:center;border-bottom:1px solid #e2e4e8;box-sizing:border-box;background:#f1f1f1">
<div style="width:260px;flex:none;height:100%;box-sizing:border-box;display:flex;align-items:center;padding:0 10px 0 16px;border-right:1px solid #e2e4e8">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
</div>

<div style="flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;overflow:hidden">
<div aria-label="常驻钉选笔记" style="display:flex;align-items:center;gap:6px;flex:none">
<sc-for list="{{pinnedTabs}}" as="pin" hint-placeholder-count="2">
<button type="button" class="{{pin.chipClass}}" onClick="{{pin.select}}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3559a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 7 3 3v2H6v-2l3-3-1-7z"></path></svg>
<span>{{pin.title}}</span>
</button>
</sc-for>
</div>

<div aria-hidden="true" style="width:1px;height:18px;background:#d8dde6;flex:none"></div>

<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden">
<span style="font-size:14px;color:#3d4856;white-space:nowrap">当前阅读：</span>
<span style="font-size:14px;font-weight:560;color:#181c23;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{activeTitle}}</span>
</div>

<button type="button" class="{{pinBtnClass}}" onClick="{{togglePinCurrent}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 7 3 3v2H6v-2l3-3-1-7z"></path></svg>
<span>{{pinBtnLabel}}</span>
</button>
</div>
</header>

<div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">
<aside aria-label="文件列表" style="width:260px;flex:none;background:#fafafa;border-right:1px solid #e2e4e8;box-sizing:border-box;display:flex;flex-direction:column;min-height:0">
<div style="padding:14px 12px 10px;border-bottom:1px solid #eceef2;display:flex;flex-direction:column;gap:6px">
<div style="font-size:14px;font-weight:560;color:#181c23">钉选胶囊 + 单篇阅读流</div>
<div style="font-size:14px;line-height:20px;color:#3d4856">平时翻看根本不建标签页；只有你主动点「钉选到顶栏」的笔记才会常驻在上方胶囊区。</div>
</div>

<div style="flex:1;min-height:0;overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:4px">
<sc-for list="{{notes}}" as="item" hint-placeholder-count="6">
<button type="button" class="{{item.rowClass}}" onClick="{{item.click}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{item.stroke}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3.75h8l4 4V20.25H6z" fill="{{item.fill}}" stroke="none"></path><path d="M6 3.75h8l4 4V20.25H6z"></path><path d="M14 3.75v4h4"></path></svg>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{item.title}}</span>
<span style="font-size:14px;color:#3d4856">{{item.badge}}</span>
</button>
</sc-for>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;background:#ffffff;overflow:auto">
<div style="box-sizing:border-box;width:100%;max-width:816px;margin:0 auto;padding:44px 36px 72px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-radius:10px;background:#f4f7fd;border:1px solid #d7e2f8;color:#24324b;font-size:14px;line-height:20px">
<span>顶栏已钉选 <strong>{{pinnedCount}}</strong> 篇常用笔记 · 右侧为无负担的单窗口阅读流</span>
</div>

<h1 style="margin:8px 0 0;font-size:28px;line-height:1.35;font-weight:600;letter-spacing:-0.02em;color:#181c23">{{activeTitle}}</h1>
<p style="margin:0;font-size:17px;line-height:1.65;color:#242a33;max-width:68ch">{{activeLead}}</p>
<p style="margin:0;font-size:17px;line-height:1.65;color:#242a33;max-width:68ch">{{activeBody}}</p>
</div>
</main>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const NOTES = [
  {
    id: 'weekly',
    title: '周会 11-03',
    lead: '这篇笔记被钉选在顶栏左侧胶囊区，无论你在文件树里翻看多少篇其他笔记，随时点一下胶囊就能秒切回来。',
    body: '这种模式吸收了 Bear / Craft 的沉浸式单篇阅读体验，同时用顶栏轻量钉选胶囊解决「2 到 3 篇核心文档反复切换」的需求。'
  },
  {
    id: 'review',
    title: '需求评审',
    lead: '随便点左侧任何笔记，只会更换「当前阅读」的标题和内容，顶栏永远不会多出一串待关闭的标签。',
    body: '如果你发现这篇「需求评审」今天要反复看，点右上角的「钉选到顶栏」即可将它加入左侧胶囊。'
  },
  {
    id: 'principles',
    title: '产品原则',
    lead: '对于个人笔记库而言，绝大多数时候只有 1 篇正在读的笔记，外加 1–2 篇近期置顶备忘。',
    body: '把「标签栏」彻底简化为「钉选胶囊 + 当前阅读」，连关闭标签页的动作都省掉了。'
  },
  {
    id: 'release',
    title: '发布清单',
    lead: '打包前确认签名身份，执行构建脚本后替换本地应用并启动验证。',
    body: '你可以试试点击右上角的钉选按钮，把这篇清单固定到顶栏，或者取消已钉选的胶囊。'
  },
  {
    id: 'reading',
    title: '读书摘录',
    lead: '翻书的时候，我们不会每翻一页就在书里夹一根不可自动抽走的新书签。',
    body: '只有你亲手夹上书签（钉选）的那一页，才应该留在顶栏。'
  },
  {
    id: 'roadmap',
    title: '四季度规划',
    lead: '左侧文件树负责全局漫游，顶栏胶囊负责高频锚点，两者职责分明。',
    body: '再也不会出现随手点开五六篇笔记后还得挨个点 × 关掉的烦躁感。'
  }
];

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      pinned: ['weekly', 'principles'],
      activeId: 'review'
    };
  }
  togglePinCurrent() {
    const pinned = [...this.state.pinned];
    const idx = pinned.indexOf(this.state.activeId);
    if (idx !== -1) {
      pinned.splice(idx, 1);
    } else {
      pinned.push(this.state.activeId);
    }
    this.setState({ pinned });
  }
  renderVals() {
    const { pinned, activeId } = this.state;
    const activeNote = NOTES.find((n) => n.id === activeId) || NOTES[0];
    const isPinned = pinned.includes(activeId);

    return {
      activeTitle: activeNote.title,
      activeLead: activeNote.lead,
      activeBody: activeNote.body,
      pinnedCount: String(pinned.length),
      pinBtnClass: isPinned ? 'pin-toggle pin-toggle-on' : 'pin-toggle',
      pinBtnLabel: isPinned ? '已钉选（点击取消）' : '钉选到顶栏',
      togglePinCurrent: () => this.togglePinCurrent(),
      pinnedTabs: pinned.map((id) => {
        const note = NOTES.find((n) => n.id === id) || NOTES[0];
        const isAct = id === activeId;
        return {
          title: note.title,
          chipClass: isAct ? 'pin-chip pin-chip-active' : 'pin-chip',
          select: () => this.setState({ activeId: id })
        };
      }),
      notes: NOTES.map((n) => {
        const isAct = n.id === activeId;
        const isPin = pinned.includes(n.id);
        return {
          title: n.title,
          rowClass: isAct ? 'row row-active' : 'row',
          stroke: isAct ? '#3559a8' : '#3d4856',
          fill: isAct ? '#c5d6f5' : 'none',
          badge: isPin ? '已钉选' : '',
          click: () => this.setState({ activeId: n.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
