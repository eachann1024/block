<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>速记小窗 · 方案 C · 底栏三槽胶囊</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#3559a8}a:hover{color:#233f7d}
button{font-family:inherit}
.ib-close{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;padding:0;cursor:pointer}
.ib-close:hover{background:#e81123;color:#ffffff}
.pill-btn{font:inherit;height:28px;padding:0 12px;border-radius:999px;border:0;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;transition:background-color .14s ease,color .14s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:440px;height:520px;box-sizing:border-box;display:flex;flex-direction:column;background:{{paperBg}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:{{textPrimary}};font-size:16px;line-height:26px;overflow:hidden;border:1px solid {{borderCol}};border-radius:14px;-webkit-font-smoothing:antialiased">

<header style="height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;box-sizing:border-box">
<sc-if value="{{isMac}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="display:flex;gap:8px;flex:none">
<span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
<span style="width:12px;height:12px;border-radius:6px;background:{{dotMuted}}"></span>
<span style="width:12px;height:12px;border-radius:6px;background:{{dotMuted}}"></span>
</div>
</sc-if>
<sc-if value="{{isWin}}" hint-placeholder-val="{{false}}">
<button type="button" class="ib-close" aria-label="隐藏速记" style="margin-left:auto;color:{{iconCol}}">
<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg>
</button>
</sc-if>
</header>

<main style="flex:1;min-height:0;overflow:auto;padding:8px 28px 68px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">周五回看只记录偏差，不复述进度。</p>
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">小窗与主窗口独立运行，底部悬浮三槽胶囊切换。</p>
<ul style="margin:0;padding-left:20px;font-size:16px;line-height:26px;color:{{textPrimary}};display:flex;flex-direction:column;gap:4px">
<li>顶部彻底清空功能控件，打开即专注书写</li>
<li>底部居中悬浮三槽切换胶囊，不关联主窗口</li>
</ul>
<p style="margin:0;font-size:16px;line-height:26px;color:{{textPrimary}}">明天确认一下签名证书的续期时间<span aria-hidden="true" style="display:inline-block;width:2px;height:19px;background:{{accent}};vertical-align:-4px;margin-left:2px;border-radius:1px"></span></p>
</main>

<div style="position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center">
<div style="display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:{{dockBg}};border:1px solid {{dockBorder}}">
<button type="button" class="pill-btn" onClick="{{pick1}}" style="background:{{b1Bg}};color:{{b1Text}}">1</button>
<button type="button" class="pill-btn" onClick="{{pick2}}" style="background:{{b2Bg}};color:{{b2Text}}">2</button>
<button type="button" class="pill-btn" onClick="{{pick3}}" style="background:{{b3Bg}};color:{{b3Text}}">3</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","default":"macOS","options":["macOS","Windows / Linux"],"label":"系统平台"},"theme":{"editor":"enum","default":"浅色","options":["浅色","深色"],"label":"外观主题"},"$preview":{"width":440,"height":520}}'>
class Component extends DCLogic {
constructor() {
super();
this.state = { slot: 1 };
}
renderVals() {
const isWin = this.props.platform === 'Windows / Linux';
const isMac = !isWin;
const dark = this.props.theme === '深色';
const s = this.state.slot || 1;
const activeBg = dark ? '#3559a8' : '#3559a8';
const activeText = '#ffffff';
const idleText = dark ? '#98a4b8' : '#475467';
return {
isMac,
isWin,
paperBg: dark ? '#161920' : '#ffffff',
borderCol: dark ? '#2a303c' : '#dcdcdc',
textPrimary: dark ? '#eef2f8' : '#181c23',
iconCol: dark ? '#98a4b8' : '#475467',
dotMuted: dark ? '#343b48' : '#dcdcdc',
accent: dark ? '#6f96ec' : '#3559a8',
dockBg: dark ? '#1e232d' : '#f6f8fc',
dockBorder: dark ? '#323946' : '#d5dce6',
b1Bg: s === 1 ? activeBg : 'transparent',
b2Bg: s === 2 ? activeBg : 'transparent',
b3Bg: s === 3 ? activeBg : 'transparent',
b1Text: s === 1 ? activeText : idleText,
b2Text: s === 2 ? activeText : idleText,
b3Text: s === 3 ? activeText : idleText,
pick1: () => this.setState({ slot: 1 }),
pick2: () => this.setState({ slot: 2 }),
pick3: () => this.setState({ slot: 3 })
};
}
}
</script>
</body>
</html>
