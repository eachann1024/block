<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置顶栏 A · 左列返回笔记 + 顶栏面包屑与右侧静默版本号</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#547dd0}
button,input{font-family:inherit;font-size:14px;line-height:20px}
button:focus-visible,input:focus-visible{outline:2px solid #779de8;outline-offset:1px}
.mono{font-family:'JetBrains Mono',Menlo,ui-monospace,monospace;font-variant-numeric:tabular-nums}
.nav-row{width:100%;height:34px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box;text-align:left;background:transparent}
.pcard{flex:1;min-width:0;padding:10px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;box-sizing:border-box;text-align:left}
.chip{height:30px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.tbtn{height:28px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-sizing:border-box;white-space:nowrap;font-weight:460}
.abtn{height:34px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-sizing:border-box;white-space:nowrap;font-weight:460;flex:none}
.seg{height:32px;padding:0 14px;border:0;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:460;white-space:nowrap}
</style>
</helmet>

<div style="width:100%;min-height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:{{shellBg}};color:{{textPrimary}};font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:14px;line-height:20px;overflow:hidden;-webkit-font-smoothing:antialiased">

<header style="height:40px;flex:none;display:flex;align-items:center;background:{{shellBg}};border-bottom:1px solid {{shellBorder}};box-sizing:border-box">
<div style="width:260px;flex:none;height:100%;padding:0 10px 0 16px;border-right:1px solid {{shellBorder}};display:flex;align-items:center;justify-content:space-between;box-sizing:border-box">
<div aria-hidden="true" style="display:flex;align-items:center;gap:8px;flex:none">
<span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
<span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span>
<span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span>
</div>

<button type="button" class="tbtn" onClick="{{triggerBackNote}}" style="background:{{cardBg}};border:1px solid {{btnBorder}};color:{{textPrimary}}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<path d="M10.5 6.25L4.75 12L10.5 17.75" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M5.25 12H19.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
<span>返回笔记</span>
</button>
</div>

<div style="flex:1;min-width:0;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-sizing:border-box">
<div style="display:flex;align-items:center;gap:6px;min-width:0">
<span style="color:{{textSecondary}}">设置</span>
<span style="color:{{textSecondary}}">/</span>
<span style="color:{{textPrimary}};font-weight:460">{{activeTabTitle}}</span>
</div>

<div style="display:flex;align-items:center;gap:8px;flex:none">
<span class="mono" style="height:24px;padding:0 8px;border-radius:6px;background:{{sidebarBg}};border:1px solid {{borderCol}};color:{{textSecondary}};font-size:12px;line-height:16px;display:inline-flex;align-items:center">1.0.301</span>
</div>
</div>
</header>

<div style="flex:1;min-height:0;display:flex">

<aside aria-label="设置分类导航" style="width:260px;flex:none;background:{{sidebarBg}};border-right:1px solid {{shellBorder}};display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;box-sizing:border-box">
<nav aria-label="设置分类" style="display:flex;flex-direction:column;gap:4px">
<button type="button" class="nav-row" onClick="{{selectAi}}" style="background:{{navAiBg}};color:{{navAiCol}};border:1px solid {{navAiBorder}};font-weight:{{navAiWeight}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<path d="M12 3.5L14.2 9.3L20 11.5L14.2 13.7L12 19.5L9.8 13.7L4 11.5L9.8 9.3L12 3.5Z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
<path d="M18.5 4V7M17 5.5H20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
<span>AI 助手</span>
</button>

<button type="button" class="nav-row" onClick="{{selectAppearance}}" style="background:{{navAppBg}};color:{{navAppCol}};border:1px solid {{navAppBorder}};font-weight:{{navAppWeight}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
<circle cx="9" cy="7" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle>
<circle cx="15" cy="12" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle>
<circle cx="10" cy="17" r="2" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.5"></circle>
</svg>
<span>外观与字体</span>
</button>

<button type="button" class="nav-row" onClick="{{selectFolders}}" style="background:{{navFldBg}};color:{{navFldCol}};border:1px solid {{navFldBorder}};font-weight:{{navFldWeight}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<path d="M3.75 6.75A1.75 1.75 0 0 1 5.5 5H9.6l2 2.25H18.5A1.75 1.75 0 0 1 20.25 9v8.25A1.75 1.75 0 0 1 18.5 19H5.5a1.75 1.75 0 0 1-1.75-1.75V6.75Z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
</svg>
<span>文件夹</span>
</button>

<button type="button" class="nav-row" onClick="{{selectShortcuts}}" style="background:{{navScBg}};color:{{navScCol}};border:1px solid {{navScBorder}};font-weight:{{navScWeight}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none">
<rect x="3.25" y="5.75" width="17.5" height="12.5" rx="2" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5"></rect>
<path d="M7.5 10h2M11 10h2M14.5 10h2M7.5 14h9" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round"></path>
</svg>
<span>基础快捷键</span>
</button>
</nav>
</aside>

<main style="flex:1;min-width:0;background:{{settingsBg}};overflow-y:auto">
<div style="max-width:720px;margin:0 auto;padding:40px 28px 64px;display:flex;flex-direction:column;gap:28px;box-sizing:border-box">

<sc-if value="{{hasReturnedToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="padding:10px 14px;border-radius:8px;background:{{selectedBg}};border:1px solid {{accent}};display:flex;align-items:center;justify-content:space-between;gap:12px">
<span>已触发「返回笔记」（快捷键 Esc 同步生效）</span>
<button type="button" onClick="{{clearBackToast}}" style="border:0;background:transparent;color:{{accent}};cursor:pointer;font-weight:500">关闭提示</button>
</div>
</sc-if>

<h1 style="margin:0;font-size:24px;line-height:32px;font-weight:560;color:{{textPrimary}}">{{activeTabTitle}}</h1>

<sc-if value="{{isTabAi}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:24px">

<section style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<span style="font-size:15px;line-height:22px;font-weight:560;color:{{textPrimary}}">服务商与连接</span>
<button type="button" class="abtn" onClick="{{toggleAiEnabled}}" style="height:32px;background:{{aiToggleBg}};border:1px solid {{aiToggleBorder}};color:{{textPrimary}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M12 3.5L14.2 9.3L20 11.5L14.2 13.7L12 19.5L9.8 13.7L4 11.5L9.8 9.3L12 3.5Z" fill="{{iconFill}}" stroke="{{accent}}" stroke-width="1.6" stroke-linejoin="round"></path>
<path d="M18.5 4V7M17 5.5H20" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
<span>{{aiToggleLabel}}</span>
</button>
</div>

<div style="display:flex;gap:10px">
<button type="button" class="pcard" onClick="{{selectDeepseek}}" style="background:{{cardDsBg}};border:1px solid {{cardDsBorder}};color:{{textPrimary}}">
<span style="width:28px;height:28px;border-radius:8px;background:{{cardBg}};border:1px solid {{borderCol}};display:inline-flex;align-items:center;justify-content:center;flex:none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="#4d6bfe"></circle><path d="M8.5 12.5c1.5-2 4.5-2 6.5 0" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"></path></svg>
</span>
<span style="font-weight:500">DeepSeek</span>
</button>

<button type="button" class="pcard" onClick="{{selectOpenai}}" style="background:{{cardOaBg}};border:1px solid {{cardOaBorder}};color:{{textPrimary}}">
<span style="width:28px;height:28px;border-radius:8px;background:{{cardBg}};border:1px solid {{borderCol}};display:inline-flex;align-items:center;justify-content:center;flex:none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7" stroke="#10a37f" stroke-width="1.8"></circle><circle cx="12" cy="12" r="2.6" fill="#10a37f"></circle></svg>
</span>
<span style="font-weight:500">OpenAI 协议</span>
</button>

<button type="button" class="pcard" onClick="{{selectClaude}}" style="background:{{cardClBg}};border:1px solid {{cardClBorder}};color:{{textPrimary}}">
<span style="width:28px;height:28px;border-radius:8px;background:{{cardBg}};border:1px solid {{borderCol}};display:inline-flex;align-items:center;justify-content:center;flex:none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7L6.7 17.3" stroke="#d97757" stroke-width="1.8" stroke-linecap="round"></path></svg>
</span>
<span style="font-weight:500">Claude 协议</span>
</button>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<label for="v1-base-url" style="color:{{textPrimary}};font-weight:460">接口地址</label>
<input id="v1-base-url" type="text" value="{{baseUrl}}" onInput="{{onBaseUrlInput}}" style="width:380px;max-width:100%;height:34px;padding:0 12px;border-radius:8px;border:1px solid {{btnBorder}};background:{{shellBg}};color:{{textPrimary}};box-sizing:border-box" />
</div>

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<label for="v1-api-key" style="color:{{textPrimary}};font-weight:460">API 密钥</label>
<div style="width:380px;max-width:100%;display:flex;align-items:center;gap:8px">
<input id="v1-api-key" type="{{apiKeyType}}" value="{{apiKey}}" onInput="{{onApiKeyInput}}" style="flex:1;min-width:0;height:34px;padding:0 12px;border-radius:8px;border:1px solid {{btnBorder}};background:{{shellBg}};color:{{textPrimary}};box-sizing:border-box" />
<button type="button" class="abtn" onClick="{{toggleShowKey}}" style="background:{{shellBg}};border:1px solid {{btnBorder}};color:{{textPrimary}}">{{showKeyLabel}}</button>
</div>
</div>
</section>

<section style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:16px">
<span style="font-size:15px;line-height:22px;font-weight:560;color:{{textPrimary}}">模型与连接</span>

<div style="display:flex;align-items:center;gap:8px">
<div style="flex:1;min-width:0;height:34px;padding:0 10px;border-radius:8px;border:1px solid {{btnBorder}};background:{{shellBg}};display:flex;align-items:center;gap:8px;box-sizing:border-box">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none;color:{{textSecondary}}">
<circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"></circle>
<path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
</svg>
<input type="text" aria-label="筛选模型" placeholder="筛选模型..." value="{{filterQuery}}" onInput="{{onFilterInput}}" style="flex:1;min-width:0;border:0;background:transparent;color:{{textPrimary}};outline:none" />
</div>

<button type="button" class="abtn" onClick="{{triggerRefresh}}" style="background:{{shellBg}};border:1px solid {{btnBorder}};color:{{textPrimary}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color:{{textSecondary}}">
<path d="M20 11A8 8 0 1 0 18 16.3M20 11V6M20 11H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>{{refreshLabel}}</span>
</button>

<button type="button" class="abtn" onClick="{{triggerTest}}" style="background:{{testBg}};border:1px solid {{testBorder}};color:{{textPrimary}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color:{{accent}}">
<path d="M12 3.5L14.2 9.3L20 11.5L14.2 13.7L12 19.5L9.8 13.7L4 11.5L9.8 9.3L12 3.5Z" fill="{{iconFill}}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
</svg>
<span>{{testLabel}}</span>
</button>
</div>

<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{modelChips}}" as="m" hint-placeholder-count="12">
<button type="button" class="chip mono" onClick="{{m.pick}}" style="background:{{m.bg}};border:1px solid {{m.border}};color:{{m.col}};font-size:13px">
<sc-if value="{{m.active}}" hint-placeholder-val="{{false}}">
<span style="width:6px;height:6px;border-radius:3px;background:{{accent}};flex:none"></span>
</sc-if>
<span>{{m.id}}</span>
</button>
</sc-for>
</div>
</section>

</div>
</sc-if>

<sc-if value="{{isTabAppearance}}" hint-placeholder-val="{{false}}">
<section style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<span style="font-weight:460">外观主题</span>
<div role="group" aria-label="外观主题" style="display:inline-flex;padding:3px;border-radius:8px;background:{{shellBg}};border:1px solid {{borderCol}};gap:2px">
<button type="button" class="seg" onClick="{{setLightMode}}" style="background:{{lightSegBg}};color:{{lightSegCol}};box-shadow:{{lightSegRing}}">浅色</button>
<button type="button" class="seg" onClick="{{setDarkMode}}" style="background:{{darkSegBg}};color:{{darkSegCol}};box-shadow:{{darkSegRing}}">深色</button>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isTabOther}}" hint-placeholder-val="{{false}}">
<section style="background:{{cardBg}};border:1px solid {{borderCol}};border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between">
<span style="color:{{textSecondary}}">可点击左侧「AI 助手」或「外观与字体」查看完整交互</span>
<button type="button" class="tbtn" onClick="{{selectAi}}" style="background:{{selectedBg}};border:1px solid {{accent}};color:{{textPrimary}}">切回 AI 助手</button>
</section>
</sc-if>

</div>
</main>
</div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      tab: 'ai',
      darkOverride: null,
      aiEnabled: true,
      provider: 'openai',
      baseUrl: 'http://127.0.0.1:3425',
      apiKey: 'sk-magpie-local-proxy',
      showKey: false,
      filterQuery: '',
      selectedModel: 'gemini-3.8-flash',
      refreshed: false,
      tested: false,
      backToast: false
    };
  }

  renderVals() {
    const st = this.state;
    const mode = st.darkOverride || this.props.theme || 'dark';
    const dark = mode === 'dark';

    const shellBg = dark ? '#343434' : '#f1f1f1';
    const shellBorder = dark ? '#333333' : '#e6e6e6';
    const sidebarBg = dark ? '#222222' : '#fafafa';
    const settingsBg = dark ? '#181818' : '#f8f8f8';
    const cardBg = dark ? '#222222' : '#ffffff';
    const textPrimary = dark ? '#ececec' : '#20242c';
    const textSecondary = dark ? '#b4b4b4' : '#526071';
    const accent = dark ? '#779de8' : '#547dd0';
    const iconFill = dark ? '#31456a' : '#c9d8f3';
    const selectedBg = dark ? '#343434' : '#e5edfc';
    const borderCol = dark ? '#2e2e2e' : '#e4e6ea';
    const btnBorder = dark ? '#444444' : '#dcdcdc';

    const tabTitles = {
      ai: 'AI 助手',
      appearance: '外观与字体',
      folders: '文件夹',
      shortcuts: '基础快捷键'
    };

    const navStyle = (id) => {
      const on = st.tab === id;
      return {
        bg: on ? selectedBg : 'transparent',
        col: on ? textPrimary : textSecondary,
        border: on ? accent : 'transparent',
        weight: on ? '500' : '400'
      };
    };

    const nAi = navStyle('ai');
    const nApp = navStyle('appearance');
    const nFld = navStyle('folders');
    const nSc = navStyle('shortcuts');

    const allModels = [
      'antigravity/gemini-4-argon',
      'gemini-3.8-flash',
      'gpt-6-astra',
      'gpt-6-luna',
      'gpt-6.1-sol',
      'gpt-6.1-terra',
      'grok-4.7-build-fast',
      'group/grok',
      'group/opus',
      'group/sonnet',
      'remote/antigravity/gemini-4-argon',
      'remote/gemini-3.8-flash'
    ];
    const q = (st.filterQuery || '').trim().toLowerCase();
    const filtered = allModels.filter((m) => !q || m.toLowerCase().includes(q));
    const modelChips = filtered.map((id) => {
      const active = st.selectedModel === id;
      return {
        id,
        active,
        bg: active ? selectedBg : shellBg,
        border: active ? accent : btnBorder,
        col: active ? textPrimary : textSecondary,
        pick: () => this.setState({ selectedModel: id })
      };
    });

    return {
      shellBg,
      shellBorder,
      sidebarBg,
      settingsBg,
      cardBg,
      textPrimary,
      textSecondary,
      accent,
      iconFill,
      selectedBg,
      borderCol,
      btnBorder,

      activeTabTitle: tabTitles[st.tab] || 'AI 助手',
      isTabAi: st.tab === 'ai',
      isTabAppearance: st.tab === 'appearance',
      isTabOther: st.tab === 'folders' || st.tab === 'shortcuts',
      hasReturnedToast: !!st.backToast,

      navAiBg: nAi.bg, navAiCol: nAi.col, navAiBorder: nAi.border, navAiWeight: nAi.weight,
      navAppBg: nApp.bg, navAppCol: nApp.col, navAppBorder: nApp.border, navAppWeight: nApp.weight,
      navFldBg: nFld.bg, navFldCol: nFld.col, navFldBorder: nFld.border, navFldWeight: nFld.weight,
      navScBg: nSc.bg, navScCol: nSc.col, navScBorder: nSc.border, navScWeight: nSc.weight,

      aiToggleBg: st.aiEnabled ? selectedBg : shellBg,
      aiToggleBorder: st.aiEnabled ? accent : btnBorder,
      aiToggleLabel: st.aiEnabled ? '已开启' : '已关闭',

      cardDsBg: st.provider === 'deepseek' ? selectedBg : shellBg,
      cardDsBorder: st.provider === 'deepseek' ? accent : btnBorder,
      cardOaBg: st.provider === 'openai' ? selectedBg : shellBg,
      cardOaBorder: st.provider === 'openai' ? accent : btnBorder,
      cardClBg: st.provider === 'claude' ? selectedBg : shellBg,
      cardClBorder: st.provider === 'claude' ? accent : btnBorder,

      baseUrl: st.baseUrl,
      apiKey: st.apiKey,
      apiKeyType: st.showKey ? 'text' : 'password',
      showKeyLabel: st.showKey ? '隐藏' : '显示',

      filterQuery: st.filterQuery,
      refreshLabel: st.refreshed ? '已同步 12 个模型' : '重新获取模型',
      testBg: st.tested ? selectedBg : shellBg,
      testBorder: st.tested ? accent : btnBorder,
      testLabel: st.tested ? '连接正常' : '连接测试',
      modelChips,

      lightSegBg: !dark ? selectedBg : 'transparent',
      lightSegCol: !dark ? textPrimary : textSecondary,
      lightSegRing: !dark ? ('inset 0 0 0 1px ' + accent) : 'none',
      darkSegBg: dark ? selectedBg : 'transparent',
      darkSegCol: dark ? textPrimary : textSecondary,
      darkSegRing: dark ? ('inset 0 0 0 1px ' + accent) : 'none',

      triggerBackNote: () => this.setState({ backToast: true }),
      clearBackToast: () => this.setState({ backToast: false }),
      selectAi: () => this.setState({ tab: 'ai' }),
      selectAppearance: () => this.setState({ tab: 'appearance' }),
      selectFolders: () => this.setState({ tab: 'folders' }),
      selectShortcuts: () => this.setState({ tab: 'shortcuts' }),
      toggleAiEnabled: () => this.setState({ aiEnabled: !st.aiEnabled }),
      selectDeepseek: () => this.setState({ provider: 'deepseek' }),
      selectOpenai: () => this.setState({ provider: 'openai' }),
      selectClaude: () => this.setState({ provider: 'claude' }),
      onBaseUrlInput: (e) => { if (e && e.target) this.setState({ baseUrl: e.target.value }); },
      onApiKeyInput: (e) => { if (e && e.target) this.setState({ apiKey: e.target.value }); },
      toggleShowKey: () => this.setState({ showKey: !st.showKey }),
      onFilterInput: (e) => { if (e && e.target) this.setState({ filterQuery: e.target.value }); },
      triggerRefresh: () => this.setState({ refreshed: true }),
      triggerTest: () => this.setState({ tested: true }),
      setLightMode: () => this.setState({ darkOverride: 'light' }),
      setDarkMode: () => this.setState({ darkOverride: 'dark' })
    };
  }
}
</script>
</body>
