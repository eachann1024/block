<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>标签页 · 方案 A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.a-tab{transition:background .15s,color .15s}
.a-tab:hover{background:rgba(0,0,0,0.04);color:#1f2328}
.a-x{transition:background .15s,color .15s}
.a-x:hover{background:rgba(0,0,0,0.07);color:#1f2328}
.a-add:hover{background:rgba(0,0,0,0.05)}
</style>
</helmet>
<div style="width: 720px; height: 280px; box-sizing: border-box; background: #f1f1f1; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
<div style="zoom: 2; display: flex; align-items: center; gap: 6px">
<button type="button" class="a-tab" style="height: 28px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; color: #6b6f76">健身计划</button>
<div style="height: 28px; box-sizing: border-box; padding: 0 6px 0 12px; border: 1px solid rgba(0,0,0,0.06); border-radius: 8px; background: #ffffff; box-shadow: 0 1px 3px rgba(32,36,44,0.05); display: flex; align-items: center; gap: {{gap}}px; font-size: 13px; color: #1f2328">
<span>Mac</span>
<button type="button" class="a-x" aria-label="关闭标签页" style="width: 18px; height: 18px; padding: 0; border: 0; border-radius: 5px; background: rgba(0,0,0,0.07); color: #1f2328; display: flex; align-items: center; justify-content: center">
<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"></path></svg>
</button>
</div>
<button type="button" class="a-add" aria-label="新建标签页" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #6b6f76; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"gap":{"editor":"range","default":8,"min":2,"max":14},"$preview":{"width":720,"height":280}}'>
class Component extends DCLogic {
renderVals() { return { gap: this.props.gap ?? 8 }; }
}
</script>
</body>
</html>
