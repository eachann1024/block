<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>标签页 · 现状</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.now-x:hover{background:#d3e2fb}
</style>
</helmet>
<div style="width: 720px; height: 280px; box-sizing: border-box; background: #f1f1f1; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
<div style="zoom: 2; display: flex; align-items: center; gap: 4px">
<button type="button" style="height: 28px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; color: #6b6f76; display: flex; align-items: center; gap: 2px">健身计划<span style="width: 18px; height: 18px"></span></button>
<div style="height: 28px; box-sizing: border-box; padding: 0 5px 0 10px; border: 1px solid rgba(0,0,0,0.06); border-radius: 8px; background: #ffffff; box-shadow: 0 1px 3px rgba(32,36,44,0.05); display: flex; align-items: center; gap: 2px; font-size: 13px; color: #1f2328">
<span>Mac</span>
<button type="button" class="now-x" aria-label="关闭标签页" style="width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px; background: #d3e2fb; color: #1f2328; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"></path></svg>
</button>
</div>
<button type="button" aria-label="新建标签页" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #3c4047; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":280}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
