<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="ih-bg" x1="0.1" y1="0.04" x2="0.9" y2="0.96">
    <stop offset="0%" stop-color="#f28b6b"/>
    <stop offset="52%" stop-color="#c95b77"/>
    <stop offset="100%" stop-color="#693b69"/>
  </linearGradient>
  <radialGradient id="ih-sun" cx="0.28" cy="0.24" r="0.56">
    <stop offset="0%" stop-color="#ffe599" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#f9a476" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#693b69" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ih-cloud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#fbe4dc"/>
  </linearGradient>
</defs>

<!-- Warm dusk-coral to plum sky squircle -->
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#ih-bg)"/>
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#ih-sun)"/>
<rect class="light-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#8f3d58" stroke-opacity="0.35" stroke-width="1.5"/>
<rect class="dark-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#f6a89a" stroke-opacity="0.35" stroke-width="1.5"/>

<!-- Glowing sunset disc peeking behind cloud -->
<circle cx="22.5" cy="21" r="6.5" fill="#ffe7a8" opacity="0.9"/>

<!-- Floating soft shadow beneath cloud -->
<path d="M18 46.5 H45.5 A8.5 8.5 0 0 0 46.8 29.8 A12.4 12.4 0 0 0 23.6 26.2 A9.2 9.2 0 0 0 18 46.5 Z" fill="#471d3d" opacity="0.24"/>

<!-- Sculpted ivory cloud silhouette -->
<path d="M18 44.5 H45.5 A8.5 8.5 0 0 0 46.8 27.8 A12.4 12.4 0 0 0 23.6 24.2 A9.2 9.2 0 0 0 18 44.5 Z" fill="url(#ih-cloud)"/>

<!-- Crisp coral-plum upward upload arrow carved inside cloud -->
<path d="M32 39.5 V28.5 M27.2 32.8 L32 28 L36.8 32.8" fill="none" stroke="#b94869" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
