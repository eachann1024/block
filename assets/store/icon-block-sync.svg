<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="sy-bg" x1="0.1" y1="0.05" x2="0.92" y2="0.95">
    <stop offset="0%" stop-color="#197b72"/>
    <stop offset="52%" stop-color="#115c5a"/>
    <stop offset="100%" stop-color="#0b3b40"/>
  </linearGradient>
  <radialGradient id="sy-glow" cx="0.32" cy="0.24" r="0.65">
    <stop offset="0%" stop-color="#7df5d7" stop-opacity="0.34"/>
    <stop offset="60%" stop-color="#2ac7a7" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#0b3b40" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sy-arc1" x1="0.15" y1="0.8" x2="0.85" y2="0.15">
    <stop offset="0%" stop-color="#aefbe6"/>
    <stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="sy-arc2" x1="0.85" y1="0.2" x2="0.15" y2="0.85">
    <stop offset="0%" stop-color="#7be8cb"/>
    <stop offset="100%" stop-color="#dffef5"/>
  </linearGradient>
  <radialGradient id="sy-core" cx="0.35" cy="0.35" r="0.65">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#b9fae8"/>
  </radialGradient>
</defs>

<!-- Deep jade squircle -->
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#sy-bg)"/>
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#sy-glow)"/>
<rect class="light-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#0f4e4d" stroke-opacity="0.45" stroke-width="1.5"/>
<rect class="dark-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#47b6a2" stroke-opacity="0.42" stroke-width="1.5"/>

<!-- Subtle orbital track -->
<circle cx="32" cy="32" r="20.5" fill="none" stroke="#9cf5de" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="2.5 3.5"/>

<!-- Upper flowing aurora arc -->
<path d="M16.8 31.2 A15.2 15.2 0 0 1 42.6 20.6" fill="none" stroke="url(#sy-arc1)" stroke-width="4.6" stroke-linecap="round"/>
<path d="M38.2 15.6 L45.8 21.8 L36.6 23.8" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Lower counter-flowing jade arc -->
<path d="M47.2 32.8 A15.2 15.2 0 0 1 21.4 43.4" fill="none" stroke="url(#sy-arc2)" stroke-width="4.6" stroke-linecap="round"/>
<path d="M25.8 48.4 L18.2 42.2 L27.4 40.2" fill="none" stroke="#c8fbec" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Warm pearl anchor core -->
<circle cx="32" cy="32" r="6.4" fill="#63e6c7" opacity="0.22"/>
<circle cx="32" cy="32" r="3.9" fill="url(#sy-core)"/>
</svg>
