<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="tb-bg" x1="0.1" y1="0.04" x2="0.9" y2="0.96">
    <stop offset="0%" stop-color="#3a3d47"/>
    <stop offset="55%" stop-color="#272a32"/>
    <stop offset="100%" stop-color="#1b1d24"/>
  </linearGradient>
  <radialGradient id="tb-glow" cx="0.75" cy="0.24" r="0.65">
    <stop offset="0%" stop-color="#f6c77c" stop-opacity="0.22"/>
    <stop offset="55%" stop-color="#68d6a8" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#1b1d24" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tb-bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#eef0f3"/>
  </linearGradient>
  <linearGradient id="tb-switch" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#48c793"/>
    <stop offset="100%" stop-color="#279e72"/>
  </linearGradient>
</defs>

<!-- Warm charcoal metal squircle -->
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#tb-bg)"/>
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#tb-glow)"/>
<rect class="light-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#181a20" stroke-opacity="0.55" stroke-width="1.5"/>
<rect class="dark-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#5a6070" stroke-opacity="0.55" stroke-width="1.5"/>

<!-- Window outline hinting body below the titlebar -->
<rect x="10.5" y="16" width="43" height="33" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>

<!-- Soft shadow under elevated titlebar strip -->
<rect x="10.5" y="18.2" width="43" height="14.5" rx="6.5" fill="#0d0e12" opacity="0.34"/>

<!-- Crisp ivory floating titlebar strip -->
<rect x="9.5" y="15.5" width="45" height="14.5" rx="6.5" fill="url(#tb-bar)"/>

<!-- Classic subtle traffic dots on left -->
<circle cx="15.8" cy="22.75" r="2.05" fill="#f06a62"/>
<circle cx="21.5" cy="22.75" r="2.05" fill="#f4bc46"/>
<circle cx="27.2" cy="22.75" r="2.05" fill="#46c471"/>

<!-- Customizable right-hand icon slots + mint active toggle pill -->
<rect x="33.5" y="19.9" width="5.6" height="5.6" rx="1.8" fill="#e2e5ea"/>
<circle cx="36.3" cy="22.7" r="1.4" fill="#9ca3b0"/>

<rect x="40.8" y="19.4" width="10.4" height="6.6" rx="3.3" fill="url(#tb-switch)"/>
<circle cx="47.9" cy="22.7" r="2.35" fill="#ffffff"/>

<!-- Quiet page content bars underneath -->
<rect x="16" y="36.5" width="18" height="2.8" rx="1.4" fill="#ffffff" opacity="0.34"/>
<rect x="16" y="42" width="27" height="2.4" rx="1.2" fill="#ffffff" opacity="0.18"/>
</svg>
