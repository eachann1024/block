<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="tr-bg" x1="0.08" y1="0.04" x2="0.92" y2="0.96">
    <stop offset="0%" stop-color="#253359"/>
    <stop offset="52%" stop-color="#17213b"/>
    <stop offset="100%" stop-color="#0d1324"/>
  </linearGradient>
  <radialGradient id="tr-glow" cx="0.5" cy="0.34" r="0.62">
    <stop offset="0%" stop-color="#e3bc70" stop-opacity="0.24"/>
    <stop offset="55%" stop-color="#5670b5" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#0d1324" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tr-card-side" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#1f2a4a"/>
    <stop offset="100%" stop-color="#11182c"/>
  </linearGradient>
  <linearGradient id="tr-card" x1="0.12" y1="0.04" x2="0.88" y2="0.96">
    <stop offset="0%" stop-color="#243154"/>
    <stop offset="55%" stop-color="#18223d"/>
    <stop offset="100%" stop-color="#10172b"/>
  </linearGradient>
  <linearGradient id="tr-gold" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
    <stop offset="0%" stop-color="#faebc0"/>
    <stop offset="50%" stop-color="#e1b96a"/>
    <stop offset="100%" stop-color="#b9893d"/>
  </linearGradient>
  <radialGradient id="tr-emblem-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#f7dc94" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#f7dc94" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Midnight indigo squircle backdrop -->
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#tr-bg)"/>
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#tr-glow)"/>
<path d="M16.5 2.5 H47.5 C55 2.5 61.5 9 61.5 16.5 V23 C44 18.5 20 18.5 2.5 23 V16.5 C2.5 9 9 2.5 16.5 2.5 Z" fill="#ffffff" opacity="0.06"/>
<rect class="light-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#18223c" stroke-opacity="0.45" stroke-width="1.5"/>
<rect class="dark-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#e1b96a" stroke-opacity="0.42" stroke-width="1.5"/>

<!-- Soft card deck ground shadow -->
<ellipse cx="32" cy="52.5" rx="18" ry="3.2" fill="#050811" opacity="0.48"/>

<!-- Subtle fanned side cards (3-card spread motif) -->
<g transform="translate(21 33.5) rotate(-13)">
  <rect x="-10" y="-16" width="20" height="32" rx="3" fill="url(#tr-card-side)" stroke="#c89e52" stroke-opacity="0.58" stroke-width="1.05"/>
  <rect x="-7.4" y="-13.4" width="14.8" height="26.8" rx="1.4" fill="none" stroke="#e5c37a" stroke-opacity="0.24" stroke-width="0.75"/>
</g>
<g transform="translate(43 33.5) rotate(13)">
  <rect x="-10" y="-16" width="20" height="32" rx="3" fill="url(#tr-card-side)" stroke="#c89e52" stroke-opacity="0.58" stroke-width="1.05"/>
  <rect x="-7.4" y="-13.4" width="14.8" height="26.8" rx="1.4" fill="none" stroke="#e5c37a" stroke-opacity="0.24" stroke-width="0.75"/>
</g>

<!-- Center Major Arcana card -->
<rect x="20" y="14" width="26" height="39" rx="3.6" fill="#050811" opacity="0.42"/>
<rect x="19" y="12.5" width="26" height="39" rx="3.6" fill="url(#tr-card)" stroke="url(#tr-gold)" stroke-width="1.5"/>
<rect x="22" y="15.5" width="20" height="33" rx="1.8" fill="none" stroke="#e6c47c" stroke-opacity="0.52" stroke-width="0.85"/>

<!-- Corner copperplate filigree dots -->
<circle cx="24" cy="17.5" r="0.75" fill="#ebd08f" opacity="0.75"/>
<circle cx="40" cy="17.5" r="0.75" fill="#ebd08f" opacity="0.75"/>
<circle cx="24" cy="46.5" r="0.75" fill="#ebd08f" opacity="0.75"/>
<circle cx="40" cy="46.5" r="0.75" fill="#ebd08f" opacity="0.75"/>

<!-- Celestial emblem: gilded crescent moon & four-point star -->
<circle cx="32" cy="29.5" r="8.5" fill="url(#tr-emblem-glow)"/>
<path d="M33.6 22.8 A7.2 7.2 0 1 0 33.6 36.2 A5.5 5.5 0 1 1 33.6 22.8 Z" fill="url(#tr-gold)"/>
<path d="M36.3 25.5 C36.65 27.65 37.55 28.55 39.7 28.9 C37.55 29.25 36.65 30.15 36.3 32.3 C35.95 30.15 35.05 29.25 32.9 28.9 C35.05 28.55 35.95 27.65 36.3 25.5 Z" fill="#fff5d6"/>

<!-- Minimal copperplate card footer ornament -->
<path d="M25.8 42.4 H29.5 M34.5 42.4 H38.2" stroke="#e1b96a" stroke-opacity="0.72" stroke-width="1.05" stroke-linecap="round"/>
<path d="M32 40.7 L33.5 42.4 L32 44.1 L30.5 42.4 Z" fill="url(#tr-gold)"/>

<!-- Subtle celestial dust outside the cards -->
<path d="M12.2 13.4 L12.8 15.1 L14.5 15.7 L12.8 16.3 L12.2 18 L11.6 16.3 L9.9 15.7 L11.6 15.1 Z" fill="#f5da96" opacity="0.88"/>
<circle cx="51.8" cy="16.2" r="1.2" fill="#f7e2aa" opacity="0.72"/>
<circle cx="13.2" cy="49.2" r="1" fill="#c6d5ff" opacity="0.45"/>
</svg>
