<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="mm-bg" x1="0.08" y1="0.06" x2="0.92" y2="0.96">
    <stop offset="0%" stop-color="#f2a03d"/>
    <stop offset="52%" stop-color="#dc6a37"/>
    <stop offset="100%" stop-color="#ad3b3a"/>
  </linearGradient>
  <radialGradient id="mm-glow" cx="0.26" cy="0.26" r="0.65">
    <stop offset="0%" stop-color="#ffe7a8" stop-opacity="0.45"/>
    <stop offset="60%" stop-color="#f79f4a" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#ad3b3a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mm-seed" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#fff0d9"/>
  </linearGradient>
</defs>

<!-- Warm sunset amber squircle -->
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#mm-bg)"/>
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#mm-glow)"/>
<rect class="light-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#b6482e" stroke-opacity="0.4" stroke-width="1.5"/>
<rect class="dark-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#f7b26a" stroke-opacity="0.42" stroke-width="1.5"/>

<!-- Organic glowing branches -->
<path d="M23 32 C31 32 31.5 18 41.5 18" fill="none" stroke="#fff6e6" stroke-opacity="0.88" stroke-width="2.9" stroke-linecap="round"/>
<path d="M23 32 H40.5" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
<path d="M23 32 C31 32 31.5 46 41.5 46" fill="none" stroke="#ffe5cc" stroke-opacity="0.84" stroke-width="2.9" stroke-linecap="round"/>

<!-- Subtle ambient halo behind root seed -->
<circle cx="19" cy="32" r="10.5" fill="#fff3d6" opacity="0.18"/>

<!-- Root seed node -->
<circle cx="19" cy="32" r="6.8" fill="url(#mm-seed)"/>
<circle cx="19" cy="32" r="2.5" fill="#df6e36"/>

<!-- Satellite inspiration nodes -->
<circle cx="46" cy="18" r="5" fill="#ffe7a3"/>
<circle cx="46" cy="18" r="2" fill="#d96b27"/>

<rect x="39.5" y="27.2" width="13.5" height="9.6" rx="4.8" fill="#ffffff"/>
<rect x="43" y="30.8" width="6.5" height="2.4" rx="1.2" fill="#e06e38" opacity="0.72"/>

<circle cx="46" cy="46" r="5" fill="#ffd2c2"/>
<circle cx="46" cy="46" r="2" fill="#be423a"/>

<!-- Two tiny inspiration sparks -->
<circle cx="29.5" cy="17.5" r="1.4" fill="#fff4d2" opacity="0.85"/>
<circle cx="28" cy="47.5" r="1.2" fill="#ffd9c7" opacity="0.72"/>
</svg>
