<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="pp-bg-l" x1="0.08" y1="0.04" x2="0.92" y2="0.96">
    <stop offset="0%" stop-color="#fff8ec"/>
    <stop offset="55%" stop-color="#fbe9cc"/>
    <stop offset="100%" stop-color="#f2d5a7"/>
  </linearGradient>
  <linearGradient id="pp-bg-d" x1="0.08" y1="0.04" x2="0.92" y2="0.96">
    <stop offset="0%" stop-color="#3a2c22"/>
    <stop offset="55%" stop-color="#2c2119"/>
    <stop offset="100%" stop-color="#201712"/>
  </linearGradient>
  <linearGradient id="pp-cocoa" x1="0.2" y1="0.05" x2="0.8" y2="0.95">
    <stop offset="0%" stop-color="#b27446"/>
    <stop offset="55%" stop-color="#87502d"/>
    <stop offset="100%" stop-color="#61361c"/>
  </linearGradient>
</defs>

<!-- Warm butter-cream / espresso squircle -->
<g class="light-only">
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#pp-bg-l)" stroke="#e2c291" stroke-width="1.5"/>
</g>
<g class="dark-only">
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#pp-bg-d)" stroke="#5c4636" stroke-width="1.5"/>
</g>

<!-- Soft ground shadow -->
<ellipse cx="32" cy="49.5" rx="16.5" ry="3.4" fill="#4f2d18" opacity="0.18"/>

<!-- Sculpted caramel-cocoa swirl tiers -->
<rect x="14.5" y="37" width="35" height="11.5" rx="5.75" fill="url(#pp-cocoa)"/>
<rect x="19" y="27.5" width="26" height="10.8" rx="5.4" fill="url(#pp-cocoa)"/>
<path d="M24 29.5 C24 22.5 29.5 18.8 33 14 C35.5 18.2 40 21.8 40 29.5 Z" fill="url(#pp-cocoa)"/>

<!-- Cute glossy highlight & smiling eyes -->
<path d="M23.5 31.2 C25.5 30 28.5 30 30.5 30.8" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="27" cy="41.5" r="2.1" fill="#fffaf0"/>
<circle cx="37" cy="41.5" r="2.1" fill="#fffaf0"/>
<circle cx="27.4" cy="41.3" r="1.0" fill="#3a2010"/>
<circle cx="37.4" cy="41.3" r="1.0" fill="#3a2010"/>
<path d="M29.8 44.6 Q32 46.8 34.2 44.6" fill="none" stroke="#fff2d9" stroke-width="1.5" stroke-linecap="round"/>

<!-- Playful golden sparkles -->
<path d="M47 16 L48 18.6 L50.6 19.6 L48 20.6 L47 23.2 L46 20.6 L43.4 19.6 L46 18.6 Z" fill="#e5972a"/>
<circle cx="17.5" cy="21" r="1.8" fill="#e06f58" opacity="0.8"/>
</svg>
