<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  .paper-card { fill: #ffffff; stroke: #e3ded5; }
  .paper-shadow { fill: #2c241b; opacity: 0.06; }
  .paper-shadow2 { fill: #2c241b; opacity: 0.035; }
  .row-hi { fill: #f9f3ea; }
  .nb-pill { fill: #fcf6ee; stroke: #ebd2b4; }
  .bar-1 { fill: #333944; }
  .bar-2 { fill: #9ba3b0; }
  .div-line { stroke: #ece8e1; }
  .tile-bg { fill: #ffffff; stroke: #e5dfd6; }
  .hero-tile { fill: #fffdf9; stroke: #e47261; }
  .palette-pill { fill: #ffffff; stroke: #e3ded6; }
  .dot-grid { fill: #9e8a73; opacity: 0.14; }
  .arc-line { stroke: #e26d5c; opacity: 0.55; }
  .spark-1 { fill: #e67c6a; opacity: 0.5; }
  .spark-2 { fill: #2fa87e; opacity: 0.45; }
  .ico-jade { stroke: #1f8c66; fill: #2aa377; fill-opacity: 0.18; }
  .ico-iris { stroke: #7555cb; fill: #8160d6; fill-opacity: 0.18; }
  .ico-amber { stroke: #cf7f18; fill: #e5972a; fill-opacity: 0.22; }
  .ico-coral { stroke: #d95348; fill: #e56458; fill-opacity: 0.18; }
  .ico-teal { stroke: #1f8c8c; fill: none; }
  .ico-jade-s { stroke: #1f8c66; fill: none; }
  .ico-amber-s { stroke: #cf7f18; fill: none; }
  .ico-iris-s { stroke: #7555cb; fill: none; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
    .paper-card { fill: #201e26; stroke: #353140; }
    .paper-shadow { fill: #000000; opacity: 0.34; }
    .paper-shadow2 { fill: #000000; opacity: 0.18; }
    .row-hi { fill: #2b2735; }
    .nb-pill { fill: #2d2633; stroke: #5a434a; }
    .bar-1 { fill: #e3e6ee; }
    .bar-2 { fill: #7f8699; }
    .div-line { stroke: #2f2c3a; }
    .tile-bg { fill: #22202a; stroke: #363344; }
    .hero-tile { fill: #282331; stroke: #f08472; }
    .palette-pill { fill: #211f28; stroke: #353242; }
    .dot-grid { fill: #c6b8a8; opacity: 0.12; }
    .arc-line { stroke: #f08472; opacity: 0.65; }
    .spark-1 { fill: #f39583; opacity: 0.65; }
    .spark-2 { fill: #5ad4a6; opacity: 0.55; }
    .ico-jade { stroke: #5cd4a6; fill: #3bc497; fill-opacity: 0.2; }
    .ico-iris { stroke: #b89ef7; fill: #9b7cf2; fill-opacity: 0.2; }
    .ico-amber { stroke: #f5b856; fill: #f0a43c; fill-opacity: 0.22; }
    .ico-coral { stroke: #f58a7b; fill: #ee6f61; fill-opacity: 0.2; }
    .ico-teal { stroke: #5cd4d4; fill: none; }
    .ico-jade-s { stroke: #5cd4a6; fill: none; }
    .ico-amber-s { stroke: #f5b856; fill: none; }
    .ico-iris-s { stroke: #b89ef7; fill: none; }
  }
</style>
<defs>
  <radialGradient id="hfi-glow1" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#f2846c" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#f2846c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hfi-glow2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#3bc497" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#3bc497" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hfi-coral" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
    <stop offset="0%" stop-color="#f27a68"/>
    <stop offset="100%" stop-color="#d84e48"/>
  </linearGradient>
</defs>

<!-- Soft ambient blooms behind right composition -->
<circle cx="322" cy="108" r="102" fill="url(#hfi-glow1)"/>
<circle cx="148" cy="60" r="88" fill="url(#hfi-glow2)"/>

