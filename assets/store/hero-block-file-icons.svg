  <circle cx="242" cy="48" r="1.2"/><circle cx="266" cy="48" r="1.2"/><circle cx="290" cy="48" r="1.2"/><circle cx="314" cy="48" r="1.2"/><circle cx="338" cy="48" r="1.2"/><circle cx="362" cy="48" r="1.2"/><circle cx="386" cy="48" r="1.2"/><circle cx="410" cy="48" r="1.2"/>
  <circle cx="242" cy="72" r="1.2"/><circle cx="266" cy="72" r="1.2"/><circle cx="386" cy="72" r="1.2"/><circle cx="410" cy="72" r="1.2"/><circle cx="434" cy="72" r="1.2"/>
  <circle cx="242" cy="96" r="1.2"/><circle cx="410" cy="96" r="1.2"/><circle cx="434" cy="96" r="1.2"/>
  <circle cx="242" cy="144" r="1.2"/><circle cx="410" cy="144" r="1.2"/><circle cx="434" cy="144" r="1.2"/>
  <circle cx="242" cy="168" r="1.2"/><circle cx="266" cy="168" r="1.2"/><circle cx="410" cy="168" r="1.2"/><circle cx="434" cy="168" r="1.2"/>
</g>

