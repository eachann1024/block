    <rect x="-11.5" y="-11.5" width="23" height="23" rx="7" fill="url(#hfi-coral)"/>
    <path d="M0 -6.2 C0.65 -2.2 2.2 -0.65 6.2 0 C2.2 0.65 0.65 2.2 0 6.2 C-0.65 2.2 -2.2 0.65 -6.2 0 C-2.2 -0.65 -0.65 -2.2 0 -6.2 Z" fill="#fffaf5"/>
  </g>
</g>

