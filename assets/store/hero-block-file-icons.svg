    <circle cx="8" cy="8" r="3" fill="none" stroke="#cf7f18" stroke-width="1.4"/>
    <path d="M8 2.2 V3.3 M8 12.7 V13.8 M2.2 8 H3.3 M12.7 8 H13.8 M3.9 3.9 L4.7 4.7 M11.3 11.3 L12.1 12.1 M12.1 3.9 L11.3 4.7 M4.7 11.3 L3.9 12.1" stroke="#cf7f18" stroke-width="1.35" stroke-linecap="round"/>
  </g>
