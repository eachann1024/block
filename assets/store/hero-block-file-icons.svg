  </g>
  <rect class="bar-1" x="44" y="25.5" width="76" height="6" rx="3"/>

  <!-- Row 2: jade leaf -->
  <g transform="translate(20 53.5)">
    <path d="M3 13 C3 6.2 7.2 3.2 13 3.2 C13 9 10 13 3 13 Z" fill="#2aa377" opacity="0.22"/>
    <path d="M3 13 C3 6.2 7.2 3.2 13 3.2 C13 9 10 13 3 13 Z M3 13 L8.6 7.4" fill="none" stroke="#228c66" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
