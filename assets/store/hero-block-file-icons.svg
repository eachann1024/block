<!-- Connector arc from notebook switcher pill to focal icon mosaic -->
<path class="arc-line" d="M206 164 C232 164 236 104 268 104" fill="none" stroke-width="1.6" stroke-dasharray="3.5 3.5" stroke-linecap="round"/>
<circle cx="206" cy="164" r="3.4" fill="#e26d5c"/>
<circle cx="268" cy="104" r="3" fill="#e26d5c"/>

