<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="cd-bg-l" x1="0.08" y1="0.04" x2="0.92" y2="0.96">
    <stop offset="0%" stop-color="#f9f7f1"/>
    <stop offset="55%" stop-color="#f0ece1"/>
    <stop offset="100%" stop-color="#e3dccb"/>
  </linearGradient>
  <linearGradient id="cd-bg-d" x1="0.08" y1="0.04" x2="0.92" y2="0.96">
    <stop offset="0%" stop-color="#30342f"/>
    <stop offset="55%" stop-color="#242823"/>
    <stop offset="100%" stop-color="#1a1d19"/>
  </linearGradient>
  <radialGradient id="cd-glow" cx="0.72" cy="0.28" r="0.62">
    <stop offset="0%" stop-color="#6fa882" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#6fa882" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cd-leaf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#58a377"/>
    <stop offset="100%" stop-color="#337352"/>
  </linearGradient>
</defs>

<!-- Drafting paper squircle -->
<g class="light-only">
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#cd-bg-l)" stroke="#d5ccb8" stroke-width="1.5"/>
</g>
<g class="dark-only">
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#cd-bg-d)" stroke="#444b42" stroke-width="1.5"/>
</g>
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#cd-glow)"/>

<!-- Clean 4x4 tactile dot-grid matrix -->
<g class="light-only" fill="#8b8373">
  <circle cx="17" cy="17" r="2.1" opacity="0.45"/>
  <circle cx="27" cy="17" r="2.1" opacity="0.65"/>
  <circle cx="37" cy="17" r="2.1" opacity="0.75"/>
  <circle cx="47" cy="17" r="2.1" opacity="0.45"/>

  <circle cx="17" cy="27" r="2.1" opacity="0.65"/>
  <circle cx="27" cy="27" r="2.4" fill="#3f8760"/>
  <circle cx="37" cy="27" r="2.4" fill="#3f8760"/>
  <circle cx="47" cy="27" r="2.1" opacity="0.7"/>

  <circle cx="17" cy="37" r="2.1" opacity="0.65"/>
  <circle cx="27" cy="37" r="2.4" fill="#3f8760"/>
  <circle cx="37" cy="37" r="2.4" fill="#3f8760"/>
  <circle cx="47" cy="37" r="2.1" opacity="0.65"/>

  <circle cx="17" cy="47" r="2.1" opacity="0.45"/>
  <circle cx="27" cy="47" r="2.1" opacity="0.65"/>
  <circle cx="37" cy="47" r="2.1" opacity="0.65"/>
  <circle cx="47" cy="47" r="2.1" opacity="0.45"/>
</g>
<g class="dark-only" fill="#8c9689">
  <circle cx="17" cy="17" r="2.1" opacity="0.45"/>
  <circle cx="27" cy="17" r="2.1" opacity="0.68"/>
  <circle cx="37" cy="17" r="2.1" opacity="0.75"/>
  <circle cx="47" cy="17" r="2.1" opacity="0.45"/>

  <circle cx="17" cy="27" r="2.1" opacity="0.68"/>
  <circle cx="27" cy="27" r="2.4" fill="#6fd19c"/>
  <circle cx="37" cy="27" r="2.4" fill="#6fd19c"/>
  <circle cx="47" cy="27" r="2.1" opacity="0.72"/>

  <circle cx="17" cy="37" r="2.1" opacity="0.68"/>
  <circle cx="27" cy="37" r="2.4" fill="#6fd19c"/>
  <circle cx="37" cy="37" r="2.4" fill="#6fd19c"/>
  <circle cx="47" cy="37" r="2.1" opacity="0.68"/>

  <circle cx="17" cy="47" r="2.1" opacity="0.45"/>
  <circle cx="27" cy="47" r="2.1" opacity="0.68"/>
  <circle cx="37" cy="47" r="2.1" opacity="0.68"/>
  <circle cx="47" cy="47" r="2.1" opacity="0.45"/>
</g>

<!-- Subtle floating paper corner card with sage accent pin -->
<g transform="translate(27 27)">
  <rect x="-7.5" y="-7.5" width="25" height="25" rx="7" fill="url(#cd-leaf)" fill-opacity="0.16" stroke="#459469" stroke-opacity="0.65" stroke-width="1.35"/>
</g>
</svg>
