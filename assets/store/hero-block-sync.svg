<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
<style>
  .paper-card { fill: #ffffff; stroke: #d6e7e4; }
  .paper-shadow { fill: #0d3331; opacity: 0.065; }
  .paper-shadow2 { fill: #0d3331; opacity: 0.035; }
  .row-hi { fill: #ebf7f4; }
  .bar-1 { fill: #243c3d; }
  .bar-2 { fill: #8ba5a4; }
  .ring-track { stroke: #1a8e80; opacity: 0.14; }
  .arc-flow { stroke: #1a8e80; }
  .arc-flow2 { stroke: #3bb89e; }
  .badge-bg { fill: #ffffff; stroke: #cbe6e0; }
  .chip-bg { fill: #ffffff; stroke: #d4e8e4; }
  .jade-ico { fill: #2aa387; fill-opacity: 0.2; stroke: #1f8c73; }
  .jade-ico-s { fill: none; stroke: #1f8c73; }
  .jade-dot { fill: #1f8c73; }
  @media (prefers-color-scheme: dark) {
    .paper-card { fill: #1a2426; stroke: #2c4044; }
    .paper-shadow { fill: #000000; opacity: 0.36; }
    .paper-shadow2 { fill: #000000; opacity: 0.2; }
    .row-hi { fill: #213438; }
    .bar-1 { fill: #ddeeee; }
    .bar-2 { fill: #7b9a9c; }
    .ring-track { stroke: #5edbc0; opacity: 0.16; }
    .arc-flow { stroke: #46cca9; }
    .arc-flow2 { stroke: #80ebd1; }
    .badge-bg { fill: #182729; stroke: #305559; }
    .chip-bg { fill: #1b292b; stroke: #2f4a4d; }
    .jade-ico { fill: #46cca9; fill-opacity: 0.2; stroke: #63dec0; }
    .jade-ico-s { fill: none; stroke: #63dec0; }
    .jade-dot { fill: #63dec0; }
  }
</style>
<defs>
  <radialGradient id="hsy-glow1" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#2ec4a6" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#2ec4a6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hsy-core" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
    <stop offset="0%" stop-color="#1d8a7e"/>
    <stop offset="100%" stop-color="#0f5355"/>
  </linearGradient>
</defs>

<!-- Soft jade ambient glow & subtle concentric orbital rings -->
<circle cx="238" cy="110" r="106" fill="url(#hsy-glow1)"/>
<circle class="ring-track" cx="238" cy="110" r="76" fill="none" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle class="ring-track" cx="238" cy="110" r="108" fill="none" stroke-width="1" stroke-dasharray="2 6"/>

<!-- Left card: Local Workspace -->
<g transform="translate(36 44)">
  <rect class="paper-shadow2" x="4" y="9" width="144" height="126" rx="14"/>
  <rect class="paper-shadow" x="2" y="5" width="144" height="126" rx="13"/>
  <rect class="paper-card" x="0" y="0" width="144" height="126" rx="12" stroke-width="1.15"/>
  <!-- Mini header bar -->
  <circle cx="15" cy="15" r="2.6" fill="#2ea889"/>
  <rect class="bar-1" x="24" y="12.5" width="52" height="5" rx="2.5" opacity="0.85"/>
  <!-- Synced note rows -->
  <rect class="row-hi" x="10" y="29" width="124" height="25" rx="7"/>
  <circle cx="22" cy="41.5" r="3.2" fill="#229b7e"/>
  <rect class="bar-1" x="32" y="39" width="62" height="5" rx="2.5"/>
  <path d="M116 41.5 L119 44.5 L125 38.5" fill="none" stroke="#1e9478" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="22" cy="70" r="3" fill="#4cc2a6" opacity="0.65"/>
  <rect class="bar-2" x="32" y="67.5" width="76" height="4.8" rx="2.4" opacity="0.7"/>
  <path d="M116 70 L119 73 L125 67" fill="none" stroke="#3bb599" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <circle cx="22" cy="94" r="3" fill="#4cc2a6" opacity="0.45"/>
  <rect class="bar-2" x="32" y="91.5" width="54" height="4.8" rx="2.4" opacity="0.52"/>
  <path d="M116 94 L119 97 L125 91" fill="none" stroke="#3bb599" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
</g>

<!-- Right card: Remote Cloud / Git / WebDAV Mirror -->
<g transform="translate(284 34)">
  <rect class="paper-shadow2" x="4" y="9" width="144" height="126" rx="14"/>
  <rect class="paper-shadow" x="2" y="5" width="144" height="126" rx="13"/>
  <rect class="paper-card" x="0" y="0" width="144" height="126" rx="12" stroke-width="1.15"/>

  <!-- Cloud / Repo graphic header -->
  <path class="jade-ico" d="M20 22 H35 A4.5 4.5 0 0 0 35.5 13.2 A6.2 6.2 0 0 0 23.8 11.4 A4.8 4.8 0 0 0 20 22 Z" stroke-width="1.45" stroke-linejoin="round"/>
  <rect class="bar-1" x="46" y="14.5" width="58" height="5" rx="2.5" opacity="0.85"/>

  <!-- Diff / incremental blocks -->
  <rect class="row-hi" x="10" y="33" width="124" height="25" rx="7"/>
  <rect x="19" y="41" width="14" height="9" rx="3" fill="#249e81" opacity="0.22"/>
  <path d="M23.5 45.5 H28.5 M26 43 V48" stroke="#1b8a6f" stroke-width="1.4" stroke-linecap="round"/>
  <rect class="bar-1" x="40" y="43" width="66" height="5" rx="2.5"/>

  <!-- Git branch mini diagram inside remote card -->
  <path d="M24 72 V98 M24 88 C24 81 36 81 36 74" fill="none" stroke="#2aa387" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="24" cy="72" r="2.8" fill="#1f8c73"/>
  <circle cx="36" cy="74" r="2.8" fill="#46c9aa"/>
  <circle cx="24" cy="98" r="2.8" fill="#1f8c73"/>
  <rect class="bar-2" x="48" y="71.5" width="68" height="4.8" rx="2.4" opacity="0.72"/>
  <rect class="bar-2" x="48" y="95.5" width="52" height="4.8" rx="2.4" opacity="0.52"/>
</g>

<!-- Bidirectional curved aurora transfer arcs -->
<path class="arc-flow" d="M180 86 C210 64 252 60 284 74" fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<path class="arc-flow2" d="M284 128 C252 150 212 152 180 134" fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<circle cx="196" cy="76" r="3" fill="#26a98b"/>
<circle cx="268" cy="138" r="3" fill="#4ad0b0"/>

<!-- Central floating jade sync core medallion -->
<g transform="translate(232 106)">
  <circle class="paper-shadow2" cx="2" cy="8" r="32"/>
  <circle class="badge-bg" cx="0" cy="0" r="31" stroke-width="1.3"/>
  <circle cx="0" cy="0" r="24" fill="url(#hsy-core)"/>
  <path d="M-10.5 -1 A10.5 10.5 0 0 1 7.2 -8.2" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M4.2 -11.5 L9.4 -7.4 L3.2 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10.5 1 A10.5 10.5 0 0 1 -7.2 8.2" fill="none" stroke="#b6faea" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M-4.2 11.5 L-9.4 7.4 L-3.2 6" fill="none" stroke="#b6faea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="0" cy="0" r="2.6" fill="#ffffff"/>
</g>

<!-- Bottom three compact transport symbols (Mirror / Cloud / Git) -->
<g transform="translate(154 178)">
  <rect class="paper-shadow" x="1" y="2.5" width="156" height="28" rx="14"/>
  <rect class="chip-bg" x="0" y="0" width="156" height="28" rx="14" stroke-width="1.1"/>
  <!-- Folder mirror -->
  <path class="jade-ico" d="M22 10.5 H26.5 L28 12.3 H34.5 V18.5 H22 Z" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="52" cy="14" r="1.5" fill="#92b2af"/>
  <!-- Cloud WebDAV -->
  <path class="jade-ico" d="M70.5 17.5 H81 A3 3 0 0 0 81.4 11.7 A4.2 4.2 0 0 0 73.4 10.4 A3.2 3.2 0 0 0 70.5 17.5 Z" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="102" cy="14" r="1.5" fill="#92b2af"/>
  <!-- Git branch -->
  <path class="jade-ico-s" d="M122 10.5 V18 M122 15.8 C122 13.5 129 13.5 129 11" stroke-width="1.45" stroke-linecap="round"/>
  <circle class="jade-dot" cx="122" cy="10.5" r="1.8"/>
  <circle cx="129" cy="11" r="1.8" fill="#43c4a6"/>
  <circle class="jade-dot" cx="122" cy="18" r="1.8"/>
</g>
</svg>
