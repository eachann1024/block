<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  .dark-only { opacity: 0; }
  .light-only { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    .dark-only { opacity: 1; }
    .light-only { opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="cp-bg" x1="0.1" y1="0.04" x2="0.9" y2="0.96">
    <stop offset="0%" stop-color="#3b4d44"/>
    <stop offset="55%" stop-color="#28362f"/>
    <stop offset="100%" stop-color="#1a241f"/>
  </linearGradient>
  <radialGradient id="cp-glow" cx="0.72" cy="0.26" r="0.6">
    <stop offset="0%" stop-color="#9fe6be" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#1a241f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cp-card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7fbf8"/>
    <stop offset="100%" stop-color="#dfeee5"/>
  </linearGradient>
</defs>

<!-- Forest-olive slate squircle -->
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#cp-bg)"/>
<rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#cp-glow)"/>
<rect class="light-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#18221d" stroke-opacity="0.5" stroke-width="1.5"/>
<rect class="dark-only" x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#6d927f" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Back clipboard ghost layer -->
<rect x="13" y="14" width="27" height="29" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#b9ebd0" stroke-opacity="0.42" stroke-width="1.3"/>

<!-- Front crisp path card -->
<rect x="21" y="21" width="30" height="29" rx="6.5" fill="url(#cp-card)"/>

<!-- Crisp path slash & segment lines -->
<path d="M31.5 41.5 L36.8 29.5" fill="none" stroke="#247a56" stroke-width="2.6" stroke-linecap="round"/>
<rect x="25.5" y="34.2" width="4.2" height="2.6" rx="1.3" fill="#63967e"/>
<rect x="38.5" y="34.2" width="7.2" height="2.6" rx="1.3" fill="#247a56"/>
</svg>
